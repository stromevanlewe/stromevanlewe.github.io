<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boodskappe · Strome van Lewe</title>
<meta name="description" content="Preke en boodskappe van Strome van Lewe Gemeente — soek op spreker, reeks, Skrifgedeelte of onderwerp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf7ef;--ink:#2b2117;--ink-2:#5a4a38;--ink-3:#8a7760;--ink-4:#a89885;
 --line:#efe2c8;--card:#fff;--sand:#fbf2e3;--gold:#d9b88c;--gold-d:#b0895a;
 --warm:#fef1d6;--warm-line:#f0d9b0;--deep:#2b2117;--shadow:0 8px 30px rgba(43,33,23,.06);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}
header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.crumbs a{font:500 13px/1 Inter,sans-serif;color:var(--ink-3);text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;padding:7px 12px;border-radius:999px;cursor:pointer}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}
.hero{padding-block:34px 6px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:12px}
.eyebrow i{display:block;width:30px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(30px,6vw,46px);line-height:1.03}
.hero p.lede{margin-top:10px;max-width:58ch;font-size:15px;line-height:1.65;color:var(--ink-2)}

.tools{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 15px;box-shadow:var(--shadow)}
.search i{font-style:normal;color:var(--ink-4)}
.search input{flex:1;border:0;outline:0;background:transparent;font:400 15px/1.4 Inter,sans-serif;color:var(--ink);min-width:0}
.search input::placeholder{color:var(--ink-4)}
.search button{border:0;background:transparent;color:var(--ink-4);cursor:pointer;font-size:15px;padding:0 2px}
.facets{display:flex;flex-wrap:wrap;gap:8px}
.facet{position:relative}
.facet>button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font:500 12.5px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.facet>button[data-on="1"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.facet>button i{font-style:normal;font-size:9px;opacity:.6}
button.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font:500 12.5px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
button.toggle[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:190px;max-height:52vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(43,33,23,.16);padding:6px}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 11px;font:500 13.5px/1.3 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.menu button:hover{background:var(--sand)}
.menu button[aria-pressed="true"]{background:var(--deep);color:#fff}
.counting{font-size:12.5px;color:var(--ink-4);padding-top:2px}

.list{padding-block:22px 70px;display:grid;gap:14px}
a.msg{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:19px 21px;transition:.16s}
a.msg:hover{border-color:var(--deep);transform:translateY(-2px)}
a.msg .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:9px}
a.msg .meta span{font:600 11px/1 Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-d)}
a.msg .meta em{font-style:normal;font:500 11px/1 Inter,sans-serif;color:var(--ink-4)}
a.msg h2{font-size:clamp(19px,2.6vw,23px);line-height:1.16}
a.msg p{margin:9px 0 0;font-size:14.5px;line-height:1.62;color:var(--ink-2)}
a.msg .refs{margin-top:13px;display:flex;flex-wrap:wrap;gap:7px}
a.msg .refs b{font:500 11.5px/1 Inter,sans-serif;color:var(--ink-3);background:var(--sand);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.empty{padding:38px 4px;color:var(--ink-3);font-size:15px}

.body .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:20px 0}
.body table{border-collapse:collapse;width:100%;min-width:340px;font-size:14.5px;line-height:1.55}
.body th{text-align:left;font:600 12px/1.3 Inter,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);border-bottom:1.5px solid var(--line);padding:0 14px 9px 0;vertical-align:bottom}
.body td{padding:10px 14px 10px 0;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top}
.body th:last-child,.body td:last-child{padding-right:0}
.body tbody tr:last-child td{border-bottom:0}
.body blockquote h2,.body blockquote h3{margin:0 0 8px}
.banner{margin:0 0 22px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.banner img{display:block;width:100%;height:auto}
@media(max-width:640px){.banner{border-radius:14px;margin-bottom:18px}.banner img{aspect-ratio:1/1;object-fit:cover;object-position:center}}
.reader{padding-block:8px 70px;max-width:660px}
.backlink{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:600 12.5px/1 Inter,sans-serif;color:var(--ink-2);text-decoration:none;margin-bottom:20px}
.backlink:hover{border-color:var(--deep)}
.rhead .meta{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:10px}
.rhead .meta span{font:600 11px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-d)}
.rhead .meta em{font-style:normal;font:500 12px/1 Inter,sans-serif;color:var(--ink-4)}
.rhead h1{font-size:clamp(26px,4.6vw,38px);line-height:1.08}
.rhead .sum{margin-top:12px;font-family:Fraunces,Georgia,serif;font-size:clamp(16.5px,2.3vw,19px);line-height:1.5;color:var(--ink)}
.chips{margin-top:16px;display:flex;flex-wrap:wrap;gap:7px}
.chips a,.chips b{font:600 11.5px/1 Inter,sans-serif;text-decoration:none;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px}
.chips a:hover{border-color:var(--deep)}
.player{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.player .lbl{font:600 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-d);margin-bottom:10px}
.player audio{width:100%;height:38px;display:block}
.player .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.player .row:first-child{margin-top:0}
.player a.watch{display:inline-flex;align-items:center;gap:7px;text-decoration:none;background:var(--deep);color:#fff;border-radius:999px;padding:9px 15px;font:600 12.5px/1 Inter,sans-serif}
.player a.watch:hover{background:#000}
.player a.dl{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font:600 12.5px/1 Inter,sans-serif;color:var(--ink-2)}
.player a.dl:hover{border-color:var(--deep)}
a.msg .meta u{text-decoration:none;font:600 10.5px/1 Inter,sans-serif;letter-spacing:.05em;color:var(--ink-3);background:var(--warm);border:1px solid var(--warm-line);border-radius:999px;padding:5px 8px}
.related{margin-top:18px;background:var(--sand);border:1px dashed var(--warm-line);border-radius:14px;padding:13px 16px;font-size:14px;color:var(--ink-2)}
.related a{font-weight:600}
.related .lbl{display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;font-weight:700;color:var(--ink-3,var(--ink-2));opacity:.75}
.related ul{list-style:none;margin:0;padding:0}
.related li{margin:0;padding:3px 0 3px 15px;position:relative;line-height:1.45}
.related li:before{content:'\2192';position:absolute;left:0;opacity:.5}
.body{margin-top:26px}
.body h2{font-size:clamp(19px,2.8vw,23px);line-height:1.2;margin:32px 0 10px;padding-top:22px;border-top:1px solid var(--line)}
.body h2:first-child{border-top:0;padding-top:0;margin-top:0}
.body h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:24px 0 9px}
.body h4{font-size:16px;line-height:1.35;font-weight:700;color:var(--ink);margin:22px 0 7px;font-family:Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none}
.body h3+h4{margin-top:14px}
.body p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:var(--ink-2)}
.body b{color:var(--ink);font-weight:600}
.body ul,.body ol{margin:0 0 14px;padding-left:20px}
.body li{margin-bottom:8px;font-size:15.5px;line-height:1.66;color:var(--ink-2)}
.body blockquote{margin:16px 0;background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px}
.body blockquote p{margin:0 0 8px;font-size:15px}
.body blockquote p:last-child{margin:0}
.body hr{border:0;border-top:1px solid var(--line);margin:26px 0}
a.ref{text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap}
a.ref:hover{background:rgba(217,184,140,.16)}
a.ref sup{font-size:9px;color:var(--gold-d);margin-left:2px}
footer.foot{border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:22px 34px;font-size:12.5px;color:var(--ink-4);display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
@media print{header.top,.tools,.backlink,footer.foot{display:none!important}.reader{max-width:none}}
</style>

  return linkRefs(esc(s).replace(/\*\*\*(.+?)\*\*\*/g,"<b><em>$1</em></b>")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[(.+?)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>'));
}
const tCells=l=>l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(x=>x.trim());
const tSep=l=>/^\s*\|?[\s:|-]*-[\s:|-]*$/.test(l||"")&&(l||"").indexOf("|")>=0;
function mdToHtml(md){
  const out=[];let list=null,quote=[],para=[];
  function flushPara(){if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[];}}
  function flushList(){if(list){out.push("<"+list.t+">"+list.i.map(x=>"<li>"+inline(x)+"</li>").join("")+"</"+list.t+">");list=null;}}
  function flushQuote(){if(quote.length){
    out.push("<blockquote>"+mdToHtml(quote.join("\n"))+"</blockquote>");quote=[];}}
  const lines=md.replace(/\r/g,"").split("\n");
  for(let i=0;i<lines.length;i++){
    const l=lines[i].replace(/\s+$/,"");
    if(/^>\s?/.test(l)){flushPara();flushList();quote.push(l.replace(/^>\s?/,""));continue;}
    flushQuote();
    if(!l.trim()){flushPara();flushList();continue;}
    if(/^---+$/.test(l)){flushPara();flushList();out.push("[[HR]]");continue;}
    if(l.trim().indexOf("|")===0&&tSep(lines[i+1])){
      flushPara();flushList();
      const head=tCells(l);i++;const rows=[];
      while(i+1<lines.length&&lines[i+1].trim().indexOf("|")===0){i++;rows.push(tCells(lines[i]));}
      out.push('<div class="tw"><table><thead><tr>'+head.map(c=>"<th>"+inline(c)+"</th>").join("")+
        "</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+
        "</tbody></table></div>");
      continue;
    }
    let m=l.match(/^(#{1,4})\s+(.*)$/);
    if(m){flushPara();flushList();const lvl=m[1].length<=2?2:(m[1].length===3?3:4);out.push("<h"+lvl+">"+inline(m[2])+"</h"+lvl+">");continue;}
    m=l.match(/^[-*]\s+(.*)$/);
    if(m){flushPara();if(!list||list.t!=="ul"){flushList();list={t:"ul",i:[]};}list.i.push(m[1]);continue;}
    m=l.match(/^\d+\.\s+(.*)$/);
    if(m){flushPara();if(!list||list.t!=="ol"){flushList();list={t:"ol",i:[]};}list.i.push(m[1]);continue;}
    flushList();para.push(l.trim());
  }
  flushPara();flushList();flushQuote();
  // 'n reël voor 'n opskrif is oorbodig — die opskrif het klaar 'n lyn
  const clean=out.filter(function(x,i){ if(x!=="[[HR]]")return true;
    const nxt=out[i+1]||""; return !(nxt.indexOf("<h2")===0||nxt.indexOf("<h3")===0)&&i<out.length-1; });
  return clean.map(x=>x==="[[HR]]"?"<hr>":x).join("");
}
const uniq=a=>[...new Set(a)].sort();
const books=m=>uniq(m.texts.map(t=>t.osis.split(".")[0]));
function tagName(x,l){const e=TAGS[x];return (e&&e[l])?e[l]:x;}
const tagWords=m=>m.tags.map(x=>x+" "+tagName(x,"af")+" "+tagName(x,"en")).join(" ");
const haystack=m=>[m.title.af,m.title.en,m.summary.af,m.summary.en,m.speaker,m.series.af,m.series.en,
  tagWords(m),m.texts.map(t=>t.af+" "+t.en).join(" ")].join(" ").toLowerCase();
function filtered(){
  const t=q.trim().toLowerCase();
  return DB.filter(m=>(!F.speaker||m.speaker===F.speaker)&&(!F.series||m.series.af===F.series)
    &&(!F.year||m.date.slice(0,4)===F.year)&&(!F.book||books(m).indexOf(F.book)>=0)
    &&(!F.media||hasMedia(m))
    &&(!t||haystack(m).indexOf(t)>=0));
}
function facet(key,label,opts,fmt){
  const on=F[key];
  return '<div class="facet"><button data-facet="'+key+'" data-on="'+(on?1:0)+'">'+
    esc(on?fmt(on):label)+' <i>▼</i></button><div class="menu" hidden>'+
    '<button data-pick="'+key+'" data-val="" aria-pressed="'+(!on)+'">'+esc(T[lang].all)+"</button>"+
    opts.map(o=>'<button data-pick="'+key+'" data-val="'+esc(o)+'" aria-pressed="'+(on===o)+'">'+esc(fmt(o))+"</button>").join("")+
  "</div></div>";
}
function renderList(){
  const t=T[lang],rows=filtered();
  document.getElementById("app").innerHTML=
   '<div class="hero"><div class="eyebrow"><i></i>'+t.eyebrow+"</div><h1>"+t.title+'</h1><p class="lede">'+t.lede+"</p>"+
   '<div class="tools"><div class="search"><i>⌕</i><input id="q" value="'+esc(q)+'" placeholder="'+esc(t.search)+'">'+
   (q?'<button id="cq" title="'+esc(t.clear)+'">✕</button>':"")+"</div>"+
   '<div class="facets">'+
     facet("speaker",t.speaker,uniq(DB.map(m=>m.speaker)),x=>x)+
     facet("series",t.series,uniq(DB.map(m=>m.series.af)),function(x){const m=DB.filter(d=>d.series.af===x)[0];return m?m.series[lang]:x;})+
     facet("year",t.year,uniq(DB.map(m=>m.date.slice(0,4))).reverse(),x=>x)+
     facet("book",t.book,uniq([].concat.apply([],DB.map(books))),x=>BMAP.name[x]?BMAP.name[x][lang]:x)+
     (DB.some(hasMedia)?'<button class="toggle" id="tmedia" aria-pressed="'+(F.media?"true":"false")+'">♪ '+esc(t.onlyMedia)+"</button>":"")+
   '</div><div class="counting">'+t.count(rows.length)+"</div></div></div>"+
   '<div class="list">'+(rows.length?rows.map(m=>
     '<a class="msg" href="#/'+m.id+'"><div class="meta"><span>'+esc(m.series[lang])+
       (m.seriesNo?" · "+t.msgNo+" "+m.seriesNo:"")+"</span><em>"+esc(m.speaker)+" · "+dateStr(m.date)+"</em>"+
       (m.media&&(m.media.audio||m.media.video)?"<u>♪ "+t.hasMedia+"</u>":"")+"</div>"+
     "<h2>"+esc(m.title[lang])+"</h2><p>"+esc(m.summary[lang])+'</p><div class="refs">'+
     m.texts.map(x=>"<b>"+esc(x[lang])+"</b>").join("")+"</div></a>").join("")
     :'<div class="empty">'+t.none+"</div>")+"</div>";
  const qi=document.getElementById("q");
  if(qi)qi.oninput=function(e){q=e.target.value;const s=qi.selectionStart;renderList();
    const n=document.getElementById("q");n.focus();n.setSelectionRange(s,s);};
  const c=document.getElementById("cq"); if(c)c.onclick=function(){q="";renderList();};
  [].forEach.call(document.querySelectorAll("[data-facet]"),function(b){
    b.onclick=function(e){e.stopPropagation();const menu=b.nextElementSibling,wasOpen=!menu.hidden;
      [].forEach.call(document.querySelectorAll(".menu"),m=>m.hidden=true); menu.hidden=wasOpen;};});
  [].forEach.call(document.querySelectorAll("[data-pick]"),function(b){
    b.onclick=function(){F[b.dataset.pick]=b.dataset.val;renderList();};});
  const tm=document.getElementById("tmedia");
  if(tm)tm.onclick=function(){F.media=F.media?"":"1";renderList();};
}
function mediaBlock(m,t){
  const md=m.media||{};
  if(!md.audio&&!md.video)return "";
  let h='<div class="player"><div class="lbl">'+(md.audio?t.listen:t.watch)+"</div>";
  if(md.audio) h+='<audio controls preload="none" src="'+esc(md.audio)+'"></audio>';
  const row=[];
  if(md.video) row.push('<a class="watch" href="'+esc(md.video)+'" target="_blank" rel="noopener">▶ '+t.watch+"</a>");
  if(md.audio) row.push('<a class="dl" href="'+esc(md.audio)+'" download>↓ '+t.dl+"</a>");
  if(row.length) h+='<div class="row">'+row.join("")+"</div>";
  return h+"</div>";
}
function bannerBlock(m){
  const im=m.image; if(!im||!im.wide)return "";
  const alt=esc((im.alt&&im.alt[lang])||m.title[lang]);
  return '<figure class="banner"><picture>'+
    (im.tall?'<source media="(max-width:640px)" srcset="'+esc(im.tall)+'">':"")+
    '<img src="'+esc(im.wide)+'" alt="'+alt+'" loading="eager" decoding="async">'+
    "</picture></figure>";
}
function renderMsg(id){
  const t=T[lang],m=DB.filter(x=>x.id===id)[0];
  if(!m){location.hash="";return;}
  document.getElementById("app").innerHTML='<div class="reader"><a class="backlink" href="#">← '+t.back+"</a>"+
   bannerBlock(m)+
   '<div class="rhead"><div class="meta"><span>'+esc(m.series[lang])+(m.seriesNo?" · "+t.msgNo+" "+m.seriesNo:"")+
   "</span><em>"+esc(m.speaker)+" · "+dateStr(m.date)+"</em></div><h1>"+esc(m.title[lang])+"</h1>"+
   '<p class="sum">'+esc(m.summary[lang])+'</p><div class="chips">'+
   m.texts.map(x=>'<a href="'+url(x.osis)+'" target="_blank" rel="noopener">'+esc(x[lang])+" ↗</a>").join("")+
   m.tags.map(x=>'<b title="'+esc(x)+'">'+esc(tagName(x,lang))+"</b>").join("")+"</div>"+
   mediaBlock(m,t)+
   (m.related&&m.related.length?'<div class="related"><span class="lbl">'+t.related+'</span><ul>'+
      m.related.map(r=>'<li><a href="'+r.href+'">'+esc(r[lang])+"</a></li>").join("")+'</ul></div>':"")+
   '</div><div class="body" id="body"><p>'+t.loading+"</p></div></div>";
  window.scrollTo({top:0});
  fetch("m/"+m.id+"."+lang+".md",{cache:"no-cache"}).then(function(r){
    if(!r.ok)throw new Error("404"); return r.text();
  }).then(function(md){
    md=md.replace(/^\uFEFF/,"").replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n+/,"");
    md=md.replace(/^#\s+[^\n]*\n+/,"").replace(/^(?:###\s+[^\n]*|\*[^*\n][^\n]*\*)\n+/,"");
    document.getElementById("body").innerHTML=mdToHtml(md);
  }).catch(function(){document.getElementById("body").innerHTML="<p>"+t.fail+"</p>";});
}
function route(){
  [].forEach.call(document.querySelectorAll("[data-t]"),el=>el.textContent=T[lang][el.dataset.t]);
  document.documentElement.lang=lang;
  document.getElementById("bAF").setAttribute("aria-pressed",lang==="af");
  document.getElementById("bEN").setAttribute("aria-pressed",lang==="en");
  const m=(location.hash||"").match(/^#\/(.+)$/);
  if(m)renderMsg(m[1]); else renderList();
}
document.getElementById("bAF").onclick=function(){lang="af";route();};
document.getElementById("bEN").onclick=function(){lang="en";route();};
window.addEventListener("hashchange",route);
document.addEventListener("click",function(){[].forEach.call(document.querySelectorAll(".menu"),m=>m.hidden=true);});
(function(){
  try{if((new URLSearchParams(location.search).get("lang")||"")==="en")lang="en";}catch(e){}
  fetch("index.json",{cache:"no-cache"}).then(r=>r.json()).then(function(d){
    DB=d.messages.slice().sort((a,b)=>b.date.localeCompare(a.date));
    TAGS=d.tagname||{};
  }).catch(function(){DB=[];}).then(route);
})();
</script>
