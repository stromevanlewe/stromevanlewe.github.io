<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leiersgids · Sessie 7 — Om Aanstoot te Neem</title>
<meta name="description" content="'n Tweetalige studie van agt sessies oor aanstoot — vir persoonlike voorbereiding en kleingroepbespreking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf7ef; --ink:#2b2117; --ink-2:#5a4a38; --ink-3:#8a7760; --ink-4:#a89885;
  --line:#efe2c8; --card:#ffffff; --sand:#fbf2e3; --gold:#d9b88c; --gold-d:#b0895a;
  --warm:#fef1d6; --warm-line:#f0d9b0; --deep:#2b2117; --shadow:0 8px 30px rgba(43,33,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:500;color:var(--ink-3);min-width:0}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;padding:7px 11px;border-radius:999px;cursor:pointer}
.pillbox button:hover{color:var(--ink)}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}

/* hero */
.hero{padding-block:34px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:12px}
.eyebrow i{display:block;width:32px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.02}
.hero .sub{margin-top:10px;font-size:clamp(16px,2.4vw,19px);font-weight:500;color:var(--ink-2)}
.hero .opening{margin-top:16px;max-width:54ch;font-family:Fraunces,Georgia,serif;font-size:clamp(17px,2.4vw,19.5px);line-height:1.5;color:var(--ink)}
.hero .lede{margin-top:14px;max-width:56ch;font-size:15px;line-height:1.65;color:var(--ink-2)}

.fabline{margin:14px 0 0;max-width:60ch;font-size:14px;line-height:1.6;color:var(--ink-2)}
.fabline .link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--gold)}
.fabline .link:hover{border-bottom-color:var(--ink)}
.selfstrip{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sand);border:1px dashed var(--warm-line);border-radius:14px;padding:13px 16px}
.selfstrip span{font-size:14px;line-height:1.5;color:var(--ink-2)}
.selfstrip button{margin-left:auto;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:9px 15px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;white-space:nowrap}
.selfstrip button:hover{background:#000}
.note{margin:22px 0 4px;background:#fff;border:1px solid var(--warm-line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;box-shadow:var(--shadow)}
.note .ico{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:15px}
.note p{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note p:last-child{margin:0}
.note b{color:var(--ink)}

/* layout */
.cols{display:flex;gap:34px;padding-block:28px 110px;align-items:flex-start}
aside{display:none}
@media(min-width:900px){aside{display:block;flex:0 0 236px;position:sticky;top:74px}}
main{flex:1;min-width:0;max-width:660px}
.navlabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit;transition:.15s}
.navbtn:hover{background:#fff}
.navbtn[aria-current="true"]{background:#fff;border-color:var(--deep);box-shadow:var(--shadow)}
.navbtn .row{display:flex;align-items:center;gap:11px}
.navbtn .num{flex:0 0 auto;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font:700 12px/1 Inter,sans-serif;background:#fff;color:var(--ink-3);border:1px solid var(--line)}
.navbtn[aria-current="true"] .num{background:var(--deep);color:#fff;border-color:var(--deep)}
.navbtn .t{min-width:0}
.navbtn .t b{display:block;font:600 13px/1.25 Inter,sans-serif;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn[aria-current="true"] .t b{color:var(--ink)}
.navbtn .t span{display:block;font-size:11px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media(min-width:900px){.scroller{display:none}}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 13px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.chip[aria-current="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}

/* session */
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.skicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.shead h2{margin-top:5px;font-size:clamp(23px,4vw,31px);line-height:1.12}
.shead .theme{margin-top:6px;font-size:14px;color:var(--ink-3)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .inner{padding:18px 20px}
@media(min-width:768px){.card .inner{padding:22px 26px}}
.klabel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.klabel .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.klabel .r{font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2)}
blockquote.verse{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(18px,2.7vw,21px);line-height:1.45;font-weight:500}
.vbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink-3);border-radius:999px;padding:5px 10px;font:600 11px/1 Inter,sans-serif;cursor:pointer}
.vbar button[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.vbar a.open{margin-left:auto;font:600 11.5px/1 Inter,sans-serif;color:var(--ink-3);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--bg)}
.vbar a.open:hover{border-color:var(--deep);color:var(--ink)}

.simply{font-size:15.5px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.simply b{color:var(--ink)}
.simplynote{font-size:13.5px;line-height:1.6;color:var(--ink-3);font-style:italic;margin:8px 0 0}

h3.sec{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:26px 0 10px}
.prose p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:var(--ink-2)}
.lead-prose,.simply,.simplynote,h3.sec{padding-inline:6px}
@media(min-width:768px){.lead-prose,.simply,.simplynote,h3.sec{padding-inline:10px}}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.box{background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;margin:16px 0}
.box p{margin:0 0 9px;font-size:14.5px;line-height:1.68;color:var(--ink-2)}
.box p:last-child{margin:0}

.learn{background:var(--deep);color:#f5e9d6;border-radius:18px;padding:20px}
@media(min-width:768px){.learn{padding:24px 28px}}
.learn h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.learn ol{margin:0;padding:0;list-style:none;counter-reset:l}
.learn li{counter-increment:l;display:flex;gap:13px;margin-bottom:12px;font-size:15px;line-height:1.65}
.learn li:last-child{margin:0}
.learn li::before{content:counter(l);flex:0 0 auto;width:22px;height:22px;margin-top:2px;border-radius:999px;background:rgba(217,184,140,.18);color:var(--gold);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif}
.learn b{color:#fff}
.learn a{color:var(--gold)}
.learn .caveat{margin:14px 0 0;font-size:13.5px;line-height:1.6;color:#cbb99e;font-style:italic}

.story{background:#fff;border:1px solid var(--warm-line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
@media(min-width:768px){.story{padding:24px 28px}}
.story::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:999px;background:var(--warm);pointer-events:none}
.story>*{position:relative}
.story h3{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 12px}
.story h3 i{font-style:normal;width:26px;height:26px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:12px}
.story p{margin:0 0 12px;font-size:15px;line-height:1.78;color:#4a3c2b}
.story p:last-child{margin:0}
.story .lead{font-size:13.5px;color:var(--ink-3);font-style:italic}

.extras{background:var(--sand);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(min-width:768px){.extras{padding:22px 26px}}
.extras h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 14px}
.ex{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.ex:last-child{margin:0}
.ex .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.ex .top b{font:600 13.5px/1 Inter,sans-serif}
.ex .top a{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.03em;background:var(--deep);color:#fff;border-radius:999px;padding:5px 9px;text-decoration:none}
.ex p{margin:0;font-size:14px;line-height:1.62;color:var(--ink-2)}

.week{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
@media(min-width:768px){.week{padding:22px 26px}}
.week h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin:0 0 10px}

.qs{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
@media(min-width:768px){.qs{padding:22px 26px}}
.qs.group{background:var(--deep);border-color:var(--deep)}
.qs h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.qs.group h3{color:var(--gold)}
.qs .hint{font-size:12.5px;color:var(--ink-4);margin:0 0 14px}
.qs.group .hint{color:#b6a184}
.qs ol{margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:12px;margin-bottom:11px;font-size:15px;line-height:1.62;color:var(--ink-2)}
.qs li:last-child{margin:0}
.qs li::before{content:"Q" counter(q);flex:0 0 auto;font:700 11px/1.5 Inter,sans-serif;color:var(--ink-4)}
.qs.group li{color:#f0e4d1}
.qs.group li::before{color:var(--gold)}

.pray{border:1px dashed var(--warm-line);background:var(--warm);border-radius:18px;padding:18px 20px}
@media(min-width:768px){.pray{padding:20px 26px}}
.pray h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 8px}
.pray p{margin:0;font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.55;color:#4a3c2b}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;font:500 13.5px/1 Inter,sans-serif;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{background:var(--deep);color:#fff;border-color:var(--deep)}
.pager .count{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4)}

/* scripture refs */
a.ref{text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap;color:inherit}
a.ref:hover{border-bottom-color:var(--ink);background:rgba(217,184,140,.16)}
a.ref sup{font-size:9px;letter-spacing:.04em;color:var(--gold-d);margin-left:2px;vertical-align:super}
.learn a.ref{border-bottom-color:var(--gold)}
.learn a.ref sup{color:var(--gold)}

/* self-check */
.fab{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:11px 16px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(43,33,23,.28);max-width:calc(100% - 28px)}
@media(min-width:768px){.fab{right:20px;bottom:20px;padding:13px 19px;font-size:13.5px}}
dialog.sheet{border:0;padding:0;border-radius:20px;max-width:620px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(43,33,23,.3)}
dialog.sheet::backdrop{background:rgba(43,33,23,.45)}
.sheet .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 0}
.sheet h2{font-size:23px}
.sheet .close{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:32px;font-size:16px;line-height:1;cursor:pointer;color:var(--ink-3)}
.sheet .body{padding:14px 24px 24px}
.sheet .body p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.sheet ol.check{list-style:none;margin:14px 0;padding:0;counter-reset:c}
.sheet ol.check li{counter-increment:c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;font-size:14.5px;line-height:1.55}
.sheet ol.check li::before{content:counter(c);flex:0 0 auto;width:21px;height:21px;border-radius:999px;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif;color:var(--ink-3)}
.sheet .prog{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);opacity:.8;margin:0 0 10px}
.sheet .wq{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px;color:var(--ink)}
.sheet .opts{display:grid;gap:8px;margin:0 0 4px}
.sheet .opts button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:600 15px/1.3 Inter,sans-serif;color:var(--ink);cursor:pointer}
.sheet .opts button:hover{border-color:var(--gold);background:var(--sand)}
.sheet .mirror{display:grid;gap:10px;margin:14px 0}
@media(min-width:520px){.sheet .mirror{grid-template-columns:1fr 1fr}}
.sheet .mcol{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.sheet .mcol.spirit{background:var(--warm);border-color:var(--warm-line)}
.sheet .mcol h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.sheet .mcol ul{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.sheet .namein{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:500 16px/1.3 Inter,sans-serif;color:var(--ink);background:#fff;margin:4px 0 10px}
.sheet .namein:focus{outline:none;border-color:var(--gold)}
.sheet .privacy{font-size:13px;line-height:1.6;color:var(--ink-3);background:var(--sand);border-radius:12px;padding:11px 13px;margin:0 0 14px}
.sheet .go{background:var(--deep);color:#fff;border:1px solid var(--deep);border-radius:999px;padding:12px 20px;font:600 14.5px/1 Inter,sans-serif;cursor:pointer}
.sheet .ghost{background:none;border:0;padding:10px 2px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-3);cursor:pointer;text-decoration:underline}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.sheet .doors{list-style:none;margin:12px 0 0;padding:0}
.sheet .doors li{padding:4px 0 4px 15px;position:relative;font-size:14.5px;line-height:1.5}
.sheet .doors li:before{content:"\2192";position:absolute;left:0;opacity:.5}
.sheet .close-note{background:var(--warm);border:1px solid var(--warm-line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:#4a3c2b;margin-top:14px}

/* leader */
details.leader{margin-top:34px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
details.leader summary{cursor:pointer;padding:16px 20px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.leader summary::-webkit-details-marker{display:none}
details.leader summary::before{content:"›";display:inline-block;transition:.2s;font-size:19px;color:var(--ink-4)}
details.leader[open] summary::before{transform:rotate(90deg)}
details.leader .lbody{padding:0 20px 20px}
details.leader .lbody p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}

footer.foot{border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:22px 34px;font-size:12px;line-height:1.7;color:var(--ink-4)}
.footin p{margin:0 0 8px}
.footin a{color:var(--ink-3)}
.footin .rights{font-size:11px;line-height:1.6}

@media print{
  header.top,aside,.scroller,.pager,.fab,.crumbs,.ctrl{display:none!important}
  body{background:#fff}
  .card,.learn,.story,.extras,.week,.qs,.pray{box-shadow:none;break-inside:avoid}
  .learn,.qs.group{background:#fff!important;color:#000!important;border:1px solid #ccc!important}
  .learn li,.qs.group li{color:#000!important}
  .learn h3,.qs.group h3{color:#666!important}
}

/* ---- leiersgids ---- */
body{--gp:#2f5d50}
.lbadge{display:inline-flex;align-items:center;gap:7px;background:var(--gp);color:#fff;border-radius:999px;padding:6px 13px;font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.lblock{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 14px 14px 0;padding:15px 17px;margin:18px 0}
.lblock>h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gp);margin:0 0 9px}
.lblock p{font-size:14.7px;line-height:1.72;color:#22322c;margin:0 0 11px}
.lblock p:last-child{margin-bottom:0}
.lblock ul{margin:0 0 11px;padding-left:19px;font-size:14.7px;line-height:1.72;color:#22322c}
.lblock .lbox{background:#fff;border:1px solid #cfe0d9;border-radius:12px;padding:13px 15px;margin:12px 0}
.lblock table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.lblock td{border-bottom:1px solid #d8e6e0;padding:8px 9px;vertical-align:top;line-height:1.55}
.lnote{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0 4px}
.lnote p{font-size:14.4px;line-height:1.7;color:#22322c;margin:0 0 10px}
.lnote p:last-child{margin-bottom:0}
.lnote ul{margin:0 0 10px;padding-left:19px;font-size:14.4px;line-height:1.7;color:#22322c}

<script>
const DATA = {"versions": {"AFR83": {"id": 6, "lang": "af", "name": "Afrikaans 1983"}, "AFR53": {"id": 5, "lang": "af", "name": "Afrikaans 1933/1953"}, "NLV": {"id": 117, "lang": "af", "name": "Nuwe Lewende Vertaling"}, "ESV": {"id": 59, "lang": "en", "name": "English Standard Version"}, "NIV": {"id": 111, "lang": "en", "name": "New International Version"}}, "books": {"af": {"Genesis": "GEN", "Eksodus": "EXO", "Levitikus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Konings": "1KI", "2 Konings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Spreuke": "PRO", "Prediker": "ECC", "Jesaja": "ISA", "Jeremia": "JER", "Matteus": "MAT", "Matthéüs": "MAT", "Markus": "MRK", "Lukas": "LUK", "Johannes": "JHN", "Handelinge": "ACT", "Romeine": "ROM", "1 Korintiërs": "1CO", "2 Korintiërs": "2CO", "Galasiërs": "GAL", "Efesiërs": "EPH", "Filippense": "PHP", "Kolossense": "COL", "1 Timoteus": "1TI", "2 Timoteus": "2TI", "Hebreërs": "HEB", "Jakobus": "JAS", "1 Petrus": "1PE", "2 Petrus": "2PE", "Judas": "JUD", "Openbaring": "REV"}, "en": {"Genesis": "GEN", "Exodus": "EXO", "Leviticus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Kings": "1KI", "2 Kings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Proverbs": "PRO", "Ecclesiastes": "ECC", "Isaiah": "ISA", "Jeremiah": "JER", "Matthew": "MAT", "Mark": "MRK", "Luke": "LUK", "John": "JHN", "Acts": "ACT", "Romans": "ROM", "1 Corinthians": "1CO", "2 Corinthians": "2CO", "Galatians": "GAL", "Ephesians": "EPH", "Philippians": "PHP", "Colossians": "COL", "1 Timothy": "1TI", "2 Timothy": "2TI", "Hebrews": "HEB", "James": "JAS", "1 Peter": "1PE", "2 Peter": "2PE", "Jude": "JUD", "Revelation": "REV"}}, "sessions": [{"n": 7, "id": "s7", "title": {"af": "Vergewe soos jy vergewe is", "en": "Forgive as you were forgiven"}, "theme": {"af": "Die vrylating", "en": "The release"}, "keyRef": {"af": "Kolossense 3:13", "en": "Colossians 3:13"}, "osis": "COL.3.13", "texts": {"AFR83": "Wees geduldig met mekaar en vergewe mekaar as die een iets teen die ander het. Soos die Here julle vergewe het, moet julle mekaar ook vergewe.", "AFR53": "Verdra mekaar en vergewe mekaar as die een teen die ander 'n klag het; soos Christus julle vergeef het, so moet julle ook doen.", "NLV": "Verdra mekaar en as enigeen ’n klagte teen iemand anders het, vergewe mekaar. Vergewe mekaar soos die Here julle vergewe het.", "ESV": "bearing with one another and, if one has a complaint against another, forgiving each other; as the Lord has forgiven you, so you also must forgive.", "NIV": "Bear with each other and forgive one another if any of you has a grievance against someone. Forgive as the Lord forgave you."}, "simply": {"af": "Jy word nie gevra om uit niks te vergewe nie. Jy word gevra om aan te gee wat jy self gekry het.", "en": "You are not asked to forgive out of nothing. You are asked to pass on what you were given."}, "simplyNote": {"af": "", "en": ""}, "meaning": {"af": [{"t": "p", "x": "Petrus vra hoeveel keer hy moet vergewe. Sewe keer? Jesus sê sewentig maal sewe, en vertel dan die verhaal (Matteus 18:21-35)."}, {"t": "p", "x": "Die getalle maak saak. Die slaaf skuld tienduisend talente — omtrent tweehonderdduisend jaar se dagloon. Dit is 'n doelbewus belaglike bedrag. Niemand in die vertrek kon dit as 'n werklike skuld hoor nie. En dit word geskrap, alles, in een sin."}, {"t": "p", "x": "Dan kry dieselfde man iemand wat hom honderd denarii skuld — omtrent drie maande se loon. Let op: dít is werklike geld. Jesus sê nie wat aan jou gedoen is, is niks nie. Hy sê dit is honderd denarii langs tienduisend talente."}, {"t": "p", "x": "En let op hoe die gelykenis eindig. Die koning gee hom oor aan die tronkbewaarders *\"totdat hy die hele skuld betaal het.\"* Onvergewensgesindheid is 'n tronk, en jý is die een binne-in. Dit is dieselfde prentjie as Spreuke 18:19 — grendels, deur die veronregte man self gebou."}, {"t": "p", "x": "**Drie eerlike grense, sodat niemand hier verward loop nie:**"}, {"t": "list", "x": ["**Vergifnis is nie vertroue nie.** Vergifnis skrap 'n skuld. Vertroue is toegang, en toegang word herbou deur veranderde gedrag oor tyd. Jy sal hoor dat liefde \"altyd vertrou\" (1 Korintiërs 13:7) en dat vertroue eerder gegee as verdien moet word. Hou dit langs Johannes 2:24, waar Jesus *\"Homself nie aan hulle toevertrou het nie, omdat Hy hulle almal geken het\"* — dieselfde woord. Jesus het almal liefgehad en Homself aan bykans niemand toevertrou nie. Liefde gee genade vrylik. Dit gee nie outomaties die sleutels terug nie.", "**Vergifnis is nie versoening nie.** Jy kan alleen vergewe. Jy kan nie alleen versoen nie — dit vat twee, en een van hulle moet berou hê.", "**Vergifnis beteken nooit dat jy terug in gevaar gaan nie.** Waar iemand mishandel, bedreig of uitgebuit word, is vergifnis iets wat jy op 'n veilige afstand doen, en dit vervang nooit die feit dat jy iemand moet vertel, hulp moet kry, of 'n misdaad moet aanmeld nie. Jesus roep ons om voetwassers te wees, nie deurmatte nie. As hierdie sessie aan iets raak wat jy nog vir niemand vertel het nie, sê dit vir 'n leier."]}], "en": [{"t": "p", "x": "Peter asks how many times he must forgive. Seven? Jesus says seventy-seven, and then tells the story (Matthew 18:21-35)."}, {"t": "p", "x": "The numbers matter. The servant owes ten thousand talents — roughly two hundred thousand years of a labourer's wages. It is a deliberately absurd figure. Nobody in the room could hear it as a real debt. And it is cancelled, all of it, in one sentence."}, {"t": "p", "x": "Then that same man finds someone who owes him a hundred denarii — about three months' wages. Notice: that is real money. Jesus is not saying what was done to you was nothing. He is saying it is a hundred denarii standing next to ten thousand talents."}, {"t": "p", "x": "And notice how the parable ends. The master hands him to the jailers *\"until he should pay all his debt.\"* Unforgiveness is a prison, and you are the one inside it. It is the same picture as Proverbs 18:19 — barred gates, built by the offended man himself."}, {"t": "p", "x": "**Three honest limits, so nobody leaves confused:**"}, {"t": "list", "x": ["**Forgiveness is not trust.** Forgiveness cancels a debt. Trust is access, and access is rebuilt by changed behaviour over time. You will hear it said that love \"always trusts\" (1 Corinthians 13:7) and that trust should be given rather than earned. Hold that next to John 2:24, where Jesus *\"did not entrust himself to them, because he knew all people\"* — the same word. Jesus loved everyone and entrusted Himself to almost no one. Love gives grace freely. It does not hand back the keys automatically.", "**Forgiveness is not reconciliation.** You can forgive alone. You cannot reconcile alone — that takes two, and one of them repenting.", "**Forgiveness never means going back into harm.** Where someone is being abused, threatened or exploited, forgiveness is something you do from a safe distance, and it never replaces telling someone, getting help, or reporting a crime. Jesus calls us to be foot-washers, not doormats. If this session touches something you have not told anyone, tell a leader."]}]}, "points": {"af": [{"t": "list", "x": ["Vergifnis is om 'n skuld te skrap: jy hou op om betaling te eis.", "Vergifnis is nie dieselfde as vertroue nie, en nie dieselfde as versoening nie. Net die eerste een kan jy alleen doen.", "Onvergewensgesindheid is 'n tronk wat jy self bou en dan in gaan bly — en hoe werkliker die onreg was, hoe meer geregverdig sal jy voel om te bly. Dit is die enigste tronk waar onskuldig wees jou langer toegesluit hou."]}], "en": [{"t": "list", "x": ["Forgiveness is cancelling a debt: you stop requiring payment.", "Forgiveness is not the same as trust, and not the same as reconciliation. Only the first can be done alone.", "Unforgiveness is a prison you build and then live in — and the more genuinely wronged you were, the more justified you will feel staying in it. It is the one prison where being innocent keeps you locked up longer."]}]}, "story": {"af": [{"t": "p", "x": "Willem het die plaas gekry (geërf). Dit was so in die testament, en die testament was duidelik, en Kobus het nooit een keer gesê dit was onregverdig nie."}, {"t": "p", "x": "Wat hy wél gesê het — elf jaar lank, vir sy vrou, in die kar op pad terug van elke familiebyeenkoms — is dat Willem nooit gebel het om eers daaroor te praat nie. Hy het dit hardop voorgelees gehoor aan 'n tafel met sewe ander mense in die vertrek."}, {"t": "p", "x": "Kobus het vir een sin gewag. Net een: *Ek moes jou gebel het.* Dit was aan hom verskuldig. Dit was werklik aan hom verskuldig."}, {"t": "p", "x": "Hy het elf jaar gewag. Twee van hulle kinders is in daardie tyd getroud en hy het aan die ander kant van die kerk gesit."}, {"t": "p", "x": "Hy was agt-en-vyftig toe dit hom tref, in die bakkie, in 'n ry by 'n vulstasie: *\"hy gaan dit nooit sê nie.\"* Nie uit wreedheid nie. Willem het net nie daardie sin in hom nie en het dit nooit gehad nie."}, {"t": "p", "x": "So Kobus het gewag vir 'n betaling wat nooit sou aankom nie. En hy het elf jaar lank rente daarop betaal."}, {"t": "p", "x": "Hy het dit daardie middag geskrap. Hardop, alleen in die bakkie, en hy het dom gevoel."}, {"t": "p", "x": "Hulle is nie naby vandag nie. Daar was geen versoeningstoneel op die stoep nie. Hy en Willem praat oor reënval en diesel en hulle los dit daar."}, {"t": "p", "x": "Maar Kobus gaan na die troues toe. En as hy daarna huis toe ry, is die kar stil."}], "en": [{"t": "p", "x": "The farm went to Willem. That was in the will, and the will was clear, and Kobus has never once said it was unfair."}, {"t": "p", "x": "What he has said — for eleven years, to his wife, in the car on the way home from every family gathering — is that Willem never phoned to talk about it first. He heard it read out at a table with seven other people in the room."}, {"t": "p", "x": "Kobus was waiting for a sentence. Just one: *I should have called you.* He was owed it. He was genuinely owed it."}, {"t": "p", "x": "He waited eleven years. Two of their children got married in that time and he sat on the other side of the church."}, {"t": "p", "x": "He was fifty-eight when it landed on him, in the bakkie, in a queue at a filling station: *he is never going to say it.* Not out of cruelty. Willem does not have that sentence in him and never has."}, {"t": "p", "x": "So Kobus was waiting for a payment that was never going to arrive. And he had been paying interest on it for eleven years."}, {"t": "p", "x": "He cancelled it that afternoon. Out loud, alone in the bakkie, feeling foolish."}, {"t": "p", "x": "They are not close now. There was no scene of reconciliation on the stoep. He and Willem talk about rainfall and diesel and they leave it there."}, {"t": "p", "x": "But Kobus goes to the weddings. And when he drives home afterwards, the car is quiet."}]}, "extras": {"af": [{"ref": "Matteus 18:32-33", "osis": "MAT.18.32", "note": "Die koning se vraag aan die slaaf wat pas vergewe is. Die hele gelykenis draai om daardie een vergelyking."}, {"ref": "Efesiërs 4:31-32", "osis": "EPH.4.31", "note": "Die maatstaf is nie wat hulle verdien nie. Dit is wat jy gekry het."}, {"ref": "Markus 11:25", "osis": "MRK.11.25", "note": "Vergifnis word langs gebed gesit, nie langs gevoelens nie."}], "en": [{"ref": "Matthew 18:32-33", "osis": "MAT.18.32", "note": "The king's question to the servant who has just been forgiven. The whole parable turns on that one comparison."}, {"ref": "Ephesians 4:31-32", "osis": "EPH.4.31", "note": "The standard is not what they deserve. It is what you were given."}, {"ref": "Mark 11:25", "osis": "MRK.11.25", "note": "Forgiveness is put next to prayer, not next to feelings."}]}, "week": {"af": [{"t": "p", "x": "Noem die skuld presies. Wat presies is aan jou verskuldig — 'n verskoning, 'n verduideliking, 'n erkenning? Skryf die woorde neer. Besluit dan hardop wat jy met die rekening doen."}], "en": [{"t": "p", "x": "Name the debt precisely. What exactly are you owed — an apology, an explanation, an acknowledgement? Write the words. Then decide out loud what you are doing with the bill."}]}, "qhome": {"af": ["Wat presies voel jy is aan jou verskuldig? Sê dit in een sin, presies.", "Wag jy vir 'n betaling wat nooit gaan aankom nie?", "Wat het God vir jou geskrap waaraan jy byna nooit dink nie?"], "en": ["What exactly do you feel you are owed? Say it in one sentence, precisely.", "Are you waiting for a payment that is never going to arrive?", "What has God cancelled for you that you almost never think about?"]}, "qgroup": {"af": ["Jesus het die tweede skuld werklike geld gemaak, nie niks nie. Hoekom maak daardie besonderheid soveel saak?", "Wat is die verskil tussen om iemand te vergewe en om hulle weer te vertrou? Kan jy die eerste doen sonder die tweede?", "Waar hou vergifnis op om 'n deurmat te wees? Hoe leer ons albei kante hiervan eerlik?"], "en": ["Jesus made the second debt real money, not nothing. Why does that detail matter so much?", "What is the difference between forgiving someone and trusting them again? Can you do the first without the second?", "Where does forgiveness stop being a doormat? How do we teach both sides of that honestly?"]}, "prayer": {"af": "*Vader, ek hou 'n rekening vas. U het myne afgeskryf en ek dink skaars daaraan. Ek skrap hierdie een — vandag, hardop, of daar iets aan hulle kant verander of nie.*", "en": "*Father, I have been holding a bill. You cancelled mine and I hardly think about it. I cancel this one — today, out loud, whether or not anything changes on their side.*"}}], "selfcheck": {"af": {"intro": ["Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Die toets kan dus nie wees \"voel ek aanstoot?\" nie — niemand antwoord dít eerlik nie. Die toets moet oor simptome gaan.", "Paulus lys hulle in Galasiërs 5:19-21, en langs verse 22-23 gelees werk dit soos 'n diagnose. Aan die een kant: vyandskap, twis, jaloesie, woede-uitbarstings, selfsug, tweedrag, verdeeldheid. Aan die ander kant: liefde, blydskap, vrede, geduld, vriendelikheid. Jy kan nie in albei tegelyk wandel nie. As die eerste lys is wat opkom wanneer jy aan 'n bepaalde mens dink, sit jou voet in die strik — hoe goed jou saak ook al is.", "**Ses eerlike vrae. Kies een mens en antwoord vir hulle.**"], "questions": ["Wanneer hulle naam opkom, wat gebeur in jou bors?", "As jy hulle in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie vertel aan iemand wat dit nie hoef te gehoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir hulle?", "Kan jy God hardop, by die naam, vir hulle dank en dit bedoel?", "Kan jy in 'n vertrek sit en hoor hoe hulle geprys word sonder om 'n \"maar\" by te sit?"], "close": "**As verskeie van dié raak vat:** jy is nie 'n slegte mens nie en jy is waarskynlik nie verkeerd oor die feite nie. Jy is in 'n strik. Om reg te wees is wat die meeste mense daarin hou. Gaan terug na sessie 5 (gee die saak oor), sessie 6 (gaan na hulle), of sessie 7 (skrap die skuld) — watter een jy ook al vermy het."}, "en": {"intro": ["The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel *right*. So the test cannot be \"am I offended?\" — nobody answers that honestly. The test has to be about symptoms.", "Paul lists them in Galatians 5:19-21, and read side by side with verses 22-23 they work as a diagnostic. On the one side: enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions. On the other: love, joy, peace, patience, kindness. You cannot walk in both at once. If the first list is what comes up when you think of a particular person, your foot is in the trap, however good your case is.", "**Six honest questions. Pick one person and answer for them.**"], "questions": ["When their name comes up, what happens in your chest?", "If you saw them in the shop, would you turn down a different aisle?", "Have you told the story to someone who did not need to hear it?", "Do you find yourself hoping something goes slightly wrong for them?", "Can you thank God for them out loud, by name, and mean it?", "Could you sit in a room and hear them praised without adding a \"but\"?"], "close": "**If several of those land:** you are not a bad person and you are probably not wrong about the facts. You are in a trap. Being right is what keeps most people in it. Go back to Session 5 (hand the case over), Session 6 (go to them), or Session 7 (cancel the debt) — whichever one you have been avoiding."}}, "check": {"af": {"step": "Stap", "of": "van", "mirrorTitle": "Eers die spieël", "mirrorLead": "Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Daarom kan die toets nie wees \"voel ek aanstoot?\" nie. Niemand antwoord dít eerlik nie.", "mirrorLead2": "Paulus gee vir ons 'n ander soort toets. Hy sit twee lyste langs mekaar in Galasiërs 5:19-23. Jy kan nie in albei tegelyk loop nie. Kyk watter lys opkom wanneer jy aan een bepaalde mens dink.", "fleshTitle": "Die vlees", "flesh": ["vyandskap", "twis", "jaloesie", "woede-uitbarstings", "selfsug", "tweedrag", "verdeeldheid"], "spiritTitle": "Die Gees", "spirit": ["liefde", "blydskap", "vrede", "geduld", "vriendelikheid", "goedhartigheid", "getrouheid"], "mirrorClose": "Hierdie toets vra nie of jou saak goed is nie. Dit vra net wat in jou gebeur.", "go": "Ek is gereed", "nameTitle": "Wie is die mens?", "nameLead": "Dink aan een mens. Tik hulle naam, of laat dit leeg as jy liewer nie wil nie.", "namePlaceholder": "Naam", "namePrivacy": "Wat jy hier tik bly op jou foon. Dit word nêrens gestoor of gestuur nie, ook nie op hierdie toestel nie. Maak die blad toe en dit is weg.", "nameSkip": "iemand", "start": "Begin", "yes": "Ja", "unsure": "Nie seker", "no": "Nee", "back": "Terug", "q": ["Wanneer {n} se naam opkom, trek iets in jou bors saam?", "As jy {n} in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie oor {n} vertel aan iemand wat dit nie hoef te hoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir {n}?", "Sukkel jy om God hardop vir {n} te dank, by die naam, en dit te bedoel?", "Sukkel jy om te hoor hoe {n} geprys word sonder om 'n \"maar\" by te sit?"], "resultTitle": "Wat dit aandui", "r0": "Niks hier dui daarop dat jy met {n} vasgevang is nie. Dit is goeie nuus, en dit is die moeite werd om dit so te hou.\n\nAs 'n ander naam by jou opgekom het terwyl jy die vrae gelees het, doen die toets weer vir daardie mens. Dít is gewoonlik die een.", "r1": "Daar is iets hier, maar dit is nog vroeg. Op hierdie stadium is dit klein genoeg om te hanteer sonder dat iemand anders eers hoef te weet.\n\nDit is presies die oomblik waar 'n mens dit gewoonlik laat lê, en dit is presies hoekom dit later 'n muur word.", "r2": "Jou voet is in die strik.\n\nJy is nie 'n slegte mens nie, en jy is waarskynlik nie verkeerd oor die feite nie. Om reg te wees is juis wat die meeste mense daarin hou.", "door6": "Jy praat **oor** {n} eerder as **met** {n}. Begin by sessie 6.", "door7": "Jy hou 'n rekening oop wat jy kan skrap. Begin by sessie 7.", "door5": "Jy dra 'n saak wat jy kan oorgee. Begin by sessie 5.", "alsoTitle": "Die drie deure", "also": ["Sessie 5 — gee die saak oor", "Sessie 6 — gaan na hulle toe", "Sessie 7 — skrap die skuld"], "again": "Doen dit weer", "close": "Maak toe"}, "en": {"step": "Step", "of": "of", "mirrorTitle": "The mirror first", "mirrorLead": "The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel **right**. So the test cannot be \"am I offended?\" Nobody answers that one honestly.", "mirrorLead2": "Paul gives us a different kind of test. He puts two lists side by side in Galatians 5:19-23. You cannot walk in both at once. Watch which list comes up when you think of one particular person.", "fleshTitle": "The flesh", "flesh": ["enmity", "strife", "jealousy", "fits of anger", "rivalries", "dissensions", "divisions"], "spiritTitle": "The Spirit", "spirit": ["love", "joy", "peace", "patience", "kindness", "goodness", "faithfulness"], "mirrorClose": "This test does not ask whether your case is good. It only asks what is happening in you.", "go": "I am ready", "nameTitle": "Who is the person?", "nameLead": "Think of one person. Type their name, or leave it blank if you would rather not.", "namePlaceholder": "Name", "namePrivacy": "What you type stays on your phone. It is not stored or sent anywhere, not even on this device. Close the page and it is gone.", "nameSkip": "someone", "start": "Start", "yes": "Yes", "unsure": "Not sure", "no": "No", "back": "Back", "q": ["When {n}'s name comes up, does something tighten in your chest?", "If you saw {n} in the shop, would you turn down a different aisle?", "Have you told the story about {n} to someone who did not need to hear it?", "Do you ever hope something goes slightly wrong for {n}?", "Do you struggle to thank God out loud for {n}, by name, and mean it?", "Do you struggle to hear {n} praised without adding a \"but\"?"], "resultTitle": "What this points to", "r0": "Nothing here suggests you are caught with {n}. That is good news, and it is worth keeping that way.\n\nIf another name came to mind while you were reading the questions, run it again for that person. That is usually the one.", "r1": "There is something here, but it is early. At this stage it is small enough to deal with before anyone else needs to know about it.\n\nThis is exactly the point where people leave it, and exactly why it becomes a wall later.", "r2": "Your foot is in the trap.\n\nYou are not a bad person, and you are probably not wrong about the facts. Being right is what keeps most people in it.", "door6": "You are talking **about** {n} rather than **to** {n}. Start at session 6.", "door7": "You are holding an account open that you could cancel. Start at session 7.", "door5": "You are carrying a case you could hand over. Start at session 5.", "alsoTitle": "The three doors", "also": ["Session 5 — hand the case over", "Session 6 — go to them", "Session 7 — cancel the debt"], "again": "Run it again", "close": "Close"}}, "leader": {"af": ["**Oor sessie 4.** Dit is die sessie waar iemand dalk vir die eerste keer hardop sê dat hulle kwaad is vir God. Moenie dit regmaak nie, moenie God verdedig nie, en moenie vinnig na die volgende vraag beweeg nie. Jesus het Johannes nie berispe omdat hy gevra het nie. Die vertrek moet ook nie.", "**Oor sessie 7.** Onderrig oor vergifnis is waar 'n groep werklike skade kan doen sonder om dit te bedoel. Twee reëls: niemand word ooit gesê om volgens 'n tydtafel te vergewe nie, en niemand word ooit gesê dat vergewe beteken jy gaan terug nie. As iemand in die groep mishandeling of 'n misdaad openbaar, gaan dit na 'n leier en na die owerhede. Sê dit van voor af, eerder as om dit in 'n voetnoot te laat.", "**Oor Andrew Selley se twee boodskappe.** Die strikbeeld, die spooknet, die bysteek en \"die pyn volg die perspektief\", die sononder-reël, die Galasiërs 5-diagnose en Absalom kom uit sy tweede boodskap, *Hurt but Not Offended*. Drie dinge is doelbewus van die studieblad af weggelaat:", "- **Sy vertelling van 'n vrou wat deur verskeie mans aangerand is en hulle een vir een vergewe het terwyl dit gebeur.** Dit dra die punt, maar die blad word alleen gelees, op 'n foon, deur tieners sowel as volwassenes, met geen leier in die vertrek nie. Die beginsel staan sonder dit.\n- **\"Trust isn't earned, it's given.\"** Net so gelaat, plaas dit mense terug binne bereik van dié wat hulle skade aangedoen het. Sessie 7 behou die liefde en voeg Johannes 2:24 by.\n- **\"Jesus never had to forgive anybody\"** — die argument dat \"Vader, vergeef hulle\" voorbidding was eerder as vergifnis. Verdedigbaar, maar dit is 'n fyn onderskeid wat meer in verwarring gaan kos as wat dit in presiesheid wen. Sessie 5 rus op 1 Petrus 2:23, wat niemand betwis nie.", "Die frase \"'n onaanstootlike kerk\" in sessie 8 is ook syne — dit is hoe hy die hele reeks raam. Iewers in die agt weke werd om van voor af te sê, want dit is die studie se eie beginsel op homself toegepas: *ons kan nie die aanstoot van die evangelie verwyder nie — maar ons wil dit in liefde en versigtigheid oorbring.*"], "en": ["**On Session 4.** This is the session where someone may say out loud, for the first time, that they are angry with God. Do not fix it, do not defend God, and do not move quickly to the next question. Jesus did not rebuke John for asking. The room should not either.", "**On Session 7.** Forgiveness teaching is where a group can do real damage without meaning to. Two rules to hold: nobody is ever told to forgive on a timetable, and nobody is ever told that forgiving means going back. If someone discloses abuse or a crime in the group, that goes to a leader and to the proper authorities. Say that from the front rather than leaving it in a footnote.", "**On Andrew Selley's two messages.** The trap image, the ghost net, the bee sting and \"the pain follows the perspective\", the sundown rule, the Galatians 5 diagnostic and Absalom all come from his part-two message, *Hurt but Not Offended*. Three things were deliberately left out of the study page:", "- **His account of a woman assaulted by several men, forgiving them as it happened.** It carries the point, but the study page is read alone, on a phone, by teenagers as well as adults, with no leader in the room. The principle stands without it.\n- **\"Trust isn't earned, it's given.\"** Held as-is, it puts people back within reach of those who harmed them. Session 7 keeps the love and adds John 2:24.\n- **\"Jesus never had to forgive anybody\"** — the argument that \"Father, forgive them\" was intercession rather than forgiveness. It is a defensible reading, but it is a fine distinction that will cost more in confusion than it gains in precision. Session 5 rests on 1 Peter 2:23, which nobody disputes.", "The phrase \"an unoffendable church\" in Session 8 is also his — it is how he frames the whole series. Worth saying from the front at some point in the eight weeks, because it is the study's own principle turned on itself: *we cannot remove the offence of the gospel — but we must not be recklessly careless where it is not necessary.*"]}};
const GUIDE = {"sessions": [{"n": 7, "lead": {"af": [{"t": "p", "x": "**Kolossense 3:13** · gee deur wat jy gekry het"}], "en": [{"t": "p", "x": "**Colossians 3:13** · pass on what you were given"}]}, "before": {"af": [{"t": "p", "x": "**Lees die drie grense hardop voordat die gesprek begin.** Nie daarna nie. Nie as 'n voetnoot nie. Iemand in die vertrek is in 'n situasie waarvan jy nie weet nie, en die volgorde waarin hulle dinge hoor, maak saak."}, {"t": "list", "x": ["**Vergifnis is nie vertroue nie.** Vergifnis skrap 'n skuld. Vertroue is toegang, en toegang word deur veranderde gedrag oor tyd herbou. Jy sal hoor dat liefde alles glo (1 Korintiërs 13:7) en dat vertroue gegee eerder as verdien moet word. Hou dit langs Johannes 2:24 *(in die sessie)*, waar Jesus *\"Hom nie op hulle verlaat het nie, omdat Hy geweet het hoe hulle almal is\"* — dieselfde woord. Hy het almal liefgehad en Homself aan byna niemand toevertrou nie.", "**Vergifnis is nie versoening nie.** Jy kan alleen vergewe. Jy kan nie alleen versoen nie. Dit vat twee, en een van hulle moet berou hê.", "**Vergifnis beteken nooit om terug te gaan in skade in nie.** Waar iemand mishandel, bedreig of misbruik word, word daar op 'n veilige afstand vergewe. Dit vervang nooit om iemand te vertel, hulp te kry, of 'n misdaad aan te meld nie. Voetewassers, nie voetvee nie."]}, {"t": "p", "x": "Die getalle in die gelykenis dra die onderrig. Tien duisend talente is omtrent twee honderd duisend jaar se dagloon — 'n doelbewus belaglike bedrag wat niemand in die vertrek as 'n werklike skuld kan hoor nie. Dit word in een sin geskrap. Die honderd denarii is omtrent drie maande se loon. Regte geld."}, {"t": "p", "x": "En let op waar die gelykenis eindig. Die man word aan die tronkbewaarders oorgegee *totdat hy die hele skuld betaal het*. Onvergewensgesindheid is 'n tronk, en die man wat verontreg is, is die een binne-in. Dieselfde prentjie as Spreuke 18:19: gesluite poorte, gebou deur die veronregte man self."}, {"t": "p", "x": "**Waar dit skeefloop:** iemand stap uit en glo hulle is aangesê om terug te gaan na 'n mens wat hulle seermaak. Of dat hulle lang wag dwaas was. **Kobus het elf jaar gewag** vir een sin van sy broer Willem — *ek moes jou gebel het* — en hy was dit werklik geskuld. Die studie sê nêrens dat hy nie was nie. Wat dit sê, is dat Willem daardie sin nie in hom het nie en nooit gehad het nie, en dat Kobus dus rente betaal het op 'n betaling wat nooit sou opdaag nie."}], "en": [{"t": "p", "x": "**Read the three limits out loud before the discussion starts.** Not after. Not as a footnote. Someone in the room is in a situation you do not know about, and the order in which they hear things matters."}, {"t": "list", "x": ["**Forgiveness is not trust.** Forgiveness cancels a debt. Trust is access, and access is rebuilt by changed behaviour over time. You will hear it said that love always trusts (1 Corinthians 13:7) and that trust should be given rather than earned. Hold that next to John 2:24 *(in the session)*, where Jesus *\"did not entrust himself to them, because he knew all people\"* — the same word. He loved everybody and entrusted Himself to almost nobody.", "**Forgiveness is not reconciliation.** You can forgive on your own. You cannot reconcile on your own. That takes two, and one of them repenting.", "**Forgiveness never means going back into harm.** Where someone is being abused, threatened or used, forgiveness is done from a safe distance. It never replaces telling someone, getting help, or reporting a crime. Foot-washers, not doormats."]}, {"t": "p", "x": "The numbers in the parable carry the teaching. Ten thousand talents is roughly two hundred thousand years of a labourer's wages — a deliberately silly figure that nobody in the room could hear as a real debt. It is cancelled in one sentence. The hundred denarii is about three months' wages. Real money."}, {"t": "p", "x": "And notice where the parable ends. The servant is handed to the jailers *until he should pay all his debt*. Unforgiveness is a prison, and the man who was wronged is the one inside it. Same picture as Proverbs 18:19: barred gates, built by the offended man himself."}, {"t": "p", "x": "**Where it goes wrong:** someone leaves believing they have been told to go back to a person who is hurting them. Or that their long wait was foolish. **Kobus waited eleven years** for one sentence from his brother Willem — *I should have called you* — and he was genuinely owed it. The study never says he was not. What it says is that Willem does not have that sentence in him and never did, so Kobus was charging himself interest on a payment that was never going to arrive."}]}, "qhome": {"af": [{"q": "Wat presies voel jy word jou geskuld? Sê dit in een sin.", "note": [{"t": "p", "x": "Om presies te wees is die punt. *'n Verskoning* is te vaag om te skrap. *Hy moes my gebel het voordat dit voorgelees is* is 'n rekening wat jy werklik kan opskeur."}]}, {"q": "Wag jy vir 'n betaling wat nooit gaan kom nie?", "note": [{"t": "p", "x": "Dit is Kobus in die bakkie by die vulstasie. Dikwels is dit nie wreedheid aan die ander kant nie. Willem het daardie sin eenvoudig nie in hom nie."}]}, {"q": "Wat het God vir jou geskrap waaraan jy byna nooit dink nie?", "note": [{"t": "p", "x": "Die gelykenis se eie vraag, persoonlik gemaak. As die antwoord vinnig en algemeen kom, is dit nie behoorlik gevra nie."}]}], "en": [{"q": "What exactly do you feel you are owed? Say it in one sentence.", "note": [{"t": "p", "x": "Being precise is the point. *An apology* is too vague to cancel. *He should have phoned me before it was read out* is a bill you can actually tear up."}]}, {"q": "Are you waiting for a payment that is never going to arrive?", "note": [{"t": "p", "x": "This is Kobus in the bakkie at the filling station. Often it is not cruelty on the other side. Willem simply does not have that sentence in him."}]}, {"q": "What has God cancelled for you that you almost never think about?", "note": [{"t": "p", "x": "The parable's own question, made personal. If the answer comes quickly and generally, it has not been asked properly."}]}]}, "qgroup": {"af": [{"q": "Jesus het die tweede skuld regte geld gemaak, nie niks nie. Hoekom maak dit soveel saak?", "note": [{"t": "p", "x": "Omdat dit die veronregte mens beskerm daarteen om te hoor dat sy besering klein was."}, {"t": "p", "x": "As Jesus die tweede skuld 'n paar sent gemaak het, sou vergifnis op grootte loop — *dit was mos nie so erg nie* — en almal wie se besering wél erg was, sou uit die onderrig gesluit wees. In plaas daarvan is die grond van vergifnis glad nie die grootte van hulle skuld nie. Dit is die grootte van myne, wat geskrap is. Dít is presies wat Kolossense sê: *soos die Here julle vergewe het, moet julle mekaar ook vergewe.*"}, {"t": "p", "x": "Dit is die pastoraal belangrikste detail in die sessie. Honderd denarii is drie maande se loon. Jesus sê nie dat wat aan jou gedoen is, niks was nie."}]}, {"q": "Wat is die verskil tussen om iemand te vergewe en om hulle weer te vertrou? Kan jy die eerste doen sonder die tweede?", "note": [{"t": "p", "x": "Ja, en dit is die nuttigste onderskeid in die hele studie."}, {"t": "p", "x": "Vergifnis skrap 'n skuld. Vertroue gee toegang. Vergifnis is eensydig en kan vandag gedoen word. Vertroue is tweesydig en word deur veranderde gedrag oor tyd herbou. Johannes 2:24 maak dit uit: dieselfde woord, en Jesus het dit teruggehou terwyl Hy ten volle liefgehad het."}, {"t": "p", "x": "*Dit is die punt in die agt weke waar iemand in 'n moeilike situasie die waarskynlikste gaan praat, of die waarskynlikste baie stil gaan word.* Kyk na die vertrek eerder as na die horlosie."}]}, {"q": "Waar hou vergifnis op om 'n voetveeg te wees? Hoe leer ons albei kante eerlik?", "note": [{"t": "p", "x": "**Vergifnis eindig waar veiligheid begin.** Dit is die kort antwoord en dit is die moeite werd om dit in daardie woorde te sê."}, {"t": "p", "x": "Om albei kante eerlik te leer beteken een ding in die praktyk: die opdrag en die grense word in dieselfde asem gesê, altyd. Nooit in 'n voetnoot nie en nooit in 'n latere sessie nie. 'n Groep wat op een aand \"vergewe soos julle vergewe is\" hoor en die grense 'n maand later, is sleg geleer, ongeag wat uiteindelik gesê is."}, {"t": "p", "x": "En sê die plig om aan te meld reguit, eerder as om daarna te hint."}]}], "en": [{"q": "Jesus made the second debt real money, not nothing. Why does that matter so much?", "note": [{"t": "p", "x": "Because it protects the wronged person from being told their injury was small."}, {"t": "p", "x": "If Jesus had made the second debt a few cents, forgiveness would run on size — *it was not that bad* — and everybody whose injury really was bad would be shut out of the teaching. Instead, the ground of forgiveness is not the size of their debt at all. It is the size of mine, which was cancelled. That is exactly what Colossians says: *as the Lord has forgiven you, so you also must forgive.*"}, {"t": "p", "x": "This is the most pastorally important detail in the session. A hundred denarii is three months' wages. Jesus is not saying what was done to you was nothing."}]}, {"q": "What is the difference between forgiving someone and trusting them again? Can you do the first without the second?", "note": [{"t": "p", "x": "Yes, and this is the most useful distinction in the whole study."}, {"t": "p", "x": "Forgiveness cancels a debt. Trust gives access. Forgiveness is one-sided and can be done today. Trust is two-sided and is rebuilt by changed behaviour over time. John 2:24 settles it: same word, and Jesus held it back while loving fully."}, {"t": "p", "x": "*This is the point in the eight weeks where somebody in a hard situation is most likely to speak, or most likely to go very quiet.* Watch the room rather than the clock."}]}, {"q": "Where does forgiveness stop being a doormat? How do we teach both sides honestly?", "note": [{"t": "p", "x": "**Forgiveness ends where safety begins.** That is the short answer and it is worth saying in those words."}, {"t": "p", "x": "Teaching both sides honestly means one thing in practice: the command and the limits get said in the same breath, always. Never in a footnote and never in a later session. A group that hears \"forgive as you were forgiven\" one evening and the limits a month later has been taught badly, whatever was eventually said."}, {"t": "p", "x": "And say the reporting duty plainly, rather than hinting at it."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Wat sou môre verander as die rekening vanaand geskrap word en niks aan hulle kant verander nie?\"*"}], "en": [{"t": "p", "x": "*\"What would change tomorrow if the bill were cancelled tonight and nothing on their side changed at all?\"*"}]}, "title": "Vergewe soos jy vergewe is  ·  Forgive as you were forgiven"}]};

function linkRefs(html, sessionN){
  const parts = html.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<[^>]+>)/g);
  return parts.map(seg=>{
    if (!seg || seg[0]==="<") return seg;
    return seg.replace(bookRe[lang], (m, book, ch, v) => {
      const code = DATA.books[lang][book];
      if (!code) return m;
      const osis = code+"."+ch+(v?"."+v:"");
      const key  = code+"."+ch+(v?"."+v.split(/[–-]/)[0]:"");
      const tgt  = verseIndex[key];
      if (tgt && tgt !== sessionN)
        return '<a class="ref" href="#s'+tgt+'" title="'+T[lang].seeS+' '+tgt+'">'+m+'<sup>S'+tgt+'</sup></a>';
      return '<a class="ref" href="'+bibleUrl(osis)+'" target="_blank" rel="noopener" title="'+DATA.versions[ver].name+'">'+m+'<sup>↗</sup></a>';
    });
  }).join("");
}

/* ---------- inline markdown ---------- */
function md(s, sessionN){
  let h = esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[(.+?)\]\((#?[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return linkRefs(h, sessionN);
}
const blocks = (arr, n) => arr.map(b=>{
  if (b.t==="box")  return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  if (b.t==="list") return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  return "<p>"+md(b.x,n)+"</p>";
}).join("");

/* ---------- render ---------- */
function renderChrome(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T[lang][el.dataset.t]; });
  document.getElementById("fab").textContent = T[lang].fab;
  document.getElementById("footNote").textContent = T[lang].foot;
  document.getElementById("fabIntro").innerHTML = T[lang].fabIntro+' <button class="link" data-check>'+T[lang].fabDo+" →</button>";
  document.getElementById("btnAF").setAttribute("aria-pressed", lang==="af");
  document.getElementById("btnEN").setAttribute("aria-pressed", lang==="en");
  document.getElementById("verBox").innerHTML = Object.keys(DATA.versions)
    .map(k=>'<button data-v="'+k+'" aria-pressed="'+(k===ver)+'" title="'+DATA.versions[k].name+'">'+k+"</button>").join("");
  document.querySelectorAll("#verBox button").forEach(b=>b.onclick=()=>{ ver=b.dataset.v; render(); });

  const nav = DATA.sessions.map(s=>
    '<button class="navbtn" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'"><span class="row">'+
    '<span class="num">'+s.n+'</span><span class="t"><b>'+esc(s.title[lang])+"</b><span>"+esc(s.keyRef[lang])+"</span></span></span></button>").join("");
  document.getElementById("nav").innerHTML = nav;
  document.getElementById("chips").innerHTML = DATA.sessions.map(s=>
    '<button class="chip" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'">'+s.n+". "+esc(s.title[lang])+"</button>").join("");
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>go(+b.dataset.n));

  document.getElementById("leaderBody").innerHTML = DATA.leader[lang].map(p=>"<p>"+md(p,0)+"</p>").join("");
}


const G = GUIDE.sessions.find(x=>x.n===SESSION);
function gtable(rows,n){
  const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
  return "<table>"+body.map(r=>{
    const cells=r.replace(/^\||\|$/g,"").split("|");
    return "<tr>"+cells.map(c=>"<td>"+md(c.trim(),n)+"</td>").join("")+"</tr>";
  }).join("")+"</table>";
}
function gblocks(arr,n){
  return (arr||[]).map(b=>
    b.t==="box"   ? '<div class="lbox">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>" :
    b.t==="list"  ? "<ul>"+b.x.map(p=>"<li>"+md(p,n)+"</li>").join("")+"</ul>" :
    b.t==="table" ? gtable(b.x,n) :
                    "<p>"+md(b.x,n)+"</p>").join("");
}
function gnote(key,i){
  const arr=(G[key]&&G[key][lang])||[]; const it=arr[i];
  if(!it) return "";
  return '<div class="lnote">'+gblocks(it.note,SESSION)+"</div>";
}
function gextras(key,from){
  const arr=(G[key]&&G[key][lang])||[];
  if(arr.length<=from) return "";
  return arr.slice(from).map(it=>'<div class="lnote gextra"><p><b>'+esc(it.q)+"</b></p>"+gblocks(it.note,SESSION)+"</div>").join("");
}
function gopen(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.before)+"</h4>"+
    gblocks((G.lead&&G.lead[lang])||[],SESSION)+
    gblocks((G.before&&G.before[lang])||[],SESSION)+"</div>";
}
function gquiet(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.quiet)+"</h4>"+gblocks((G.quiet&&G.quiet[lang])||[],SESSION)+"</div>";
}

function renderSession(){
  const s = DATA.sessions.find(x=>x.n===cur), n = s.n, t = T[lang];
  const pts = s.points[lang];
  const list = pts.find(b=>b.t==="list") || {x:[]};
  const caveat = pts.filter(b=>b.t!=="list").map(b=>'<p class="caveat">'+md(b.x,n)+"</p>").join("");
  const storyLead = s.story[lang].filter(b=>b.t==="p" && b.x.startsWith("*("));
  const storyRest = s.story[lang].filter(b=>!(b.t==="p" && b.x.startsWith("*(")));

  document.getElementById("session").innerHTML =
  '<div class="shead"><div><div class="skicker"><span class="lbadge">'+esc(LS[lang].kicker)+'</span> &nbsp;'+t.sess+" "+n+'</div><h2>'+esc(s.title[lang])+"</h2>"+
    '<div class="theme">'+esc(s.theme[lang])+"</div></div></div>"+gopen()+

  '<div class="card"><div class="inner">'+
    '<div class="klabel"><span class="l">'+t.key+'</span><span class="r">'+esc(s.keyRef[lang])+"</span></div>"+
    '<blockquote class="verse">'+esc(s.texts[ver])+"</blockquote>"+
    '<div class="vbar">'+Object.keys(DATA.versions).map(k=>'<button data-vv="'+k+'" aria-pressed="'+(k===ver)+'">'+k+"</button>").join("")+
      '<a class="open" href="'+bibleUrl(s.osis)+'" target="_blank" rel="noopener">'+t.open+" ↗</a></div>"+
  "</div></div>"+

  '<p class="simply">'+md(s.simply[lang],n)+"</p>"+
  (s.simplyNote[lang] ? '<p class="simplynote">'+md(s.simplyNote[lang],n)+"</p>" : "")+

  '<h3 class="sec">'+(lang==="af"?"Betekenis":"Meaning")+'</h3><div class="prose lead-prose">'+blocks(s.meaning[lang],n)+"</div>"+

  '<div class="learn" style="margin-top:24px"><h3>'+t.learn+"</h3><ol>"+
    list.x.map(p=>"<li><span>"+md(p,n)+"</span></li>").join("")+"</ol>"+caveat+"</div>"+

  '<div class="story" style="margin-top:18px"><h3><i>✦</i>'+t.story+"</h3>"+
    storyLead.map(b=>'<p class="lead">'+md(b.x,n)+"</p>").join("")+
    storyRest.map(b=> b.t==="box"
      ? '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>"
      : "<p>"+md(b.x,n)+"</p>").join("")+"</div>"+

  '<div class="extras" style="margin-top:18px"><h3>'+t.extras+"</h3>"+
    s.extras[lang].map(x=>'<div class="ex"><div class="top"><b>'+esc(x.ref)+"</b>"+
      '<a href="'+bibleUrl(x.osis)+'" target="_blank" rel="noopener">'+ver+" ↗</a></div><p>"+md(x.note,n)+"</p></div>").join("")+
  "</div>"+

  '<div class="week" style="margin-top:18px"><h3>'+t.week+'</h3><div class="prose">'+blocks(s.week[lang],n)+"</div></div>"+

  '<div class="qs" style="margin-top:18px"><h3>'+t.qhome+'</h3><p class="hint">'+t.qhomeHint+"</p><ol>"+
    s.qhome[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qhome",i)+"</li>").join("")+gextras("qhome",s.qhome[lang].length)+"</ol>"+
    '<div class="selfstrip"><span>'+t.fabPrompt+'</span><button data-check>'+t.fabDo+"</button></div></div>"+

  '<div class="qs group" style="margin-top:14px"><h3>'+t.qgroup+'</h3><p class="hint">'+t.qgroupHint+"</p><ol>"+
    s.qgroup[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qgroup",i)+"</li>").join("")+gextras("qgroup",s.qgroup[lang].length)+"</ol></div>"+

  '<div class="pray" style="margin-top:18px"><h3>'+t.pray+"</h3><p>"+md(s.prayer[lang].x||s.prayer[lang],n)+"</p></div>"+gquiet()+'<div class="printbar"><button onclick="window.print()">'+esc(LS[lang].print)+'</button><a href="../">'+esc(LS[lang].back)+"</a></div>"+

  '<div class="pager"><button '+(n===1?"disabled":"")+' id="prev">← '+t.prev+"</button>"+
    '<span class="count">'+n+" / 8</span>"+
    '<button class="next" '+(n===8?"disabled":"")+' id="next">'+t.next+" →</button></div>";

  document.querySelectorAll("[data-vv]").forEach(b=>b.onclick=()=>{ ver=b.dataset.vv; render(); });
  const p=document.getElementById("prev"), nx=document.getElementById("next");
  if(p) p.onclick=()=>go(cur-1);
  if(nx) nx.onclick=()=>go(cur+1);
}

let chk={step:0,name:"",ans:[]};
function chkName(){ return chk.name.trim() || DATA.check[lang].nameSkip; }
function renderSheet(){
  const k=DATA.check[lang], body=document.getElementById("sheetBody");
  document.getElementById("sheetTitle").textContent = T[lang].fab;
  const nm=esc(chkName());
  let h="";
  if(chk.step===0){
    h='<p class="prog">'+k.step+" 1 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.mirrorTitle)+"</h3>"+
      "<p>"+md(k.mirrorLead,0)+"</p><p>"+md(k.mirrorLead2,0)+"</p>"+
      '<div class="mirror"><div class="mcol"><h4>'+esc(k.fleshTitle)+"</h4><ul>"+
      k.flesh.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>"+
      '<div class="mcol spirit"><h4>'+esc(k.spiritTitle)+"</h4><ul>"+
      k.spirit.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div></div>"+
      "<p>"+md(k.mirrorClose,0)+"</p>"+
      '<div class="row"><button class="go" data-cstep="1">'+esc(k.go)+" →</button></div>";
  } else if(chk.step===1){
    h='<p class="prog">'+k.step+" 2 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.nameTitle)+"</h3>"+
      "<p>"+md(k.nameLead,0)+"</p>"+
      '<input class="namein" id="cname" maxlength="40" autocomplete="off" placeholder="'+esc(k.namePlaceholder)+'" value="'+esc(chk.name)+'">'+
      '<div class="privacy">'+esc(k.namePrivacy)+"</div>"+
      '<div class="row"><button class="go" data-cstart>'+esc(k.start)+' →</button><button class="ghost" data-cstep="0">'+esc(k.back)+"</button></div>";
  } else if(chk.step>=2 && chk.step<=7){
    const i=chk.step-2;
    h='<p class="prog">'+k.step+" "+(chk.step+1)+" "+k.of+" 8</p>"+
      '<h3 class="wq">'+esc(k.q[i]).replace(/\{n\}/g,"<b>"+nm+"</b>")+"</h3>"+
      '<div class="opts">'+
        '<button data-cans="1">'+esc(k.yes)+"</button>"+
        '<button data-cans="0.5">'+esc(k.unsure)+"</button>"+
        '<button data-cans="0">'+esc(k.no)+"</button></div>"+
      '<div class="row"><span></span><button class="ghost" data-cstep="'+(chk.step-1)+'">'+esc(k.back)+"</button></div>";
  } else {
    const sc=chk.ans.reduce((a,b)=>a+b,0);
    const band = sc<1 ? "r0" : (sc<2.5 ? "r1" : "r2");
    let door="";
    if(band!=="r0"){
      door = chk.ans[2]===1 ? k.door6 : ((chk.ans[3]===1||chk.ans[4]===1) ? k.door7 : k.door5);
    }
    h='<h3 class="wq">'+esc(k.resultTitle)+"</h3>"+
      k[band].split("\n\n").map(p=>"<p>"+md(p.replace(/\{n\}/g,chkName()),0)+"</p>").join("")+
      (door?'<div class="close-note">'+md(door.replace(/\{n\}/g,chkName()),0)+"</div>":"")+
      (band==="r0"?"":'<p class="prog" style="margin:18px 0 2px">'+esc(k.alsoTitle)+"</p>"+
        '<ul class="doors">'+k.also.map((x,i)=>'<li><a href="#s'+(i+5)+'">'+esc(x)+"</a></li>").join("")+"</ul>")+
      '<div class="row"><button class="go" data-cstep="0">'+esc(k.again)+'</button><button class="ghost" data-cclose>'+esc(k.close)+"</button></div>";
  }
  body.innerHTML=h;
  const inp=document.getElementById("cname");
  if(inp){ inp.oninput=e=>{chk.name=e.target.value;}; setTimeout(()=>inp.focus(),30); }
}
function openCheck(){ chk={step:0,name:"",ans:[]}; renderSheet(); sheet.showModal(); }

function render(){ renderChrome(); renderSession(); if(sheet && sheet.open) renderSheet(); }

function go(n, push=true){
  if(n<1||n>8) return;
  cur=n;
  if(push){ try{ if(location.hash!=="#s"+n) history.replaceState(null,"","#s"+n); }catch(e){} }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("btnAF").onclick=()=>{ lang="af"; if(DATA.versions[ver].lang!=="af") ver="AFR83"; render(); };
document.getElementById("btnEN").onclick=()=>{ lang="en"; if(DATA.versions[ver].lang!=="en") ver="ESV";   render(); };

const sheet=document.getElementById("sheet");
document.addEventListener("click",e=>{ if(e.target.closest("[data-check]")) openCheck(); });
document.getElementById("fab").onclick=openCheck;
document.getElementById("sheetClose").onclick=()=>sheet.close();
sheet.addEventListener("click",function(e){
  const st=e.target.closest("[data-cstep]");
  if(st){ chk.step=+st.dataset.cstep; if(chk.step<2) chk.ans=[]; renderSheet(); return; }
  if(e.target.closest("[data-cstart]")){ chk.step=2; chk.ans=[]; renderSheet(); return; }
  const an=e.target.closest("[data-cans]");
  if(an){ chk.ans[chk.step-2]=parseFloat(an.dataset.cans); chk.step++; renderSheet(); return; }
  if(e.target.closest("[data-cclose]")) sheet.close();
});
sheet.addEventListener("click",e=>{ if(e.target===sheet) sheet.close(); });

document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#s"]');
  if(a){ const n=+a.getAttribute("href").slice(2); if(n>=1&&n<=8){ e.preventDefault(); if(sheet.open) sheet.close(); go(n); } }
});
window.addEventListener("hashchange",()=>{ try{ const m=location.hash.match(/^#s([1-8])$/); if(m) go(+m[1],false); }catch(e){} });

(function init(){
  try{
    const m=location.hash.match(/^#s([1-8])$/); if(m) cur=+m[1];
    const q=new URLSearchParams(location.search);
    if((q.get("lang")||"").toLowerCase()==="en"){ lang="en"; ver="ESV"; }
  }catch(e){}
  render();
})();
</script>
</body>
