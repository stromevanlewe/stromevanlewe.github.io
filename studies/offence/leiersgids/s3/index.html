<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leiersgids · Sessie 3 — Om Aanstoot te Neem</title>
<meta name="description" content="'n Tweetalige studie van agt sessies oor aanstoot — vir persoonlike voorbereiding en kleingroepbespreking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf7ef; --ink:#2b2117; --ink-2:#5a4a38; --ink-3:#8a7760; --ink-4:#a89885;
  --line:#efe2c8; --card:#ffffff; --sand:#fbf2e3; --gold:#d9b88c; --gold-d:#b0895a;
  --warm:#fef1d6; --warm-line:#f0d9b0; --deep:#2b2117; --shadow:0 8px 30px rgba(43,33,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:500;color:var(--ink-3);min-width:0}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;padding:7px 11px;border-radius:999px;cursor:pointer}
.pillbox button:hover{color:var(--ink)}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}

/* hero */
.hero{padding-block:34px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:12px}
.eyebrow i{display:block;width:32px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.02}
.hero .sub{margin-top:10px;font-size:clamp(16px,2.4vw,19px);font-weight:500;color:var(--ink-2)}
.hero .opening{margin-top:16px;max-width:54ch;font-family:Fraunces,Georgia,serif;font-size:clamp(17px,2.4vw,19.5px);line-height:1.5;color:var(--ink)}
.hero .lede{margin-top:14px;max-width:56ch;font-size:15px;line-height:1.65;color:var(--ink-2)}

.fabline{margin:14px 0 0;max-width:60ch;font-size:14px;line-height:1.6;color:var(--ink-2)}
.fabline .link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--gold)}
.fabline .link:hover{border-bottom-color:var(--ink)}
.selfstrip{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sand);border:1px dashed var(--warm-line);border-radius:14px;padding:13px 16px}
.selfstrip span{font-size:14px;line-height:1.5;color:var(--ink-2)}
.selfstrip button{margin-left:auto;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:9px 15px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;white-space:nowrap}
.selfstrip button:hover{background:#000}
.note{margin:22px 0 4px;background:#fff;border:1px solid var(--warm-line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;box-shadow:var(--shadow)}
.note .ico{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:15px}
.note p{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note p:last-child{margin:0}
.note b{color:var(--ink)}

/* layout */
.cols{display:flex;gap:34px;padding-block:28px 110px;align-items:flex-start}
aside{display:none}
@media(min-width:900px){aside{display:block;flex:0 0 236px;position:sticky;top:74px}}
main{flex:1;min-width:0;max-width:660px}
.navlabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit;transition:.15s}
.navbtn:hover{background:#fff}
.navbtn[aria-current="true"]{background:#fff;border-color:var(--deep);box-shadow:var(--shadow)}
.navbtn .row{display:flex;align-items:center;gap:11px}
.navbtn .num{flex:0 0 auto;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font:700 12px/1 Inter,sans-serif;background:#fff;color:var(--ink-3);border:1px solid var(--line)}
.navbtn[aria-current="true"] .num{background:var(--deep);color:#fff;border-color:var(--deep)}
.navbtn .t{min-width:0}
.navbtn .t b{display:block;font:600 13px/1.25 Inter,sans-serif;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn[aria-current="true"] .t b{color:var(--ink)}
.navbtn .t span{display:block;font-size:11px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media(min-width:900px){.scroller{display:none}}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 13px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.chip[aria-current="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}

/* session */
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.skicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.shead h2{margin-top:5px;font-size:clamp(23px,4vw,31px);line-height:1.12}
.shead .theme{margin-top:6px;font-size:14px;color:var(--ink-3)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .inner{padding:18px 20px}
@media(min-width:768px){.card .inner{padding:22px 26px}}
.klabel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.klabel .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.klabel .r{font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2)}
blockquote.verse{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(18px,2.7vw,21px);line-height:1.45;font-weight:500}
.vbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink-3);border-radius:999px;padding:5px 10px;font:600 11px/1 Inter,sans-serif;cursor:pointer}
.vbar button[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.vbar a.open{margin-left:auto;font:600 11.5px/1 Inter,sans-serif;color:var(--ink-3);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--bg)}
.vbar a.open:hover{border-color:var(--deep);color:var(--ink)}

.simply{font-size:15.5px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.simply b{color:var(--ink)}
.simplynote{font-size:13.5px;line-height:1.6;color:var(--ink-3);font-style:italic;margin:8px 0 0}

h3.sec{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:26px 0 10px}
.prose p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:var(--ink-2)}
.lead-prose,.simply,.simplynote,h3.sec{padding-inline:6px}
@media(min-width:768px){.lead-prose,.simply,.simplynote,h3.sec{padding-inline:10px}}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.box{background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;margin:16px 0}
.box p{margin:0 0 9px;font-size:14.5px;line-height:1.68;color:var(--ink-2)}
.box p:last-child{margin:0}

.learn{background:var(--deep);color:#f5e9d6;border-radius:18px;padding:20px}
@media(min-width:768px){.learn{padding:24px 28px}}
.learn h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.learn ol{margin:0;padding:0;list-style:none;counter-reset:l}
.learn li{counter-increment:l;display:flex;gap:13px;margin-bottom:12px;font-size:15px;line-height:1.65}
.learn li:last-child{margin:0}
.learn li::before{content:counter(l);flex:0 0 auto;width:22px;height:22px;margin-top:2px;border-radius:999px;background:rgba(217,184,140,.18);color:var(--gold);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif}
.learn b{color:#fff}
.learn a{color:var(--gold)}
.learn .caveat{margin:14px 0 0;font-size:13.5px;line-height:1.6;color:#cbb99e;font-style:italic}

.story{background:#fff;border:1px solid var(--warm-line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
@media(min-width:768px){.story{padding:24px 28px}}
.story::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:999px;background:var(--warm);pointer-events:none}
.story>*{position:relative}
.story h3{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 12px}
.story h3 i{font-style:normal;width:26px;height:26px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:12px}
.story p{margin:0 0 12px;font-size:15px;line-height:1.78;color:#4a3c2b}
.story p:last-child{margin:0}
.story .lead{font-size:13.5px;color:var(--ink-3);font-style:italic}

.extras{background:var(--sand);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(min-width:768px){.extras{padding:22px 26px}}
.extras h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 14px}
.ex{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.ex:last-child{margin:0}
.ex .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.ex .top b{font:600 13.5px/1 Inter,sans-serif}
.ex .top a{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.03em;background:var(--deep);color:#fff;border-radius:999px;padding:5px 9px;text-decoration:none}
.ex p{margin:0;font-size:14px;line-height:1.62;color:var(--ink-2)}

.week{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
@media(min-width:768px){.week{padding:22px 26px}}
.week h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin:0 0 10px}

.qs{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
@media(min-width:768px){.qs{padding:22px 26px}}
.qs.group{background:var(--deep);border-color:var(--deep)}
.qs h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.qs.group h3{color:var(--gold)}
.qs .hint{font-size:12.5px;color:var(--ink-4);margin:0 0 14px}
.qs.group .hint{color:#b6a184}
.qs ol{margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:12px;margin-bottom:11px;font-size:15px;line-height:1.62;color:var(--ink-2)}
.qs li:last-child{margin:0}
.qs li::before{content:"Q" counter(q);flex:0 0 auto;font:700 11px/1.5 Inter,sans-serif;color:var(--ink-4)}
.qs.group li{color:#f0e4d1}
.qs.group li::before{color:var(--gold)}

.pray{border:1px dashed var(--warm-line);background:var(--warm);border-radius:18px;padding:18px 20px}
@media(min-width:768px){.pray{padding:20px 26px}}
.pray h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 8px}
.pray p{margin:0;font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.55;color:#4a3c2b}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;font:500 13.5px/1 Inter,sans-serif;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{background:var(--deep);color:#fff;border-color:var(--deep)}
.pager .count{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4)}

/* scripture refs */
a.ref{text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap;color:inherit}
a.ref:hover{border-bottom-color:var(--ink);background:rgba(217,184,140,.16)}
a.ref sup{font-size:9px;letter-spacing:.04em;color:var(--gold-d);margin-left:2px;vertical-align:super}
.learn a.ref{border-bottom-color:var(--gold)}
.learn a.ref sup{color:var(--gold)}

/* self-check */
.fab{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:11px 16px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(43,33,23,.28);max-width:calc(100% - 28px)}
@media(min-width:768px){.fab{right:20px;bottom:20px;padding:13px 19px;font-size:13.5px}}
dialog.sheet{border:0;padding:0;border-radius:20px;max-width:620px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(43,33,23,.3)}
dialog.sheet::backdrop{background:rgba(43,33,23,.45)}
.sheet .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 0}
.sheet h2{font-size:23px}
.sheet .close{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:32px;font-size:16px;line-height:1;cursor:pointer;color:var(--ink-3)}
.sheet .body{padding:14px 24px 24px}
.sheet .body p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.sheet ol.check{list-style:none;margin:14px 0;padding:0;counter-reset:c}
.sheet ol.check li{counter-increment:c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;font-size:14.5px;line-height:1.55}
.sheet ol.check li::before{content:counter(c);flex:0 0 auto;width:21px;height:21px;border-radius:999px;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif;color:var(--ink-3)}
.sheet .prog{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);opacity:.8;margin:0 0 10px}
.sheet .wq{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px;color:var(--ink)}
.sheet .opts{display:grid;gap:8px;margin:0 0 4px}
.sheet .opts button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:600 15px/1.3 Inter,sans-serif;color:var(--ink);cursor:pointer}
.sheet .opts button:hover{border-color:var(--gold);background:var(--sand)}
.sheet .mirror{display:grid;gap:10px;margin:14px 0}
@media(min-width:520px){.sheet .mirror{grid-template-columns:1fr 1fr}}
.sheet .mcol{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.sheet .mcol.spirit{background:var(--warm);border-color:var(--warm-line)}
.sheet .mcol h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.sheet .mcol ul{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.sheet .namein{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:500 16px/1.3 Inter,sans-serif;color:var(--ink);background:#fff;margin:4px 0 10px}
.sheet .namein:focus{outline:none;border-color:var(--gold)}
.sheet .privacy{font-size:13px;line-height:1.6;color:var(--ink-3);background:var(--sand);border-radius:12px;padding:11px 13px;margin:0 0 14px}
.sheet .go{background:var(--deep);color:#fff;border:1px solid var(--deep);border-radius:999px;padding:12px 20px;font:600 14.5px/1 Inter,sans-serif;cursor:pointer}
.sheet .ghost{background:none;border:0;padding:10px 2px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-3);cursor:pointer;text-decoration:underline}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.sheet .doors{list-style:none;margin:12px 0 0;padding:0}
.sheet .doors li{padding:4px 0 4px 15px;position:relative;font-size:14.5px;line-height:1.5}
.sheet .doors li:before{content:"\2192";position:absolute;left:0;opacity:.5}
.sheet .close-note{background:var(--warm);border:1px solid var(--warm-line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:#4a3c2b;margin-top:14px}

/* leader */
details.leader{margin-top:34px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
details.leader summary{cursor:pointer;padding:16px 20px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.leader summary::-webkit-details-marker{display:none}
details.leader summary::before{content:"›";display:inline-block;transition:.2s;font-size:19px;color:var(--ink-4)}
details.leader[open] summary::before{transform:rotate(90deg)}
details.leader .lbody{padding:0 20px 20px}
details.leader .lbody p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}

footer.foot{border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:22px 34px;font-size:12px;line-height:1.7;color:var(--ink-4)}
.footin p{margin:0 0 8px}
.footin a{color:var(--ink-3)}
.footin .rights{font-size:11px;line-height:1.6}

@media print{
  header.top,aside,.scroller,.pager,.fab,.crumbs,.ctrl{display:none!important}
  body{background:#fff}
  .card,.learn,.story,.extras,.week,.qs,.pray{box-shadow:none;break-inside:avoid}
  .learn,.qs.group{background:#fff!important;color:#000!important;border:1px solid #ccc!important}
  .learn li,.qs.group li{color:#000!important}
  .learn h3,.qs.group h3{color:#666!important}
}

/* ---- leiersgids ---- */
body{--gp:#2f5d50}
.lbadge{display:inline-flex;align-items:center;gap:7px;background:var(--gp);color:#fff;border-radius:999px;padding:6px 13px;font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.lblock{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 14px 14px 0;padding:15px 17px;margin:18px 0}
.lblock>h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gp);margin:0 0 9px}
.lblock p{font-size:14.7px;line-height:1.72;color:#22322c;margin:0 0 11px}
.lblock p:last-child{margin-bottom:0}
.lblock ul{margin:0 0 11px;padding-left:19px;font-size:14.7px;line-height:1.72;color:#22322c}
.lblock .lbox{background:#fff;border:1px solid #cfe0d9;border-radius:12px;padding:13px 15px;margin:12px 0}
.lblock table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.lblock td{border-bottom:1px solid #d8e6e0;padding:8px 9px;vertical-align:top;line-height:1.55}
.lnote{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0 4px}
.lnote p{font-size:14.4px;line-height:1.7;color:#22322c;margin:0 0 10px}
.lnote p:last-child{margin-bottom:0}
.lnote ul{margin:0 0 10px;padding-left:19px;font-size:14.4px;line-height:1.7;color:#22322c}

<script>
const DATA = {"versions": {"AFR83": {"id": 6, "lang": "af", "name": "Afrikaans 1983"}, "AFR53": {"id": 5, "lang": "af", "name": "Afrikaans 1933/1953"}, "NLV": {"id": 117, "lang": "af", "name": "Nuwe Lewende Vertaling"}, "ESV": {"id": 59, "lang": "en", "name": "English Standard Version"}, "NIV": {"id": 111, "lang": "en", "name": "New International Version"}}, "books": {"af": {"Genesis": "GEN", "Eksodus": "EXO", "Levitikus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Konings": "1KI", "2 Konings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Spreuke": "PRO", "Prediker": "ECC", "Jesaja": "ISA", "Jeremia": "JER", "Matteus": "MAT", "Matthéüs": "MAT", "Markus": "MRK", "Lukas": "LUK", "Johannes": "JHN", "Handelinge": "ACT", "Romeine": "ROM", "1 Korintiërs": "1CO", "2 Korintiërs": "2CO", "Galasiërs": "GAL", "Efesiërs": "EPH", "Filippense": "PHP", "Kolossense": "COL", "1 Timoteus": "1TI", "2 Timoteus": "2TI", "Hebreërs": "HEB", "Jakobus": "JAS", "1 Petrus": "1PE", "2 Petrus": "2PE", "Judas": "JUD", "Openbaring": "REV"}, "en": {"Genesis": "GEN", "Exodus": "EXO", "Leviticus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Kings": "1KI", "2 Kings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Proverbs": "PRO", "Ecclesiastes": "ECC", "Isaiah": "ISA", "Jeremiah": "JER", "Matthew": "MAT", "Mark": "MRK", "Luke": "LUK", "John": "JHN", "Acts": "ACT", "Romans": "ROM", "1 Corinthians": "1CO", "2 Corinthians": "2CO", "Galatians": "GAL", "Ephesians": "EPH", "Philippians": "PHP", "Colossians": "COL", "1 Timothy": "1TI", "2 Timothy": "2TI", "Hebrews": "HEB", "James": "JAS", "1 Peter": "1PE", "2 Peter": "2PE", "Jude": "JUD", "Revelation": "REV"}}, "sessions": [{"n": 3, "id": "s3", "title": {"af": "Die aanstoot van die Kruis", "en": "The offence of the Cross"}, "theme": {"af": "Die draaipunt", "en": "The turn"}, "keyRef": {"af": "1 Korintiërs 1:23", "en": "1 Corinthians 1:23"}, "osis": "1CO.1.23", "texts": {"AFR83": "maar ons verkondig Christus wat gekruisig is. Vir die Jode is dit 'n aanstoot en vir die ander is dit onsin", "AFR53": "maar ons verkondig Christus wat gekruisig is, 'n struikelblok vir die Jode en dwaasheid vir die Grieke", "NLV": "Maar ons verkondig die gekruisigde Christus. Vir die Jode is dit skokkend en vir die nie-Jode is dit absolute dwaasheid.", "ESV": "but we preach Christ crucified, a stumbling block to Jews and folly to Gentiles,", "NIV": "but we preach Christ crucified: a stumbling block to Jews and foolishness to Gentiles,"}, "simply": {"af": "Die woord hier is dieselfde woord — *skandalon*. Die Kruis self is 'n aanstoot. Aanstoot is nie altyd 'n mislukking nie. Dit is die evangelie wat sy werk doen.", "en": "\"Stumbling block\" here is the same word — *skandalon*. The Cross itself is an offence. Some offence is not a failure. It is the gospel doing its work."}, "simplyNote": {"af": "", "en": ""}, "meaning": {"af": [{"t": "p", "x": "Hier draai die studie. Tot nou toe was aanstoot 'n probleem om te verwyder. Nou gebruik Paulus presies dieselfde woord vir die een boodskap wat hy weier om te verander."}, {"t": "p", "x": "Jesaja het gesê God self sal *\"'n klip wees waarteen 'n mens jou stamp, 'n rots waaroor 'n mens struikel\"* (Jesaja 8:14). Die Nuwe Testament haal daardie vers twee keer aan — Romeine 9:32-33 en 1 Petrus 2:8 — en albei kere gaan dit oor Jesus."}, {"t": "p", "x": "Hoekom is die Kruis dan aanstootlik? Nie omdat dit wreed is nie. Oor wat dit van ons sê. As God sy eie Seun moes laat doodmaak om my probleem te hanteer, dan is my probleem baie erger as wat ek gedink het, en daar is niks wat ek kan byvoeg nie. Die Kruis verwyder elke bydrae wat ek kon maak. Dít is die aanstoot — dit laat my met niks om op trots te wees nie."}, {"t": "p", "x": "Galasiërs 5:11 stel dit reguit: Paulus sê as hy nog die besnydenis verkondig het, *\"is die aanstoot van die kruis daarmee heen.\"* Jy kan die evangelie altyd minder aanstootlik maak. Jy kan dit net nie doen en steeds die evangelie hê nie."}, {"t": "p", "x": "**'n Geskenk in Afrikaans.** Die 1983-vertaling gebruik hier die woord **aanstoot** — dieselfde alledaagse woord wat ons die hele studie lank gebruik vir wat tussen jou en jou broer gebeur. In Engels het jy twee woorde nodig, *offence* en *stumbling block*, om die verband te sien. In Afrikaans staan dit op die bladsy. Wys daarna."}, {"t": "p", "x": "**En die sin wat die sessie bymekaar hou:**"}, {"t": "box", "x": ["Ons kan nie die aanstoot van die evangelie verwyder nie — maar ons wil dit in liefde en versigtigheid oorbring."]}], "en": [{"t": "p", "x": "This is the turn in the study. Until now offence has been a problem to remove. Now Paul uses the identical word for the one message he refuses to change."}, {"t": "p", "x": "Isaiah said God Himself would be *\"a stone of stumbling and a rock of offence\"* (Isaiah 8:14). The New Testament quotes that verse twice — Romans 9:32-33 and 1 Peter 2:8 — and both times it is about Jesus."}, {"t": "p", "x": "So why is the Cross offensive? Not because it is cruel. Because of what it says about us. If God had to put His own Son to death to deal with my problem, then my problem is far worse than I thought, and there is nothing I can add. The Cross removes every contribution I could make. That is the offence — it leaves me with nothing to be proud of."}, {"t": "p", "x": "Galatians 5:11 makes it plain: Paul says that if he still preached circumcision, *\"the offence of the Cross has been removed.\"* You can always make the gospel less offensive. You just cannot do it and still have the gospel."}, {"t": "p", "x": "**A gift in Afrikaans.** The 1983 translation renders this verse *\"Vir die Jode is dit 'n **aanstoot**\"* — the same everyday word this study has been using for what happens between you and your brother. English needs two words, *offence* and *stumbling block*, to show the link. Afrikaans puts it on the page. Point at it."}, {"t": "p", "x": "**And the sentence that holds the session together:**"}, {"t": "box", "x": ["We cannot remove the offence of the gospel — but we must not be recklessly careless where it is not necessary."]}]}, "points": {"af": [{"t": "list", "x": ["Daar is twee soorte aanstoot: die soort wat ek moet verwyder, en die soort wat ek nooit mag verwyder nie.", "Paulus het hard gewerk om elke onnodige aanstoot weg te vat — *\"Moet vir niemand 'n aanstoot wees nie, nie vir Jode of Grieke of vir die gemeente van God nie\"* (1 Kor 10:32) — en toe geweier om hierdie een weg te vat.", "Die Kruis gee aanstoot omdat dit sê **jy kán nie**. Alles in ons wil kán."]}], "en": [{"t": "list", "x": ["There are two kinds of offence: the kind I must remove, and the kind I must never remove.", "Paul worked hard to remove every unnecessary offence — *\"give no offence to Jews or to Greeks or to the church of God\"* (1 Cor 10:32) — and then refused to remove this one.", "The Cross offends because it says *you cannot*. Everything in us wants to be able to."]}]}, "story": {"af": [{"t": "p", "x": "Oom Danie is een-en-vyftig jaar in die kerk. Sondagskoolonderwyser, tien jaar lank ouderling, sny nog steeds Saterdae die gras by die kerksaal."}, {"t": "p", "x": "By 'n begrafnis hoor hy die pastoor sê dat die man in die kis — wat sy gesin in die grond in gedrink het, en wat agt weke voor sy dood tot geloof gekom het — nou by Christus is. Ten volle. Nie gedeeltelik nie. Nie op proef nie."}, {"t": "p", "x": "Oom Danie het by die tee die regte dinge gesê. Maar hy het kwaad huis toe gery en kon nie sê hoekom nie."}, {"t": "p", "x": "Dit het hom drie weke gevat om die sin te kry. *\"Een-en-vyftig jaar, en hy kry dieselfde as wat ek kry.\"*"}, {"t": "p", "x": "Die oomblik toe hy homself dit hoor sê, het hy geweet waarin hy staan. Hy was die ouer broer by die hek, wat luister na musiek van 'n fees wat hy help betaal het. Hy was die man in Matteus 20 wat die hele dag gewerk het en nie kon verduur wat die elfde-uur-mense gekry het nie."}, {"t": "p", "x": "Niks is aan hom gedoen nie. Hy het bloot teen die vrygewigheid van God vasgeloop op presies die punt waar dit hom nie gepas het nie."}, {"t": "p", "x": "Dít is die aanstoot van die Kruis. En Oom Danie is 'n goeie man — wat juis is hoekom dit hom gevang het."}], "en": [{"t": "p", "x": "Oom Danie has been in church for fifty-one years. Sunday school teacher, elder for a decade, still cuts the grass at the church hall on a Saturday."}, {"t": "p", "x": "At a funeral he heard the pastor say that the man in the coffin — who had drunk his family into the ground, who came to faith eight weeks before he died — was now with Christ. Fully. Not partly. Not on probation."}, {"t": "p", "x": "Oom Danie said the right things at the tea afterwards. But he drove home angry and could not say why."}, {"t": "p", "x": "It took him three weeks to find the sentence. *Fifty-one years, and he gets the same thing I get.*"}, {"t": "p", "x": "The moment he heard himself say it, he knew what he was standing in. He was the older brother at the gate, listening to music from a party he had helped pay for. He was the man in Matthew 20 who worked all day and could not stomach what the eleventh-hour men were handed."}, {"t": "p", "x": "Nothing had been done to him. He had simply run into the generosity of God at the exact point where it did not suit him."}, {"t": "p", "x": "That is the offence of the Cross. And Oom Danie is a good man — which is exactly why it caught him."}]}, "extras": {"af": [{"ref": "Galasiërs 5:11", "osis": "GAL.5.11", "note": "Paulus se waarskuwing: jy kan dit sagter maak, maar dan het jy dit nie meer nie."}, {"ref": "1 Petrus 2:7-8", "osis": "1PE.2.7", "note": "Dieselfde klip is vir die een kosbaar en vir die ander 'n struikelblok. Die klip het nie verander nie."}, {"ref": "Matteus 20:15", "osis": "MAT.20.15", "note": "Die ongemaklikste vraag in die Evangelies vir mense wat lank gedien het."}], "en": [{"ref": "Galatians 5:11", "osis": "GAL.5.11", "note": "Paul's warning: you can soften it, but then you no longer have it."}, {"ref": "1 Peter 2:7-8", "osis": "1PE.2.7", "note": "The same stone is precious to one person and a trip hazard to another. The stone has not changed."}, {"ref": "Matthew 20:15", "osis": "MAT.20.15", "note": "The most uncomfortable question in the Gospels for people who have served a long time."}]}, "week": {"af": [{"t": "p", "x": "Vra twee eerlike vrae. Waar het jy die evangelie stilweg sagter gemaak om vrede te hou? En is enige van die aanstoot wat jy dra eintlik aanstoot oor God se goedheid teenoor iemand anders?"}], "en": [{"t": "p", "x": "Ask two honest questions. Where have you quietly softened the gospel to keep the peace? And is any of the offence you are carrying actually offence at God's generosity to someone else?"}]}, "qhome": {"af": ["Wanneer laas het die evangelie **jou** aanstoot gegee?", "Is daar iemand wie se vergifnis deur God jy moeilik aanvaar?", "Waar wil jy nog iets bydra tot jou eie redding?"], "en": ["When did the gospel last offend *you* personally?", "Is there someone whose forgiveness by God you find hard to accept?", "Where do you still want to contribute something to your own salvation?"]}, "qgroup": {"af": ["Paulus het elke aanstoot weggevat wat hy kon, en toe hierdie een geweier. Hoe onderskei ons vandag tussen die twee?", "Hoekom is genade juis vir goeie mense aanstootlik?", "Hoe sou 'n kerk lyk wat die aanstoot van die Kruis verwyder het? Sou ons dit van binne af agterkom?"], "en": ["Paul removed every offence he could, then refused to remove this one. How do we tell the two apart today?", "Why is grace offensive to good people in particular?", "What would a church look like that had removed the offence of the Cross? Would we notice from the inside?"]}, "prayer": {"af": "*Here, ek wil nie 'n evangelie hê wat ek gemaklik gemaak het nie. Gee my aanstoot waar ek dit nodig het. En waar ek aanstoot geneem het oor U goedheid aan iemand anders, vergewe my.*", "en": "*Lord, I do not want a gospel I have made comfortable. Offend me where I need it. And where I have been offended by Your kindness to someone else, forgive me.*"}}], "selfcheck": {"af": {"intro": ["Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Die toets kan dus nie wees \"voel ek aanstoot?\" nie — niemand antwoord dít eerlik nie. Die toets moet oor simptome gaan.", "Paulus lys hulle in Galasiërs 5:19-21, en langs verse 22-23 gelees werk dit soos 'n diagnose. Aan die een kant: vyandskap, twis, jaloesie, woede-uitbarstings, selfsug, tweedrag, verdeeldheid. Aan die ander kant: liefde, blydskap, vrede, geduld, vriendelikheid. Jy kan nie in albei tegelyk wandel nie. As die eerste lys is wat opkom wanneer jy aan 'n bepaalde mens dink, sit jou voet in die strik — hoe goed jou saak ook al is.", "**Ses eerlike vrae. Kies een mens en antwoord vir hulle.**"], "questions": ["Wanneer hulle naam opkom, wat gebeur in jou bors?", "As jy hulle in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie vertel aan iemand wat dit nie hoef te gehoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir hulle?", "Kan jy God hardop, by die naam, vir hulle dank en dit bedoel?", "Kan jy in 'n vertrek sit en hoor hoe hulle geprys word sonder om 'n \"maar\" by te sit?"], "close": "**As verskeie van dié raak vat:** jy is nie 'n slegte mens nie en jy is waarskynlik nie verkeerd oor die feite nie. Jy is in 'n strik. Om reg te wees is wat die meeste mense daarin hou. Gaan terug na sessie 5 (gee die saak oor), sessie 6 (gaan na hulle), of sessie 7 (skrap die skuld) — watter een jy ook al vermy het."}, "en": {"intro": ["The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel *right*. So the test cannot be \"am I offended?\" — nobody answers that honestly. The test has to be about symptoms.", "Paul lists them in Galatians 5:19-21, and read side by side with verses 22-23 they work as a diagnostic. On the one side: enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions. On the other: love, joy, peace, patience, kindness. You cannot walk in both at once. If the first list is what comes up when you think of a particular person, your foot is in the trap, however good your case is.", "**Six honest questions. Pick one person and answer for them.**"], "questions": ["When their name comes up, what happens in your chest?", "If you saw them in the shop, would you turn down a different aisle?", "Have you told the story to someone who did not need to hear it?", "Do you find yourself hoping something goes slightly wrong for them?", "Can you thank God for them out loud, by name, and mean it?", "Could you sit in a room and hear them praised without adding a \"but\"?"], "close": "**If several of those land:** you are not a bad person and you are probably not wrong about the facts. You are in a trap. Being right is what keeps most people in it. Go back to Session 5 (hand the case over), Session 6 (go to them), or Session 7 (cancel the debt) — whichever one you have been avoiding."}}, "check": {"af": {"step": "Stap", "of": "van", "mirrorTitle": "Eers die spieël", "mirrorLead": "Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Daarom kan die toets nie wees \"voel ek aanstoot?\" nie. Niemand antwoord dít eerlik nie.", "mirrorLead2": "Paulus gee vir ons 'n ander soort toets. Hy sit twee lyste langs mekaar in Galasiërs 5:19-23. Jy kan nie in albei tegelyk loop nie. Kyk watter lys opkom wanneer jy aan een bepaalde mens dink.", "fleshTitle": "Die vlees", "flesh": ["vyandskap", "twis", "jaloesie", "woede-uitbarstings", "selfsug", "tweedrag", "verdeeldheid"], "spiritTitle": "Die Gees", "spirit": ["liefde", "blydskap", "vrede", "geduld", "vriendelikheid", "goedhartigheid", "getrouheid"], "mirrorClose": "Hierdie toets vra nie of jou saak goed is nie. Dit vra net wat in jou gebeur.", "go": "Ek is gereed", "nameTitle": "Wie is die mens?", "nameLead": "Dink aan een mens. Tik hulle naam, of laat dit leeg as jy liewer nie wil nie.", "namePlaceholder": "Naam", "namePrivacy": "Wat jy hier tik bly op jou foon. Dit word nêrens gestoor of gestuur nie, ook nie op hierdie toestel nie. Maak die blad toe en dit is weg.", "nameSkip": "iemand", "start": "Begin", "yes": "Ja", "unsure": "Nie seker", "no": "Nee", "back": "Terug", "q": ["Wanneer {n} se naam opkom, trek iets in jou bors saam?", "As jy {n} in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie oor {n} vertel aan iemand wat dit nie hoef te hoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir {n}?", "Sukkel jy om God hardop vir {n} te dank, by die naam, en dit te bedoel?", "Sukkel jy om te hoor hoe {n} geprys word sonder om 'n \"maar\" by te sit?"], "resultTitle": "Wat dit aandui", "r0": "Niks hier dui daarop dat jy met {n} vasgevang is nie. Dit is goeie nuus, en dit is die moeite werd om dit so te hou.\n\nAs 'n ander naam by jou opgekom het terwyl jy die vrae gelees het, doen die toets weer vir daardie mens. Dít is gewoonlik die een.", "r1": "Daar is iets hier, maar dit is nog vroeg. Op hierdie stadium is dit klein genoeg om te hanteer sonder dat iemand anders eers hoef te weet.\n\nDit is presies die oomblik waar 'n mens dit gewoonlik laat lê, en dit is presies hoekom dit later 'n muur word.", "r2": "Jou voet is in die strik.\n\nJy is nie 'n slegte mens nie, en jy is waarskynlik nie verkeerd oor die feite nie. Om reg te wees is juis wat die meeste mense daarin hou.", "door6": "Jy praat **oor** {n} eerder as **met** {n}. Begin by sessie 6.", "door7": "Jy hou 'n rekening oop wat jy kan skrap. Begin by sessie 7.", "door5": "Jy dra 'n saak wat jy kan oorgee. Begin by sessie 5.", "alsoTitle": "Die drie deure", "also": ["Sessie 5 — gee die saak oor", "Sessie 6 — gaan na hulle toe", "Sessie 7 — skrap die skuld"], "again": "Doen dit weer", "close": "Maak toe"}, "en": {"step": "Step", "of": "of", "mirrorTitle": "The mirror first", "mirrorLead": "The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel **right**. So the test cannot be \"am I offended?\" Nobody answers that one honestly.", "mirrorLead2": "Paul gives us a different kind of test. He puts two lists side by side in Galatians 5:19-23. You cannot walk in both at once. Watch which list comes up when you think of one particular person.", "fleshTitle": "The flesh", "flesh": ["enmity", "strife", "jealousy", "fits of anger", "rivalries", "dissensions", "divisions"], "spiritTitle": "The Spirit", "spirit": ["love", "joy", "peace", "patience", "kindness", "goodness", "faithfulness"], "mirrorClose": "This test does not ask whether your case is good. It only asks what is happening in you.", "go": "I am ready", "nameTitle": "Who is the person?", "nameLead": "Think of one person. Type their name, or leave it blank if you would rather not.", "namePlaceholder": "Name", "namePrivacy": "What you type stays on your phone. It is not stored or sent anywhere, not even on this device. Close the page and it is gone.", "nameSkip": "someone", "start": "Start", "yes": "Yes", "unsure": "Not sure", "no": "No", "back": "Back", "q": ["When {n}'s name comes up, does something tighten in your chest?", "If you saw {n} in the shop, would you turn down a different aisle?", "Have you told the story about {n} to someone who did not need to hear it?", "Do you ever hope something goes slightly wrong for {n}?", "Do you struggle to thank God out loud for {n}, by name, and mean it?", "Do you struggle to hear {n} praised without adding a \"but\"?"], "resultTitle": "What this points to", "r0": "Nothing here suggests you are caught with {n}. That is good news, and it is worth keeping that way.\n\nIf another name came to mind while you were reading the questions, run it again for that person. That is usually the one.", "r1": "There is something here, but it is early. At this stage it is small enough to deal with before anyone else needs to know about it.\n\nThis is exactly the point where people leave it, and exactly why it becomes a wall later.", "r2": "Your foot is in the trap.\n\nYou are not a bad person, and you are probably not wrong about the facts. Being right is what keeps most people in it.", "door6": "You are talking **about** {n} rather than **to** {n}. Start at session 6.", "door7": "You are holding an account open that you could cancel. Start at session 7.", "door5": "You are carrying a case you could hand over. Start at session 5.", "alsoTitle": "The three doors", "also": ["Session 5 — hand the case over", "Session 6 — go to them", "Session 7 — cancel the debt"], "again": "Run it again", "close": "Close"}}, "leader": {"af": ["**Oor sessie 4.** Dit is die sessie waar iemand dalk vir die eerste keer hardop sê dat hulle kwaad is vir God. Moenie dit regmaak nie, moenie God verdedig nie, en moenie vinnig na die volgende vraag beweeg nie. Jesus het Johannes nie berispe omdat hy gevra het nie. Die vertrek moet ook nie.", "**Oor sessie 7.** Onderrig oor vergifnis is waar 'n groep werklike skade kan doen sonder om dit te bedoel. Twee reëls: niemand word ooit gesê om volgens 'n tydtafel te vergewe nie, en niemand word ooit gesê dat vergewe beteken jy gaan terug nie. As iemand in die groep mishandeling of 'n misdaad openbaar, gaan dit na 'n leier en na die owerhede. Sê dit van voor af, eerder as om dit in 'n voetnoot te laat.", "**Oor Andrew Selley se twee boodskappe.** Die strikbeeld, die spooknet, die bysteek en \"die pyn volg die perspektief\", die sononder-reël, die Galasiërs 5-diagnose en Absalom kom uit sy tweede boodskap, *Hurt but Not Offended*. Drie dinge is doelbewus van die studieblad af weggelaat:", "- **Sy vertelling van 'n vrou wat deur verskeie mans aangerand is en hulle een vir een vergewe het terwyl dit gebeur.** Dit dra die punt, maar die blad word alleen gelees, op 'n foon, deur tieners sowel as volwassenes, met geen leier in die vertrek nie. Die beginsel staan sonder dit.\n- **\"Trust isn't earned, it's given.\"** Net so gelaat, plaas dit mense terug binne bereik van dié wat hulle skade aangedoen het. Sessie 7 behou die liefde en voeg Johannes 2:24 by.\n- **\"Jesus never had to forgive anybody\"** — die argument dat \"Vader, vergeef hulle\" voorbidding was eerder as vergifnis. Verdedigbaar, maar dit is 'n fyn onderskeid wat meer in verwarring gaan kos as wat dit in presiesheid wen. Sessie 5 rus op 1 Petrus 2:23, wat niemand betwis nie.", "Die frase \"'n onaanstootlike kerk\" in sessie 8 is ook syne — dit is hoe hy die hele reeks raam. Iewers in die agt weke werd om van voor af te sê, want dit is die studie se eie beginsel op homself toegepas: *ons kan nie die aanstoot van die evangelie verwyder nie — maar ons wil dit in liefde en versigtigheid oorbring.*"], "en": ["**On Session 4.** This is the session where someone may say out loud, for the first time, that they are angry with God. Do not fix it, do not defend God, and do not move quickly to the next question. Jesus did not rebuke John for asking. The room should not either.", "**On Session 7.** Forgiveness teaching is where a group can do real damage without meaning to. Two rules to hold: nobody is ever told to forgive on a timetable, and nobody is ever told that forgiving means going back. If someone discloses abuse or a crime in the group, that goes to a leader and to the proper authorities. Say that from the front rather than leaving it in a footnote.", "**On Andrew Selley's two messages.** The trap image, the ghost net, the bee sting and \"the pain follows the perspective\", the sundown rule, the Galatians 5 diagnostic and Absalom all come from his part-two message, *Hurt but Not Offended*. Three things were deliberately left out of the study page:", "- **His account of a woman assaulted by several men, forgiving them as it happened.** It carries the point, but the study page is read alone, on a phone, by teenagers as well as adults, with no leader in the room. The principle stands without it.\n- **\"Trust isn't earned, it's given.\"** Held as-is, it puts people back within reach of those who harmed them. Session 7 keeps the love and adds John 2:24.\n- **\"Jesus never had to forgive anybody\"** — the argument that \"Father, forgive them\" was intercession rather than forgiveness. It is a defensible reading, but it is a fine distinction that will cost more in confusion than it gains in precision. Session 5 rests on 1 Peter 2:23, which nobody disputes.", "The phrase \"an unoffendable church\" in Session 8 is also his — it is how he frames the whole series. Worth saying from the front at some point in the eight weeks, because it is the study's own principle turned on itself: *we cannot remove the offence of the gospel — but we must not be recklessly careless where it is not necessary.*"]}};
const GUIDE = {"sessions": [{"n": 3, "lead": {"af": [{"t": "p", "x": "**1 Korintiërs 1:23** · dieselfde woord, nou oor die evangelie"}], "en": [{"t": "p", "x": "**1 Corinthians 1:23** · the same word, now used of the gospel"}]}, "before": {"af": [{"t": "p", "x": "Dit is die draai in die studie, en dit is die sessie wat die maklikste misbruik word. Lei dit versigtig."}, {"t": "p", "x": "Tot nou toe was aanstoot 'n probleem om weg te kry. Paulus gebruik nou presies dieselfde woord — *skandalon* — vir die een boodskap wat hy weier om te verander. Daar is twee soorte aanstoot: die soort wat ek moet verwyder, en die soort wat ek nooit mag verwyder nie."}, {"t": "p", "x": "**Wys op die Afrikaans.** AFR83 vertaal 1 Korintiërs 1:23 met *aanstoot* — dieselfde alledaagse woord wat die studie gebruik vir wat tussen jou en jou broer gebeur. Engels het twee woorde nodig, *offence* en *stumbling block*, om die skakel te wys. Afrikaans sit dit reguit op die bladsy. Gebruik dit."}, {"t": "p", "x": "**Waar dit skeefloop:** iemand gebruik \"die evangelie gee aanstoot\" as dekmantel om onbeskof te wees. Dit is die algemeenste misbruik van die sessie, en dit is die moeite werd om dit voor die gesprek te noem eerder as agterna. Paulus het hard gewerk om elke aanstoot te verwyder wat hy kon — *\"Moenie aanstoot gee nie, nie aan Jode of aan Grieke of aan die gemeente van God nie\"* — en toe hierdie een geweier. Albei helftes is Paulus."}, {"t": "p", "x": "Oom Danie is 'n goeie man, en dít is die punt van hom. Moenie toelaat dat die groep hom as 'n waarskuwing behandel nie. Hy is die meeste van ons."}], "en": [{"t": "p", "x": "This is the turn in the study, and it is the session most likely to be misused. Lead it carefully."}, {"t": "p", "x": "Until now offence has been a problem to get rid of. Paul now uses the very same word — *skandalon* — for the one message he refuses to change. There are two kinds of offence: the kind I must remove, and the kind I must never remove."}, {"t": "p", "x": "**Point at the Afrikaans.** AFR83 translates 1 Corinthians 1:23 with *aanstoot* — the same everyday word the study has been using for what happens between you and your brother. English needs two words, *offence* and *stumbling block*, to show the link. Afrikaans puts it right there on the page. Use it."}, {"t": "p", "x": "**Where it goes wrong:** somebody uses \"the gospel offends\" as cover for being rude. This is the most common misuse of the session, and it is worth naming before the discussion rather than after. Paul worked hard to remove every offence he could — *\"give no offence to Jews or to Greeks or to the church of God\"* — and then refused to remove this one. Both halves are Paul."}, {"t": "p", "x": "Oom Danie is a good man, and that is the point of him. Do not let the group treat him as a warning. He is most of us."}]}, "qhome": {"af": [{"q": "Wanneer laas het die evangelie **jou** aanstoot gegee?", "note": [{"t": "p", "x": "Baie sal sê nooit, en vir die meeste van hulle is dit nie 'n goeie teken nie. Dit beteken gewoonlik die evangelie het 'n stel standpunte geword eerder as iets met 'n aanspraak op hulle. As dit in die vertrek opkom, wees saggies. Dit is nie 'n gebrek aan geloof nie. Dit is wat gebeur wanneer iets bekend word."}]}, {"q": "Is daar iemand wie se vergifnis deur God jy moeilik aanvaar?", "note": [{"t": "p", "x": "Die eerlike antwoorde is spesifiek, en hulle skok dikwels die mens wat hulle sê. Dit is Oom Danie se vraag."}]}, {"q": "Waar wil jy nog iets bydra tot jou eie redding?", "note": [{"t": "p", "x": "Luister vir die woord *maar*. *Ek weet dit is genade, maar ek dien al dertig jaar.* Daardie \"maar\" is die hele vraag."}]}], "en": [{"q": "When did the gospel last offend *you* personally?", "note": [{"t": "p", "x": "Many will say never, and for most of them that is not a good sign. It usually means the gospel has become a set of positions rather than something with a claim on them. If it comes up in the room, be gentle. It is not a failure of faith. It is what happens when something becomes familiar."}]}, {"q": "Is there someone whose forgiveness by God you find hard to accept?", "note": [{"t": "p", "x": "The honest answers are specific, and they often shock the person saying them. This is Oom Danie's question."}]}, {"q": "Where do you still want to add something to your own salvation?", "note": [{"t": "p", "x": "Listen for the word *but*. *I know it is grace, but I have served for thirty years.* That \"but\" is the whole question."}]}]}, "qgroup": {"af": [{"q": "Paulus het elke aanstoot weggevat wat hy kon, en toe hierdie een geweier. Hoe onderskei ons vandag tussen die twee?", "note": [{"t": "p", "x": "Die toets wat werk: **lê die aanstoot in die boodskap, of in hoe ons dit oordra?**"}, {"t": "p", "x": "Die evangelie se eie aanstoot is dat jy jouself nie kan red nie, en dat Jesus nie een pad tussen ander is nie. Alles anders is ons s'n en kan gaan: ons toon, ons binnehuise woorde, ons gewoontes, ons styl, ons politiek, ons onbeskoftheid."}, {"t": "p", "x": "Hier is 'n reël om vir die groep te gee. *As om dit weg te vat sou verander wat 'n mens moet glo om gered te word, mag jy dit nie wegvat nie. As om dit weg te vat net ons gemak of gewoonte kos, vat dit weg.*"}, {"t": "p", "x": "Paulus doen albei. **1 Korintiërs 9:22** *(net in hierdie gids)* — *\"Vir almal het ek alles geword om in elk geval sommige te red.\"* En **Galasiërs 5:11** *(in die sessie)* — as hy nog besnydenis verkondig het, is *\"die kruis as struikelblok mos uit die weg geruim.\"* Dieselfde man, dieselfde leeftyd."}]}, {"q": "Hoekom is genade juis vir goeie mense aanstootlik?", "note": [{"t": "p", "x": "Omdat genade hulle moeite op nul prys, en hulle het meer moeite belê as die meeste."}, {"t": "p", "x": "Die aanstoot is nie eintlik teen barmhartigheid nie. Dit is teen barmhartigheid wat **gelyk** is. In Matteus 20 is die klagte nie dat hulle te min betaal is nie. Dit is dat die ander dieselfde gekry het. Oom Danie se sin is presies: *een-en-vyftig jaar, en hy kry dieselfde as ek.* Die ouer broer in Lukas 15 verlaat nooit die plaas nie en gaan nooit die huis binne nie."}, {"t": "p", "x": "Die moeite werd om by te voeg, sodat die vertrek nie verhewe voel nie: genade gee aanstoot aan die godsdienstige instink in almal, nie net in sigbaar goeie mense nie. Elke ander stelsel wat mense gebou het, loop op verdien. Genade is die een ding wat niemand sou uitgedink het nie."}]}, {"q": "Hoe sou 'n kerk lyk wat die aanstoot van die Kruis verwyder het? Sou ons dit van binne af agterkom?", "note": [{"t": "p", "x": "Dit sou suksesvol lyk. Vol, warm, goed bestuur, vriendelik, en bemoedigend."}, {"t": "p", "x": "Die verwydering word nooit aangekondig nie. Dit gebeur deur dinge uit te laat. Sonde word nie meer benoem nie. Bekering word nie meer gevra nie. Die Kruis word 'n prentjie van hoe lief God ons het in plaas van 'n betaling vir skuld. Jesus word 'n voorbeeld in plaas van 'n plaasvervanger. Elke enkele stap voel na pastorale sensitiwiteit."}, {"t": "p", "x": "Sou ons dit agterkom? Waarskynlik nie, want die getalle word beter. Een toets van binne af: loop enigiemand ooit weg oor wat ons leer? Jesus het mense in Johannes 6 laat wegstap. 'n Kerk waarvan niemand ooit wegstap nie, sê dalk eenvoudig niks waaroor besluit moet word nie."}, {"t": "p", "x": "*Let op:* hierdie vraag word baie vinnig selfvoldaan — *nie soos daardie kerke daar onder in die straat nie.* Draai dit binnetoe die oomblik as dit begin. **Waar het óns dit sagter gemaak?**"}]}], "en": [{"q": "Paul removed every offence he could, then refused to remove this one. How do we tell them apart today?", "note": [{"t": "p", "x": "The test that works: **is the offence in the message, or in the way we deliver it?**"}, {"t": "p", "x": "The gospel's own offence is that you cannot save yourself, and that Jesus is not one road among several. Everything else is ours and can go: our tone, our in-house words, our habits, our style, our politics, our rudeness."}, {"t": "p", "x": "Here is a rule you can hand the group. *If taking it away would change what a person has to believe to be saved, you may not take it away. If taking it away only costs us comfort or habit, take it away.*"}, {"t": "p", "x": "Paul does both. **1 Corinthians 9:22** *(only in this guide)* — *\"I have become all things to all people, that by all means I might save some.\"* And **Galatians 5:11** *(in the session)* — if he still preached circumcision, *\"the offence of the cross has been removed.\"* Same man, same lifetime."}]}, {"q": "Why is grace offensive to good people in particular?", "note": [{"t": "p", "x": "Because grace prices their effort at zero, and they have more effort invested than most."}, {"t": "p", "x": "The offence is not really at mercy. It is at mercy being **equal**. In Matthew 20 the complaint is not that they were underpaid. It is that the others were paid the same. Oom Danie's sentence is exact: *fifty-one years, and he gets the same thing I get.* The older brother in Luke 15 never leaves the property and never goes into the house."}, {"t": "p", "x": "Worth adding, so the room does not feel superior: grace offends the religious instinct in everybody, not just visibly good people. Every other system humans have built runs on earning. Grace is the one thing nobody would have invented."}]}, {"q": "What would a church look like that had removed the offence of the Cross? Would we notice from the inside?", "note": [{"t": "p", "x": "It would look successful. Full, warm, well run, kind, and encouraging."}, {"t": "p", "x": "The removal is never announced. It happens by leaving things out. Sin stops being named. Repentance stops being asked for. The Cross becomes a picture of how much God loves us instead of a payment for guilt. Jesus becomes an example instead of a substitute. Every single step feels like being pastorally sensitive."}, {"t": "p", "x": "Would we notice? Probably not, because the numbers get better. One test from the inside: does anybody ever leave because of what we teach? Jesus let people walk away in John 6. A church that nobody ever walks away from may simply not be saying anything that has to be decided about."}, {"t": "p", "x": "*Watch for:* this question turns smug very fast — *not like those churches down the road.* Turn it inwards the moment it starts. **Where have we softened it?**"}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"As iemand jou vanaand vra wat hy moet doen om gered te word, wat sou jy sê — en watter deel van daardie antwoord sou 'n ordentlike mens aanstoot gee?\"*"}], "en": [{"t": "p", "x": "*\"If someone asked you tonight what they must do to be saved, what would you say — and which part of that answer would offend a decent person?\"*"}]}, "title": "Die aanstoot van die Kruis  ·  The offence of the Cross"}]};

let lang = "af", ver = "AFR83", cur = 3;

/* ---------- scripture reference linking ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const bookRe = {};
for (const L of ["af","en"]) {
  const names = Object.keys(DATA.books[L]).sort((a,b)=>b.length-a.length)
    .map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  bookRe[L] = new RegExp("(?:\\b)("+names.join("|")+")\\s+(\\d+)(?::(\\d+(?:[–-]\\d+)?))?(?!\\d)","g");
}
const verseIndex = {};
DATA.sessions.forEach(s=>{
  const add=(o,n)=>{ if(o && !(o in verseIndex)) verseIndex[o]=n; };
  add(s.osis, s.n);
  ["af","en"].forEach(L=>s.extras[L].forEach(x=>add(x.osis, s.n)));
});
const bibleUrl = osis => "https://www.bible.com/bible/"+DATA.versions[ver].id+"/"+osis;

function linkRefs(html, sessionN){
  const parts = html.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<[^>]+>)/g);
  return parts.map(seg=>{
    if (!seg || seg[0]==="<") return seg;
    return seg.replace(bookRe[lang], (m, book, ch, v) => {
      const code = DATA.books[lang][book];
      if (!code) return m;
      const osis = code+"."+ch+(v?"."+v:"");
      const key  = code+"."+ch+(v?"."+v.split(/[–-]/)[0]:"");
      const tgt  = verseIndex[key];
      if (tgt && tgt !== sessionN)
        return '<a class="ref" href="#s'+tgt+'" title="'+T[lang].seeS+' '+tgt+'">'+m+'<sup>S'+tgt+'</sup></a>';
      return '<a class="ref" href="'+bibleUrl(osis)+'" target="_blank" rel="noopener" title="'+DATA.versions[ver].name+'">'+m+'<sup>↗</sup></a>';
    });
  }).join("");
}

/* ---------- inline markdown ---------- */
function md(s, sessionN){
  let h = esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[(.+?)\]\((#?[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return linkRefs(h, sessionN);
}
const blocks = (arr, n) => arr.map(b=>{
  if (b.t==="box")  return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  if (b.t==="list") return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  return "<p>"+md(b.x,n)+"</p>";
}).join("");

/* ---------- render ---------- */
function renderChrome(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T[lang][el.dataset.t]; });
  document.getElementById("fab").textContent = T[lang].fab;
  document.getElementById("footNote").textContent = T[lang].foot;
  document.getElementById("fabIntro").innerHTML = T[lang].fabIntro+' <button class="link" data-check>'+T[lang].fabDo+" →</button>";
  document.getElementById("btnAF").setAttribute("aria-pressed", lang==="af");
  document.getElementById("btnEN").setAttribute("aria-pressed", lang==="en");
  document.getElementById("verBox").innerHTML = Object.keys(DATA.versions)
    .map(k=>'<button data-v="'+k+'" aria-pressed="'+(k===ver)+'" title="'+DATA.versions[k].name+'">'+k+"</button>").join("");
  document.querySelectorAll("#verBox button").forEach(b=>b.onclick=()=>{ ver=b.dataset.v; render(); });

  const nav = DATA.sessions.map(s=>
    '<button class="navbtn" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'"><span class="row">'+
    '<span class="num">'+s.n+'</span><span class="t"><b>'+esc(s.title[lang])+"</b><span>"+esc(s.keyRef[lang])+"</span></span></span></button>").join("");
  document.getElementById("nav").innerHTML = nav;
  document.getElementById("chips").innerHTML = DATA.sessions.map(s=>
    '<button class="chip" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'">'+s.n+". "+esc(s.title[lang])+"</button>").join("");
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>go(+b.dataset.n));

  document.getElementById("leaderBody").innerHTML = DATA.leader[lang].map(p=>"<p>"+md(p,0)+"</p>").join("");
}


const G = GUIDE.sessions.find(x=>x.n===SESSION);
function gtable(rows,n){
  const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
  return "<table>"+body.map(r=>{
    const cells=r.replace(/^\||\|$/g,"").split("|");
    return "<tr>"+cells.map(c=>"<td>"+md(c.trim(),n)+"</td>").join("")+"</tr>";
  }).join("")+"</table>";
}
function gblocks(arr,n){
  return (arr||[]).map(b=>
    b.t==="box"   ? '<div class="lbox">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>" :
    b.t==="list"  ? "<ul>"+b.x.map(p=>"<li>"+md(p,n)+"</li>").join("")+"</ul>" :
    b.t==="table" ? gtable(b.x,n) :
                    "<p>"+md(b.x,n)+"</p>").join("");
}
function gnote(key,i){
  const arr=(G[key]&&G[key][lang])||[]; const it=arr[i];
  if(!it) return "";
  return '<div class="lnote">'+gblocks(it.note,SESSION)+"</div>";
}
function gextras(key,from){
  const arr=(G[key]&&G[key][lang])||[];
  if(arr.length<=from) return "";
  return arr.slice(from).map(it=>'<div class="lnote gextra"><p><b>'+esc(it.q)+"</b></p>"+gblocks(it.note,SESSION)+"</div>").join("");
}
function gopen(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.before)+"</h4>"+
    gblocks((G.lead&&G.lead[lang])||[],SESSION)+
    gblocks((G.before&&G.before[lang])||[],SESSION)+"</div>";
}
function gquiet(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.quiet)+"</h4>"+gblocks((G.quiet&&G.quiet[lang])||[],SESSION)+"</div>";
}

function renderSession(){
  const s = DATA.sessions.find(x=>x.n===cur), n = s.n, t = T[lang];
  const pts = s.points[lang];
  const list = pts.find(b=>b.t==="list") || {x:[]};
  const caveat = pts.filter(b=>b.t!=="list").map(b=>'<p class="caveat">'+md(b.x,n)+"</p>").join("");
  const storyLead = s.story[lang].filter(b=>b.t==="p" && b.x.startsWith("*("));
  const storyRest = s.story[lang].filter(b=>!(b.t==="p" && b.x.startsWith("*(")));

  document.getElementById("session").innerHTML =
  '<div class="shead"><div><div class="skicker"><span class="lbadge">'+esc(LS[lang].kicker)+'</span> &nbsp;'+t.sess+" "+n+'</div><h2>'+esc(s.title[lang])+"</h2>"+
    '<div class="theme">'+esc(s.theme[lang])+"</div></div></div>"+gopen()+

  '<div class="card"><div class="inner">'+
    '<div class="klabel"><span class="l">'+t.key+'</span><span class="r">'+esc(s.keyRef[lang])+"</span></div>"+
    '<blockquote class="verse">'+esc(s.texts[ver])+"</blockquote>"+
    '<div class="vbar">'+Object.keys(DATA.versions).map(k=>'<button data-vv="'+k+'" aria-pressed="'+(k===ver)+'">'+k+"</button>").join("")+
      '<a class="open" href="'+bibleUrl(s.osis)+'" target="_blank" rel="noopener">'+t.open+" ↗</a></div>"+
  "</div></div>"+

  '<p class="simply">'+md(s.simply[lang],n)+"</p>"+
  (s.simplyNote[lang] ? '<p class="simplynote">'+md(s.simplyNote[lang],n)+"</p>" : "")+

  '<h3 class="sec">'+(lang==="af"?"Betekenis":"Meaning")+'</h3><div class="prose lead-prose">'+blocks(s.meaning[lang],n)+"</div>"+

  '<div class="learn" style="margin-top:24px"><h3>'+t.learn+"</h3><ol>"+
    list.x.map(p=>"<li><span>"+md(p,n)+"</span></li>").join("")+"</ol>"+caveat+"</div>"+

  '<div class="story" style="margin-top:18px"><h3><i>✦</i>'+t.story+"</h3>"+
    storyLead.map(b=>'<p class="lead">'+md(b.x,n)+"</p>").join("")+
    storyRest.map(b=> b.t==="box"
      ? '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>"
      : "<p>"+md(b.x,n)+"</p>").join("")+"</div>"+

  '<div class="extras" style="margin-top:18px"><h3>'+t.extras+"</h3>"+
    s.extras[lang].map(x=>'<div class="ex"><div class="top"><b>'+esc(x.ref)+"</b>"+
      '<a href="'+bibleUrl(x.osis)+'" target="_blank" rel="noopener">'+ver+" ↗</a></div><p>"+md(x.note,n)+"</p></div>").join("")+
  "</div>"+

  '<div class="week" style="margin-top:18px"><h3>'+t.week+'</h3><div class="prose">'+blocks(s.week[lang],n)+"</div></div>"+

  '<div class="qs" style="margin-top:18px"><h3>'+t.qhome+'</h3><p class="hint">'+t.qhomeHint+"</p><ol>"+
    s.qhome[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qhome",i)+"</li>").join("")+gextras("qhome",s.qhome[lang].length)+"</ol>"+
    '<div class="selfstrip"><span>'+t.fabPrompt+'</span><button data-check>'+t.fabDo+"</button></div></div>"+

  '<div class="qs group" style="margin-top:14px"><h3>'+t.qgroup+'</h3><p class="hint">'+t.qgroupHint+"</p><ol>"+
    s.qgroup[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qgroup",i)+"</li>").join("")+gextras("qgroup",s.qgroup[lang].length)+"</ol></div>"+

  '<div class="pray" style="margin-top:18px"><h3>'+t.pray+"</h3><p>"+md(s.prayer[lang].x||s.prayer[lang],n)+"</p></div>"+gquiet()+'<div class="printbar"><button onclick="window.print()">'+esc(LS[lang].print)+'</button><a href="../">'+esc(LS[lang].back)+"</a></div>"+

  '<div class="pager"><button '+(n===1?"disabled":"")+' id="prev">← '+t.prev+"</button>"+
    '<span class="count">'+n+" / 8</span>"+
    '<button class="next" '+(n===8?"disabled":"")+' id="next">'+t.next+" →</button></div>";

  document.querySelectorAll("[data-vv]").forEach(b=>b.onclick=()=>{ ver=b.dataset.vv; render(); });
  const p=document.getElementById("prev"), nx=document.getElementById("next");
  if(p) p.onclick=()=>go(cur-1);
  if(nx) nx.onclick=()=>go(cur+1);
}

let chk={step:0,name:"",ans:[]};
function chkName(){ return chk.name.trim() || DATA.check[lang].nameSkip; }
function renderSheet(){
  const k=DATA.check[lang], body=document.getElementById("sheetBody");
  document.getElementById("sheetTitle").textContent = T[lang].fab;
  const nm=esc(chkName());
  let h="";
  if(chk.step===0){
    h='<p class="prog">'+k.step+" 1 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.mirrorTitle)+"</h3>"+
      "<p>"+md(k.mirrorLead,0)+"</p><p>"+md(k.mirrorLead2,0)+"</p>"+
      '<div class="mirror"><div class="mcol"><h4>'+esc(k.fleshTitle)+"</h4><ul>"+
      k.flesh.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>"+
      '<div class="mcol spirit"><h4>'+esc(k.spiritTitle)+"</h4><ul>"+
      k.spirit.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div></div>"+
      "<p>"+md(k.mirrorClose,0)+"</p>"+
      '<div class="row"><button class="go" data-cstep="1">'+esc(k.go)+" →</button></div>";
  } else if(chk.step===1){
    h='<p class="prog">'+k.step+" 2 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.nameTitle)+"</h3>"+
      "<p>"+md(k.nameLead,0)+"</p>"+
      '<input class="namein" id="cname" maxlength="40" autocomplete="off" placeholder="'+esc(k.namePlaceholder)+'" value="'+esc(chk.name)+'">'+
      '<div class="privacy">'+esc(k.namePrivacy)+"</div>"+
      '<div class="row"><button class="go" data-cstart>'+esc(k.start)+' →</button><button class="ghost" data-cstep="0">'+esc(k.back)+"</button></div>";
  } else if(chk.step>=2 && chk.step<=7){
    const i=chk.step-2;
    h='<p class="prog">'+k.step+" "+(chk.step+1)+" "+k.of+" 8</p>"+
      '<h3 class="wq">'+esc(k.q[i]).replace(/\{n\}/g,"<b>"+nm+"</b>")+"</h3>"+
      '<div class="opts">'+
        '<button data-cans="1">'+esc(k.yes)+"</button>"+
        '<button data-cans="0.5">'+esc(k.unsure)+"</button>"+
        '<button data-cans="0">'+esc(k.no)+"</button></div>"+
      '<div class="row"><span></span><button class="ghost" data-cstep="'+(chk.step-1)+'">'+esc(k.back)+"</button></div>";
  } else {
    const sc=chk.ans.reduce((a,b)=>a+b,0);
    const band = sc<1 ? "r0" : (sc<2.5 ? "r1" : "r2");
    let door="";
    if(band!=="r0"){
      door = chk.ans[2]===1 ? k.door6 : ((chk.ans[3]===1||chk.ans[4]===1) ? k.door7 : k.door5);
    }
    h='<h3 class="wq">'+esc(k.resultTitle)+"</h3>"+
      k[band].split("\n\n").map(p=>"<p>"+md(p.replace(/\{n\}/g,chkName()),0)+"</p>").join("")+
      (door?'<div class="close-note">'+md(door.replace(/\{n\}/g,chkName()),0)+"</div>":"")+
      (band==="r0"?"":'<p class="prog" style="margin:18px 0 2px">'+esc(k.alsoTitle)+"</p>"+
        '<ul class="doors">'+k.also.map((x,i)=>'<li><a href="#s'+(i+5)+'">'+esc(x)+"</a></li>").join("")+"</ul>")+
      '<div class="row"><button class="go" data-cstep="0">'+esc(k.again)+'</button><button class="ghost" data-cclose>'+esc(k.close)+"</button></div>";
  }
  body.innerHTML=h;
  const inp=document.getElementById("cname");
  if(inp){ inp.oninput=e=>{chk.name=e.target.value;}; setTimeout(()=>inp.focus(),30); }
}
function openCheck(){ chk={step:0,name:"",ans:[]}; renderSheet(); sheet.showModal(); }

function render(){ renderChrome(); renderSession(); if(sheet && sheet.open) renderSheet(); }

function go(n, push=true){
  if(n<1||n>8) return;
  cur=n;
  if(push){ try{ if(location.hash!=="#s"+n) history.replaceState(null,"","#s"+n); }catch(e){} }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("btnAF").onclick=()=>{ lang="af"; if(DATA.versions[ver].lang!=="af") ver="AFR83"; render(); };
document.getElementById("btnEN").onclick=()=>{ lang="en"; if(DATA.versions[ver].lang!=="en") ver="ESV";   render(); };

const sheet=document.getElementById("sheet");
document.addEventListener("click",e=>{ if(e.target.closest("[data-check]")) openCheck(); });
document.getElementById("fab").onclick=openCheck;
document.getElementById("sheetClose").onclick=()=>sheet.close();
sheet.addEventListener("click",function(e){
  const st=e.target.closest("[data-cstep]");
  if(st){ chk.step=+st.dataset.cstep; if(chk.step<2) chk.ans=[]; renderSheet(); return; }
  if(e.target.closest("[data-cstart]")){ chk.step=2; chk.ans=[]; renderSheet(); return; }
  const an=e.target.closest("[data-cans]");
  if(an){ chk.ans[chk.step-2]=parseFloat(an.dataset.cans); chk.step++; renderSheet(); return; }
  if(e.target.closest("[data-cclose]")) sheet.close();
});
sheet.addEventListener("click",e=>{ if(e.target===sheet) sheet.close(); });

document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#s"]');
  if(a){ const n=+a.getAttribute("href").slice(2); if(n>=1&&n<=8){ e.preventDefault(); if(sheet.open) sheet.close(); go(n); } }
});
window.addEventListener("hashchange",()=>{ try{ const m=location.hash.match(/^#s([1-8])$/); if(m) go(+m[1],false); }catch(e){} });

(function init(){
  try{
    const m=location.hash.match(/^#s([1-8])$/); if(m) cur=+m[1];
    const q=new URLSearchParams(location.search);
    if((q.get("lang")||"").toLowerCase()==="en"){ lang="en"; ver="ESV"; }
  }catch(e){}
  render();
})();
</script>
</body>
</html>
