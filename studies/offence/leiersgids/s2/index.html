<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leiersgids · Sessie 2 — Om Aanstoot te Neem</title>
<meta name="description" content="'n Tweetalige studie van agt sessies oor aanstoot — vir persoonlike voorbereiding en kleingroepbespreking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf7ef; --ink:#2b2117; --ink-2:#5a4a38; --ink-3:#8a7760; --ink-4:#a89885;
  --line:#efe2c8; --card:#ffffff; --sand:#fbf2e3; --gold:#d9b88c; --gold-d:#b0895a;
  --warm:#fef1d6; --warm-line:#f0d9b0; --deep:#2b2117; --shadow:0 8px 30px rgba(43,33,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:500;color:var(--ink-3);min-width:0}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;padding:7px 11px;border-radius:999px;cursor:pointer}
.pillbox button:hover{color:var(--ink)}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}

/* hero */
.hero{padding-block:34px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:12px}
.eyebrow i{display:block;width:32px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.02}
.hero .sub{margin-top:10px;font-size:clamp(16px,2.4vw,19px);font-weight:500;color:var(--ink-2)}
.hero .opening{margin-top:16px;max-width:54ch;font-family:Fraunces,Georgia,serif;font-size:clamp(17px,2.4vw,19.5px);line-height:1.5;color:var(--ink)}
.hero .lede{margin-top:14px;max-width:56ch;font-size:15px;line-height:1.65;color:var(--ink-2)}

.fabline{margin:14px 0 0;max-width:60ch;font-size:14px;line-height:1.6;color:var(--ink-2)}
.fabline .link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--gold)}
.fabline .link:hover{border-bottom-color:var(--ink)}
.selfstrip{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sand);border:1px dashed var(--warm-line);border-radius:14px;padding:13px 16px}
.selfstrip span{font-size:14px;line-height:1.5;color:var(--ink-2)}
.selfstrip button{margin-left:auto;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:9px 15px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;white-space:nowrap}
.selfstrip button:hover{background:#000}
.note{margin:22px 0 4px;background:#fff;border:1px solid var(--warm-line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;box-shadow:var(--shadow)}
.note .ico{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:15px}
.note p{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note p:last-child{margin:0}
.note b{color:var(--ink)}

/* layout */
.cols{display:flex;gap:34px;padding-block:28px 110px;align-items:flex-start}
aside{display:none}
@media(min-width:900px){aside{display:block;flex:0 0 236px;position:sticky;top:74px}}
main{flex:1;min-width:0;max-width:660px}
.navlabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit;transition:.15s}
.navbtn:hover{background:#fff}
.navbtn[aria-current="true"]{background:#fff;border-color:var(--deep);box-shadow:var(--shadow)}
.navbtn .row{display:flex;align-items:center;gap:11px}
.navbtn .num{flex:0 0 auto;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font:700 12px/1 Inter,sans-serif;background:#fff;color:var(--ink-3);border:1px solid var(--line)}
.navbtn[aria-current="true"] .num{background:var(--deep);color:#fff;border-color:var(--deep)}
.navbtn .t{min-width:0}
.navbtn .t b{display:block;font:600 13px/1.25 Inter,sans-serif;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn[aria-current="true"] .t b{color:var(--ink)}
.navbtn .t span{display:block;font-size:11px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media(min-width:900px){.scroller{display:none}}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 13px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.chip[aria-current="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}

/* session */
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.skicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.shead h2{margin-top:5px;font-size:clamp(23px,4vw,31px);line-height:1.12}
.shead .theme{margin-top:6px;font-size:14px;color:var(--ink-3)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .inner{padding:18px 20px}
@media(min-width:768px){.card .inner{padding:22px 26px}}
.klabel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.klabel .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.klabel .r{font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2)}
blockquote.verse{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(18px,2.7vw,21px);line-height:1.45;font-weight:500}
.vbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink-3);border-radius:999px;padding:5px 10px;font:600 11px/1 Inter,sans-serif;cursor:pointer}
.vbar button[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.vbar a.open{margin-left:auto;font:600 11.5px/1 Inter,sans-serif;color:var(--ink-3);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--bg)}
.vbar a.open:hover{border-color:var(--deep);color:var(--ink)}

.simply{font-size:15.5px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.simply b{color:var(--ink)}
.simplynote{font-size:13.5px;line-height:1.6;color:var(--ink-3);font-style:italic;margin:8px 0 0}

h3.sec{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:26px 0 10px}
.prose p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:var(--ink-2)}
.lead-prose,.simply,.simplynote,h3.sec{padding-inline:6px}
@media(min-width:768px){.lead-prose,.simply,.simplynote,h3.sec{padding-inline:10px}}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.box{background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;margin:16px 0}
.box p{margin:0 0 9px;font-size:14.5px;line-height:1.68;color:var(--ink-2)}
.box p:last-child{margin:0}

.learn{background:var(--deep);color:#f5e9d6;border-radius:18px;padding:20px}
@media(min-width:768px){.learn{padding:24px 28px}}
.learn h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.learn ol{margin:0;padding:0;list-style:none;counter-reset:l}
.learn li{counter-increment:l;display:flex;gap:13px;margin-bottom:12px;font-size:15px;line-height:1.65}
.learn li:last-child{margin:0}
.learn li::before{content:counter(l);flex:0 0 auto;width:22px;height:22px;margin-top:2px;border-radius:999px;background:rgba(217,184,140,.18);color:var(--gold);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif}
.learn b{color:#fff}
.learn a{color:var(--gold)}
.learn .caveat{margin:14px 0 0;font-size:13.5px;line-height:1.6;color:#cbb99e;font-style:italic}

.story{background:#fff;border:1px solid var(--warm-line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
@media(min-width:768px){.story{padding:24px 28px}}
.story::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:999px;background:var(--warm);pointer-events:none}
.story>*{position:relative}
.story h3{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 12px}
.story h3 i{font-style:normal;width:26px;height:26px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:12px}
.story p{margin:0 0 12px;font-size:15px;line-height:1.78;color:#4a3c2b}
.story p:last-child{margin:0}
.story .lead{font-size:13.5px;color:var(--ink-3);font-style:italic}

.extras{background:var(--sand);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(min-width:768px){.extras{padding:22px 26px}}
.extras h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 14px}
.ex{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.ex:last-child{margin:0}
.ex .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.ex .top b{font:600 13.5px/1 Inter,sans-serif}
.ex .top a{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.03em;background:var(--deep);color:#fff;border-radius:999px;padding:5px 9px;text-decoration:none}
.ex p{margin:0;font-size:14px;line-height:1.62;color:var(--ink-2)}

.week{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
@media(min-width:768px){.week{padding:22px 26px}}
.week h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin:0 0 10px}

.qs{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
@media(min-width:768px){.qs{padding:22px 26px}}
.qs.group{background:var(--deep);border-color:var(--deep)}
.qs h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.qs.group h3{color:var(--gold)}
.qs .hint{font-size:12.5px;color:var(--ink-4);margin:0 0 14px}
.qs.group .hint{color:#b6a184}
.qs ol{margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:12px;margin-bottom:11px;font-size:15px;line-height:1.62;color:var(--ink-2)}
.qs li:last-child{margin:0}
.qs li::before{content:"Q" counter(q);flex:0 0 auto;font:700 11px/1.5 Inter,sans-serif;color:var(--ink-4)}
.qs.group li{color:#f0e4d1}
.qs.group li::before{color:var(--gold)}

.pray{border:1px dashed var(--warm-line);background:var(--warm);border-radius:18px;padding:18px 20px}
@media(min-width:768px){.pray{padding:20px 26px}}
.pray h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 8px}
.pray p{margin:0;font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.55;color:#4a3c2b}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;font:500 13.5px/1 Inter,sans-serif;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{background:var(--deep);color:#fff;border-color:var(--deep)}
.pager .count{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4)}

/* scripture refs */
a.ref{text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap;color:inherit}
a.ref:hover{border-bottom-color:var(--ink);background:rgba(217,184,140,.16)}
a.ref sup{font-size:9px;letter-spacing:.04em;color:var(--gold-d);margin-left:2px;vertical-align:super}
.learn a.ref{border-bottom-color:var(--gold)}
.learn a.ref sup{color:var(--gold)}

/* self-check */
.fab{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:11px 16px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(43,33,23,.28);max-width:calc(100% - 28px)}
@media(min-width:768px){.fab{right:20px;bottom:20px;padding:13px 19px;font-size:13.5px}}
dialog.sheet{border:0;padding:0;border-radius:20px;max-width:620px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(43,33,23,.3)}
dialog.sheet::backdrop{background:rgba(43,33,23,.45)}
.sheet .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 0}
.sheet h2{font-size:23px}
.sheet .close{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:32px;font-size:16px;line-height:1;cursor:pointer;color:var(--ink-3)}
.sheet .body{padding:14px 24px 24px}
.sheet .body p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.sheet ol.check{list-style:none;margin:14px 0;padding:0;counter-reset:c}
.sheet ol.check li{counter-increment:c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;font-size:14.5px;line-height:1.55}
.sheet ol.check li::before{content:counter(c);flex:0 0 auto;width:21px;height:21px;border-radius:999px;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif;color:var(--ink-3)}
.sheet .prog{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);opacity:.8;margin:0 0 10px}
.sheet .wq{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px;color:var(--ink)}
.sheet .opts{display:grid;gap:8px;margin:0 0 4px}
.sheet .opts button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:600 15px/1.3 Inter,sans-serif;color:var(--ink);cursor:pointer}
.sheet .opts button:hover{border-color:var(--gold);background:var(--sand)}
.sheet .mirror{display:grid;gap:10px;margin:14px 0}
@media(min-width:520px){.sheet .mirror{grid-template-columns:1fr 1fr}}
.sheet .mcol{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.sheet .mcol.spirit{background:var(--warm);border-color:var(--warm-line)}
.sheet .mcol h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.sheet .mcol ul{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.sheet .namein{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:500 16px/1.3 Inter,sans-serif;color:var(--ink);background:#fff;margin:4px 0 10px}
.sheet .namein:focus{outline:none;border-color:var(--gold)}
.sheet .privacy{font-size:13px;line-height:1.6;color:var(--ink-3);background:var(--sand);border-radius:12px;padding:11px 13px;margin:0 0 14px}
.sheet .go{background:var(--deep);color:#fff;border:1px solid var(--deep);border-radius:999px;padding:12px 20px;font:600 14.5px/1 Inter,sans-serif;cursor:pointer}
.sheet .ghost{background:none;border:0;padding:10px 2px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-3);cursor:pointer;text-decoration:underline}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.sheet .doors{list-style:none;margin:12px 0 0;padding:0}
.sheet .doors li{padding:4px 0 4px 15px;position:relative;font-size:14.5px;line-height:1.5}
.sheet .doors li:before{content:"\2192";position:absolute;left:0;opacity:.5}
.sheet .close-note{background:var(--warm);border:1px solid var(--warm-line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:#4a3c2b;margin-top:14px}

/* leader */
details.leader{margin-top:34px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
details.leader summary{cursor:pointer;padding:16px 20px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.leader summary::-webkit-details-marker{display:none}
details.leader summary::before{content:"›";display:inline-block;transition:.2s;font-size:19px;color:var(--ink-4)}
details.leader[open] summary::before{transform:rotate(90deg)}
details.leader .lbody{padding:0 20px 20px}
details.leader .lbody p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}

footer.foot{border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:22px 34px;font-size:12px;line-height:1.7;color:var(--ink-4)}
.footin p{margin:0 0 8px}
.footin a{color:var(--ink-3)}
.footin .rights{font-size:11px;line-height:1.6}

@media print{
  header.top,aside,.scroller,.pager,.fab,.crumbs,.ctrl{display:none!important}
  body{background:#fff}
  .card,.learn,.story,.extras,.week,.qs,.pray{box-shadow:none;break-inside:avoid}
  .learn,.qs.group{background:#fff!important;color:#000!important;border:1px solid #ccc!important}
  .learn li,.qs.group li{color:#000!important}
  .learn h3,.qs.group h3{color:#666!important}
}

/* ---- leiersgids ---- */
body{--gp:#2f5d50}
.lbadge{display:inline-flex;align-items:center;gap:7px;background:var(--gp);color:#fff;border-radius:999px;padding:6px 13px;font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.lblock{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 14px 14px 0;padding:15px 17px;margin:18px 0}
.lblock>h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gp);margin:0 0 9px}
.lblock p{font-size:14.7px;line-height:1.72;color:#22322c;margin:0 0 11px}
.lblock p:last-child{margin-bottom:0}
.lblock ul{margin:0 0 11px;padding-left:19px;font-size:14.7px;line-height:1.72;color:#22322c}
.lblock .lbox{background:#fff;border:1px solid #cfe0d9;border-radius:12px;padding:13px 15px;margin:12px 0}
.lblock table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.lblock td{border-bottom:1px solid #d8e6e0;padding:8px 9px;vertical-align:top;line-height:1.55}
.lnote{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0 4px}
.lnote p{font-size:14.4px;line-height:1.7;color:#22322c;margin:0 0 10px}
.lnote p:last-child{margin-bottom:0}
.lnote ul{margin:0 0 10px;padding-left:19px;font-size:14.4px;line-height:1.7;color:#22322c}

<script>
const DATA = {"versions": {"AFR83": {"id": 6, "lang": "af", "name": "Afrikaans 1983"}, "AFR53": {"id": 5, "lang": "af", "name": "Afrikaans 1933/1953"}, "NLV": {"id": 117, "lang": "af", "name": "Nuwe Lewende Vertaling"}, "ESV": {"id": 59, "lang": "en", "name": "English Standard Version"}, "NIV": {"id": 111, "lang": "en", "name": "New International Version"}}, "books": {"af": {"Genesis": "GEN", "Eksodus": "EXO", "Levitikus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Konings": "1KI", "2 Konings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Spreuke": "PRO", "Prediker": "ECC", "Jesaja": "ISA", "Jeremia": "JER", "Matteus": "MAT", "Matthéüs": "MAT", "Markus": "MRK", "Lukas": "LUK", "Johannes": "JHN", "Handelinge": "ACT", "Romeine": "ROM", "1 Korintiërs": "1CO", "2 Korintiërs": "2CO", "Galasiërs": "GAL", "Efesiërs": "EPH", "Filippense": "PHP", "Kolossense": "COL", "1 Timoteus": "1TI", "2 Timoteus": "2TI", "Hebreërs": "HEB", "Jakobus": "JAS", "1 Petrus": "1PE", "2 Petrus": "2PE", "Judas": "JUD", "Openbaring": "REV"}, "en": {"Genesis": "GEN", "Exodus": "EXO", "Leviticus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Kings": "1KI", "2 Kings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Proverbs": "PRO", "Ecclesiastes": "ECC", "Isaiah": "ISA", "Jeremiah": "JER", "Matthew": "MAT", "Mark": "MRK", "Luke": "LUK", "John": "JHN", "Acts": "ACT", "Romans": "ROM", "1 Corinthians": "1CO", "2 Corinthians": "2CO", "Galatians": "GAL", "Ephesians": "EPH", "Philippians": "PHP", "Colossians": "COL", "1 Timothy": "1TI", "2 Timothy": "2TI", "Hebrews": "HEB", "James": "JAS", "1 Peter": "1PE", "2 Peter": "2PE", "Jude": "JUD", "Revelation": "REV"}}, "sessions": [{"n": 2, "id": "s2", "title": {"af": "Die wortel", "en": "The root"}, "theme": {"af": "Wys waar dit groei — en wat ons byvoeg", "en": "Where it grows — and what we add"}, "keyRef": {"af": "Hebreërs 12:15", "en": "Hebrews 12:15"}, "osis": "HEB.12.15", "texts": {"AFR83": "Sorg dat niemand van die genade van God afvallig word nie. Sorg dat daar nie verbittering soos 'n wortel uitspruit, moeilikheid veroorsaak en baie besmet nie.", "AFR53": "en pas op dat niemand in die genade van God veragter nie; dat geen wortel van bitterheid opskiet en onrus verwek en baie hierdeur besoedel word nie.", "NLV": "Wees baie versigtig dat niemand van julle uitsak en God se genade verspeel nie. Moenie dat daar onder julle ’n loot van bitterheid opskiet wat moeilikheid veroorsaak en baie aansteek nie.", "ESV": "See to it that no one fails to obtain the grace of God; that no “root of bitterness” springs up and causes trouble, and by it many become defiled;", "NIV": "See to it that no one falls short of the grace of God and that no bitter root grows up to cause trouble and defile many."}, "simply": {"af": "Aanstoot plant nie bitterheid nie. Dit ontbloot 'n wortel wat reeds daar was.", "en": "Offence does not plant bitterness. It exposes a root that was already there."}, "simplyNote": {"af": "", "en": ""}, "meaning": {"af": [{"t": "p", "x": "'n Wortel groei ondergronds, ongesiens, lank voordat enigiets bo die grond wys. Hebreërs sit twee dinge langs mekaar: om die genade van God te verspeel (mis te loop), en die bitter wortel. Hulle hang saam. Bitterheid groei in die gaping waar genade moes gewees het."}, {"t": "p", "x": "Let dan op die laaste woorde: *\"en baie besmet.\"* Bitterheid is nooit privaat nie. Een mens wat aanstoot dra, verander die temperatuur van 'n hele groep — die grappe word versigtig, die gebed word vlak, en niemand kan sê hoekom nie."}, {"t": "p", "x": "Dit is ook hoekom dieselfde opmerking op verskillende dae verskillend val. Die opmerking is die sneller. Dit is nie die oorsaak nie."}, {"t": "p", "x": "En dan maak ons dit erger. Trap op 'n by en die angel bly in die vel steek met die gifsak nog vas daaraan. Gryp dit om dit uit te trek en jy druk die sak — jy spuit meer gif in as wat die by self reggekry het. Die manier om 'n angel uit te haal is om dit sywaarts uit te skraap, nie om dit vas te knyp nie."}, {"t": "p", "x": "Dit is presies wat dit doen as jy 'n voorval oor en oor afspeel. *Hoekom sou sy dit sê? Wie dink sy is sy? En nog iets —* elke herhaling is 'n druk op die sak. Teen Vrydag maak dit meer seer as op Dinsdag, en niks nuuts het gebeur nie. **Die pyn volg die perspektief.** Verander hoe jy dit sien en jy verander wat dit jou kos."}], "en": [{"t": "p", "x": "A root grows underground, unseen, long before anything shows above the soil. Hebrews puts two things side by side: falling short of grace, and the bitter root. They are connected. Bitterness grows in the gap where grace should have been."}, {"t": "p", "x": "Then notice the last phrase: *\"and by it many become defiled.\"* Bitterness is never private. One offended person changes the temperature of a whole group — the jokes get careful, the prayer gets shallow, and nobody can say why."}, {"t": "p", "x": "This is why the same comment lands differently on different days. The comment is the trigger. It is not the cause."}, {"t": "p", "x": "And then we make it worse. Stand on a bee and the sting stays in the skin with the venom sac still attached. Grab it to pull it out and you squeeze the sac — you inject more venom than the bee managed on its own. The way to remove a sting is to scrape it out sideways, not to pinch it."}, {"t": "p", "x": "That is exactly what replaying an incident does. *Why would she say that? Who does she think she is? And another thing —* every rehearsal is a squeeze on the sac. By Friday it hurts more than it did on Tuesday, and nothing new has happened. **The pain follows the perspective.** Change how you see it and you change how much it costs you."}]}, "points": {"af": [{"t": "list", "x": ["Aanstoot ontbloot wat reeds in jou hart is — moegheid, onsekerheid, 'n ou wond.", "Dieselfde woorde maak Dinsdag seer en Saterdag nie. Daardie verskil is die wortel, nie die woorde nie — en elke keer as jy dit weer afspeel, druk jy meer gif in as wat die woorde gedra het.", "Hebreërs sê nie \"probeer harder om gaaf te wees\" nie. Dit sê moenie die genade mis (verspeel) nie. Genade is die onkruiddoder."]}], "en": [{"t": "list", "x": ["Offence reveals what is already in your heart — tiredness, insecurity, an old wound.", "The same words hurt on Tuesday and not on Saturday. That difference is the root, not the words — and every time you replay it, you push in more poison than the words carried.", "Hebrews does not say \"try harder to be nice\". It says do not fall short of grace. Grace is the weed killer."]}]}, "story": {"af": [{"t": "p", "x": "Elke keer as die groepleier die woord \"toewyding\" gebruik het, het Marlene stil geword."}, {"t": "p", "x": "Sy was nie onbeskof daaroor nie. Sy het net opgehou deelneem vir die res van die aand. Dit het gereeld genoeg gebeur dat Anna, wat langs haar gesit het, dit begin agterkom het. Een aand in die kombuis vra sy daaroor — versigtig, sonder om iets te verwag."}, {"t": "p", "x": "Marlene was lank stil. \"My pa het daardie woord gebruik,\" sê sy. \"Elke keer, net voordat hy vir my gesê het waarin ek gefaal het. *Jy het geen toewyding nie.* Ek was veertien.\""}, {"t": "p", "x": "Die leier het haar pa nooit ontmoet nie. Hy het van Bybellees gepraat. Maar die woord in sy sin het haar dertig jaar terug gevat."}, {"t": "p", "x": "Marlene het twee jaar lank in daardie groep aanstoot gedra teenoor 'n man wat haar niks aangedoen het nie. En sy het nog nooit een keer gevra hoekom juis daardie woord 'n hele vertrek vir haar kan leegmaak nie."}, {"t": "p", "x": "Die wortel was oud. Die sneller was nuut. Totdat sy die verskil gesien het, sou sy aanhou om die sneller te blameer."}, {"t": "box", "x": ["**Uit die Skrif — Absalom** (2 Samuel 13–15)", "Absalom se suster word verontreg deur hulle halfbroer, en hulle pa Dawid hoor daarvan en doen niks. Die onreg is werklik en die versuim van geregtigheid is werklik. Hier is nie 'n man wat 'n belediging verbeel nie.", "Lees dan 2 Samuel 13:22. Absalom het niks vir Amnon gesê nie, \"geen kwaad of goed nie\" — **twee jaar lank**. Aan die einde van daardie twee jaar laat hy hom doodmaak, en mettertyd vat hy die koninkryk by sy pa en skeur dit in twee.", "Aan die buitekant het niks in daardie twee jaar verander nie. Aan die binnekant het alles verander. Dit is die duidelikste prentjie in die Skrif van wat stilte aan 'n werklike wond doen — en van hoe 'n mens met aanstoot uiteindelik glo hy is reg."]}], "en": [{"t": "p", "x": "Every time the group leader used the word \"commitment\", Marlene went quiet."}, {"t": "p", "x": "She was not rude about it. She just stopped contributing for the rest of the evening. It happened often enough that Anna, who sat next to her, started noticing. One night in the kitchen she asked about it — carefully, expecting nothing."}, {"t": "p", "x": "Marlene was quiet for a long moment. \"My father used that word,\" she said. \"Every single time, before he told me what I had failed at. *You have no commitment.* I was fourteen.\""}, {"t": "p", "x": "The leader had never met her father. He was talking about Bible reading. But the word went past his sentence and landed somewhere thirty years older than the group."}, {"t": "p", "x": "Marlene had been offended in that group for two years, at a man who had done nothing to her. And she had never once thought to ask why that particular word could empty a room for her."}, {"t": "p", "x": "The root was old. The trigger was new. Until she saw the difference, she was going to keep blaming the trigger."}, {"t": "box", "x": ["**From Scripture — Absalom** (2 Samuel 13–15)", "Absalom's sister is wronged by their half-brother, and their father David hears of it and does nothing. The wrong is real and the failure of justice is real. This is not a man imagining an insult.", "Then read 2 Samuel 13:22. Absalom said nothing to Amnon, \"either good or bad\" — for **two years**. At the end of those two years he has him killed, and in time he takes the kingdom from his father and splits it in two.", "Nothing changed on the outside during those two years. Everything changed underneath. It is the clearest picture in Scripture of what silence does to a real wound — and of how an offended man ends up believing he is the righteous one."]}]}, "extras": {"af": [{"ref": "Psalm 139:23-24", "osis": "PSA.139.23", "note": "Vra God om die wortel te wys. Jy gaan dit nie kry deur na die sneller te staar nie."}, {"ref": "Jakobus 1:19-20", "osis": "JAS.1.19", "note": "Om eers te luister is nie beleefdheid nie. Dit koop tyd om jou eie hart na te gaan."}, {"ref": "Spreuke 4:23", "osis": "PRO.4.23", "note": "Om die hart te bewaak is deurlopend, nie 'n eenmalige ding nie."}], "en": [{"ref": "Psalm 139:23-24", "osis": "PSA.139.23", "note": "Ask God to show you the root. You will not find it by staring at the trigger."}, {"ref": "James 1:19-20", "osis": "JAS.1.19", "note": "Listening first is not politeness. It is a way of buying time to check your own heart."}, {"ref": "Proverbs 4:23", "osis": "PRO.4.23", "note": "Guarding the heart is maintenance work, not a one-off."}]}, "week": {"af": [{"t": "p", "x": "Voordat jy reageer op iets wat seermaak, vra drie vrae: **Het ek geslaap? Het ek geëet? Was ek by God?** As twee van die drie nee is, moenie vandag besluit nie. Kry eers genade, besluit dan."}], "en": [{"t": "p", "x": "Before you react to something that stings, ask three questions: **Have I slept? Have I eaten? Have I been with God?** If two of the three are no, do not make a decision today. Get grace first, then decide."}]}, "qhome": {"af": ["Watter woord, toon of soort mens kry 'n groter reaksie uit jou as wat dit behoort te kry?", "Waar kom dit vandaan? Wie het dit eerste gesê?", "Watter genade het jy self nodig gehad wat jy moeilik vir iemand anders gee?"], "en": ["What word, tone or kind of person gets a bigger reaction out of you than it should?", "Where did that come from? Who said it first?", "What grace have you needed yourself that you find hard to give someone else?"]}, "qgroup": {"af": ["Hebreërs sê bitterheid \"besmet baie\". Hoe verander een mens met aanstoot 'n hele groep?", "Hoekom maak dieselfde opmerking op een dag seer en op 'n ander dag nie?", "Hebreërs sê nie \"probeer harder\" nie — dit sê moenie by die genade verbyval nie. Hoe lyk dit prakties op 'n Woensdag?"], "en": ["Hebrews says bitterness \"defiles many\". How does one offended person change a whole group?", "Why does the same comment hurt on one day and not another?", "Hebrews does not say \"try harder\" — it says do not fall short of grace. What does that actually look like on a Wednesday?"]}, "prayer": {"af": "*Vader, wys my die wortel en nie net die oomblik nie. Waar ek kort raak aan U genade, maak my weer vol — voordat die volgende klein dingetjie kom.*", "en": "*Father, show me the root and not just the moment. Where I am running short on Your grace, fill me up again — before the next small thing arrives.*"}}], "selfcheck": {"af": {"intro": ["Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Die toets kan dus nie wees \"voel ek aanstoot?\" nie — niemand antwoord dít eerlik nie. Die toets moet oor simptome gaan.", "Paulus lys hulle in Galasiërs 5:19-21, en langs verse 22-23 gelees werk dit soos 'n diagnose. Aan die een kant: vyandskap, twis, jaloesie, woede-uitbarstings, selfsug, tweedrag, verdeeldheid. Aan die ander kant: liefde, blydskap, vrede, geduld, vriendelikheid. Jy kan nie in albei tegelyk wandel nie. As die eerste lys is wat opkom wanneer jy aan 'n bepaalde mens dink, sit jou voet in die strik — hoe goed jou saak ook al is.", "**Ses eerlike vrae. Kies een mens en antwoord vir hulle.**"], "questions": ["Wanneer hulle naam opkom, wat gebeur in jou bors?", "As jy hulle in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie vertel aan iemand wat dit nie hoef te gehoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir hulle?", "Kan jy God hardop, by die naam, vir hulle dank en dit bedoel?", "Kan jy in 'n vertrek sit en hoor hoe hulle geprys word sonder om 'n \"maar\" by te sit?"], "close": "**As verskeie van dié raak vat:** jy is nie 'n slegte mens nie en jy is waarskynlik nie verkeerd oor die feite nie. Jy is in 'n strik. Om reg te wees is wat die meeste mense daarin hou. Gaan terug na sessie 5 (gee die saak oor), sessie 6 (gaan na hulle), of sessie 7 (skrap die skuld) — watter een jy ook al vermy het."}, "en": {"intro": ["The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel *right*. So the test cannot be \"am I offended?\" — nobody answers that honestly. The test has to be about symptoms.", "Paul lists them in Galatians 5:19-21, and read side by side with verses 22-23 they work as a diagnostic. On the one side: enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions. On the other: love, joy, peace, patience, kindness. You cannot walk in both at once. If the first list is what comes up when you think of a particular person, your foot is in the trap, however good your case is.", "**Six honest questions. Pick one person and answer for them.**"], "questions": ["When their name comes up, what happens in your chest?", "If you saw them in the shop, would you turn down a different aisle?", "Have you told the story to someone who did not need to hear it?", "Do you find yourself hoping something goes slightly wrong for them?", "Can you thank God for them out loud, by name, and mean it?", "Could you sit in a room and hear them praised without adding a \"but\"?"], "close": "**If several of those land:** you are not a bad person and you are probably not wrong about the facts. You are in a trap. Being right is what keeps most people in it. Go back to Session 5 (hand the case over), Session 6 (go to them), or Session 7 (cancel the debt) — whichever one you have been avoiding."}}, "check": {"af": {"step": "Stap", "of": "van", "mirrorTitle": "Eers die spieël", "mirrorLead": "Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Daarom kan die toets nie wees \"voel ek aanstoot?\" nie. Niemand antwoord dít eerlik nie.", "mirrorLead2": "Paulus gee vir ons 'n ander soort toets. Hy sit twee lyste langs mekaar in Galasiërs 5:19-23. Jy kan nie in albei tegelyk loop nie. Kyk watter lys opkom wanneer jy aan een bepaalde mens dink.", "fleshTitle": "Die vlees", "flesh": ["vyandskap", "twis", "jaloesie", "woede-uitbarstings", "selfsug", "tweedrag", "verdeeldheid"], "spiritTitle": "Die Gees", "spirit": ["liefde", "blydskap", "vrede", "geduld", "vriendelikheid", "goedhartigheid", "getrouheid"], "mirrorClose": "Hierdie toets vra nie of jou saak goed is nie. Dit vra net wat in jou gebeur.", "go": "Ek is gereed", "nameTitle": "Wie is die mens?", "nameLead": "Dink aan een mens. Tik hulle naam, of laat dit leeg as jy liewer nie wil nie.", "namePlaceholder": "Naam", "namePrivacy": "Wat jy hier tik bly op jou foon. Dit word nêrens gestoor of gestuur nie, ook nie op hierdie toestel nie. Maak die blad toe en dit is weg.", "nameSkip": "iemand", "start": "Begin", "yes": "Ja", "unsure": "Nie seker", "no": "Nee", "back": "Terug", "q": ["Wanneer {n} se naam opkom, trek iets in jou bors saam?", "As jy {n} in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie oor {n} vertel aan iemand wat dit nie hoef te hoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir {n}?", "Sukkel jy om God hardop vir {n} te dank, by die naam, en dit te bedoel?", "Sukkel jy om te hoor hoe {n} geprys word sonder om 'n \"maar\" by te sit?"], "resultTitle": "Wat dit aandui", "r0": "Niks hier dui daarop dat jy met {n} vasgevang is nie. Dit is goeie nuus, en dit is die moeite werd om dit so te hou.\n\nAs 'n ander naam by jou opgekom het terwyl jy die vrae gelees het, doen die toets weer vir daardie mens. Dít is gewoonlik die een.", "r1": "Daar is iets hier, maar dit is nog vroeg. Op hierdie stadium is dit klein genoeg om te hanteer sonder dat iemand anders eers hoef te weet.\n\nDit is presies die oomblik waar 'n mens dit gewoonlik laat lê, en dit is presies hoekom dit later 'n muur word.", "r2": "Jou voet is in die strik.\n\nJy is nie 'n slegte mens nie, en jy is waarskynlik nie verkeerd oor die feite nie. Om reg te wees is juis wat die meeste mense daarin hou.", "door6": "Jy praat **oor** {n} eerder as **met** {n}. Begin by sessie 6.", "door7": "Jy hou 'n rekening oop wat jy kan skrap. Begin by sessie 7.", "door5": "Jy dra 'n saak wat jy kan oorgee. Begin by sessie 5.", "alsoTitle": "Die drie deure", "also": ["Sessie 5 — gee die saak oor", "Sessie 6 — gaan na hulle toe", "Sessie 7 — skrap die skuld"], "again": "Doen dit weer", "close": "Maak toe"}, "en": {"step": "Step", "of": "of", "mirrorTitle": "The mirror first", "mirrorLead": "The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel **right**. So the test cannot be \"am I offended?\" Nobody answers that one honestly.", "mirrorLead2": "Paul gives us a different kind of test. He puts two lists side by side in Galatians 5:19-23. You cannot walk in both at once. Watch which list comes up when you think of one particular person.", "fleshTitle": "The flesh", "flesh": ["enmity", "strife", "jealousy", "fits of anger", "rivalries", "dissensions", "divisions"], "spiritTitle": "The Spirit", "spirit": ["love", "joy", "peace", "patience", "kindness", "goodness", "faithfulness"], "mirrorClose": "This test does not ask whether your case is good. It only asks what is happening in you.", "go": "I am ready", "nameTitle": "Who is the person?", "nameLead": "Think of one person. Type their name, or leave it blank if you would rather not.", "namePlaceholder": "Name", "namePrivacy": "What you type stays on your phone. It is not stored or sent anywhere, not even on this device. Close the page and it is gone.", "nameSkip": "someone", "start": "Start", "yes": "Yes", "unsure": "Not sure", "no": "No", "back": "Back", "q": ["When {n}'s name comes up, does something tighten in your chest?", "If you saw {n} in the shop, would you turn down a different aisle?", "Have you told the story about {n} to someone who did not need to hear it?", "Do you ever hope something goes slightly wrong for {n}?", "Do you struggle to thank God out loud for {n}, by name, and mean it?", "Do you struggle to hear {n} praised without adding a \"but\"?"], "resultTitle": "What this points to", "r0": "Nothing here suggests you are caught with {n}. That is good news, and it is worth keeping that way.\n\nIf another name came to mind while you were reading the questions, run it again for that person. That is usually the one.", "r1": "There is something here, but it is early. At this stage it is small enough to deal with before anyone else needs to know about it.\n\nThis is exactly the point where people leave it, and exactly why it becomes a wall later.", "r2": "Your foot is in the trap.\n\nYou are not a bad person, and you are probably not wrong about the facts. Being right is what keeps most people in it.", "door6": "You are talking **about** {n} rather than **to** {n}. Start at session 6.", "door7": "You are holding an account open that you could cancel. Start at session 7.", "door5": "You are carrying a case you could hand over. Start at session 5.", "alsoTitle": "The three doors", "also": ["Session 5 — hand the case over", "Session 6 — go to them", "Session 7 — cancel the debt"], "again": "Run it again", "close": "Close"}}, "leader": {"af": ["**Oor sessie 4.** Dit is die sessie waar iemand dalk vir die eerste keer hardop sê dat hulle kwaad is vir God. Moenie dit regmaak nie, moenie God verdedig nie, en moenie vinnig na die volgende vraag beweeg nie. Jesus het Johannes nie berispe omdat hy gevra het nie. Die vertrek moet ook nie.", "**Oor sessie 7.** Onderrig oor vergifnis is waar 'n groep werklike skade kan doen sonder om dit te bedoel. Twee reëls: niemand word ooit gesê om volgens 'n tydtafel te vergewe nie, en niemand word ooit gesê dat vergewe beteken jy gaan terug nie. As iemand in die groep mishandeling of 'n misdaad openbaar, gaan dit na 'n leier en na die owerhede. Sê dit van voor af, eerder as om dit in 'n voetnoot te laat.", "**Oor Andrew Selley se twee boodskappe.** Die strikbeeld, die spooknet, die bysteek en \"die pyn volg die perspektief\", die sononder-reël, die Galasiërs 5-diagnose en Absalom kom uit sy tweede boodskap, *Hurt but Not Offended*. Drie dinge is doelbewus van die studieblad af weggelaat:", "- **Sy vertelling van 'n vrou wat deur verskeie mans aangerand is en hulle een vir een vergewe het terwyl dit gebeur.** Dit dra die punt, maar die blad word alleen gelees, op 'n foon, deur tieners sowel as volwassenes, met geen leier in die vertrek nie. Die beginsel staan sonder dit.\n- **\"Trust isn't earned, it's given.\"** Net so gelaat, plaas dit mense terug binne bereik van dié wat hulle skade aangedoen het. Sessie 7 behou die liefde en voeg Johannes 2:24 by.\n- **\"Jesus never had to forgive anybody\"** — die argument dat \"Vader, vergeef hulle\" voorbidding was eerder as vergifnis. Verdedigbaar, maar dit is 'n fyn onderskeid wat meer in verwarring gaan kos as wat dit in presiesheid wen. Sessie 5 rus op 1 Petrus 2:23, wat niemand betwis nie.", "Die frase \"'n onaanstootlike kerk\" in sessie 8 is ook syne — dit is hoe hy die hele reeks raam. Iewers in die agt weke werd om van voor af te sê, want dit is die studie se eie beginsel op homself toegepas: *ons kan nie die aanstoot van die evangelie verwyder nie — maar ons wil dit in liefde en versigtigheid oorbring.*"], "en": ["**On Session 4.** This is the session where someone may say out loud, for the first time, that they are angry with God. Do not fix it, do not defend God, and do not move quickly to the next question. Jesus did not rebuke John for asking. The room should not either.", "**On Session 7.** Forgiveness teaching is where a group can do real damage without meaning to. Two rules to hold: nobody is ever told to forgive on a timetable, and nobody is ever told that forgiving means going back. If someone discloses abuse or a crime in the group, that goes to a leader and to the proper authorities. Say that from the front rather than leaving it in a footnote.", "**On Andrew Selley's two messages.** The trap image, the ghost net, the bee sting and \"the pain follows the perspective\", the sundown rule, the Galatians 5 diagnostic and Absalom all come from his part-two message, *Hurt but Not Offended*. Three things were deliberately left out of the study page:", "- **His account of a woman assaulted by several men, forgiving them as it happened.** It carries the point, but the study page is read alone, on a phone, by teenagers as well as adults, with no leader in the room. The principle stands without it.\n- **\"Trust isn't earned, it's given.\"** Held as-is, it puts people back within reach of those who harmed them. Session 7 keeps the love and adds John 2:24.\n- **\"Jesus never had to forgive anybody\"** — the argument that \"Father, forgive them\" was intercession rather than forgiveness. It is a defensible reading, but it is a fine distinction that will cost more in confusion than it gains in precision. Session 5 rests on 1 Peter 2:23, which nobody disputes.", "The phrase \"an unoffendable church\" in Session 8 is also his — it is how he frames the whole series. Worth saying from the front at some point in the eight weeks, because it is the study's own principle turned on itself: *we cannot remove the offence of the gospel — but we must not be recklessly careless where it is not necessary.*"]}};
const GUIDE = {"sessions": [{"n": 2, "lead": {"af": [{"t": "p", "x": "**Hebreërs 12:15** · bitterheid groei in die gaping waar genade moes gewees het"}], "en": [{"t": "p", "x": "**Hebrews 12:15** · bitterness grows in the gap where grace should have been"}]}, "before": {"af": [{"t": "p", "x": "Sessie 1 het gesê die byt is joune. Sessie 2 vra hoekom jy gebyt het. Die antwoord is dat die sneller nie die oorsaak was nie."}, {"t": "p", "x": "Twee prente dra die sessie en hulle doen verskillende werk. Die **wortel** verduidelik hoekom dieselfde woorde op verskillende dae verskillend land. Die **bysteek** verduidelik hoekom dit oor 'n week erger word terwyl niks nuuts gebeur het nie. Druk die gifsakkie en jy stoot meer in as wat die by reggekry het. Elke keer wat jy dit weer deurgaan, druk jy."}, {"t": "p", "x": "Absalom is die swaar een. Lees 2 Samuel 13:22 hardop *(in die sessie)*: hy het nie 'n enkele woord met Amnon gepraat nie, twee jaar lank. Toe die moord. Toe die koninkryk wat skeur. Niks het in daardie twee jaar aan die buitekant verander nie. Alles het onder verander."}, {"t": "p", "x": "**Waar dit skeefloop:** die groep gebruik die wortel om werklike onreg weg te wuif — *jy was net moeg.* Sê duidelik dat die wortel verduidelik hoe sterk jy gereageer het, nie of die onreg werklik was nie. Marlene se leier het regtig niks gedoen nie. Hennie in Sessie 6 is regtig verkul. Die studie het albei nodig."}], "en": [{"t": "p", "x": "Session 1 said the bite is yours. Session 2 asks why you bit. The answer is that the trigger was not the cause."}, {"t": "p", "x": "Two pictures carry the session and they do different jobs. The **root** explains why the same words land differently on different days. The **bee sting** explains why it gets worse over a week when nothing new has happened. Squeeze the venom sac and you push in more than the bee managed. Every time you go over it, you squeeze."}, {"t": "p", "x": "Absalom is the heavy one. Read 2 Samuel 13:22 out loud *(in the session)*: he said nothing to Amnon, good or bad, for two years. Then the killing. Then the kingdom split. Nothing changed on the outside in those two years. Everything changed underneath."}, {"t": "p", "x": "**Where it goes wrong:** the group uses the root to wave away real wrongs — *you were just tired.* Say clearly that the root explains how strongly you reacted, not whether the wrong was real. Marlene's leader really had done nothing. Hennie in Session 6 really was cheated. The study needs both."}]}, "qhome": {"af": [{"q": "Watter woord, toon of soort mens kry 'n groter reaksie uit jou as wat dit behoort te kry?", "note": [{"t": "p", "x": "Mense vind hierdie een makliker as wat jy sou dink. Die teken is dat die reaksie buite verhouding is — groter as wat hulle self sou verdedig as hulle dit op video gesien het."}]}, {"q": "Waar kom dit vandaan? Wie het dit eerste gesê?", "note": [{"t": "p", "x": "Dit is die werklike vraag van die week, en dit is dikwels die eerste keer dat iemand dit vra. Verwag 'n ouer, 'n onderwyser, 'n eerste werkgewer, of 'n seisoen eerder as een mens."}]}, {"q": "Watter genade het jy self nodig gehad wat jy moeilik vir iemand anders gee?", "note": [{"t": "p", "x": "Die antwoorde is gewoonlik stil en spesifiek. Dit is die vers wat 'n spieël word."}]}], "en": [{"q": "What word, tone or kind of person gets a bigger reaction out of you than it should?", "note": [{"t": "p", "x": "People find this one easier than you would expect. The sign is that the reaction is out of proportion — bigger than they would defend if they saw it on video."}]}, {"q": "Where did that come from? Who said it first?", "note": [{"t": "p", "x": "This is the real question of the week, and it is often the first time anyone has asked them. Expect a parent, a teacher, a first boss, or a season rather than one person."}]}, {"q": "What grace have you needed yourself that you find hard to give someone else?", "note": [{"t": "p", "x": "The answers are usually quiet and specific. This is the verse turned into a mirror."}]}]}, "qgroup": {"af": [{"q": "Hebreërs sê bitterheid \"besmet baie\". Hoe verander een mens met aanstoot 'n hele groep?", "note": [{"t": "p", "x": "Byna nooit deur teen iemand te praat nie. Gewoonlik deur terug te trek."}, {"t": "p", "x": "Die groep verander vorm om die gaping sonder om te besluit. Grappies word versigtig. Gebed word vlakker. Mense hou op spontaan wees omdat hulle stilweg iemand se stemming bestuur. Niemand kan sê wat verander het nie, en dít is die punt. Hebreërs gebruik 'n bevlek-woord, nie 'n slaan-woord nie. Bitterheid val nie 'n groep aan nie. Dit kleur dit."}, {"t": "p", "x": "Die tweede manier is **werwing**. Aanstoot soek instemming, so dit vertel die storie aan mense wat dit nie hoef te gehoor het nie. Elke keer wat jy dit vertel, teken jy iemand aan."}, {"t": "box", "x": ["**'n Nota uit ons eie leierskap.**", "Om jou man of vrou van 'n griewe met 'n ander leier te vertel, voel heeltemal veilig. Dit is jou huwelik. Julle vertel mekaar alles.", "Maar dink aan wat jy nou net gedoen het. Jou maat dra nou 'n prentjie van daardie mens wat hulle nie self gebou het nie en nie kan afbreek nie. Jy maak dit dalk volgende week reg. Hulle is dalk 'n jaar later nog koel teenoor daardie mens. Hulle het nooit aanstoot geneem nie — hulle is gewerf.", "Daarom een praktyk wat oorweging werd is: **moenie met jou maat oor 'n ander leier praat voordat jy dit in jou eie hart uitgemaak het, of dit met die mens self uitgemaak het nie.** Vertel hulle dan die hele storie, insluitend hoe dit geëindig het.", "Twee grense daarop, en hulle maak saak. Dit is 'n reël oor griewe, nie oor jou huwelik nie — niemand vra jou om jou lewe weg te steek van die mens met wie jy saamleef nie. En as jy skade ly, of iets is werklik verkeerd en jy het hulp nodig, vertel iemand. Hierdie reël bestaan om te keer dat mense gewerf word. Dit is nie 'n rede om iets alleen te dra nie.", "Sleg hanteer, is dít presies hoe ons vestingstede teen mekaar bou — die sterk stad van Spreuke 18:19, net dat dit nou ons huwelike is wat die poorte toehou."]}, {"t": "p", "x": "*Let op:* as die groep eerlik is, gaan iemand besef dat hulle hierdie groep beskryf. Laat dit sit. Moenie dit red nie."}]}, {"q": "Hoekom maak dieselfde opmerking op een dag seer en op 'n ander dag nie?", "note": [{"t": "p", "x": "Omdat die opmerking die sneller is, nie die oorsaak nie. Wat verander, is die drie dinge wat die sessie noem — slaap, kos, tyd met God — plus geskiedenis, en dít is Marlene."}, {"t": "p", "x": "Daar is 'n ongemaklike punt hier, en dit is die moeite werd om te sê. As my reaksie verander terwyl die woorde dieselfde bly, dan gaan die meeste van die reaksie oor my. Dit is nie iets om oor skaam te wees nie. Dit is die diagnose wat verandering moontlik maak, want ek kan nie hulle woorde beheer nie en ek kan wél iets aan die wortel doen."}]}, {"q": "Hebreërs sê nie \"probeer harder\" nie — dit sê moenie by die genade verbyval nie. Hoe lyk dit op 'n Woensdag?", "note": [{"t": "p", "x": "Kyk na die werkwoord: *afvallig word*, verbyval. Dit is 'n versuim om te gaan haal, nie 'n versuim om te probeer nie. Genade is 'n voorraad, nie 'n stemming nie."}, {"t": "p", "x": "Die praktiese vraag is dus: wat is my werklike manier om genade in die middel van die week te kry? As die enigste antwoord Sondag is, het die wortel ses dae vir homself."}, {"t": "p", "x": "Die sessie gee drie vrae om as hek te gebruik voor enige besluit wat jy neem terwyl jy leeg loop:"}, {"t": "box", "x": ["**Het ek geslaap? Het ek geëet? Was ek by God?**", "As twee van die drie nee is, moenie vandag besluit nie. Kry eers genade, besluit dan."]}, {"t": "p", "x": "Twee ander antwoorde kom gewoonlik in die vertrek op, en albei is goed. Vat genade in voordat jy dit nodig het, eerder as net in 'n krisis. En hê iewers om dinge neer te sit — 'n mens vir wie jy dit hardop kan sê voordat dit hard word."}]}], "en": [{"q": "Hebrews says bitterness \"defiles many\". How does one offended person change a whole group?", "note": [{"t": "p", "x": "Almost never by speaking against anybody. Usually by pulling back."}, {"t": "p", "x": "The group changes shape around the gap without deciding to. Jokes get careful. Prayer gets shallower. People stop being spontaneous because they are quietly managing somebody's mood. Nobody can say what changed, and that is the point. Hebrews uses a staining word, not a striking word. Bitterness does not attack a group. It colours it."}, {"t": "p", "x": "The second way is **recruitment**. Offence wants agreement, so it tells the story to people who did not need to hear it. Every time you tell it, you sign somebody up."}, {"t": "box", "x": ["**A note from our own leadership.**", "Telling your husband or wife about a grievance with another leader feels completely safe. It is your marriage. You tell each other everything.", "But think about what you have just done. Your spouse now carries a picture of that person which they did not build and cannot take down. You may settle the matter next week. They may still be cool towards that person a year later. They were never offended — they were recruited.", "So one practice worth considering: **do not talk to your spouse about another leader until you have settled it in your own heart, or settled it with the person.** Then tell them the whole story, including how it ended.", "Two limits on that, and they matter. It is a rule about grievances, not about your marriage — nobody is asking you to hide your life from the person you live with. And if you are being harmed, or something is genuinely wrong and you need help, tell someone. This rule exists to stop people being recruited. It is not a reason to carry something alone.", "Handled badly, this is exactly how we build fortified cities against each other — the strong city of Proverbs 18:19, only now it is our marriages holding the gates shut."]}, {"t": "p", "x": "*Watch for:* if the group is honest, someone will realise they are describing this group. Let that sit. Do not rescue it."}]}, {"q": "Why does the same comment hurt on one day and not another?", "note": [{"t": "p", "x": "Because the comment is the trigger, not the cause. The things that change are the three the session names — sleep, food, time with God — plus history, which is Marlene."}, {"t": "p", "x": "There is an uncomfortable point here, and it is worth saying. If my reaction changes while the words stay the same, then most of the reaction is about me. That is not something to be ashamed of. It is the diagnosis that makes change possible, because I cannot control their words and I can do something about the root."}]}, {"q": "Hebrews does not say \"try harder\" — it says do not fall short of grace. What does that look like on a Wednesday?", "note": [{"t": "p", "x": "Look at the verb: *fails to obtain*. It is a failure to go and get, not a failure to try. Grace is a supply, not a mood."}, {"t": "p", "x": "So the practical question is: what is my actual way of getting grace mid-week? If the only answer is Sunday, the root has six days to itself."}, {"t": "p", "x": "The session gives three questions to use as a gate before any decision made when you are running on empty:"}, {"t": "box", "x": ["**Have I slept? Have I eaten? Have I been with God?**", "If two of the three are no, do not decide today. Get grace first, then decide."]}, {"t": "p", "x": "Two other answers usually come up in the room, and both are good. Take grace in before you need it, rather than only in a crisis. And have somewhere to put things — a person you can say it out loud to before it hardens."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Het iemand hier al ooit uitgevind dat wat jou laat ontplof het, byna niks met die mens voor jou te doen gehad het nie?\"*"}], "en": [{"t": "p", "x": "*\"Has anyone here ever found out that what set you off had almost nothing to do with the person in front of you?\"*"}]}, "title": "Die wortel  ·  The root"}]};

  const names = Object.keys(DATA.books[L]).sort((a,b)=>b.length-a.length)
    .map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  bookRe[L] = new RegExp("(?:\\b)("+names.join("|")+")\\s+(\\d+)(?::(\\d+(?:[–-]\\d+)?))?(?!\\d)","g");
}
const verseIndex = {};
DATA.sessions.forEach(s=>{
  const add=(o,n)=>{ if(o && !(o in verseIndex)) verseIndex[o]=n; };
  add(s.osis, s.n);
  ["af","en"].forEach(L=>s.extras[L].forEach(x=>add(x.osis, s.n)));
});
const bibleUrl = osis => "https://www.bible.com/bible/"+DATA.versions[ver].id+"/"+osis;

function linkRefs(html, sessionN){
  const parts = html.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<[^>]+>)/g);
  return parts.map(seg=>{
    if (!seg || seg[0]==="<") return seg;
    return seg.replace(bookRe[lang], (m, book, ch, v) => {
      const code = DATA.books[lang][book];
      if (!code) return m;
      const osis = code+"."+ch+(v?"."+v:"");
      const key  = code+"."+ch+(v?"."+v.split(/[–-]/)[0]:"");
      const tgt  = verseIndex[key];
      if (tgt && tgt !== sessionN)
        return '<a class="ref" href="#s'+tgt+'" title="'+T[lang].seeS+' '+tgt+'">'+m+'<sup>S'+tgt+'</sup></a>';
      return '<a class="ref" href="'+bibleUrl(osis)+'" target="_blank" rel="noopener" title="'+DATA.versions[ver].name+'">'+m+'<sup>↗</sup></a>';
    });
  }).join("");
}

/* ---------- inline markdown ---------- */
function md(s, sessionN){
  let h = esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[(.+?)\]\((#?[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return linkRefs(h, sessionN);
}
const blocks = (arr, n) => arr.map(b=>{
  if (b.t==="box")  return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  if (b.t==="list") return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  return "<p>"+md(b.x,n)+"</p>";
}).join("");

/* ---------- render ---------- */
function renderChrome(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T[lang][el.dataset.t]; });
  document.getElementById("fab").textContent = T[lang].fab;
  document.getElementById("footNote").textContent = T[lang].foot;
  document.getElementById("fabIntro").innerHTML = T[lang].fabIntro+' <button class="link" data-check>'+T[lang].fabDo+" →</button>";
  document.getElementById("btnAF").setAttribute("aria-pressed", lang==="af");
  document.getElementById("btnEN").setAttribute("aria-pressed", lang==="en");
  document.getElementById("verBox").innerHTML = Object.keys(DATA.versions)
    .map(k=>'<button data-v="'+k+'" aria-pressed="'+(k===ver)+'" title="'+DATA.versions[k].name+'">'+k+"</button>").join("");
  document.querySelectorAll("#verBox button").forEach(b=>b.onclick=()=>{ ver=b.dataset.v; render(); });

  const nav = DATA.sessions.map(s=>
    '<button class="navbtn" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'"><span class="row">'+
    '<span class="num">'+s.n+'</span><span class="t"><b>'+esc(s.title[lang])+"</b><span>"+esc(s.keyRef[lang])+"</span></span></span></button>").join("");
  document.getElementById("nav").innerHTML = nav;
  document.getElementById("chips").innerHTML = DATA.sessions.map(s=>
    '<button class="chip" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'">'+s.n+". "+esc(s.title[lang])+"</button>").join("");
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>go(+b.dataset.n));

  document.getElementById("leaderBody").innerHTML = DATA.leader[lang].map(p=>"<p>"+md(p,0)+"</p>").join("");
}


const G = GUIDE.sessions.find(x=>x.n===SESSION);
function gtable(rows,n){
  const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
  return "<table>"+body.map(r=>{
    const cells=r.replace(/^\||\|$/g,"").split("|");
    return "<tr>"+cells.map(c=>"<td>"+md(c.trim(),n)+"</td>").join("")+"</tr>";
  }).join("")+"</table>";
}
function gblocks(arr,n){
  return (arr||[]).map(b=>
    b.t==="box"   ? '<div class="lbox">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>" :
    b.t==="list"  ? "<ul>"+b.x.map(p=>"<li>"+md(p,n)+"</li>").join("")+"</ul>" :
    b.t==="table" ? gtable(b.x,n) :
                    "<p>"+md(b.x,n)+"</p>").join("");
}
function gnote(key,i){
  const arr=(G[key]&&G[key][lang])||[]; const it=arr[i];
  if(!it) return "";
  return '<div class="lnote">'+gblocks(it.note,SESSION)+"</div>";
}
function gextras(key,from){
  const arr=(G[key]&&G[key][lang])||[];
  if(arr.length<=from) return "";
  return arr.slice(from).map(it=>'<div class="lnote gextra"><p><b>'+esc(it.q)+"</b></p>"+gblocks(it.note,SESSION)+"</div>").join("");
}
function gopen(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.before)+"</h4>"+
    gblocks((G.lead&&G.lead[lang])||[],SESSION)+
    gblocks((G.before&&G.before[lang])||[],SESSION)+"</div>";
}
function gquiet(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.quiet)+"</h4>"+gblocks((G.quiet&&G.quiet[lang])||[],SESSION)+"</div>";
}

function renderSession(){
  const s = DATA.sessions.find(x=>x.n===cur), n = s.n, t = T[lang];
  const pts = s.points[lang];
  const list = pts.find(b=>b.t==="list") || {x:[]};
  const caveat = pts.filter(b=>b.t!=="list").map(b=>'<p class="caveat">'+md(b.x,n)+"</p>").join("");
  const storyLead = s.story[lang].filter(b=>b.t==="p" && b.x.startsWith("*("));
  const storyRest = s.story[lang].filter(b=>!(b.t==="p" && b.x.startsWith("*(")));

  document.getElementById("session").innerHTML =
  '<div class="shead"><div><div class="skicker"><span class="lbadge">'+esc(LS[lang].kicker)+'</span> &nbsp;'+t.sess+" "+n+'</div><h2>'+esc(s.title[lang])+"</h2>"+
    '<div class="theme">'+esc(s.theme[lang])+"</div></div></div>"+gopen()+

  '<div class="card"><div class="inner">'+
    '<div class="klabel"><span class="l">'+t.key+'</span><span class="r">'+esc(s.keyRef[lang])+"</span></div>"+
    '<blockquote class="verse">'+esc(s.texts[ver])+"</blockquote>"+
    '<div class="vbar">'+Object.keys(DATA.versions).map(k=>'<button data-vv="'+k+'" aria-pressed="'+(k===ver)+'">'+k+"</button>").join("")+
      '<a class="open" href="'+bibleUrl(s.osis)+'" target="_blank" rel="noopener">'+t.open+" ↗</a></div>"+
  "</div></div>"+

  '<p class="simply">'+md(s.simply[lang],n)+"</p>"+
  (s.simplyNote[lang] ? '<p class="simplynote">'+md(s.simplyNote[lang],n)+"</p>" : "")+

  '<h3 class="sec">'+(lang==="af"?"Betekenis":"Meaning")+'</h3><div class="prose lead-prose">'+blocks(s.meaning[lang],n)+"</div>"+

  '<div class="learn" style="margin-top:24px"><h3>'+t.learn+"</h3><ol>"+
    list.x.map(p=>"<li><span>"+md(p,n)+"</span></li>").join("")+"</ol>"+caveat+"</div>"+

  '<div class="story" style="margin-top:18px"><h3><i>✦</i>'+t.story+"</h3>"+
    storyLead.map(b=>'<p class="lead">'+md(b.x,n)+"</p>").join("")+
    storyRest.map(b=> b.t==="box"
      ? '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>"
      : "<p>"+md(b.x,n)+"</p>").join("")+"</div>"+

  '<div class="extras" style="margin-top:18px"><h3>'+t.extras+"</h3>"+
    s.extras[lang].map(x=>'<div class="ex"><div class="top"><b>'+esc(x.ref)+"</b>"+
      '<a href="'+bibleUrl(x.osis)+'" target="_blank" rel="noopener">'+ver+" ↗</a></div><p>"+md(x.note,n)+"</p></div>").join("")+
  "</div>"+

  '<div class="week" style="margin-top:18px"><h3>'+t.week+'</h3><div class="prose">'+blocks(s.week[lang],n)+"</div></div>"+

  '<div class="qs" style="margin-top:18px"><h3>'+t.qhome+'</h3><p class="hint">'+t.qhomeHint+"</p><ol>"+
    s.qhome[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qhome",i)+"</li>").join("")+gextras("qhome",s.qhome[lang].length)+"</ol>"+
    '<div class="selfstrip"><span>'+t.fabPrompt+'</span><button data-check>'+t.fabDo+"</button></div></div>"+

  '<div class="qs group" style="margin-top:14px"><h3>'+t.qgroup+'</h3><p class="hint">'+t.qgroupHint+"</p><ol>"+
    s.qgroup[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qgroup",i)+"</li>").join("")+gextras("qgroup",s.qgroup[lang].length)+"</ol></div>"+

  '<div class="pray" style="margin-top:18px"><h3>'+t.pray+"</h3><p>"+md(s.prayer[lang].x||s.prayer[lang],n)+"</p></div>"+gquiet()+'<div class="printbar"><button onclick="window.print()">'+esc(LS[lang].print)+'</button><a href="../">'+esc(LS[lang].back)+"</a></div>"+

  '<div class="pager"><button '+(n===1?"disabled":"")+' id="prev">← '+t.prev+"</button>"+
    '<span class="count">'+n+" / 8</span>"+
    '<button class="next" '+(n===8?"disabled":"")+' id="next">'+t.next+" →</button></div>";

  document.querySelectorAll("[data-vv]").forEach(b=>b.onclick=()=>{ ver=b.dataset.vv; render(); });
  const p=document.getElementById("prev"), nx=document.getElementById("next");
  if(p) p.onclick=()=>go(cur-1);
  if(nx) nx.onclick=()=>go(cur+1);
}

let chk={step:0,name:"",ans:[]};
function chkName(){ return chk.name.trim() || DATA.check[lang].nameSkip; }
function renderSheet(){
  const k=DATA.check[lang], body=document.getElementById("sheetBody");
  document.getElementById("sheetTitle").textContent = T[lang].fab;
  const nm=esc(chkName());
  let h="";
  if(chk.step===0){
    h='<p class="prog">'+k.step+" 1 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.mirrorTitle)+"</h3>"+
      "<p>"+md(k.mirrorLead,0)+"</p><p>"+md(k.mirrorLead2,0)+"</p>"+
      '<div class="mirror"><div class="mcol"><h4>'+esc(k.fleshTitle)+"</h4><ul>"+
      k.flesh.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>"+
      '<div class="mcol spirit"><h4>'+esc(k.spiritTitle)+"</h4><ul>"+
      k.spirit.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div></div>"+
      "<p>"+md(k.mirrorClose,0)+"</p>"+
      '<div class="row"><button class="go" data-cstep="1">'+esc(k.go)+" →</button></div>";
  } else if(chk.step===1){
    h='<p class="prog">'+k.step+" 2 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.nameTitle)+"</h3>"+
      "<p>"+md(k.nameLead,0)+"</p>"+
      '<input class="namein" id="cname" maxlength="40" autocomplete="off" placeholder="'+esc(k.namePlaceholder)+'" value="'+esc(chk.name)+'">'+
      '<div class="privacy">'+esc(k.namePrivacy)+"</div>"+
      '<div class="row"><button class="go" data-cstart>'+esc(k.start)+' →</button><button class="ghost" data-cstep="0">'+esc(k.back)+"</button></div>";
  } else if(chk.step>=2 && chk.step<=7){
    const i=chk.step-2;
    h='<p class="prog">'+k.step+" "+(chk.step+1)+" "+k.of+" 8</p>"+
      '<h3 class="wq">'+esc(k.q[i]).replace(/\{n\}/g,"<b>"+nm+"</b>")+"</h3>"+
      '<div class="opts">'+
        '<button data-cans="1">'+esc(k.yes)+"</button>"+
        '<button data-cans="0.5">'+esc(k.unsure)+"</button>"+
        '<button data-cans="0">'+esc(k.no)+"</button></div>"+
      '<div class="row"><span></span><button class="ghost" data-cstep="'+(chk.step-1)+'">'+esc(k.back)+"</button></div>";
  } else {
    const sc=chk.ans.reduce((a,b)=>a+b,0);
    const band = sc<1 ? "r0" : (sc<2.5 ? "r1" : "r2");
    let door="";
    if(band!=="r0"){
      door = chk.ans[2]===1 ? k.door6 : ((chk.ans[3]===1||chk.ans[4]===1) ? k.door7 : k.door5);
    }
    h='<h3 class="wq">'+esc(k.resultTitle)+"</h3>"+
      k[band].split("\n\n").map(p=>"<p>"+md(p.replace(/\{n\}/g,chkName()),0)+"</p>").join("")+
      (door?'<div class="close-note">'+md(door.replace(/\{n\}/g,chkName()),0)+"</div>":"")+
      (band==="r0"?"":'<p class="prog" style="margin:18px 0 2px">'+esc(k.alsoTitle)+"</p>"+
        '<ul class="doors">'+k.also.map((x,i)=>'<li><a href="#s'+(i+5)+'">'+esc(x)+"</a></li>").join("")+"</ul>")+
      '<div class="row"><button class="go" data-cstep="0">'+esc(k.again)+'</button><button class="ghost" data-cclose>'+esc(k.close)+"</button></div>";
  }
  body.innerHTML=h;
  const inp=document.getElementById("cname");
  if(inp){ inp.oninput=e=>{chk.name=e.target.value;}; setTimeout(()=>inp.focus(),30); }
}
function openCheck(){ chk={step:0,name:"",ans:[]}; renderSheet(); sheet.showModal(); }

function render(){ renderChrome(); renderSession(); if(sheet && sheet.open) renderSheet(); }

function go(n, push=true){
  if(n<1||n>8) return;
  cur=n;
  if(push){ try{ if(location.hash!=="#s"+n) history.replaceState(null,"","#s"+n); }catch(e){} }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("btnAF").onclick=()=>{ lang="af"; if(DATA.versions[ver].lang!=="af") ver="AFR83"; render(); };
document.getElementById("btnEN").onclick=()=>{ lang="en"; if(DATA.versions[ver].lang!=="en") ver="ESV";   render(); };

const sheet=document.getElementById("sheet");
document.addEventListener("click",e=>{ if(e.target.closest("[data-check]")) openCheck(); });
document.getElementById("fab").onclick=openCheck;
document.getElementById("sheetClose").onclick=()=>sheet.close();
sheet.addEventListener("click",function(e){
  const st=e.target.closest("[data-cstep]");
  if(st){ chk.step=+st.dataset.cstep; if(chk.step<2) chk.ans=[]; renderSheet(); return; }
  if(e.target.closest("[data-cstart]")){ chk.step=2; chk.ans=[]; renderSheet(); return; }
  const an=e.target.closest("[data-cans]");
  if(an){ chk.ans[chk.step-2]=parseFloat(an.dataset.cans); chk.step++; renderSheet(); return; }
  if(e.target.closest("[data-cclose]")) sheet.close();
});
sheet.addEventListener("click",e=>{ if(e.target===sheet) sheet.close(); });

document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#s"]');
  if(a){ const n=+a.getAttribute("href").slice(2); if(n>=1&&n<=8){ e.preventDefault(); if(sheet.open) sheet.close(); go(n); } }
});
window.addEventListener("hashchange",()=>{ try{ const m=location.hash.match(/^#s([1-8])$/); if(m) go(+m[1],false); }catch(e){} });

(function init(){
  try{
    const m=location.hash.match(/^#s([1-8])$/); if(m) cur=+m[1];
    const q=new URLSearchParams(location.search);
    if((q.get("lang")||"").toLowerCase()==="en"){ lang="en"; ver="ESV"; }
  }catch(e){}
  render();
})();
</script>
