<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leiersgids · Sessie 5 — Om Aanstoot te Neem</title>
<meta name="description" content="'n Tweetalige studie van agt sessies oor aanstoot — vir persoonlike voorbereiding en kleingroepbespreking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf7ef; --ink:#2b2117; --ink-2:#5a4a38; --ink-3:#8a7760; --ink-4:#a89885;
  --line:#efe2c8; --card:#ffffff; --sand:#fbf2e3; --gold:#d9b88c; --gold-d:#b0895a;
  --warm:#fef1d6; --warm-line:#f0d9b0; --deep:#2b2117; --shadow:0 8px 30px rgba(43,33,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:500;color:var(--ink-3);min-width:0}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;padding:7px 11px;border-radius:999px;cursor:pointer}
.pillbox button:hover{color:var(--ink)}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}

/* hero */
.hero{padding-block:34px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:12px}
.eyebrow i{display:block;width:32px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.02}
.hero .sub{margin-top:10px;font-size:clamp(16px,2.4vw,19px);font-weight:500;color:var(--ink-2)}
.hero .opening{margin-top:16px;max-width:54ch;font-family:Fraunces,Georgia,serif;font-size:clamp(17px,2.4vw,19.5px);line-height:1.5;color:var(--ink)}
.hero .lede{margin-top:14px;max-width:56ch;font-size:15px;line-height:1.65;color:var(--ink-2)}

.fabline{margin:14px 0 0;max-width:60ch;font-size:14px;line-height:1.6;color:var(--ink-2)}
.fabline .link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--gold)}
.fabline .link:hover{border-bottom-color:var(--ink)}
.selfstrip{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sand);border:1px dashed var(--warm-line);border-radius:14px;padding:13px 16px}
.selfstrip span{font-size:14px;line-height:1.5;color:var(--ink-2)}
.selfstrip button{margin-left:auto;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:9px 15px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;white-space:nowrap}
.selfstrip button:hover{background:#000}
.note{margin:22px 0 4px;background:#fff;border:1px solid var(--warm-line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;box-shadow:var(--shadow)}
.note .ico{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:15px}
.note p{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note p:last-child{margin:0}
.note b{color:var(--ink)}

/* layout */
.cols{display:flex;gap:34px;padding-block:28px 110px;align-items:flex-start}
aside{display:none}
@media(min-width:900px){aside{display:block;flex:0 0 236px;position:sticky;top:74px}}
main{flex:1;min-width:0;max-width:660px}
.navlabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit;transition:.15s}
.navbtn:hover{background:#fff}
.navbtn[aria-current="true"]{background:#fff;border-color:var(--deep);box-shadow:var(--shadow)}
.navbtn .row{display:flex;align-items:center;gap:11px}
.navbtn .num{flex:0 0 auto;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font:700 12px/1 Inter,sans-serif;background:#fff;color:var(--ink-3);border:1px solid var(--line)}
.navbtn[aria-current="true"] .num{background:var(--deep);color:#fff;border-color:var(--deep)}
.navbtn .t{min-width:0}
.navbtn .t b{display:block;font:600 13px/1.25 Inter,sans-serif;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn[aria-current="true"] .t b{color:var(--ink)}
.navbtn .t span{display:block;font-size:11px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media(min-width:900px){.scroller{display:none}}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 13px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.chip[aria-current="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}

/* session */
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.skicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.shead h2{margin-top:5px;font-size:clamp(23px,4vw,31px);line-height:1.12}
.shead .theme{margin-top:6px;font-size:14px;color:var(--ink-3)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .inner{padding:18px 20px}
@media(min-width:768px){.card .inner{padding:22px 26px}}
.klabel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.klabel .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.klabel .r{font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2)}
blockquote.verse{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(18px,2.7vw,21px);line-height:1.45;font-weight:500}
.vbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink-3);border-radius:999px;padding:5px 10px;font:600 11px/1 Inter,sans-serif;cursor:pointer}
.vbar button[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.vbar a.open{margin-left:auto;font:600 11.5px/1 Inter,sans-serif;color:var(--ink-3);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--bg)}
.vbar a.open:hover{border-color:var(--deep);color:var(--ink)}

.simply{font-size:15.5px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.simply b{color:var(--ink)}
.simplynote{font-size:13.5px;line-height:1.6;color:var(--ink-3);font-style:italic;margin:8px 0 0}

h3.sec{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:26px 0 10px}
.prose p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:var(--ink-2)}
.lead-prose,.simply,.simplynote,h3.sec{padding-inline:6px}
@media(min-width:768px){.lead-prose,.simply,.simplynote,h3.sec{padding-inline:10px}}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.box{background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;margin:16px 0}
.box p{margin:0 0 9px;font-size:14.5px;line-height:1.68;color:var(--ink-2)}
.box p:last-child{margin:0}

.learn{background:var(--deep);color:#f5e9d6;border-radius:18px;padding:20px}
@media(min-width:768px){.learn{padding:24px 28px}}
.learn h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.learn ol{margin:0;padding:0;list-style:none;counter-reset:l}
.learn li{counter-increment:l;display:flex;gap:13px;margin-bottom:12px;font-size:15px;line-height:1.65}
.learn li:last-child{margin:0}
.learn li::before{content:counter(l);flex:0 0 auto;width:22px;height:22px;margin-top:2px;border-radius:999px;background:rgba(217,184,140,.18);color:var(--gold);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif}
.learn b{color:#fff}
.learn a{color:var(--gold)}
.learn .caveat{margin:14px 0 0;font-size:13.5px;line-height:1.6;color:#cbb99e;font-style:italic}

.story{background:#fff;border:1px solid var(--warm-line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
@media(min-width:768px){.story{padding:24px 28px}}
.story::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:999px;background:var(--warm);pointer-events:none}
.story>*{position:relative}
.story h3{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 12px}
.story h3 i{font-style:normal;width:26px;height:26px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:12px}
.story p{margin:0 0 12px;font-size:15px;line-height:1.78;color:#4a3c2b}
.story p:last-child{margin:0}
.story .lead{font-size:13.5px;color:var(--ink-3);font-style:italic}

.extras{background:var(--sand);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(min-width:768px){.extras{padding:22px 26px}}
.extras h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 14px}
.ex{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.ex:last-child{margin:0}
.ex .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.ex .top b{font:600 13.5px/1 Inter,sans-serif}
.ex .top a{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.03em;background:var(--deep);color:#fff;border-radius:999px;padding:5px 9px;text-decoration:none}
.ex p{margin:0;font-size:14px;line-height:1.62;color:var(--ink-2)}

.week{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
@media(min-width:768px){.week{padding:22px 26px}}
.week h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin:0 0 10px}

.qs{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
@media(min-width:768px){.qs{padding:22px 26px}}
.qs.group{background:var(--deep);border-color:var(--deep)}
.qs h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.qs.group h3{color:var(--gold)}
.qs .hint{font-size:12.5px;color:var(--ink-4);margin:0 0 14px}
.qs.group .hint{color:#b6a184}
.qs ol{margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:12px;margin-bottom:11px;font-size:15px;line-height:1.62;color:var(--ink-2)}
.qs li:last-child{margin:0}
.qs li::before{content:"Q" counter(q);flex:0 0 auto;font:700 11px/1.5 Inter,sans-serif;color:var(--ink-4)}
.qs.group li{color:#f0e4d1}
.qs.group li::before{color:var(--gold)}

.pray{border:1px dashed var(--warm-line);background:var(--warm);border-radius:18px;padding:18px 20px}
@media(min-width:768px){.pray{padding:20px 26px}}
.pray h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 8px}
.pray p{margin:0;font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.55;color:#4a3c2b}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;font:500 13.5px/1 Inter,sans-serif;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{background:var(--deep);color:#fff;border-color:var(--deep)}
.pager .count{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4)}

/* scripture refs */
a.ref{text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap;color:inherit}
a.ref:hover{border-bottom-color:var(--ink);background:rgba(217,184,140,.16)}
a.ref sup{font-size:9px;letter-spacing:.04em;color:var(--gold-d);margin-left:2px;vertical-align:super}
.learn a.ref{border-bottom-color:var(--gold)}
.learn a.ref sup{color:var(--gold)}

/* self-check */
.fab{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:11px 16px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(43,33,23,.28);max-width:calc(100% - 28px)}
@media(min-width:768px){.fab{right:20px;bottom:20px;padding:13px 19px;font-size:13.5px}}
dialog.sheet{border:0;padding:0;border-radius:20px;max-width:620px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(43,33,23,.3)}
dialog.sheet::backdrop{background:rgba(43,33,23,.45)}
.sheet .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 0}
.sheet h2{font-size:23px}
.sheet .close{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:32px;font-size:16px;line-height:1;cursor:pointer;color:var(--ink-3)}
.sheet .body{padding:14px 24px 24px}
.sheet .body p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.sheet ol.check{list-style:none;margin:14px 0;padding:0;counter-reset:c}
.sheet ol.check li{counter-increment:c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;font-size:14.5px;line-height:1.55}
.sheet ol.check li::before{content:counter(c);flex:0 0 auto;width:21px;height:21px;border-radius:999px;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif;color:var(--ink-3)}
.sheet .prog{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);opacity:.8;margin:0 0 10px}
.sheet .wq{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px;color:var(--ink)}
.sheet .opts{display:grid;gap:8px;margin:0 0 4px}
.sheet .opts button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:600 15px/1.3 Inter,sans-serif;color:var(--ink);cursor:pointer}
.sheet .opts button:hover{border-color:var(--gold);background:var(--sand)}
.sheet .mirror{display:grid;gap:10px;margin:14px 0}
@media(min-width:520px){.sheet .mirror{grid-template-columns:1fr 1fr}}
.sheet .mcol{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.sheet .mcol.spirit{background:var(--warm);border-color:var(--warm-line)}
.sheet .mcol h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.sheet .mcol ul{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.sheet .namein{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:500 16px/1.3 Inter,sans-serif;color:var(--ink);background:#fff;margin:4px 0 10px}
.sheet .namein:focus{outline:none;border-color:var(--gold)}
.sheet .privacy{font-size:13px;line-height:1.6;color:var(--ink-3);background:var(--sand);border-radius:12px;padding:11px 13px;margin:0 0 14px}
.sheet .go{background:var(--deep);color:#fff;border:1px solid var(--deep);border-radius:999px;padding:12px 20px;font:600 14.5px/1 Inter,sans-serif;cursor:pointer}
.sheet .ghost{background:none;border:0;padding:10px 2px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-3);cursor:pointer;text-decoration:underline}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.sheet .doors{list-style:none;margin:12px 0 0;padding:0}
.sheet .doors li{padding:4px 0 4px 15px;position:relative;font-size:14.5px;line-height:1.5}
.sheet .doors li:before{content:"\2192";position:absolute;left:0;opacity:.5}
.sheet .close-note{background:var(--warm);border:1px solid var(--warm-line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:#4a3c2b;margin-top:14px}

/* leader */
details.leader{margin-top:34px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
details.leader summary{cursor:pointer;padding:16px 20px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.leader summary::-webkit-details-marker{display:none}
details.leader summary::before{content:"›";display:inline-block;transition:.2s;font-size:19px;color:var(--ink-4)}
details.leader[open] summary::before{transform:rotate(90deg)}
details.leader .lbody{padding:0 20px 20px}
details.leader .lbody p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}

footer.foot{border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:22px 34px;font-size:12px;line-height:1.7;color:var(--ink-4)}
.footin p{margin:0 0 8px}
.footin a{color:var(--ink-3)}
.footin .rights{font-size:11px;line-height:1.6}

@media print{
  header.top,aside,.scroller,.pager,.fab,.crumbs,.ctrl{display:none!important}
  body{background:#fff}
  .card,.learn,.story,.extras,.week,.qs,.pray{box-shadow:none;break-inside:avoid}
  .learn,.qs.group{background:#fff!important;color:#000!important;border:1px solid #ccc!important}
  .learn li,.qs.group li{color:#000!important}
  .learn h3,.qs.group h3{color:#666!important}
}

/* ---- leiersgids ---- */
body{--gp:#2f5d50}
.lbadge{display:inline-flex;align-items:center;gap:7px;background:var(--gp);color:#fff;border-radius:999px;padding:6px 13px;font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.lblock{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 14px 14px 0;padding:15px 17px;margin:18px 0}
.lblock>h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gp);margin:0 0 9px}
.lblock p{font-size:14.7px;line-height:1.72;color:#22322c;margin:0 0 11px}
.lblock p:last-child{margin-bottom:0}
.lblock ul{margin:0 0 11px;padding-left:19px;font-size:14.7px;line-height:1.72;color:#22322c}
.lblock .lbox{background:#fff;border:1px solid #cfe0d9;border-radius:12px;padding:13px 15px;margin:12px 0}
.lblock table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.lblock td{border-bottom:1px solid #d8e6e0;padding:8px 9px;vertical-align:top;line-height:1.55}
.lnote{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0 4px}
.lnote p{font-size:14.4px;line-height:1.7;color:#22322c;margin:0 0 10px}
.lnote p:last-child{margin-bottom:0}
.lnote ul{margin:0 0 10px;padding-left:19px;font-size:14.4px;line-height:1.7;color:#22322c}

<script>
const DATA = {"versions": {"AFR83": {"id": 6, "lang": "af", "name": "Afrikaans 1983"}, "AFR53": {"id": 5, "lang": "af", "name": "Afrikaans 1933/1953"}, "NLV": {"id": 117, "lang": "af", "name": "Nuwe Lewende Vertaling"}, "ESV": {"id": 59, "lang": "en", "name": "English Standard Version"}, "NIV": {"id": 111, "lang": "en", "name": "New International Version"}}, "books": {"af": {"Genesis": "GEN", "Eksodus": "EXO", "Levitikus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Konings": "1KI", "2 Konings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Spreuke": "PRO", "Prediker": "ECC", "Jesaja": "ISA", "Jeremia": "JER", "Matteus": "MAT", "Matthéüs": "MAT", "Markus": "MRK", "Lukas": "LUK", "Johannes": "JHN", "Handelinge": "ACT", "Romeine": "ROM", "1 Korintiërs": "1CO", "2 Korintiërs": "2CO", "Galasiërs": "GAL", "Efesiërs": "EPH", "Filippense": "PHP", "Kolossense": "COL", "1 Timoteus": "1TI", "2 Timoteus": "2TI", "Hebreërs": "HEB", "Jakobus": "JAS", "1 Petrus": "1PE", "2 Petrus": "2PE", "Judas": "JUD", "Openbaring": "REV"}, "en": {"Genesis": "GEN", "Exodus": "EXO", "Leviticus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Kings": "1KI", "2 Kings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Proverbs": "PRO", "Ecclesiastes": "ECC", "Isaiah": "ISA", "Jeremiah": "JER", "Matthew": "MAT", "Mark": "MRK", "Luke": "LUK", "John": "JHN", "Acts": "ACT", "Romans": "ROM", "1 Corinthians": "1CO", "2 Corinthians": "2CO", "Galatians": "GAL", "Ephesians": "EPH", "Philippians": "PHP", "Colossians": "COL", "1 Timothy": "1TI", "2 Timothy": "2TI", "Hebrews": "HEB", "James": "JAS", "1 Peter": "1PE", "2 Peter": "2PE", "Jude": "JUD", "Revelation": "REV"}}, "sessions": [{"n": 5, "id": "s5", "title": {"af": "Seer sonder aanstoot", "en": "Hurt without offence"}, "theme": {"af": "Die derde opsie", "en": "The third option"}, "keyRef": {"af": "1 Petrus 2:23", "en": "1 Peter 2:23"}, "osis": "1PE.2.23", "texts": {"AFR83": "Toe Hy beledig is, het Hy nie terug beledig nie, toe Hy gely het, het Hy nie gedreig nie, maar alles oorgelaat aan Hom wat regverdig oordeel.", "AFR53": "wat, toe Hy uitgeskel is, nie terug uitgeskel het nie; toe Hy gely het, nie gedreig het nie, maar dit oorgegee het aan Hom wat regverdig oordeel", "NLV": "Toe Hy beledig is, het Hy nie terugbeledig nie; toe Hy gely het, het Hy nie gedreig nie. Hy het alles oorgelaat aan God wat altyd regverdig oordeel.", "ESV": "When he was reviled, he did not revile in return; when he suffered, he did not threaten, but continued entrusting himself to him who judges justly.", "NIV": "When they hurled their insults at him, he did not retaliate; when he suffered, he made no threats. Instead, he entrusted himself to him who judges justly."}, "simply": {"af": "Seer gebeur **met** jou. Aanstoot gebeur **in** jou. Die wond is nie 'n keuse nie. Om vas te bly, is.", "en": "Hurt is what happens *to* you. Offence is what happens *in* you. The wound is not a choice. Staying in the trap is."}, "simplyNote": {"af": "", "en": ""}, "meaning": {"af": [{"t": "p", "x": "Let op die woorde *\"alles oorgelaat aan Hom wat regverdig oordeel.\"* Dit is bankterme — jy gee iets vir iemand anders om in bewaring te hou."}, {"t": "p", "x": "Jesus het drie dinge gedoen wat die moeite werd is om uitmekaar te hou. Hy het nie teruggeslaan nie. Hy het nie gemaak asof dit nie gebeur het nie. En Hy het nie self die rekening vereffen nie. Hy het die saak oorhandig aan 'n Regter wat Hy vertrou."}, {"t": "p", "x": "Dit is die derde opsie wat die meeste van ons nie weet ons het nie. Ons dink daar is net twee: slaan terug, of sluk dit. Daar is 'n derde — gee dit oor."}, {"t": "p", "x": "En let op die tydsberekening. *\"Vader, vergeef hulle, want hulle weet nie wat hulle doen nie\"* is gesê terwyl dit nog aan die gebeur was. Nie agterna, toe die pyn bedaar het nie."}, {"t": "p", "x": "Onderliggend is aanstoot 'n vertrouensprobleem. Jy kan die saak net oorgee as jy glo die Regter gaan werklik oordeel. En dít is hoekom aanstoot so moeilik is om in jouself raak te sien: **dit is die een gif wat na geregtigheid smaak.** Dit voel nie soos sonde nie. Dit voel soos 'n skuld wat nog nie vereffen is nie."}, {"t": "p", "x": "Daar is 'n tweede beweging wat die moeite werd is om te noem, want dit maak die pyn kleiner nog voordat jy by die oorgee kom. Psalm 103:14 sê God *\"weet waarvan ons gemaak is, Hy hou dit in gedagte dat ons stof is.\"* Wanneer iemand jou seermaak, kan jy dit lees as *hulle het my kom uithaal* — of as *hulle is stof, net soos ek.* Nie 'n verskoning nie; 'n beskrywing. Jesus het die tweede lesing gekies op die ergste dag van sy lewe: *hulle weet nie wat hulle doen nie.* Jesus het nie beweer of gesê dat sy vyande onskuldig was nie. Hy het gesê hulle is blind. Om mense as blind te lees eerder as as vyande, haal gewig uit die wond nog voordat jy dit êrens heen dra."}], "en": [{"t": "p", "x": "Watch the word *entrusting*. It is a banking word — you hand something over to someone else for safekeeping."}, {"t": "p", "x": "Jesus did three things that are worth separating. He did not hit back. He did not pretend it had not happened. And He did not settle the score Himself. He handed the case to a Judge He trusted."}, {"t": "p", "x": "That is the third option most of us do not know we have. We think there are only two: retaliate, or swallow it. There is a third — transfer."}, {"t": "p", "x": "And notice the timing. *\"Father, forgive them, for they know not what they do\"* was said while it was still happening. Not afterwards, once the pain had faded. While the nails were still going in."}, {"t": "p", "x": "Underneath, offence is a trust problem. You can only hand the case over if you believe the Judge will actually judge. And that is why offence is so hard to see in ourselves: **it is the one poison that tastes like justice.** It does not feel like sin. It feels like a debt that has not been settled yet."}, {"t": "p", "x": "There is a second move worth naming, because it lowers the pain before you even get to the handing over. Psalm 103:14 says God \"knows our frame; he remembers that we are dust.\" When someone wounds you, you can read it as *they came for me* — or you can read it as *they are dust, the same as I am*. Not an excuse; a description. Jesus took the second reading on the worst day of His life: *they do not know what they are doing.* Nobody could seriously claim His executioners were innocent. He was saying they were blind. Reading people as blind rather than as enemies takes weight out of the wound before you carry it anywhere."}]}, "points": {"af": [{"t": "list", "x": ["Daar is 'n derde opsie tussen terugslaan en maak asof dit niks is nie: gee dit oor.", "Jy kan dit net oorgee as jy die Regter vertrou. Dít maak dit 'n geloofsaak, nie 'n temperamentsaak nie.", "Jesus het sag gebly terwyl dit nog aan die gebeur was. Vergifnis het nie gewag dat die pyn ophou nie."]}, {"t": "p", "x": "*(Let op: hierdie sessie gaan oor 'n wond wat jy kan dra. Waar iemand skade aangedoen word, of waar 'n misdaad gepleeg is, vervang \"gee dit vir God oor\" nooit die feit dat jy iemand moet vertel en hulp moet kry nie. Sessie 7 sê meer hieroor.)*"}], "en": [{"t": "list", "x": ["There is a third option between hitting back and pretending it is fine: hand it over.", "You can only hand it over if you trust the Judge. That is what makes this a faith issue, not a temperament issue.", "Jesus stayed soft while it was still happening. Forgiveness did not wait for the pain to stop."]}, {"t": "p", "x": "*(A caution: this session is about a wound you can carry. Where someone is being harmed, or a crime has been committed, \"entrusting it to God\" never replaces telling someone and getting help. Session 7 says more about this.)*"}]}, "story": {"af": [{"t": "p", "x": "Iemand het by die kantoor vertel dat Lerato agter die spanleier se rug oor haar gepraat het."}, {"t": "p", "x": "Sy het nie. Sy het een versigtige sin vir een mens gesê, en teen die tyd dat dit weer by haar uitgekom het, het dit 'n stert en tande gehad."}, {"t": "p", "x": "Sy het daardie aand die boodskap geskryf. Tweehonderd-en-veertig woorde, elkeen daarvan waar, wat presies uiteensit wat sy gesê het en vir wie en wanneer. Sy het dit vier keer gelees. Sy het dit nie gestuur nie."}, {"t": "p", "x": "Nie omdat sy edel was nie. Omdat sy elfuur besef het sy skryf dit om geglo te word, en dat sy niemand kan oortuig nie."}, {"t": "p", "x": "So het sy die enigste ding gedoen wat oorgebly het. Sy het dit hardop in haar kombuis gesê: *\"God, U weet wat ek gesê het. U oordeel dit. Ek dra dit nie.\"*"}, {"t": "p", "x": "Dit het niks reggemaak nie. Twee mense behandel haar vandag nog, twee jaar later, anders. Daar was nooit 'n verskoning nie, want niemand het ooit erken dat hulle dit begin het nie."}, {"t": "p", "x": "Wat sy teruggekry het, was nie haar naam nie. Dit was haar slaap, en die vermoë om daardie twee vroue in die gang te groet sonder dat haar bors toetrek."}, {"t": "p", "x": "Sy kon nie beheer of die waarheid uitkom nie. Sy kon beheer of haar hart oop bly terwyl sy wag."}], "en": [{"t": "p", "x": "Someone told the office that Lerato had been talking about the team leader behind her back."}, {"t": "p", "x": "She had not. She had said one careful sentence to one person, and by the time it came back around it had grown a tail and teeth."}, {"t": "p", "x": "She wrote the message that night. Two hundred and forty words, every one of them true, laying out exactly what she had said and to whom and when. She read it four times. She did not send it."}, {"t": "p", "x": "Not because she was noble. Because at eleven o'clock she realised she was writing it to be believed, and that she could not make anyone believe her."}, {"t": "p", "x": "So she did the only thing left. She said it out loud in her kitchen: *God, You know what I said. You judge this. I am not carrying it.*"}, {"t": "p", "x": "It did not fix anything. Two people still treat her differently, two years on. There was never an apology, because nobody ever admitted to starting it."}, {"t": "p", "x": "What she got back was not her reputation. It was her sleep, and her ability to greet those two women in the passage without her chest going tight."}, {"t": "p", "x": "She could not control whether the truth came out. She could control whether her heart stayed open while she waited."}]}, "extras": {"af": [{"ref": "Jesaja 53:7", "osis": "ISA.53.7", "note": "Stilte is hier nie swakheid nie. Dit is 'n besluit oor wie die saak hanteer."}, {"ref": "Romeine 12:19", "osis": "ROM.12.19", "note": "God hou die reg om te vergeld vir Homself. Dieselfde oorgee, gestel as 'n opdrag."}, {"ref": "Lukas 23:34", "osis": "LUK.23.34", "note": "Jesus se gebed vir dié wat Hom kruisig — gesê tydens, nie agterna nie."}, {"ref": "Psalm 103:14", "osis": "PSA.103.14", "note": "Hoe God mense lees wat Hom in die steek laat."}], "en": [{"ref": "Isaiah 53:7", "osis": "ISA.53.7", "note": "Silence here is not weakness. It is a decision about who is handling the case."}, {"ref": "Romans 12:19", "osis": "ROM.12.19", "note": "God keeps the right to repay for Himself. The same transfer, stated as a command."}, {"ref": "Luke 23:34", "osis": "LUK.23.34", "note": "Jesus' prayer for the men crucifying Him — spoken during, not after."}, {"ref": "Psalm 103:14", "osis": "PSA.103.14", "note": "How God reads people who fail Him."}]}, "week": {"af": [{"t": "p", "x": "**Moenie daarop gaan slaap nie.** Efesiërs 4:26-27: *\"moenie in die son onder gaan oor julle woede nie, en moenie vir die duiwel 'n vastrapplek gee nie.\"* Die woord wat Paulus vir \"vastrapplek\" gebruik is *topos* — 'n plek, 'n kamer. Seer wat voor donker hanteer word, bly 'n wond. Seer wat oornag gedra word, begin 'n kamer in jou bou, en kamers is baie moeiliker om leeg te maak as wonde."}, {"t": "p", "x": "Dus: moenie in die oomblik antwoord nie, en moenie daarmee gaan slaap nie. Iewers tussenin, hardop, in werklike woorde: *\"God, U oordeel dit. Ek dra dit nie.\"*"}], "en": [{"t": "p", "x": "**Do not sleep on it.** Ephesians 4:26-27: *\"do not let the sun go down on your anger, and give no opportunity to the devil.\"* The word Paul uses for opportunity is *topos* — a place, a room. A hurt dealt with before dark stays a wound. A hurt carried overnight starts building a room in you, and rooms are much harder to clear out than wounds."}, {"t": "p", "x": "So: do not reply in the moment, and do not go to bed with it either. Somewhere in between, out loud, in actual words: *\"God, You judge this. I am not carrying it.\"*"}]}, "qhome": {"af": ["Watter saak hou jy nog vas wat jy kon oorgee?", "Glo jy werklik God sal regverdig oordeel — of dink 'n deel van jou dat as jý dit nie vereffen nie, niemand sal nie?", "Waarheen gaan jy eerste as jy seergekry het: na die persoon, na ander mense, of na God?"], "en": ["What case are you still holding that you could hand over?", "Do you really believe God will judge justly — or does part of you think that if you do not settle it, nobody will?", "Where do you go first when you are hurt: to the person, to other people, or to God?"]}, "qgroup": {"af": ["Wat is die verskil tussen om iets vir God oor te gee en om dit net weg te steek? Hoe sou jy van buite af kon sien watter een dit is?", "Jesus het vergewe terwyl dit nog aan die gebeur was. Is dit realisties vir ons, of is dit net vir Hom?", "Waar lê die lyn tussen om nie terug te slaan nie en om 'n deurmat te wees?"], "en": ["What is the difference between entrusting something to God and simply suppressing it? How would you tell them apart from the outside?", "Jesus forgave while it was still happening. Is that realistic for us, or is it only for Him?", "Where is the line between not retaliating and being a doormat?"]}, "prayer": {"af": "*Jesus, U het nie teruggeslaan nie en U het nie gemaak asof nie. Leer my die derde manier. Ek gee hierdie saak vir U — en ek vat dit nie môre terug nie.*", "en": "*Jesus, You did not hit back and You did not pretend. Teach me the third way. I hand this case to You — and I am not taking it back tomorrow.*"}}], "selfcheck": {"af": {"intro": ["Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Die toets kan dus nie wees \"voel ek aanstoot?\" nie — niemand antwoord dít eerlik nie. Die toets moet oor simptome gaan.", "Paulus lys hulle in Galasiërs 5:19-21, en langs verse 22-23 gelees werk dit soos 'n diagnose. Aan die een kant: vyandskap, twis, jaloesie, woede-uitbarstings, selfsug, tweedrag, verdeeldheid. Aan die ander kant: liefde, blydskap, vrede, geduld, vriendelikheid. Jy kan nie in albei tegelyk wandel nie. As die eerste lys is wat opkom wanneer jy aan 'n bepaalde mens dink, sit jou voet in die strik — hoe goed jou saak ook al is.", "**Ses eerlike vrae. Kies een mens en antwoord vir hulle.**"], "questions": ["Wanneer hulle naam opkom, wat gebeur in jou bors?", "As jy hulle in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie vertel aan iemand wat dit nie hoef te gehoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir hulle?", "Kan jy God hardop, by die naam, vir hulle dank en dit bedoel?", "Kan jy in 'n vertrek sit en hoor hoe hulle geprys word sonder om 'n \"maar\" by te sit?"], "close": "**As verskeie van dié raak vat:** jy is nie 'n slegte mens nie en jy is waarskynlik nie verkeerd oor die feite nie. Jy is in 'n strik. Om reg te wees is wat die meeste mense daarin hou. Gaan terug na sessie 5 (gee die saak oor), sessie 6 (gaan na hulle), of sessie 7 (skrap die skuld) — watter een jy ook al vermy het."}, "en": {"intro": ["The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel *right*. So the test cannot be \"am I offended?\" — nobody answers that honestly. The test has to be about symptoms.", "Paul lists them in Galatians 5:19-21, and read side by side with verses 22-23 they work as a diagnostic. On the one side: enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions. On the other: love, joy, peace, patience, kindness. You cannot walk in both at once. If the first list is what comes up when you think of a particular person, your foot is in the trap, however good your case is.", "**Six honest questions. Pick one person and answer for them.**"], "questions": ["When their name comes up, what happens in your chest?", "If you saw them in the shop, would you turn down a different aisle?", "Have you told the story to someone who did not need to hear it?", "Do you find yourself hoping something goes slightly wrong for them?", "Can you thank God for them out loud, by name, and mean it?", "Could you sit in a room and hear them praised without adding a \"but\"?"], "close": "**If several of those land:** you are not a bad person and you are probably not wrong about the facts. You are in a trap. Being right is what keeps most people in it. Go back to Session 5 (hand the case over), Session 6 (go to them), or Session 7 (cancel the debt) — whichever one you have been avoiding."}}, "check": {"af": {"step": "Stap", "of": "van", "mirrorTitle": "Eers die spieël", "mirrorLead": "Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Daarom kan die toets nie wees \"voel ek aanstoot?\" nie. Niemand antwoord dít eerlik nie.", "mirrorLead2": "Paulus gee vir ons 'n ander soort toets. Hy sit twee lyste langs mekaar in Galasiërs 5:19-23. Jy kan nie in albei tegelyk loop nie. Kyk watter lys opkom wanneer jy aan een bepaalde mens dink.", "fleshTitle": "Die vlees", "flesh": ["vyandskap", "twis", "jaloesie", "woede-uitbarstings", "selfsug", "tweedrag", "verdeeldheid"], "spiritTitle": "Die Gees", "spirit": ["liefde", "blydskap", "vrede", "geduld", "vriendelikheid", "goedhartigheid", "getrouheid"], "mirrorClose": "Hierdie toets vra nie of jou saak goed is nie. Dit vra net wat in jou gebeur.", "go": "Ek is gereed", "nameTitle": "Wie is die mens?", "nameLead": "Dink aan een mens. Tik hulle naam, of laat dit leeg as jy liewer nie wil nie.", "namePlaceholder": "Naam", "namePrivacy": "Wat jy hier tik bly op jou foon. Dit word nêrens gestoor of gestuur nie, ook nie op hierdie toestel nie. Maak die blad toe en dit is weg.", "nameSkip": "iemand", "start": "Begin", "yes": "Ja", "unsure": "Nie seker", "no": "Nee", "back": "Terug", "q": ["Wanneer {n} se naam opkom, trek iets in jou bors saam?", "As jy {n} in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie oor {n} vertel aan iemand wat dit nie hoef te hoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir {n}?", "Sukkel jy om God hardop vir {n} te dank, by die naam, en dit te bedoel?", "Sukkel jy om te hoor hoe {n} geprys word sonder om 'n \"maar\" by te sit?"], "resultTitle": "Wat dit aandui", "r0": "Niks hier dui daarop dat jy met {n} vasgevang is nie. Dit is goeie nuus, en dit is die moeite werd om dit so te hou.\n\nAs 'n ander naam by jou opgekom het terwyl jy die vrae gelees het, doen die toets weer vir daardie mens. Dít is gewoonlik die een.", "r1": "Daar is iets hier, maar dit is nog vroeg. Op hierdie stadium is dit klein genoeg om te hanteer sonder dat iemand anders eers hoef te weet.\n\nDit is presies die oomblik waar 'n mens dit gewoonlik laat lê, en dit is presies hoekom dit later 'n muur word.", "r2": "Jou voet is in die strik.\n\nJy is nie 'n slegte mens nie, en jy is waarskynlik nie verkeerd oor die feite nie. Om reg te wees is juis wat die meeste mense daarin hou.", "door6": "Jy praat **oor** {n} eerder as **met** {n}. Begin by sessie 6.", "door7": "Jy hou 'n rekening oop wat jy kan skrap. Begin by sessie 7.", "door5": "Jy dra 'n saak wat jy kan oorgee. Begin by sessie 5.", "alsoTitle": "Die drie deure", "also": ["Sessie 5 — gee die saak oor", "Sessie 6 — gaan na hulle toe", "Sessie 7 — skrap die skuld"], "again": "Doen dit weer", "close": "Maak toe"}, "en": {"step": "Step", "of": "of", "mirrorTitle": "The mirror first", "mirrorLead": "The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel **right**. So the test cannot be \"am I offended?\" Nobody answers that one honestly.", "mirrorLead2": "Paul gives us a different kind of test. He puts two lists side by side in Galatians 5:19-23. You cannot walk in both at once. Watch which list comes up when you think of one particular person.", "fleshTitle": "The flesh", "flesh": ["enmity", "strife", "jealousy", "fits of anger", "rivalries", "dissensions", "divisions"], "spiritTitle": "The Spirit", "spirit": ["love", "joy", "peace", "patience", "kindness", "goodness", "faithfulness"], "mirrorClose": "This test does not ask whether your case is good. It only asks what is happening in you.", "go": "I am ready", "nameTitle": "Who is the person?", "nameLead": "Think of one person. Type their name, or leave it blank if you would rather not.", "namePlaceholder": "Name", "namePrivacy": "What you type stays on your phone. It is not stored or sent anywhere, not even on this device. Close the page and it is gone.", "nameSkip": "someone", "start": "Start", "yes": "Yes", "unsure": "Not sure", "no": "No", "back": "Back", "q": ["When {n}'s name comes up, does something tighten in your chest?", "If you saw {n} in the shop, would you turn down a different aisle?", "Have you told the story about {n} to someone who did not need to hear it?", "Do you ever hope something goes slightly wrong for {n}?", "Do you struggle to thank God out loud for {n}, by name, and mean it?", "Do you struggle to hear {n} praised without adding a \"but\"?"], "resultTitle": "What this points to", "r0": "Nothing here suggests you are caught with {n}. That is good news, and it is worth keeping that way.\n\nIf another name came to mind while you were reading the questions, run it again for that person. That is usually the one.", "r1": "There is something here, but it is early. At this stage it is small enough to deal with before anyone else needs to know about it.\n\nThis is exactly the point where people leave it, and exactly why it becomes a wall later.", "r2": "Your foot is in the trap.\n\nYou are not a bad person, and you are probably not wrong about the facts. Being right is what keeps most people in it.", "door6": "You are talking **about** {n} rather than **to** {n}. Start at session 6.", "door7": "You are holding an account open that you could cancel. Start at session 7.", "door5": "You are carrying a case you could hand over. Start at session 5.", "alsoTitle": "The three doors", "also": ["Session 5 — hand the case over", "Session 6 — go to them", "Session 7 — cancel the debt"], "again": "Run it again", "close": "Close"}}, "leader": {"af": ["**Oor sessie 4.** Dit is die sessie waar iemand dalk vir die eerste keer hardop sê dat hulle kwaad is vir God. Moenie dit regmaak nie, moenie God verdedig nie, en moenie vinnig na die volgende vraag beweeg nie. Jesus het Johannes nie berispe omdat hy gevra het nie. Die vertrek moet ook nie.", "**Oor sessie 7.** Onderrig oor vergifnis is waar 'n groep werklike skade kan doen sonder om dit te bedoel. Twee reëls: niemand word ooit gesê om volgens 'n tydtafel te vergewe nie, en niemand word ooit gesê dat vergewe beteken jy gaan terug nie. As iemand in die groep mishandeling of 'n misdaad openbaar, gaan dit na 'n leier en na die owerhede. Sê dit van voor af, eerder as om dit in 'n voetnoot te laat.", "**Oor Andrew Selley se twee boodskappe.** Die strikbeeld, die spooknet, die bysteek en \"die pyn volg die perspektief\", die sononder-reël, die Galasiërs 5-diagnose en Absalom kom uit sy tweede boodskap, *Hurt but Not Offended*. Drie dinge is doelbewus van die studieblad af weggelaat:", "- **Sy vertelling van 'n vrou wat deur verskeie mans aangerand is en hulle een vir een vergewe het terwyl dit gebeur.** Dit dra die punt, maar die blad word alleen gelees, op 'n foon, deur tieners sowel as volwassenes, met geen leier in die vertrek nie. Die beginsel staan sonder dit.\n- **\"Trust isn't earned, it's given.\"** Net so gelaat, plaas dit mense terug binne bereik van dié wat hulle skade aangedoen het. Sessie 7 behou die liefde en voeg Johannes 2:24 by.\n- **\"Jesus never had to forgive anybody\"** — die argument dat \"Vader, vergeef hulle\" voorbidding was eerder as vergifnis. Verdedigbaar, maar dit is 'n fyn onderskeid wat meer in verwarring gaan kos as wat dit in presiesheid wen. Sessie 5 rus op 1 Petrus 2:23, wat niemand betwis nie.", "Die frase \"'n onaanstootlike kerk\" in sessie 8 is ook syne — dit is hoe hy die hele reeks raam. Iewers in die agt weke werd om van voor af te sê, want dit is die studie se eie beginsel op homself toegepas: *ons kan nie die aanstoot van die evangelie verwyder nie — maar ons wil dit in liefde en versigtigheid oorbring.*"], "en": ["**On Session 4.** This is the session where someone may say out loud, for the first time, that they are angry with God. Do not fix it, do not defend God, and do not move quickly to the next question. Jesus did not rebuke John for asking. The room should not either.", "**On Session 7.** Forgiveness teaching is where a group can do real damage without meaning to. Two rules to hold: nobody is ever told to forgive on a timetable, and nobody is ever told that forgiving means going back. If someone discloses abuse or a crime in the group, that goes to a leader and to the proper authorities. Say that from the front rather than leaving it in a footnote.", "**On Andrew Selley's two messages.** The trap image, the ghost net, the bee sting and \"the pain follows the perspective\", the sundown rule, the Galatians 5 diagnostic and Absalom all come from his part-two message, *Hurt but Not Offended*. Three things were deliberately left out of the study page:", "- **His account of a woman assaulted by several men, forgiving them as it happened.** It carries the point, but the study page is read alone, on a phone, by teenagers as well as adults, with no leader in the room. The principle stands without it.\n- **\"Trust isn't earned, it's given.\"** Held as-is, it puts people back within reach of those who harmed them. Session 7 keeps the love and adds John 2:24.\n- **\"Jesus never had to forgive anybody\"** — the argument that \"Father, forgive them\" was intercession rather than forgiveness. It is a defensible reading, but it is a fine distinction that will cost more in confusion than it gains in precision. Session 5 rests on 1 Peter 2:23, which nobody disputes.", "The phrase \"an unoffendable church\" in Session 8 is also his — it is how he frames the whole series. Worth saying from the front at some point in the eight weeks, because it is the study's own principle turned on itself: *we cannot remove the offence of the gospel — but we must not be recklessly careless where it is not necessary.*"]}};
const GUIDE = {"sessions": [{"n": 5, "lead": {"af": [{"t": "p", "x": "**1 Petrus 2:23** · die derde opsie"}], "en": [{"t": "p", "x": "**1 Peter 2:23** · the third option"}]}, "before": {"af": [{"t": "p", "x": "Die meeste mense dink daar is twee maniere om op onreg te antwoord: slaan terug, of sluk dit. Hierdie sessie noem 'n derde — gee dit oor. *Toevertrou* is 'n bankwoord. Jy gee iets vir iemand anders om veilig te bewaar."}, {"t": "p", "x": "Jesus het drie afsonderlike dinge gedoen. Hy het nie teruggeslaan nie. Hy het nie gemaak of dit nie gebeur het nie. En Hy het nie self die rekening vereffen nie."}, {"t": "p", "x": "Die sin wat gewoonlik die meeste werk doen in die vertrek: **aanstoot is die een gif wat na geregtigheid smaak.** Dit voel nie soos sonde nie. Dit voel soos 'n rekening wat nog nie betaal is nie. Dít is hoekom mense wat daarin is, laaste weet."}, {"t": "p", "x": "Leer die tweede stap behoorlik, want dit verlaag die pyn nog voordat enige oorgee gebeur. Psalm 103:14 *(in die sessie)* — Hy weet waarvan ons gemaak is, Hy hou dit in gedagte dat ons stof is. Jy kan 'n wond lees as *hulle het vir my gekom*, of as *hulle is stof, net soos ek*. Jesus het die tweede lesing gevat op die ergste dag van sy lewe: hulle weet nie wat hulle doen nie. Niemand kon beweer sy beulle was onskuldig nie. Hy het gesê hulle is blind."}, {"t": "p", "x": "**Waar dit skeefloop:** die vertrek hoor \"gee dit oor\" as \"moenie iets daaraan doen nie\", wat die teenoorgestelde van die volgende sessie is. Sê dus vroeg wat kom:"}, {"t": "box", "x": ["**Sessie 6** is die gesprek self — gaan na die mens, alleen, eerste, en hoe om oorsien van vermy te onderskei.", "**Sessie 7** is om die skuld te skrap, en die drie grense oor wat vergifnis nié beteken nie."]}, {"t": "p", "x": "So stap niemand vanaand uit met die idee dat die studie hulle sê om 'n voetveeg te wees nie. Dit sê vir hulle wat om met hulle hart te doen terwyl hulle twee weke wag vir die res."}], "en": [{"t": "p", "x": "Most people think there are two ways to answer being wronged: hit back, or swallow it. This session names a third — hand it over. *Entrusting* is a banking word. You give something to somebody else to keep safe."}, {"t": "p", "x": "Jesus did three separate things. He did not hit back. He did not pretend it had not happened. And He did not settle the score Himself."}, {"t": "p", "x": "The sentence that usually does the most work in the room: **offence is the one poison that tastes like justice.** It does not feel like sin. It feels like a bill that has not been paid yet. That is why people in it are the last to know."}, {"t": "p", "x": "Teach the second move properly, because it lowers the pain before any handing over happens. Psalm 103:14 *(in the session)* — *He knows our frame; He remembers that we are dust.* You can read a wound as *they came for me*, or as *they are dust, the same as I am*. Jesus took the second reading on the worst day of His life: they do not know what they are doing. Nobody could claim His executioners were innocent. He was saying they were blind."}, {"t": "p", "x": "**Where it goes wrong:** the room hears \"hand it over\" as \"do nothing about it\", which is the opposite of the next session. So say early what is coming:"}, {"t": "box", "x": ["**Session 6** is the conversation itself — go to the person, alone, first, and how to tell overlooking from avoiding.", "**Session 7** is cancelling the debt, and the three limits on what forgiveness does not mean."]}, {"t": "p", "x": "That way nobody leaves tonight thinking the study is telling them to be a doormat. It is telling them what to do with their heart while they wait two weeks for the rest."}]}, "qhome": {"af": [{"q": "Watter saak hou jy nog vas wat jy kan oorgee?", "note": [{"t": "p", "x": "Die woord *saak* doen werklike werk. Dit suggereer bewyse, 'n verhoor, 'n uitspraak wat verlang word. Die meeste mense kan hulle s'n dadelik noem."}]}, {"q": "Glo jy regtig God sal regverdig oordeel — of dink 'n deel van jou dat as jy dit nie vereffen nie, niemand sal nie?", "note": [{"t": "p", "x": "Dit is die eerlike vloer van die sessie. Baie min mense antwoord dit as 'n vraag oor teologie. Die meeste antwoord dit as 'n belydenis."}]}, {"q": "Waarheen gaan jy eerste wanneer jy seerkry: na die mens, na ander mense, of na God?", "note": [{"t": "p", "x": "Die antwoord is byna altyd \"ander mense\", en om dit hardop te sê is ongemaklik genoeg om nuttig te wees. Dit stel Sessie 6 op."}]}], "en": [{"q": "What case are you still holding that you could hand over?", "note": [{"t": "p", "x": "The word *case* does real work. It suggests evidence, a hearing, a verdict wanted. Most people can name theirs straight away."}]}, {"q": "Do you really believe God will judge fairly — or does part of you think that if you do not settle it, nobody will?", "note": [{"t": "p", "x": "This is the honest floor of the session. Very few people answer it as a question about theology. Most answer it as a confession."}]}, {"q": "Where do you go first when you are hurt: to the person, to other people, or to God?", "note": [{"t": "p", "x": "The answer is almost always \"other people\", and saying it out loud is uncomfortable enough to be useful. It sets up Session 6."}]}]}, "qgroup": {"af": [{"q": "Wat is die verskil tussen om iets aan God oor te gee en om dit net weg te druk? Hoe sou jy van buite af sien?", "note": [{"t": "p", "x": "Wegdruk ontken wat gebeur het. Oorgee benoem dit akkuraat en gee die uitspraak weg."}, {"t": "p", "x": "Drie tekens wat die groep werklik kan gebruik:"}, {"t": "p", "x": "Iemand wat dit oorgegee het, kan beskryf wat gebeur het — sonder sagte woorde, sonder hitte — en kan ook sê wat hy wou hê. Iemand wat dit wegdruk, kan óf glad nie daaroor praat nie, óf praat heeltyd daaroor met dieselfde lading elke keer."}, {"t": "p", "x": "Oorgee lewer gewone kontak op. Lerato kan daardie twee vroue in die gang groet. Wegdruk lewer roetebeplanning op."}, {"t": "p", "x": "En oorgee kan hardop gesê word: *God, U oordeel dit, ek dra dit nie.* Wegdruk kan nie hardop gesê word nie, want om dit te sê sou die ding werklik maak."}, {"t": "p", "x": "*Die moeite werd om by te voeg:* jy moet dit gewoonlik meer as een keer oorgee. Om dit terug te vat is normaal. Die praktyk is om dit weer oor te gee, nie om dit volmaak oor te gee nie."}]}, {"q": "Jesus het vergewe terwyl dit nog aan die gang was. Is dit realisties vir ons, of net vir Hom?", "note": [{"t": "p", "x": "Albei, eerlik gesê, en die groep verdien albei helftes."}, {"t": "p", "x": "Dit is nie uniek aan Christus nie. Stefanus het dit gedoen in **Handelinge 7:60** *(net in hierdie gids)*, onder die klippe: *\"Here, moet hulle tog nie hierdie sonde toereken nie!\"* Stefanus was 'n mens soos ons. Dit is dus moontlik."}, {"t": "p", "x": "Maar dit is vrug, nie tegniek nie. Dit groei uit 'n gevestigde vertroue in die Regter, en daardie vertroue word lank voor die krisis gebou, nie tydens dit opgeroep nie."}, {"t": "p", "x": "*Let op:* iemand wat dit hoor as 'n standaard om te haal — *ek moet dadelik vergewe of ek het gefaal.* Keer dit. Wat die sessie werklik vra, is die sononder-reël van Efesiërs 4:26 *(in die sessie)* — voor donker, nie voordat jy dit gevoel het nie."}]}, {"q": "Waar lê die streep tussen om nie terug te slaan nie en om 'n voetveeg te wees?", "note": [{"t": "p", "x": "Om nie terug te slaan nie gaan oor **wie die rekening vereffen**. Om 'n voetveeg te wees gaan oor **of jy die waarheid praat**. Twee verskillende vrae, en die vertrek het hulle gewoonlik aanmekaar geplak."}, {"t": "p", "x": "Jesus is die model vir albei tegelyk. Hy het nie teruggeslaan nie — en in **Johannes 18:23** *(net in hierdie gids)*, geslaan deur 'n beampte, sê Hy: *\"As wat Ek gesê het, verkeerd was, sê dan wat was verkeerd; maar as dit reg was, waarom slaan jy My?\"* Hy het dit benoem. Hy het dit nie vergeld nie."}, {"t": "p", "x": "Jy mag dus die onreg benoem, vra dat dit ophou, en jouself uit skade uit kry, en steeds nie vergeld nie. Die voetveeg-fout is om oor die feite stil te word. Die wraak-fout is om die uitspraak in eie hande te neem."}]}], "en": [{"q": "What is the difference between handing something to God and just pushing it down? How would you tell from the outside?", "note": [{"t": "p", "x": "Pushing it down denies what happened. Handing it over names it accurately and gives away the verdict."}, {"t": "p", "x": "Three signs the group can actually use:"}, {"t": "p", "x": "Someone who has handed it over can describe what happened plainly — no soft words, no heat — and can also say what they wanted. Someone pushing it down either cannot talk about it at all, or talks about it constantly with the same charge every time."}, {"t": "p", "x": "Handing it over produces ordinary contact. Lerato can greet those two women in the corridor. Pushing it down produces route planning."}, {"t": "p", "x": "And handing it over can be said out loud: *God, You judge this, I am not carrying it.* Pushing it down cannot be said out loud, because saying it would make the thing real."}, {"t": "p", "x": "*Worth adding:* you usually have to hand it over more than once. Taking it back is normal. The practice is handing it over again, not handing it over perfectly."}]}, {"q": "Jesus forgave while it was still happening. Is that realistic for us, or only for Him?", "note": [{"t": "p", "x": "Both, honestly, and the group deserves both halves."}, {"t": "p", "x": "It is not unique to Christ. Stephen did it in **Acts 7:60** *(only in this guide)*, under the stones: *\"Lord, do not hold this sin against them.\"* Stephen was a man like us. So it is possible."}, {"t": "p", "x": "But it is fruit, not technique. It grows out of a settled trust in the Judge, and that trust is built long before the crisis, not summoned during it."}, {"t": "p", "x": "*Watch for:* someone hearing this as a standard to perform — *I must forgive instantly or I have failed.* Head that off. What the session actually asks for is the sundown rule of Ephesians 4:26 *(in the session)* — before dark, not before you have felt it."}]}, {"q": "Where is the line between not hitting back and being a doormat?", "note": [{"t": "p", "x": "Not hitting back is about **who settles the score**. Being a doormat is about **whether you tell the truth**. Two different questions, and the room usually has them stuck together."}, {"t": "p", "x": "Jesus is the model on both at once. He did not hit back — and in **John 18:23** *(only in this guide)*, struck by an official, He said: *\"If what I said is wrong, bear witness about the wrong; but if what I said is right, why do you strike me?\"* He named it. He did not repay it."}, {"t": "p", "x": "So you may name the wrong, ask for it to stop, and get yourself out of harm, and still not be repaying. The doormat mistake is going silent about the facts. The revenge mistake is taking the verdict into your own hands."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Het iemand al iets oorgegee en dit die volgende oggend teruggevat? Wat het jou dit laat terugvat?\"*"}], "en": [{"t": "p", "x": "*\"Has anyone ever handed something over and then taken it back the next morning? What made you take it back?\"*"}]}, "title": "Seer sonder aanstoot  ·  Hurt without offence"}]};

 af:{lib:"Biblioteek",home:"Tuis",eyebrow:"Studie van 8 sessies",
     title:"Om Aanstoot te Neem",sub:"Die strik van aanstoot — en die pad daaruit",

let lang = "af", ver = "AFR83", cur = 5;

/* ---------- scripture reference linking ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const bookRe = {};
for (const L of ["af","en"]) {
  const names = Object.keys(DATA.books[L]).sort((a,b)=>b.length-a.length)
    .map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  bookRe[L] = new RegExp("(?:\\b)("+names.join("|")+")\\s+(\\d+)(?::(\\d+(?:[–-]\\d+)?))?(?!\\d)","g");
}
const verseIndex = {};
DATA.sessions.forEach(s=>{
  const add=(o,n)=>{ if(o && !(o in verseIndex)) verseIndex[o]=n; };
  add(s.osis, s.n);
  ["af","en"].forEach(L=>s.extras[L].forEach(x=>add(x.osis, s.n)));
});
const bibleUrl = osis => "https://www.bible.com/bible/"+DATA.versions[ver].id+"/"+osis;

function linkRefs(html, sessionN){
  const parts = html.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<[^>]+>)/g);
  return parts.map(seg=>{
    if (!seg || seg[0]==="<") return seg;
    return seg.replace(bookRe[lang], (m, book, ch, v) => {
      const code = DATA.books[lang][book];
      if (!code) return m;
      const osis = code+"."+ch+(v?"."+v:"");
      const key  = code+"."+ch+(v?"."+v.split(/[–-]/)[0]:"");
      const tgt  = verseIndex[key];
      if (tgt && tgt !== sessionN)
        return '<a class="ref" href="#s'+tgt+'" title="'+T[lang].seeS+' '+tgt+'">'+m+'<sup>S'+tgt+'</sup></a>';
      return '<a class="ref" href="'+bibleUrl(osis)+'" target="_blank" rel="noopener" title="'+DATA.versions[ver].name+'">'+m+'<sup>↗</sup></a>';
    });
  }).join("");
}

/* ---------- inline markdown ---------- */
function md(s, sessionN){
  let h = esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[(.+?)\]\((#?[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return linkRefs(h, sessionN);
}
const blocks = (arr, n) => arr.map(b=>{
  if (b.t==="box")  return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  if (b.t==="list") return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  return "<p>"+md(b.x,n)+"</p>";
}).join("");

/* ---------- render ---------- */
function renderChrome(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = T[lang][el.dataset.t]; });
  document.getElementById("fab").textContent = T[lang].fab;
  document.getElementById("footNote").textContent = T[lang].foot;
  document.getElementById("fabIntro").innerHTML = T[lang].fabIntro+' <button class="link" data-check>'+T[lang].fabDo+" →</button>";
  document.getElementById("btnAF").setAttribute("aria-pressed", lang==="af");
  document.getElementById("btnEN").setAttribute("aria-pressed", lang==="en");
  document.getElementById("verBox").innerHTML = Object.keys(DATA.versions)
    .map(k=>'<button data-v="'+k+'" aria-pressed="'+(k===ver)+'" title="'+DATA.versions[k].name+'">'+k+"</button>").join("");
  document.querySelectorAll("#verBox button").forEach(b=>b.onclick=()=>{ ver=b.dataset.v; render(); });

  const nav = DATA.sessions.map(s=>
    '<button class="navbtn" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'"><span class="row">'+
    '<span class="num">'+s.n+'</span><span class="t"><b>'+esc(s.title[lang])+"</b><span>"+esc(s.keyRef[lang])+"</span></span></span></button>").join("");
  document.getElementById("nav").innerHTML = nav;
  document.getElementById("chips").innerHTML = DATA.sessions.map(s=>
    '<button class="chip" data-n="'+s.n+'" aria-current="'+(s.n===cur)+'">'+s.n+". "+esc(s.title[lang])+"</button>").join("");
  document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>go(+b.dataset.n));

  document.getElementById("leaderBody").innerHTML = DATA.leader[lang].map(p=>"<p>"+md(p,0)+"</p>").join("");
}


const G = GUIDE.sessions.find(x=>x.n===SESSION);
function gtable(rows,n){
  const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
  return "<table>"+body.map(r=>{
    const cells=r.replace(/^\||\|$/g,"").split("|");
    return "<tr>"+cells.map(c=>"<td>"+md(c.trim(),n)+"</td>").join("")+"</tr>";
  }).join("")+"</table>";
}
function gblocks(arr,n){
  return (arr||[]).map(b=>
    b.t==="box"   ? '<div class="lbox">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>" :
    b.t==="list"  ? "<ul>"+b.x.map(p=>"<li>"+md(p,n)+"</li>").join("")+"</ul>" :
    b.t==="table" ? gtable(b.x,n) :
                    "<p>"+md(b.x,n)+"</p>").join("");
}
function gnote(key,i){
  const arr=(G[key]&&G[key][lang])||[]; const it=arr[i];
  if(!it) return "";
  return '<div class="lnote">'+gblocks(it.note,SESSION)+"</div>";
}
function gextras(key,from){
  const arr=(G[key]&&G[key][lang])||[];
  if(arr.length<=from) return "";
  return arr.slice(from).map(it=>'<div class="lnote gextra"><p><b>'+esc(it.q)+"</b></p>"+gblocks(it.note,SESSION)+"</div>").join("");
}
function gopen(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.before)+"</h4>"+
    gblocks((G.lead&&G.lead[lang])||[],SESSION)+
    gblocks((G.before&&G.before[lang])||[],SESSION)+"</div>";
}
function gquiet(){
  const L=LS[lang];
  return '<div class="lblock"><h4>'+esc(L.quiet)+"</h4>"+gblocks((G.quiet&&G.quiet[lang])||[],SESSION)+"</div>";
}

function renderSession(){
  const s = DATA.sessions.find(x=>x.n===cur), n = s.n, t = T[lang];
  const pts = s.points[lang];
  const list = pts.find(b=>b.t==="list") || {x:[]};
  const caveat = pts.filter(b=>b.t!=="list").map(b=>'<p class="caveat">'+md(b.x,n)+"</p>").join("");
  const storyLead = s.story[lang].filter(b=>b.t==="p" && b.x.startsWith("*("));
  const storyRest = s.story[lang].filter(b=>!(b.t==="p" && b.x.startsWith("*(")));

  document.getElementById("session").innerHTML =
  '<div class="shead"><div><div class="skicker"><span class="lbadge">'+esc(LS[lang].kicker)+'</span> &nbsp;'+t.sess+" "+n+'</div><h2>'+esc(s.title[lang])+"</h2>"+
    '<div class="theme">'+esc(s.theme[lang])+"</div></div></div>"+gopen()+

  '<div class="card"><div class="inner">'+
    '<div class="klabel"><span class="l">'+t.key+'</span><span class="r">'+esc(s.keyRef[lang])+"</span></div>"+
    '<blockquote class="verse">'+esc(s.texts[ver])+"</blockquote>"+
    '<div class="vbar">'+Object.keys(DATA.versions).map(k=>'<button data-vv="'+k+'" aria-pressed="'+(k===ver)+'">'+k+"</button>").join("")+
      '<a class="open" href="'+bibleUrl(s.osis)+'" target="_blank" rel="noopener">'+t.open+" ↗</a></div>"+
  "</div></div>"+

  '<p class="simply">'+md(s.simply[lang],n)+"</p>"+
  (s.simplyNote[lang] ? '<p class="simplynote">'+md(s.simplyNote[lang],n)+"</p>" : "")+

  '<h3 class="sec">'+(lang==="af"?"Betekenis":"Meaning")+'</h3><div class="prose lead-prose">'+blocks(s.meaning[lang],n)+"</div>"+

  '<div class="learn" style="margin-top:24px"><h3>'+t.learn+"</h3><ol>"+
    list.x.map(p=>"<li><span>"+md(p,n)+"</span></li>").join("")+"</ol>"+caveat+"</div>"+

  '<div class="story" style="margin-top:18px"><h3><i>✦</i>'+t.story+"</h3>"+
    storyLead.map(b=>'<p class="lead">'+md(b.x,n)+"</p>").join("")+
    storyRest.map(b=> b.t==="box"
      ? '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>"
      : "<p>"+md(b.x,n)+"</p>").join("")+"</div>"+

  '<div class="extras" style="margin-top:18px"><h3>'+t.extras+"</h3>"+
    s.extras[lang].map(x=>'<div class="ex"><div class="top"><b>'+esc(x.ref)+"</b>"+
      '<a href="'+bibleUrl(x.osis)+'" target="_blank" rel="noopener">'+ver+" ↗</a></div><p>"+md(x.note,n)+"</p></div>").join("")+
  "</div>"+

  '<div class="week" style="margin-top:18px"><h3>'+t.week+'</h3><div class="prose">'+blocks(s.week[lang],n)+"</div></div>"+

  '<div class="qs" style="margin-top:18px"><h3>'+t.qhome+'</h3><p class="hint">'+t.qhomeHint+"</p><ol>"+
    s.qhome[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qhome",i)+"</li>").join("")+gextras("qhome",s.qhome[lang].length)+"</ol>"+
    '<div class="selfstrip"><span>'+t.fabPrompt+'</span><button data-check>'+t.fabDo+"</button></div></div>"+

  '<div class="qs group" style="margin-top:14px"><h3>'+t.qgroup+'</h3><p class="hint">'+t.qgroupHint+"</p><ol>"+
    s.qgroup[lang].map((q,i)=>"<li><span>"+md(q,n)+"</span>"+gnote("qgroup",i)+"</li>").join("")+gextras("qgroup",s.qgroup[lang].length)+"</ol></div>"+

  '<div class="pray" style="margin-top:18px"><h3>'+t.pray+"</h3><p>"+md(s.prayer[lang].x||s.prayer[lang],n)+"</p></div>"+gquiet()+'<div class="printbar"><button onclick="window.print()">'+esc(LS[lang].print)+'</button><a href="../">'+esc(LS[lang].back)+"</a></div>"+

  '<div class="pager"><button '+(n===1?"disabled":"")+' id="prev">← '+t.prev+"</button>"+
    '<span class="count">'+n+" / 8</span>"+
    '<button class="next" '+(n===8?"disabled":"")+' id="next">'+t.next+" →</button></div>";

  document.querySelectorAll("[data-vv]").forEach(b=>b.onclick=()=>{ ver=b.dataset.vv; render(); });
  const p=document.getElementById("prev"), nx=document.getElementById("next");
  if(p) p.onclick=()=>go(cur-1);
  if(nx) nx.onclick=()=>go(cur+1);
}

let chk={step:0,name:"",ans:[]};
function chkName(){ return chk.name.trim() || DATA.check[lang].nameSkip; }
function renderSheet(){
  const k=DATA.check[lang], body=document.getElementById("sheetBody");
  document.getElementById("sheetTitle").textContent = T[lang].fab;
  const nm=esc(chkName());
  let h="";
  if(chk.step===0){
    h='<p class="prog">'+k.step+" 1 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.mirrorTitle)+"</h3>"+
      "<p>"+md(k.mirrorLead,0)+"</p><p>"+md(k.mirrorLead2,0)+"</p>"+
      '<div class="mirror"><div class="mcol"><h4>'+esc(k.fleshTitle)+"</h4><ul>"+
      k.flesh.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div>"+
      '<div class="mcol spirit"><h4>'+esc(k.spiritTitle)+"</h4><ul>"+
      k.spirit.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul></div></div>"+
      "<p>"+md(k.mirrorClose,0)+"</p>"+
      '<div class="row"><button class="go" data-cstep="1">'+esc(k.go)+" →</button></div>";
  } else if(chk.step===1){
    h='<p class="prog">'+k.step+" 2 "+k.of+" 8</p>"+
      "<h3 class=\"wq\">"+esc(k.nameTitle)+"</h3>"+
      "<p>"+md(k.nameLead,0)+"</p>"+
      '<input class="namein" id="cname" maxlength="40" autocomplete="off" placeholder="'+esc(k.namePlaceholder)+'" value="'+esc(chk.name)+'">'+
      '<div class="privacy">'+esc(k.namePrivacy)+"</div>"+
      '<div class="row"><button class="go" data-cstart>'+esc(k.start)+' →</button><button class="ghost" data-cstep="0">'+esc(k.back)+"</button></div>";
  } else if(chk.step>=2 && chk.step<=7){
    const i=chk.step-2;
    h='<p class="prog">'+k.step+" "+(chk.step+1)+" "+k.of+" 8</p>"+
      '<h3 class="wq">'+esc(k.q[i]).replace(/\{n\}/g,"<b>"+nm+"</b>")+"</h3>"+
      '<div class="opts">'+
        '<button data-cans="1">'+esc(k.yes)+"</button>"+
        '<button data-cans="0.5">'+esc(k.unsure)+"</button>"+
        '<button data-cans="0">'+esc(k.no)+"</button></div>"+
      '<div class="row"><span></span><button class="ghost" data-cstep="'+(chk.step-1)+'">'+esc(k.back)+"</button></div>";
  } else {
    const sc=chk.ans.reduce((a,b)=>a+b,0);
    const band = sc<1 ? "r0" : (sc<2.5 ? "r1" : "r2");
    let door="";
    if(band!=="r0"){
      door = chk.ans[2]===1 ? k.door6 : ((chk.ans[3]===1||chk.ans[4]===1) ? k.door7 : k.door5);
    }
    h='<h3 class="wq">'+esc(k.resultTitle)+"</h3>"+
      k[band].split("\n\n").map(p=>"<p>"+md(p.replace(/\{n\}/g,chkName()),0)+"</p>").join("")+
      (door?'<div class="close-note">'+md(door.replace(/\{n\}/g,chkName()),0)+"</div>":"")+
      (band==="r0"?"":'<p class="prog" style="margin:18px 0 2px">'+esc(k.alsoTitle)+"</p>"+
        '<ul class="doors">'+k.also.map((x,i)=>'<li><a href="#s'+(i+5)+'">'+esc(x)+"</a></li>").join("")+"</ul>")+
      '<div class="row"><button class="go" data-cstep="0">'+esc(k.again)+'</button><button class="ghost" data-cclose>'+esc(k.close)+"</button></div>";
  }
  body.innerHTML=h;
  const inp=document.getElementById("cname");
  if(inp){ inp.oninput=e=>{chk.name=e.target.value;}; setTimeout(()=>inp.focus(),30); }
}
function openCheck(){ chk={step:0,name:"",ans:[]}; renderSheet(); sheet.showModal(); }

function render(){ renderChrome(); renderSession(); if(sheet && sheet.open) renderSheet(); }

function go(n, push=true){
  if(n<1||n>8) return;
  cur=n;
  if(push){ try{ if(location.hash!=="#s"+n) history.replaceState(null,"","#s"+n); }catch(e){} }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("btnAF").onclick=()=>{ lang="af"; if(DATA.versions[ver].lang!=="af") ver="AFR83"; render(); };
document.getElementById("btnEN").onclick=()=>{ lang="en"; if(DATA.versions[ver].lang!=="en") ver="ESV";   render(); };

const sheet=document.getElementById("sheet");
document.addEventListener("click",e=>{ if(e.target.closest("[data-check]")) openCheck(); });
document.getElementById("fab").onclick=openCheck;
document.getElementById("sheetClose").onclick=()=>sheet.close();
sheet.addEventListener("click",function(e){
  const st=e.target.closest("[data-cstep]");
  if(st){ chk.step=+st.dataset.cstep; if(chk.step<2) chk.ans=[]; renderSheet(); return; }
  if(e.target.closest("[data-cstart]")){ chk.step=2; chk.ans=[]; renderSheet(); return; }
  const an=e.target.closest("[data-cans]");
  if(an){ chk.ans[chk.step-2]=parseFloat(an.dataset.cans); chk.step++; renderSheet(); return; }
  if(e.target.closest("[data-cclose]")) sheet.close();
});
sheet.addEventListener("click",e=>{ if(e.target===sheet) sheet.close(); });

document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#s"]');
  if(a){ const n=+a.getAttribute("href").slice(2); if(n>=1&&n<=8){ e.preventDefault(); if(sheet.open) sheet.close(); go(n); } }
});
window.addEventListener("hashchange",()=>{ try{ const m=location.hash.match(/^#s([1-8])$/); if(m) go(+m[1],false); }catch(e){} });

(function init(){
  try{
    const m=location.hash.match(/^#s([1-8])$/); if(m) cur=+m[1];
    const q=new URLSearchParams(location.search);
    if((q.get("lang")||"").toLowerCase()==="en"){ lang="en"; ver="ESV"; }
  }catch(e){}
  render();
})();
</script>
