*Watch for:* if the group is honest, someone will realise they are describing this group. Let that sit. Do not rescue it."}]}, {"q": "Why does the same comment hurt on one day and not another?", "note": [{"t": "p", "x": "Because the comment is the trigger, not the cause. The things that change are the three the session names — sleep, food, time with God — plus history, which is Marlene."}, {"t": "p", "x": "There is an uncomfortable point here, and it is worth saying. If my reaction changes while the words stay the same, then most of the reaction is about me. That is not something to be ashamed of. It is the diagnosis that makes change possible, because I cannot control their words and I can do something about the root."}]}, {"q": "Hebrews does not say \"try harder\" — it says do not fall short of grace. What does that look like on a Wednesday?", "note": [{"t": "p", "x": "Look at the verb: *fails to obtain*. It is a failure to go and get, not a failure to try. Grace is a supply, not a mood."}, {"t": "p", "x": "So the practical question is: what is my actual way of getting grace mid-week? If the only answer is Sunday, the root has six days to itself."}, {"t": "p", "x": "The session gives three questions to use as a gate before any decision made when you are running on empty:"}, {"t": "box", "x": ["**Have I slept? Have I eaten? Have I been with God?**", "If two of the three are no, do not decide today. Get grace first, then decide."]}, {"t": "p", "x": "Two other answers usually come up in the room, and both are good. Take grace in before you need it, rather than only in a crisis. And have somewhere to put things — a person you can say it out loud to before it hardens."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Het iemand hier al ooit uitgevind dat wat jou laat ontplof het, byna niks met die mens voor jou te doen gehad het nie?\"*"}], "en": [{"t": "p", "x": "*\"Has anyone here ever found out that what set you off had almost nothing to do with the person in front of you?\"*"}]}, "title": "Die wortel  ·  The root"}, {"n": 3, "lead": {"af": [{"t": "p", "x": "**1 Korintiërs 1:23** · dieselfde woord, nou oor die evangelie"}], "en": [{"t": "p", "x": "**1 Corinthians 1:23** · the same word, now used of the gospel"}]}, "before": {"af": [{"t": "p", "x": "Dit is die draai in die studie, en dit is die sessie wat die maklikste misbruik word. Lei dit versigtig."}, {"t": "p", "x": "Tot nou toe was aanstoot 'n probleem om weg te kry. Paulus gebruik nou presies dieselfde woord — *skandalon* — vir die een boodskap wat hy weier om te verander. Daar is twee soorte aanstoot: die soort wat ek moet verwyder, en die soort wat ek nooit mag verwyder nie."}, {"t": "p", "x": "**Wys op die Afrikaans.** AFR83 vertaal 1 Korintiërs 1:23 met *aanstoot* — dieselfde alledaagse woord wat die studie gebruik vir wat tussen jou en jou broer gebeur. Engels het twee woorde nodig, *offence* en *stumbling block*, om die skakel te wys. Afrikaans sit dit reguit op die bladsy. Gebruik dit."}, {"t": "p", "x": "**Waar dit skeefloop:** iemand gebruik \"die evangelie gee aanstoot\" as dekmantel om onbeskof te wees. Dit is die algemeenste misbruik van die sessie, en dit is die moeite werd om dit voor die gesprek te noem eerder as agterna. Paulus het hard gewerk om elke aanstoot te verwyder wat hy kon — *\"Moenie aanstoot gee nie, nie aan Jode of aan Grieke of aan die gemeente van God nie\"* — en toe hierdie een geweier. Albei helftes is Paulus."}, {"t": "p", "x": "Oom Danie is 'n goeie man, en dít is die punt van hom. Moenie toelaat dat die groep hom as 'n waarskuwing behandel nie. Hy is die meeste van ons."}], "en": [{"t": "p", "x": "This is the turn in the study, and it is the session most likely to be misused. Lead it carefully."}, {"t": "p", "x": "Until now offence has been a problem to get rid of. Paul now uses the very same word — *skandalon* — for the one message he refuses to change. There are two kinds of offence: the kind I must remove, and the kind I must never remove."}, {"t": "p", "x": "**Point at the Afrikaans.** AFR83 translates 1 Corinthians 1:23 with *aanstoot* — the same everyday word the study has been using for what happens between you and your brother. English needs two words, *offence* and *stumbling block*, to show the link. Afrikaans puts it right there on the page. Use it."}, {"t": "p", "x": "**Where it goes wrong:** somebody uses \"the gospel offends\" as cover for being rude. This is the most common misuse of the session, and it is worth naming before the discussion rather than after. Paul worked hard to remove every offence he could — *\"give no offence to Jews or to Greeks or to the church of God\"* — and then refused to remove this one. Both halves are Paul."}, {"t": "p", "x": "Oom Danie is a good man, and that is the point of him. Do not let the group treat him as a warning. He is most of us."}]}, "qhome": {"af": [{"q": "Wanneer laas het die evangelie **jou** aanstoot gegee?", "note": [{"t": "p", "x": "Baie sal sê nooit, en vir die meeste van hulle is dit nie 'n goeie teken nie. Dit beteken gewoonlik die evangelie het 'n stel standpunte geword eerder as iets met 'n aanspraak op hulle. As dit in die vertrek opkom, wees saggies. Dit is nie 'n gebrek aan geloof nie. Dit is wat gebeur wanneer iets bekend word."}]}, {"q": "Is daar iemand wie se vergifnis deur God jy moeilik aanvaar?", "note": [{"t": "p", "x": "Die eerlike antwoorde is spesifiek, en hulle skok dikwels die mens wat hulle sê. Dit is Oom Danie se vraag."}]}, {"q": "Waar wil jy nog iets bydra tot jou eie redding?", "note": [{"t": "p", "x": "Luister vir die woord *maar*. *Ek weet dit is genade, maar ek dien al dertig jaar.* Daardie \"maar\" is die hele vraag."}]}], "en": [{"q": "When did the gospel last offend *you* personally?", "note": [{"t": "p", "x": "Many will say never, and for most of them that is not a good sign. It usually means the gospel has become a set of positions rather than something with a claim on them. If it comes up in the room, be gentle. It is not a failure of faith. It is what happens when something becomes familiar."}]}, {"q": "Is there someone whose forgiveness by God you find hard to accept?", "note": [{"t": "p", "x": "The honest answers are specific, and they often shock the person saying them. This is Oom Danie's question."}]}, {"q": "Where do you still want to add something to your own salvation?", "note": [{"t": "p", "x": "Listen for the word *but*. *I know it is grace, but I have served for thirty years.* That \"but\" is the whole question."}]}]}, "qgroup": {"af": [{"q": "Paulus het elke aanstoot weggevat wat hy kon, en toe hierdie een geweier. Hoe onderskei ons vandag tussen die twee?", "note": [{"t": "p", "x": "Die toets wat werk: **lê die aanstoot in die boodskap, of in hoe ons dit oordra?**"}, {"t": "p", "x": "Die evangelie se eie aanstoot is dat jy jouself nie kan red nie, en dat Jesus nie een pad tussen ander is nie. Alles anders is ons s'n en kan gaan: ons toon, ons binnehuise woorde, ons gewoontes, ons styl, ons politiek, ons onbeskoftheid."}, {"t": "p", "x": "Hier is 'n reël om vir die groep te gee. *As om dit weg te vat sou verander wat 'n mens moet glo om gered te word, mag jy dit nie wegvat nie. As om dit weg te vat net ons gemak of gewoonte kos, vat dit weg.*"}, {"t": "p", "x": "Paulus doen albei. **1 Korintiërs 9:22** *(net in hierdie gids)* — *\"Vir almal het ek alles geword om in elk geval sommige te red.\"* En **Galasiërs 5:11** *(in die sessie)* — as hy nog besnydenis verkondig het, is *\"die kruis as struikelblok mos uit die weg geruim.\"* Dieselfde man, dieselfde leeftyd."}]}, {"q": "Hoekom is genade juis vir goeie mense aanstootlik?", "note": [{"t": "p", "x": "Omdat genade hulle moeite op nul prys, en hulle het meer moeite belê as die meeste."}, {"t": "p", "x": "Die aanstoot is nie eintlik teen barmhartigheid nie. Dit is teen barmhartigheid wat **gelyk** is. In Matteus 20 is die klagte nie dat hulle te min betaal is nie. Dit is dat die ander dieselfde gekry het. Oom Danie se sin is presies: *een-en-vyftig jaar, en hy kry dieselfde as ek.* Die ouer broer in Lukas 15 verlaat nooit die plaas nie en gaan nooit die huis binne nie."}, {"t": "p", "x": "Die moeite werd om by te voeg, sodat die vertrek nie verhewe voel nie: genade gee aanstoot aan die godsdienstige instink in almal, nie net in sigbaar goeie mense nie. Elke ander stelsel wat mense gebou het, loop op verdien. Genade is die een ding wat niemand sou uitgedink het nie."}]}, {"q": "Hoe sou 'n kerk lyk wat die aanstoot van die Kruis verwyder het? Sou ons dit van binne af agterkom?", "note": [{"t": "p", "x": "Dit sou suksesvol lyk. Vol, warm, goed bestuur, vriendelik, en bemoedigend."}, {"t": "p", "x": "Die verwydering word nooit aangekondig nie. Dit gebeur deur dinge uit te laat. Sonde word nie meer benoem nie. Bekering word nie meer gevra nie. Die Kruis word 'n prentjie van hoe lief God ons het in plaas van 'n betaling vir skuld. Jesus word 'n voorbeeld in plaas van 'n plaasvervanger. Elke enkele stap voel na pastorale sensitiwiteit."}, {"t": "p", "x": "Sou ons dit agterkom? Waarskynlik nie, want die getalle word beter. Een toets van binne af: loop enigiemand ooit weg oor wat ons leer? Jesus het mense in Johannes 6 laat wegstap. 'n Kerk waarvan niemand ooit wegstap nie, sê dalk eenvoudig niks waaroor besluit moet word nie."}, {"t": "p", "x": "*Let op:* hierdie vraag word baie vinnig selfvoldaan — *nie soos daardie kerke daar onder in die straat nie.* Draai dit binnetoe die oomblik as dit begin. **Waar het óns dit sagter gemaak?**"}]}], "en": [{"q": "Paul removed every offence he could, then refused to remove this one. How do we tell them apart today?", "note": [{"t": "p", "x": "The test that works: **is the offence in the message, or in the way we deliver it?**"}, {"t": "p", "x": "The gospel's own offence is that you cannot save yourself, and that Jesus is not one road among several. Everything else is ours and can go: our tone, our in-house words, our habits, our style, our politics, our rudeness."}, {"t": "p", "x": "Here is a rule you can hand the group. *If taking it away would change what a person has to believe to be saved, you may not take it away. If taking it away only costs us comfort or habit, take it away.*"}, {"t": "p", "x": "Paul does both. **1 Corinthians 9:22** *(only in this guide)* — *\"I have become all things to all people, that by all means I might save some.\"* And **Galatians 5:11** *(in the session)* — if he still preached circumcision, *\"the offence of the cross has been removed.\"* Same man, same lifetime."}]}, {"q": "Why is grace offensive to good people in particular?", "note": [{"t": "p", "x": "Because grace prices their effort at zero, and they have more effort invested than most."}, {"t": "p", "x": "The offence is not really at mercy. It is at mercy being **equal**. In Matthew 20 the complaint is not that they were underpaid. It is that the others were paid the same. Oom Danie's sentence is exact: *fifty-one years, and he gets the same thing I get.* The older brother in Luke 15 never leaves the property and never goes into the house."}, {"t": "p", "x": "Worth adding, so the room does not feel superior: grace offends the religious instinct in everybody, not just visibly good people. Every other system humans have built runs on earning. Grace is the one thing nobody would have invented."}]}, {"q": "What would a church look like that had removed the offence of the Cross? Would we notice from the inside?", "note": [{"t": "p", "x": "It would look successful. Full, warm, well run, kind, and encouraging."}, {"t": "p", "x": "The removal is never announced. It happens by leaving things out. Sin stops being named. Repentance stops being asked for. The Cross becomes a picture of how much God loves us instead of a payment for guilt. Jesus becomes an example instead of a substitute. Every single step feels like being pastorally sensitive."}, {"t": "p", "x": "Would we notice? Probably not, because the numbers get better. One test from the inside: does anybody ever leave because of what we teach? Jesus let people walk away in John 6. A church that nobody ever walks away from may simply not be saying anything that has to be decided about."}, {"t": "p", "x": "*Watch for:* this question turns smug very fast — *not like those churches down the road.* Turn it inwards the moment it starts. **Where have we softened it?**"}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"As iemand jou vanaand vra wat hy moet doen om gered te word, wat sou jy sê — en watter deel van daardie antwoord sou 'n ordentlike mens aanstoot gee?\"*"}], "en": [{"t": "p", "x": "*\"If someone asked you tonight what they must do to be saved, what would you say — and which part of that answer would offend a decent person?\"*"}]}, "title": "Die aanstoot van die Kruis  ·  The offence of the Cross"}, {"n": 4, "lead": {"af": [{"t": "p", "x": "**Matteus 11:6** · die aanstoot wat niemand hardop sê nie"}], "en": [{"t": "p", "x": "**Matthew 11:6** · the offence nobody says out loud"}]}, "before": {"af": [{"t": "p", "x": "Lees die waarskuwing weer. Dit is die sessie waar iemand dalk vir die eerste keer hardop sê dat hy kwaad is vir God. Moenie dit regmaak nie. Moenie God verdedig nie. Moenie vinnig aanbeweeg nie."}, {"t": "p", "x": "**Kyk watter Bybel mense lees.** AFR83 het *\"gelukkig is elkeen wat nie aan My begin twyfel nie\"* — wat nie aan My begin **twyfel** nie. Dit is 'n billike lesing van Johannes se situasie, maar dit laat die aanstoot-woord val. En dit is die een vers in die hele studie waar die aanstoot op Jesus gemik is. AFR53 en AFR20 hou dit: *\"wat aan My nie aanstoot neem nie.\"* Sê dit hardop in die vertrek. Party mense se Bybels bevat nie die woord waaroor die hele aand gaan nie."}, {"t": "p", "x": "Let op wie vra. Johannes het Hom gedoop. Johannes het die Gees sien neerdaal. Johannes het gesê *\"Dáár is die Lam van God.\"* En Johannes sit nou in 'n sel en vra of hy dit verkeerd gehad het. As Johannes mag vra, mag enigiemand."}, {"t": "p", "x": "**Waar dit skeefloop:** die vertrek vul die stilte. Iemand bied 'n vers aan, of 'n storie oor hoe God dit uiteindelik uitgewerk het. Albei is goed bedoel en albei maak die deur toe. Jou werk in hierdie sessie is grootliks om dít nie te doen nie, en om te sorg dat niemand anders dit ook doen nie."}, {"t": "p", "x": "Elsabé se storie is doelbewus stil. Aanstoot teenoor God lyk selde soos woede. Dit lyk plat."}], "en": [{"t": "p", "x": "Read the warning again. This is the session where someone may say, for the first time, that they are angry with God. Do not fix it. Do not defend God. Do not move on quickly."}, {"t": "p", "x": "**Check which Bible people are reading.** AFR83 has *\"gelukkig is elkeen wat nie aan My begin twyfel nie\"* — who does not begin to **doubt** me. That is a fair reading of John's situation, but it drops the offence word. And this is the one verse in the whole study where the offence is aimed at Jesus. AFR53 and AFR20 keep it: *\"wat aan My nie aanstoot neem nie.\"* Say this out loud in the room. Some people's Bibles do not contain the word the whole evening is about."}, {"t": "p", "x": "Notice who is asking. John baptised Him. John saw the Spirit come down. John said *\"Behold, the Lamb of God.\"* And John is now in a cell asking whether he got it wrong. If John may ask, anyone may."}, {"t": "p", "x": "**Where it goes wrong:** the room fills the silence. Somebody offers a verse, or a story about how God worked it out in the end. Both are kindly meant and both shut the door. Your job in this session is mostly to not do that, and to make sure nobody else does either."}, {"t": "p", "x": "Elsabé's story is quiet on purpose. Offence at God rarely looks like anger. It looks flat."}]}, "qhome": {"af": [{"q": "Is daar iets wat jy vir God gevra het wat Hy nie gedoen het nie — en het jy dit al ooit vir Hom gesê?", "note": [{"t": "p", "x": "Die meeste mense het die eerste helfte en nie die tweede nie. Die tweede helfte is die punt van die week."}]}, {"q": "Waar het jy stilweg jou verwagting van God laer gestel om jouself te beskerm?", "note": [{"t": "p", "x": "Dit is die Elsabé-vraag. Die antwoorde is selde dramaties. Hulle het opgehou bid vir een spesifieke ding, of vir mense in die algemeen, of vir een soort gebed."}]}, {"q": "Wat het jy verwag Jesus sou wees, wat Hy nie was nie?", "note": [{"t": "p", "x": "Johannes se verwagting was nie verkeerd nie. Dit was onvolledig. Hy het 'n byl by die wortel verkondig en 'n Messias gekry wat vreemdelinge genees en hom in 'n tronk gelos het. Die meeste teleurstellings met God het daardie vorm — nie 'n gebreekte belofte nie, 'n gedeeltelike prentjie."}]}], "en": [{"q": "Is there something you asked God for that He did not do — and have you ever said that to Him?", "note": [{"t": "p", "x": "Most people have the first half and not the second. The second half is the point of the week."}]}, {"q": "Where have you quietly lowered what you expect from God, to protect yourself?", "note": [{"t": "p", "x": "This is the Elsabé question. The answers are rarely dramatic. They stopped praying for one particular thing, or for people in general, or for one kind of prayer."}]}, {"q": "What did you expect Jesus to be, that He has not been?", "note": [{"t": "p", "x": "John's expectation was not wrong. It was incomplete. He preached an axe laid to the root and got a Messiah who healed strangers and left him in prison. Most disappointments with God are that shape — not a broken promise, a partial picture."}]}]}, "qgroup": {"af": [{"q": "Jesus het Johannes nie berispe omdat hy gevra het nie. Wat sê dit vir ons oor eerlike twyfel in hierdie groep?", "note": [{"t": "p", "x": "Dat twyfel wat hardop gesê word, veiliger is as twyfel wat wegkruip. En dat om te vra jou nie diskwalifiseer nie. In die volgende asem sê Jesus dat niemand groter as Johannes gebore is nie — **Matteus 11:11** *(net in hierdie gids)*. Die lof en die vraag sit langs mekaar."}, {"t": "p", "x": "Let ook op *hóé* Hy antwoord. Met bewyse. Nie met 'n bestrawwing en nie met gerusstelling nie. Hy stuur 'n lys terug van wat werklik gebeur. Hy sê nie vir Johannes om meer geloof te hê nie en Hy verduidelik nie die tronk nie."}, {"t": "p", "x": "Vir hierdie groep is die punt prakties. Die vertrek moet kan hoor *\"ek weet nie meer of Hy antwoord nie\"* sonder om te vlinker, sonder om 'n vers uit te haal, en sonder om dit reg te maak."}, {"t": "p", "x": "*Dit is die enigste ding in hierdie gids wat ek 'n reël sal noem:* wanneer dit kom, sê 'n oomblik lank niks. Sê dan dankie dat hulle dit gesê het."}]}, {"q": "Hoekom is aanstoot teenoor God soveel moeiliker om te erken as aanstoot teenoor 'n mens?", "note": [{"t": "p", "x": "Drie redes, en dit help om hulle uitmekaar te haal."}, {"t": "p", "x": "Dit voel soos godslastering. Om dit hardop te sê klink soos 'n beskuldiging teen God, so dit bly binne."}, {"t": "p", "x": "Daar is geen proses voor nie. Matteus 18 sê hoe om na 'n broer te gaan. Daar is geen ooreenstemmende proses om 'n klagte na God te neem nie, so mense besluit daar is niks te doen nie."}, {"t": "p", "x": "En dit bedreig wie jy is. *As ek kwaad is vir God, wat maak dit van my?* Vir iemand wie se hele lewe binne die kerk is, is daardie vraag duur."}, {"t": "p", "x": "So dit gaan ondergronds, en dit kom uit as laer verwagtings in plaas van woede. Daarom is die teken nie afwesigheid nie. Dit is platheid."}]}, {"q": "Jesus het mense laat wegstap eerder as om te versag wat Hy gesê het. Wat beteken dit vir hoe ons leer en nooi?", "note": [{"t": "p", "x": "Dit skei getrouheid van resultate. Ons is verantwoordelik om duidelik te wees en vriendelik te wees. Ons is nie verantwoordelik om almal te hou nie."}, {"t": "p", "x": "Twee grense, egter. Dit is nie verlof om onversigtig te wees nie — Sessie 3 se sin staan steeds. En dit is nie verlof om koud te wees nie. Jesus het nie sy skouers opgetrek nie. Hy het na die Twaalf gedraai en gevra of hulle ook wil gaan, wat nie die vraag is van 'n man wat nie omgee nie."}, {"t": "p", "x": "Die nuttige toepassing is 'n vraag oor ons: *wat het ons vermy om in hierdie groep te sê omdat iemand dalk nie sou terugkom nie?*"}]}], "en": [{"q": "Jesus did not tell John off for asking. What does that tell us about honest doubt in this group?", "note": [{"t": "p", "x": "That doubt said out loud is safer than doubt hidden. And that asking does not disqualify you. In the very next breath Jesus says nobody born of women is greater than John — **Matthew 11:11** *(only in this guide)*. The praise and the question sit side by side."}, {"t": "p", "x": "Notice *how* He answers, too. With evidence. Not with a telling-off and not with reassurance. He sends back a list of what is actually happening. He does not tell John to have more faith and He does not explain the prison."}, {"t": "p", "x": "For this group the point is practical. The room has to be able to hear *\"I am not sure He answers any more\"* without flinching, without producing a verse, and without fixing it."}, {"t": "p", "x": "*This is the only thing in this guide I would call a rule:* when it comes, say nothing for a moment. Then thank them for saying it."}]}, {"q": "Why is offence at God so much harder to admit than offence at a person?", "note": [{"t": "p", "x": "Three reasons, and it helps to separate them."}, {"t": "p", "x": "It feels like blasphemy. Saying it out loud sounds like an accusation against God, so it stays in."}, {"t": "p", "x": "There is no procedure for it. Matthew 18 tells you how to go to a brother. There is no matching process for taking a complaint to God, so people decide there is nothing to be done."}, {"t": "p", "x": "And it threatens who you are. *If I am angry at God, what does that make me?* For someone whose whole life is inside the church, that question is expensive."}, {"t": "p", "x": "So it goes underground, and comes out as lowered expectations instead of anger. That is why the sign is not absence. It is flatness."}]}, {"q": "Jesus let people walk away rather than soften what He said. What does that mean for how we teach and invite?", "note": [{"t": "p", "x": "It separates being faithful from getting results. We are responsible for being clear and being kind. We are not responsible for keeping everybody."}, {"t": "p", "x": "Two limits, though. This is not permission to be careless — Session 3's sentence still stands. And it is not permission to be cold. Jesus did not shrug. He turned to the Twelve and asked whether they wanted to go too, which is not the question of a man who did not mind."}, {"t": "p", "x": "The useful application is a question about us: *what have we avoided saying in this group because someone might not come back?*"}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Johannes het sy vraag uit 'n tronksel gevra. Waar sou jy moes wees voordat jy joune hardop vra?\"*"}], "en": [{"t": "p", "x": "*\"John asked his question from a prison cell. Where would you have to be before you asked yours out loud?\"*"}]}, "title": "Aanstoot teenoor Jesus self  ·  Offence at Jesus Himself"}, {"n": 5, "lead": {"af": [{"t": "p", "x": "**1 Petrus 2:23** · die derde opsie"}], "en": [{"t": "p", "x": "**1 Peter 2:23** · the third option"}]}, "before": {"af": [{"t": "p", "x": "Die meeste mense dink daar is twee maniere om op onreg te antwoord: slaan terug, of sluk dit. Hierdie sessie noem 'n derde — gee dit oor. *Toevertrou* is 'n bankwoord. Jy gee iets vir iemand anders om veilig te bewaar."}, {"t": "p", "x": "Jesus het drie afsonderlike dinge gedoen. Hy het nie teruggeslaan nie. Hy het nie gemaak of dit nie gebeur het nie. En Hy het nie self die rekening vereffen nie."}, {"t": "p", "x": "Die sin wat gewoonlik die meeste werk doen in die vertrek: **aanstoot is die een gif wat na geregtigheid smaak.** Dit voel nie soos sonde nie. Dit voel soos 'n rekening wat nog nie betaal is nie. Dít is hoekom mense wat daarin is, laaste weet."}, {"t": "p", "x": "Leer die tweede stap behoorlik, want dit verlaag die pyn nog voordat enige oorgee gebeur. Psalm 103:14 *(in die sessie)* — Hy weet waarvan ons gemaak is, Hy hou dit in gedagte dat ons stof is. Jy kan 'n wond lees as *hulle het vir my gekom*, of as *hulle is stof, net soos ek*. Jesus het die tweede lesing gevat op die ergste dag van sy lewe: hulle weet nie wat hulle doen nie. Niemand kon beweer sy beulle was onskuldig nie. Hy het gesê hulle is blind."}, {"t": "p", "x": "**Waar dit skeefloop:** die vertrek hoor \"gee dit oor\" as \"moenie iets daaraan doen nie\", wat die teenoorgestelde van die volgende sessie is. Sê dus vroeg wat kom:"}, {"t": "box", "x": ["**Sessie 6** is die gesprek self — gaan na die mens, alleen, eerste, en hoe om oorsien van vermy te onderskei.", "**Sessie 7** is om die skuld te skrap, en die drie grense oor wat vergifnis nié beteken nie."]}, {"t": "p", "x": "So stap niemand vanaand uit met die idee dat die studie hulle sê om 'n voetveeg te wees nie. Dit sê vir hulle wat om met hulle hart te doen terwyl hulle twee weke wag vir die res."}], "en": [{"t": "p", "x": "Most people think there are two ways to answer being wronged: hit back, or swallow it. This session names a third — hand it over. *Entrusting* is a banking word. You give something to somebody else to keep safe."}, {"t": "p", "x": "Jesus did three separate things. He did not hit back. He did not pretend it had not happened. And He did not settle the score Himself."}, {"t": "p", "x": "The sentence that usually does the most work in the room: **offence is the one poison that tastes like justice.** It does not feel like sin. It feels like a bill that has not been paid yet. That is why people in it are the last to know."}, {"t": "p", "x": "Teach the second move properly, because it lowers the pain before any handing over happens. Psalm 103:14 *(in the session)* — *He knows our frame; He remembers that we are dust.* You can read a wound as *they came for me*, or as *they are dust, the same as I am*. Jesus took the second reading on the worst day of His life: they do not know what they are doing. Nobody could claim His executioners were innocent. He was saying they were blind."}, {"t": "p", "x": "**Where it goes wrong:** the room hears \"hand it over\" as \"do nothing about it\", which is the opposite of the next session. So say early what is coming:"}, {"t": "box", "x": ["**Session 6** is the conversation itself — go to the person, alone, first, and how to tell overlooking from avoiding.", "**Session 7** is cancelling the debt, and the three limits on what forgiveness does not mean."]}, {"t": "p", "x": "That way nobody leaves tonight thinking the study is telling them to be a doormat. It is telling them what to do with their heart while they wait two weeks for the rest."}]}, "qhome": {"af": [{"q": "Watter saak hou jy nog vas wat jy kan oorgee?", "note": [{"t": "p", "x": "Die woord *saak* doen werklike werk. Dit suggereer bewyse, 'n verhoor, 'n uitspraak wat verlang word. Die meeste mense kan hulle s'n dadelik noem."}]}, {"q": "Glo jy regtig God sal regverdig oordeel — of dink 'n deel van jou dat as jy dit nie vereffen nie, niemand sal nie?", "note": [{"t": "p", "x": "Dit is die eerlike vloer van die sessie. Baie min mense antwoord dit as 'n vraag oor teologie. Die meeste antwoord dit as 'n belydenis."}]}, {"q": "Waarheen gaan jy eerste wanneer jy seerkry: na die mens, na ander mense, of na God?", "note": [{"t": "p", "x": "Die antwoord is byna altyd \"ander mense\", en om dit hardop te sê is ongemaklik genoeg om nuttig te wees. Dit stel Sessie 6 op."}]}], "en": [{"q": "What case are you still holding that you could hand over?", "note": [{"t": "p", "x": "The word *case* does real work. It suggests evidence, a hearing, a verdict wanted. Most people can name theirs straight away."}]}, {"q": "Do you really believe God will judge fairly — or does part of you think that if you do not settle it, nobody will?", "note": [{"t": "p", "x": "This is the honest floor of the session. Very few people answer it as a question about theology. Most answer it as a confession."}]}, {"q": "Where do you go first when you are hurt: to the person, to other people, or to God?", "note": [{"t": "p", "x": "The answer is almost always \"other people\", and saying it out loud is uncomfortable enough to be useful. It sets up Session 6."}]}]}, "qgroup": {"af": [{"q": "Wat is die verskil tussen om iets aan God oor te gee en om dit net weg te druk? Hoe sou jy van buite af sien?", "note": [{"t": "p", "x": "Wegdruk ontken wat gebeur het. Oorgee benoem dit akkuraat en gee die uitspraak weg."}, {"t": "p", "x": "Drie tekens wat die groep werklik kan gebruik:"}, {"t": "p", "x": "Iemand wat dit oorgegee het, kan beskryf wat gebeur het — sonder sagte woorde, sonder hitte — en kan ook sê wat hy wou hê. Iemand wat dit wegdruk, kan óf glad nie daaroor praat nie, óf praat heeltyd daaroor met dieselfde lading elke keer."}, {"t": "p", "x": "Oorgee lewer gewone kontak op. Lerato kan daardie twee vroue in die gang groet. Wegdruk lewer roetebeplanning op."}, {"t": "p", "x": "En oorgee kan hardop gesê word: *God, U oordeel dit, ek dra dit nie.* Wegdruk kan nie hardop gesê word nie, want om dit te sê sou die ding werklik maak."}, {"t": "p", "x": "*Die moeite werd om by te voeg:* jy moet dit gewoonlik meer as een keer oorgee. Om dit terug te vat is normaal. Die praktyk is om dit weer oor te gee, nie om dit volmaak oor te gee nie."}]}, {"q": "Jesus het vergewe terwyl dit nog aan die gang was. Is dit realisties vir ons, of net vir Hom?", "note": [{"t": "p", "x": "Albei, eerlik gesê, en die groep verdien albei helftes."}, {"t": "p", "x": "Dit is nie uniek aan Christus nie. Stefanus het dit gedoen in **Handelinge 7:60** *(net in hierdie gids)*, onder die klippe: *\"Here, moet hulle tog nie hierdie sonde toereken nie!\"* Stefanus was 'n mens soos ons. Dit is dus moontlik."}, {"t": "p", "x": "Maar dit is vrug, nie tegniek nie. Dit groei uit 'n gevestigde vertroue in die Regter, en daardie vertroue word lank voor die krisis gebou, nie tydens dit opgeroep nie."}, {"t": "p", "x": "*Let op:* iemand wat dit hoor as 'n standaard om te haal — *ek moet dadelik vergewe of ek het gefaal.* Keer dit. Wat die sessie werklik vra, is die sononder-reël van Efesiërs 4:26 *(in die sessie)* — voor donker, nie voordat jy dit gevoel het nie."}]}, {"q": "Waar lê die streep tussen om nie terug te slaan nie en om 'n voetveeg te wees?", "note": [{"t": "p", "x": "Om nie terug te slaan nie gaan oor **wie die rekening vereffen**. Om 'n voetveeg te wees gaan oor **of jy die waarheid praat**. Twee verskillende vrae, en die vertrek het hulle gewoonlik aanmekaar geplak."}, {"t": "p", "x": "Jesus is die model vir albei tegelyk. Hy het nie teruggeslaan nie — en in **Johannes 18:23** *(net in hierdie gids)*, geslaan deur 'n beampte, sê Hy: *\"As wat Ek gesê het, verkeerd was, sê dan wat was verkeerd; maar as dit reg was, waarom slaan jy My?\"* Hy het dit benoem. Hy het dit nie vergeld nie."}, {"t": "p", "x": "Jy mag dus die onreg benoem, vra dat dit ophou, en jouself uit skade uit kry, en steeds nie vergeld nie. Die voetveeg-fout is om oor die feite stil te word. Die wraak-fout is om die uitspraak in eie hande te neem."}]}], "en": [{"q": "What is the difference between handing something to God and just pushing it down? How would you tell from the outside?", "note": [{"t": "p", "x": "Pushing it down denies what happened. Handing it over names it accurately and gives away the verdict."}, {"t": "p", "x": "Three signs the group can actually use:"}, {"t": "p", "x": "Someone who has handed it over can describe what happened plainly — no soft words, no heat — and can also say what they wanted. Someone pushing it down either cannot talk about it at all, or talks about it constantly with the same charge every time."}, {"t": "p", "x": "Handing it over produces ordinary contact. Lerato can greet those two women in the corridor. Pushing it down produces route planning."}, {"t": "p", "x": "And handing it over can be said out loud: *God, You judge this, I am not carrying it.* Pushing it down cannot be said out loud, because saying it would make the thing real."}, {"t": "p", "x": "*Worth adding:* you usually have to hand it over more than once. Taking it back is normal. The practice is handing it over again, not handing it over perfectly."}]}, {"q": "Jesus forgave while it was still happening. Is that realistic for us, or only for Him?", "note": [{"t": "p", "x": "Both, honestly, and the group deserves both halves."}, {"t": "p", "x": "It is not unique to Christ. Stephen did it in **Acts 7:60** *(only in this guide)*, under the stones: *\"Lord, do not hold this sin against them.\"* Stephen was a man like us. So it is possible."}, {"t": "p", "x": "But it is fruit, not technique. It grows out of a settled trust in the Judge, and that trust is built long before the crisis, not summoned during it."}, {"t": "p", "x": "*Watch for:* someone hearing this as a standard to perform — *I must forgive instantly or I have failed.* Head that off. What the session actually asks for is the sundown rule of Ephesians 4:26 *(in the session)* — before dark, not before you have felt it."}]}, {"q": "Where is the line between not hitting back and being a doormat?", "note": [{"t": "p", "x": "Not hitting back is about **who settles the score**. Being a doormat is about **whether you tell the truth**. Two different questions, and the room usually has them stuck together."}, {"t": "p", "x": "Jesus is the model on both at once. He did not hit back — and in **John 18:23** *(only in this guide)*, struck by an official, He said: *\"If what I said is wrong, bear witness about the wrong; but if what I said is right, why do you strike me?\"* He named it. He did not repay it."}, {"t": "p", "x": "So you may name the wrong, ask for it to stop, and get yourself out of harm, and still not be repaying. The doormat mistake is going silent about the facts. The revenge mistake is taking the verdict into your own hands."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Het iemand al iets oorgegee en dit die volgende oggend teruggevat? Wat het jou dit laat terugvat?\"*"}], "en": [{"t": "p", "x": "*\"Has anyone ever handed something over and then taken it back the next morning? What made you take it back?\"*"}]}, "title": "Seer sonder aanstoot  ·  Hurt without offence"}, {"n": 6, "lead": {"af": [{"t": "p", "x": "**Matteus 18:15** · gaan, alleen, eerste"}], "en": [{"t": "p", "x": "**Matthew 18:15** · go, alone, first"}]}, "before": {"af": [{"t": "p", "x": "Dit is die praktiese sessie, en dit is die een wat die waarskynlikste iets werklik in iemand se lewe hierdie week laat gebeur. Gee dit ruimte."}, {"t": "p", "x": "Twee dinge staan in die middel. Eers die volgorde: nie na jou vriend nie, nie na die groep nie, nie na die leier nie — na hóm, alleen. Dan die doel: *jy het jou broer teruggewen.* Die woord vir gewen is 'n handelswoord, om wins te maak. Paulus gebruik dieselfde woord vyf keer in 1 Korintiërs 9:19-22 vir mense wen vir Christus. Die doel is die mens, nie die uitspraak nie."}, {"t": "p", "x": "**Die eerste een by die Kruis wen.** Albei paaie eindig by \"jy gaan\" — Matteus 18 as jy verontreg is, Matteus 5:23-24 as jy die onreg gedoen het. Die wedloop is dus nie om eerste verskoning te vra nie. Dit is om eerste by die Kruis te kom, by wat Jesus gedoen het, en van daar af te gaan. Wie eerste daar kom, arriveer nie met 'n saak nie. Hy arriveer met genade wat hy self ontvang het."}, {"t": "p", "x": "Twee grense daarop, en hulle maak saak. **Om eerste te beweeg is nie om eerste skuld te erken nie** — jy gaan om te praat, nie om blaam te vat wat nie joune is nie. En **jy wen nie oor die mens nie, jy wen die mens.** Die oomblik as \"wen\" beteken *ek het bo uitgekom*, het die strik net van vorm verander."}, {"t": "p", "x": "**Waar dit skeefloop:** die groep stap geïnspireerd uit en niemand gaan nie. Sluit af met die sessie se eie opdrag — moenie die gesprek beplan nie, sit net die datum. 'n Datum is 'n baie kleiner vraag as 'n gesprek, en dit is die enigste deel wat voorspel of dit gebeur."}, {"t": "p", "x": "Hennie se storie is doelbewus onbevredigend. Hy het nooit sy geld gekry nie en die ontmoeting het sleg verloop. Moenie daaroor verskoning maak nie. Dit is die eerlike weergawe, en 'n groep wat net die netjiese weergawe gehoor het, gaan nie."}], "en": [{"t": "p", "x": "This is the practical session, and it is the one most likely to make something actually happen in somebody's life this week. Give it room."}, {"t": "p", "x": "Two things sit at the centre. First the order: not to your friend, not to the group, not to the leader — to him, alone. Second the goal: *you have gained your brother.* The word for gained is a trading word, to make a profit. Paul uses the same word five times in 1 Corinthians 9:19-22 for winning people for Christ. The aim is the person, not the verdict."}, {"t": "p", "x": "**The first one to the Cross wins.** Both roads end at \"you go\" — Matthew 18 if you were wronged, Matthew 5:23-24 if you did the wronging. So the race is not to be first to apologise. It is to get to the Cross first, to what Jesus did, and to go from there. Whoever gets there first does not arrive with a case. He arrives with grace he was given himself."}, {"t": "p", "x": "Two guards on that, and they matter. **Moving first is not admitting fault first** — you go to talk, not to take blame that is not yours. And **you do not win over the person, you win the person.** The moment \"win\" means *I came out on top*, the trap has only changed shape."}, {"t": "p", "x": "**Where it goes wrong:** the group leaves inspired and nobody goes. Close with the session's own instruction — do not plan the conversation, just set the date. A date is a much smaller ask than a conversation, and it is the only part that predicts whether it happens."}, {"t": "p", "x": "Hennie's story is deliberately unsatisfying. He never got his money and the meeting went badly. Do not apologise for that. It is the honest version, and a group that has only heard the tidy version will not go."}]}, "qhome": {"af": [{"q": "Is daar iemand na wie jy moet gaan? Wat het jou werklik gekeer?", "note": [{"t": "p", "x": "Die genoemde rede is gewoonlik \"die tydsberekening\". Die werklike rede is gewoonlik die risiko om iets te hoor wat die storie bederf."}]}, {"q": "Wees eerlik: die laaste keer wat jy iets \"oorgesien\" het, was dit genade of was dit vermyding?", "note": [{"t": "p", "x": "'n Toets wat die moeite werd is om deur te gee: oorsien is 'n besluit wat jy een keer neem en dan is dit klaar. Vermyding kom terug en moet elke paar weke weer besluit word."}]}, {"q": "As jy gaan, waarop hoop jy regtig — om reg te wees, of om hulle terug te hê?", "note": [{"t": "p", "x": "Laat hulle dit antwoord voordat hulle gaan, nie daarna nie. Dit verander die gesprek meer as enige raad oor bewoording."}]}], "en": [{"q": "Is there someone you need to go to? What has actually stopped you?", "note": [{"t": "p", "x": "The stated reason is usually \"the timing\". The real reason is usually the risk of hearing something that spoils the story."}]}, {"q": "Be honest: the last time you \"overlooked\" something, was it grace or was it avoidance?", "note": [{"t": "p", "x": "A test worth passing on: overlooking is a decision you make once and it is done. Avoidance keeps coming back and needs deciding again every few weeks."}]}, {"q": "If you went, what would you really be hoping for — to be right, or to have them back?", "note": [{"t": "p", "x": "Get them to answer this before they go, not after. It changes the conversation more than any advice about wording could."}]}]}, "qgroup": {"af": [{"q": "Hoekom gaan ons so dikwels na almal behalwe die mens?", "note": [{"t": "p", "x": "Omdat almal anders met ons saamstem. Om na die mens te gaan sit die storie op die spel. Om na 'n vriend te gaan bevestig dit."}, {"t": "p", "x": "Daar is ook 'n eenvoudige som: die vriend kos niks en die mens kos moed. En daar is 'n stukkie selfbedrog wat die moeite werd is om hardop te noem, want almal in die vertrek het dit al gebruik — ons noem dit verwerk, of raad vra, of 'n gebedsversoek."}, {"t": "p", "x": "'n Toets om huis toe te vat: *sou ek gemaklik wees as daardie mens my sin gehoor het presies soos ek dit gesê het?*"}]}, {"q": "Hoe onderskei ons tussen oorsien-in-genade en vermy-uit-vrees?", "note": [{"t": "p", "x": "Die sessie se reël is die hoofantwoord: **sien oor wanneer die koste net joune is. Konfronteer wanneer dit hulle, die kerk of die evangelie skade doen.**"}, {"t": "p", "x": "Hennie is die toetsgeval, en loop die groep daardeur. Sy stilte het hom agtien duisend rand gekos, wat syne was om te spandeer. Dit het toe 'n jong paartjie veertig duisend gekos, wat nie syne was nie. Sy \"genade\" was eenvoudig goedkoper vir hom as 'n moeilike gesprek."}, {"t": "p", "x": "Nog twee toetse. Oorsien is een keer klaar en bly klaar; vermyding moet weer besluit word. En as jy dit werklik oorgesien het, kan jy vir die mens by die naam bid, warm, hardop. As jy nie kan nie, het jy dit nie oorgesien nie. Jy het dit gebêre."}]}, {"q": "Paulus het Petrus in die openbaar gekonfronteer. Wanneer is openbaar reg, en wanneer is dit net vernedering?", "note": [{"t": "p", "x": "Openbare regstelling pas by openbare skade. Petrus se onttrekking van die tafel met die nie-Joodse gelowiges was 'n openbare daad met leerstellige gevolge, en ander het dit nagevolg — **Galasiërs 2:13** *(net in hierdie gids)* sê selfs Barnabas is meegesleep. Dit is hoekom dit reg was, en hoekom dit openbaar was."}, {"t": "p", "x": "Vier vrae wat die twee uitmekaar haal:"}, {"t": "list", "x": ["Was die onreg self openbaar?", "Duur die skade voort en versprei dit?", "Soek ek die waarheid van die evangelie, of soek ek om reg bewys te word?", "Het ek die privaat pad probeer, waar 'n privaat pad moontlik was?"]}, {"t": "p", "x": "Vernedering is openbare regstelling wat verder gaan as die openbare skade, of wat op die mens se stand mik eerder as op die gedrag."}, {"t": "p", "x": "En die bewys dat Paulus dit reg gehad het, kom jare later. In **2 Petrus 3:15** *(net in hierdie gids)* skryf Petrus oor *\"ons geliefde broer Paulus\"*. Die man wat hom voor almal reggehelp het, noem hy geliefde broer in sy eie brief. Petrus het die regstelling gevat sonder om aanstoot te neem — en dít is die ander helfte van die les, en die helfte wat ons gewoonlik oorslaan."}]}], "en": [{"q": "Why do we so often go to everyone except the person?", "note": [{"t": "p", "x": "Because everybody else agrees with us. Going to the person risks the story. Going to a friend confirms it."}, {"t": "p", "x": "There is also a simple sum: the friend costs nothing and the person costs courage. And there is a bit of self-deception worth naming out loud, because everyone in the room has used it — we call it processing, or asking for advice, or a prayer request."}, {"t": "p", "x": "A test to take home: *would I be comfortable if that person heard my sentence exactly as I said it?*"}]}, {"q": "How do we tell overlooking-in-grace from avoiding-out-of-fear?", "note": [{"t": "p", "x": "The session's rule is the main answer: **overlook when the cost is only yours. Confront when it is harming them, the church, or the gospel.**"}, {"t": "p", "x": "Hennie is the test case, and walk the group through it. His silence cost him eighteen thousand rand, which was his to spend. It then cost a young couple forty thousand, which was not. His \"grace\" was simply cheaper for him than a hard conversation."}, {"t": "p", "x": "Two more tests. Overlooking is finished once and stays finished; avoidance needs re-deciding. And if you have really overlooked it, you can pray for the person by name, warmly, out loud. If you cannot, you have not overlooked it. You have stored it."}]}, {"q": "Paul confronted Peter publicly. When is public right, and when is it just humiliation?", "note": [{"t": "p", "x": "Public correction fits public harm. Peter's withdrawal from eating with the Gentile believers was a public act with doctrinal consequences, and others were copying it — **Galatians 2:13** *(only in this guide)* says even Barnabas was carried along. That is why it was right, and why it was public."}, {"t": "p", "x": "Four questions that sort the two:"}, {"t": "list", "x": ["Was the wrong itself public?", "Is the harm still going on and spreading?", "Am I after the truth of the gospel, or after being proved right?", "Have I tried the private route, where a private route was possible?"]}, {"t": "p", "x": "Humiliation is public correction that goes further than the public harm, or that aims at the person's standing rather than at the behaviour."}, {"t": "p", "x": "And the proof that Paul got it right comes years later. In **2 Peter 3:15** *(only in this guide)* Peter writes about *\"our beloved brother Paul\"*. The man who corrected him in front of everybody, he calls beloved brother in his own letter. Peter took the correction without taking offence — which is the other half of the lesson, and the half we usually skip."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Wat is die kortste ware sin wat jy kan sê om daardie gesprek oop te maak? Nie die hele toespraak nie — net die eerste reël.\"*"}], "en": [{"t": "p", "x": "*\"What is the shortest true sentence you could say to open that conversation? Not the whole speech — just the first line.\"*"}]}, "title": "Gaan na jou broer  ·  Go to your brother"}, {"n": 7, "lead": {"af": [{"t": "p", "x": "**Kolossense 3:13** · gee deur wat jy gekry het"}], "en": [{"t": "p", "x": "**Colossians 3:13** · pass on what you were given"}]}, "before": {"af": [{"t": "p", "x": "**Lees die drie grense hardop voordat die gesprek begin.** Nie daarna nie. Nie as 'n voetnoot nie. Iemand in die vertrek is in 'n situasie waarvan jy nie weet nie, en die volgorde waarin hulle dinge hoor, maak saak."}, {"t": "list", "x": ["**Vergifnis is nie vertroue nie.** Vergifnis skrap 'n skuld. Vertroue is toegang, en toegang word deur veranderde gedrag oor tyd herbou. Jy sal hoor dat liefde alles glo (1 Korintiërs 13:7) en dat vertroue gegee eerder as verdien moet word. Hou dit langs Johannes 2:24 *(in die sessie)*, waar Jesus *\"Hom nie op hulle verlaat het nie, omdat Hy geweet het hoe hulle almal is\"* — dieselfde woord. Hy het almal liefgehad en Homself aan byna niemand toevertrou nie.", "**Vergifnis is nie versoening nie.** Jy kan alleen vergewe. Jy kan nie alleen versoen nie. Dit vat twee, en een van hulle moet berou hê.", "**Vergifnis beteken nooit om terug te gaan in skade in nie.** Waar iemand mishandel, bedreig of misbruik word, word daar op 'n veilige afstand vergewe. Dit vervang nooit om iemand te vertel, hulp te kry, of 'n misdaad aan te meld nie. Voetewassers, nie voetvee nie."]}, {"t": "p", "x": "Die getalle in die gelykenis dra die onderrig. Tien duisend talente is omtrent twee honderd duisend jaar se dagloon — 'n doelbewus belaglike bedrag wat niemand in die vertrek as 'n werklike skuld kan hoor nie. Dit word in een sin geskrap. Die honderd denarii is omtrent drie maande se loon. Regte geld."}, {"t": "p", "x": "En let op waar die gelykenis eindig. Die man word aan die tronkbewaarders oorgegee *totdat hy die hele skuld betaal het*. Onvergewensgesindheid is 'n tronk, en die man wat verontreg is, is die een binne-in. Dieselfde prentjie as Spreuke 18:19: gesluite poorte, gebou deur die veronregte man self."}, {"t": "p", "x": "**Waar dit skeefloop:** iemand stap uit en glo hulle is aangesê om terug te gaan na 'n mens wat hulle seermaak. Of dat hulle lang wag dwaas was. **Kobus het elf jaar gewag** vir een sin van sy broer Willem — *ek moes jou gebel het* — en hy was dit werklik geskuld. Die studie sê nêrens dat hy nie was nie. Wat dit sê, is dat Willem daardie sin nie in hom het nie en nooit gehad het nie, en dat Kobus dus rente betaal het op 'n betaling wat nooit sou opdaag nie."}], "en": [{"t": "p", "x": "**Read the three limits out loud before the discussion starts.** Not after. Not as a footnote. Someone in the room is in a situation you do not know about, and the order in which they hear things matters."}, {"t": "list", "x": ["**Forgiveness is not trust.** Forgiveness cancels a debt. Trust is access, and access is rebuilt by changed behaviour over time. You will hear it said that love always trusts (1 Corinthians 13:7) and that trust should be given rather than earned. Hold that next to John 2:24 *(in the session)*, where Jesus *\"did not entrust himself to them, because he knew all people\"* — the same word. He loved everybody and entrusted Himself to almost nobody.", "**Forgiveness is not reconciliation.** You can forgive on your own. You cannot reconcile on your own. That takes two, and one of them repenting.", "**Forgiveness never means going back into harm.** Where someone is being abused, threatened or used, forgiveness is done from a safe distance. It never replaces telling someone, getting help, or reporting a crime. Foot-washers, not doormats."]}, {"t": "p", "x": "The numbers in the parable carry the teaching. Ten thousand talents is roughly two hundred thousand years of a labourer's wages — a deliberately silly figure that nobody in the room could hear as a real debt. It is cancelled in one sentence. The hundred denarii is about three months' wages. Real money."}, {"t": "p", "x": "And notice where the parable ends. The servant is handed to the jailers *until he should pay all his debt*. Unforgiveness is a prison, and the man who was wronged is the one inside it. Same picture as Proverbs 18:19: barred gates, built by the offended man himself."}, {"t": "p", "x": "**Where it goes wrong:** someone leaves believing they have been told to go back to a person who is hurting them. Or that their long wait was foolish. **Kobus waited eleven years** for one sentence from his brother Willem — *I should have called you* — and he was genuinely owed it. The study never says he was not. What it says is that Willem does not have that sentence in him and never did, so Kobus was charging himself interest on a payment that was never going to arrive."}]}, "qhome": {"af": [{"q": "Wat presies voel jy word jou geskuld? Sê dit in een sin.", "note": [{"t": "p", "x": "Om presies te wees is die punt. *'n Verskoning* is te vaag om te skrap. *Hy moes my gebel het voordat dit voorgelees is* is 'n rekening wat jy werklik kan opskeur."}]}, {"q": "Wag jy vir 'n betaling wat nooit gaan kom nie?", "note": [{"t": "p", "x": "Dit is Kobus in die bakkie by die vulstasie. Dikwels is dit nie wreedheid aan die ander kant nie. Willem het daardie sin eenvoudig nie in hom nie."}]}, {"q": "Wat het God vir jou geskrap waaraan jy byna nooit dink nie?", "note": [{"t": "p", "x": "Die gelykenis se eie vraag, persoonlik gemaak. As die antwoord vinnig en algemeen kom, is dit nie behoorlik gevra nie."}]}], "en": [{"q": "What exactly do you feel you are owed? Say it in one sentence.", "note": [{"t": "p", "x": "Being precise is the point. *An apology* is too vague to cancel. *He should have phoned me before it was read out* is a bill you can actually tear up."}]}, {"q": "Are you waiting for a payment that is never going to arrive?", "note": [{"t": "p", "x": "This is Kobus in the bakkie at the filling station. Often it is not cruelty on the other side. Willem simply does not have that sentence in him."}]}, {"q": "What has God cancelled for you that you almost never think about?", "note": [{"t": "p", "x": "The parable's own question, made personal. If the answer comes quickly and generally, it has not been asked properly."}]}]}, "qgroup": {"af": [{"q": "Jesus het die tweede skuld regte geld gemaak, nie niks nie. Hoekom maak dit soveel saak?", "note": [{"t": "p", "x": "Omdat dit die veronregte mens beskerm daarteen om te hoor dat sy besering klein was."}, {"t": "p", "x": "As Jesus die tweede skuld 'n paar sent gemaak het, sou vergifnis op grootte loop — *dit was mos nie so erg nie* — en almal wie se besering wél erg was, sou uit die onderrig gesluit wees. In plaas daarvan is die grond van vergifnis glad nie die grootte van hulle skuld nie. Dit is die grootte van myne, wat geskrap is. Dít is presies wat Kolossense sê: *soos die Here julle vergewe het, moet julle mekaar ook vergewe.*"}, {"t": "p", "x": "Dit is die pastoraal belangrikste detail in die sessie. Honderd denarii is drie maande se loon. Jesus sê nie dat wat aan jou gedoen is, niks was nie."}]}, {"q": "Wat is die verskil tussen om iemand te vergewe en om hulle weer te vertrou? Kan jy die eerste doen sonder die tweede?", "note": [{"t": "p", "x": "Ja, en dit is die nuttigste onderskeid in die hele studie."}, {"t": "p", "x": "Vergifnis skrap 'n skuld. Vertroue gee toegang. Vergifnis is eensydig en kan vandag gedoen word. Vertroue is tweesydig en word deur veranderde gedrag oor tyd herbou. Johannes 2:24 maak dit uit: dieselfde woord, en Jesus het dit teruggehou terwyl Hy ten volle liefgehad het."}, {"t": "p", "x": "*Dit is die punt in die agt weke waar iemand in 'n moeilike situasie die waarskynlikste gaan praat, of die waarskynlikste baie stil gaan word.* Kyk na die vertrek eerder as na die horlosie."}]}, {"q": "Waar hou vergifnis op om 'n voetveeg te wees? Hoe leer ons albei kante eerlik?", "note": [{"t": "p", "x": "**Vergifnis eindig waar veiligheid begin.** Dit is die kort antwoord en dit is die moeite werd om dit in daardie woorde te sê."}, {"t": "p", "x": "Om albei kante eerlik te leer beteken een ding in die praktyk: die opdrag en die grense word in dieselfde asem gesê, altyd. Nooit in 'n voetnoot nie en nooit in 'n latere sessie nie. 'n Groep wat op een aand \"vergewe soos julle vergewe is\" hoor en die grense 'n maand later, is sleg geleer, ongeag wat uiteindelik gesê is."}, {"t": "p", "x": "En sê die plig om aan te meld reguit, eerder as om daarna te hint."}]}], "en": [{"q": "Jesus made the second debt real money, not nothing. Why does that matter so much?", "note": [{"t": "p", "x": "Because it protects the wronged person from being told their injury was small."}, {"t": "p", "x": "If Jesus had made the second debt a few cents, forgiveness would run on size — *it was not that bad* — and everybody whose injury really was bad would be shut out of the teaching. Instead, the ground of forgiveness is not the size of their debt at all. It is the size of mine, which was cancelled. That is exactly what Colossians says: *as the Lord has forgiven you, so you also must forgive.*"}, {"t": "p", "x": "This is the most pastorally important detail in the session. A hundred denarii is three months' wages. Jesus is not saying what was done to you was nothing."}]}, {"q": "What is the difference between forgiving someone and trusting them again? Can you do the first without the second?", "note": [{"t": "p", "x": "Yes, and this is the most useful distinction in the whole study."}, {"t": "p", "x": "Forgiveness cancels a debt. Trust gives access. Forgiveness is one-sided and can be done today. Trust is two-sided and is rebuilt by changed behaviour over time. John 2:24 settles it: same word, and Jesus held it back while loving fully."}, {"t": "p", "x": "*This is the point in the eight weeks where somebody in a hard situation is most likely to speak, or most likely to go very quiet.* Watch the room rather than the clock."}]}, {"q": "Where does forgiveness stop being a doormat? How do we teach both sides honestly?", "note": [{"t": "p", "x": "**Forgiveness ends where safety begins.** That is the short answer and it is worth saying in those words."}, {"t": "p", "x": "Teaching both sides honestly means one thing in practice: the command and the limits get said in the same breath, always. Never in a footnote and never in a later session. A group that hears \"forgive as you were forgiven\" one evening and the limits a month later has been taught badly, whatever was eventually said."}, {"t": "p", "x": "And say the reporting duty plainly, rather than hinting at it."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Wat sou môre verander as die rekening vanaand geskrap word en niks aan hulle kant verander nie?\"*"}], "en": [{"t": "p", "x": "*\"What would change tomorrow if the bill were cancelled tonight and nothing on their side changed at all?\"*"}]}, "title": "Vergewe soos jy vergewe is  ·  Forgive as you were forgiven"}, {"n": 8, "lead": {"af": [{"t": "p", "x": "**Psalm 119:165** · albei rigtings"}], "en": [{"t": "p", "x": "**Psalm 119:165** · both directions"}]}, "before": {"af": [{"t": "p", "x": "Dit is die slotsessie en dit doen drie dinge. Dit draai die studie na buite — gee geen aanstoot, nie net neem geen aanstoot nie. Dit gee die eerlike prentjie van konflik. En dit beweeg van *ek* na *ons*."}, {"t": "p", "x": "**Oor die Hebreeus:** die reël is nader aan *\"vir hulle is daar geen struikelblok nie\"* as aan *\"niks gee hulle aanstoot nie\"*. Die belofte is stabiliteit, nie gevoelloosheid nie, en die vrede kom van liefde vir God se woord eerder as van beheer oor jou omstandighede. Sê dit, want 'n vertrek wat \"niks kan hulle laat struikel nie\" hoor as 'n beskrywing van 'n persoonlikheid, gaan besluit die hele studie was vir ander mense."}, {"t": "p", "x": "**'n Geskenk in Afrikaans.** AFR83 gebruik die studie se eie woord in albei hierdie sessie se buitewaartse verse:"}, {"t": "box", "x": ["**1 Korintiërs 10:32** — *\"Moenie **aanstoot** gee nie, nie aan Jode of aan Grieke of aan die gemeente van God nie.\"* *(net in hierdie gids)*", "**Romeine 14:13** — *\"…niks te doen wat jou broer kan **aanstoot** gee of tot 'n val kan bring nie.\"* *(in die sessie)*"]}, {"t": "p", "x": "Sessie 1 het die woord benoem. Sessie 3 het dit op die Kruis gedraai. Sessie 8 draai dit op ons — en dieselfde Afrikaanse woord dra al drie. Wys daarop."}, {"t": "p", "x": "**Paulus en Barnabas** is die deel wat die meeste groepe nog nooit geleer is nie. 'n Skerp sny, en hulle het geskei. Kyk nou wat Lukas nie skryf nie. Hy sê nie wie reg was nie. Hy berispe nie een van die twee nie. Daar is geen skinder, geen brief, geen faksie nie. Twee spanne het uitgegaan in plaas van een. Tien jaar later, uit 'n Romeinse tronk: *\"Gaan haal vir Markus en bring hom saam met jou, want hy kan my tot groot diens wees.\"*"}, {"t": "p", "x": "Hulle het die opdrag verdeel. Hulle het nooit die hart verdeel nie."}, {"t": "p", "x": "**Die toets waarheen die hele studie gebou het:** aanstoot is nie die teenwoordigheid van konflik nie. Dit is wat die hart ná die konflik doen. Konflik plus 'n oop hart is 'n vennootskap wat oorleef. Konflik plus 'n toe hart is aanstoot."}, {"t": "p", "x": "**Waar dit skeefloop:** die aand eindig in algemene goeie voornemens waarmee niemand iets kan doen nie. Sluit eerder af met een spesifieke verbintenis — sien vraag 3."}, {"t": "p", "x": "En sê waar die gemeente se naam vandaan kom. Psalm 46: die aarde bewe, die berge val in die see, die waters bruis, en die stad wankel nie. Nie omdat niks skud nie. Omdat daar 'n rivier is. Andrew Selley se raamwerk hoort hier: God soek nie net onaanstootlike mense nie, Hy soek 'n onaanstootlike kerk."}], "en": [{"t": "p", "x": "This is the closing session and it does three things. It turns the study outward — give no offence, not only take none. It gives the honest picture of conflict. And it moves from *me* to *us*."}, {"t": "p", "x": "**On the Hebrew:** the line is closer to *\"there is no stumbling block for them\"* than to *\"nothing offends them\"*. The promise is steadiness, not numbness, and the peace comes from loving God's word rather than from controlling your circumstances. Say this, because a room that hears \"nothing shall offend them\" as a description of a personality will decide the whole study was for other people."}, {"t": "p", "x": "**A gift in Afrikaans.** AFR83 uses the study's own word in both of this session's outward verses:"}, {"t": "box", "x": ["**1 Korintiërs 10:32** — *\"Moenie **aanstoot** gee nie, nie aan Jode of aan Grieke of aan die gemeente van God nie.\"* *(only in this guide)*", "**Romeine 14:13** — *\"…niks te doen wat jou broer kan **aanstoot** gee of tot 'n val kan bring nie.\"* *(in the session)*"]}, {"t": "p", "x": "Session 1 named the word. Session 3 turned it on the Cross. Session 8 turns it on us — and the same Afrikaans word carries all three. Point at it."}, {"t": "p", "x": "**Paul and Barnabas** is the part most groups have never been taught. A sharp cut, and they separated. Now look at what Luke does not write. He does not say who was right. He does not tell either man off. There is no gossip, no letter, no taking sides. Two teams went out instead of one. Ten years later, from a Roman prison: *\"Get Mark and bring him with you, for he is very useful to me.\"*"}, {"t": "p", "x": "They divided the job. They never divided the heart."}, {"t": "p", "x": "**The test the whole study has been building towards:** offence is not the presence of conflict. It is what the heart does after the conflict. Conflict plus an open heart is a partnership that survives. Conflict plus a closed heart is offence."}, {"t": "p", "x": "**Where it goes wrong:** the evening ends in general good intentions that nobody can act on. Close with one specific commitment instead — see question 3."}, {"t": "p", "x": "And say where the congregation's name comes from. Psalm 46: the earth gives way, the mountains fall into the sea, the waters roar, and the city does not move. Not because nothing shakes. Because there is a river. Andrew Selley's framing belongs here: God is not only after unoffendable people, He is after an unoffendable church."}]}, "qhome": {"af": [{"q": "Waar het jou vryheid iemand anders se struikelblok geword?", "note": [{"t": "p", "x": "Romeine 14:13 is weer *skandalon* — Sessie 1 se strikstokkie, nou op ons gemik. Die antwoorde gaan gewoonlik oor 'n vryheid wat gebruik word voor iemand vir wie dit nie vry is nie."}]}, {"q": "Is daar iemand van wie jy geskei het waar jou hart nog toe is?", "note": [{"t": "p", "x": "Die skeiding was dalk reg. Die vraag gaan net oor die hart ses maande later."}]}, {"q": "Wie is jou Markus — die mens wat jy afgeskryf het, vir wie jy moet laat haal?", "note": [{"t": "p", "x": "Dit is die vraag wat die waarskynlikste 'n werklike oproep gaan oplewer. Vra wie bereid is om 'n voornaam hardop te sê, en laat dit dan daar."}]}], "en": [{"q": "Where has your freedom become somebody else's stumbling block?", "note": [{"t": "p", "x": "Romans 14:13 is *skandalon* again — Session 1's trap-stick, now pointed at us. The answers are usually about a freedom used in front of someone for whom it is not free."}]}, {"q": "Is there someone you separated from where your heart is still closed?", "note": [{"t": "p", "x": "The separation may have been right. The question is only about the heart six months later."}]}, {"q": "Who is your Mark — the person you wrote off, who you should send for?", "note": [{"t": "p", "x": "This is the question most likely to produce an actual phone call. Ask who is willing to say a first name out loud, then leave it there."}]}]}, "qgroup": {"af": [{"q": "Lukas sê nooit wie reg was oor Markus nie. Hoekom dink jy laat hy dit oop?", "note": [{"t": "p", "x": "Omdat die uitspraak nie die punt is nie, en omdat 'n uitspraak as wapen gebruik sou word."}, {"t": "p", "x": "As Lukas beslis het, sou elke latere leser in 'n kerkskeuring homself in die regte kamp plaas en na die teks gryp. Die stilte leer iets wat 'n uitspraak nie kon nie: twee Geesvervulde mense kan skerp verskil sonder dat een van hulle sondig, en die kerk se gesondheid het nie daarvan afgehang om dit uit te maak nie."}, {"t": "p", "x": "Dit beskerm ook vir Markus. 'n Uitspraak sou hom vir altyd vasgepen het as die oorsaak van die skeuring — en Markus word tien jaar later herstel, en skryf 'n Evangelie."}]}, {"q": "Kan twee mense skerp verskil en albei in die Gees wandel? Hoe sou dit hier lyk?", "note": [{"t": "p", "x": "Ja. Handelinge 15 is die bewys, en dit is die enigste bewys wat die meeste mense nodig het."}, {"t": "p", "x": "Hoe dit in die praktyk lyk, is die moeite werd om te lys, want \"in die Gees wandel\" is te vaag om iets mee te doen:"}, {"t": "list", "x": ["die verskil bly oor die saak en skuif nie na die mens nie", "nie een van hulle werf nie", "nie een van hulle vertel die storie aan mense wat dit nie hoef te hoor nie", "elkeen hou die ander se naam veilig wanneer hy met 'n derde praat", "die deur bly oop — 2 Timoteus 4:11"]}, {"t": "p", "x": "'n Werkende toets: 'n verskil is veilig wanneer elke mens die ander se standpunt so billik kan opsom dat die ander die opsomming sou aanvaar."}]}, {"q": "Psalm 46 se stad wankel nie, want daar is 'n rivier. As jy oor die agt sessies terugkyk — wat moet in *hierdie* groep verander sodat dit ook van ons waar word?", "note": [{"t": "p", "x": "Moenie hierdie een vir hulle antwoord nie. Dit is die slotvraag en dit behoort aan die vertrek."}, {"t": "p", "x": "Maar hê 'n rigting gereed as dit vasval. Die antwoord is byna nooit 'n program nie. Dit is 'n gewoonte — dat ons eerste na mekaar toe gaan, en dat ons dinge hardop sê in plaas van hulle te bêre. Albei is Sessie 6, en albei is verniet."}, {"t": "p", "x": "**Sluit af met een spesifieke verbintenis eerder as 'n algemene een.** \"Ons gaan meer oop wees met mekaar\" verdamp op die pad huis toe. \"As ek iets met jou het, kom ek binne die week na jou toe, en ek sal nie aanstoot neem wanneer jy na my toe kom nie\" is 'n sin waaraan 'n groep gehou kan word."}]}], "en": [{"q": "Luke never tells us who was right about Mark. Why do you think he leaves it open?", "note": [{"t": "p", "x": "Because the verdict is not the point, and because a verdict would have been used as a weapon."}, {"t": "p", "x": "If Luke had ruled, every later reader in a church split would put themselves in the right camp and reach for the text. The silence teaches something a ruling could not: two Spirit-filled people can disagree sharply without either of them sinning, and the health of the church did not depend on settling it."}, {"t": "p", "x": "It also protects Mark. A verdict would have fixed him for ever as the cause of the split — and Mark is restored ten years later, and writes a Gospel."}]}, {"q": "Can two people disagree sharply and both be walking in the Spirit? What would that look like here?", "note": [{"t": "p", "x": "Yes. Acts 15 is the proof, and it is the only proof most people need."}, {"t": "p", "x": "What it looks like in practice is worth listing, because \"walking in the Spirit\" is too vague to act on:"}, {"t": "list", "x": ["the disagreement stays about the matter and does not move to the person", "neither one recruits", "neither one tells the story to people who do not need to hear it", "each keeps the other's name safe when speaking to a third person", "the door stays open — 2 Timothy 4:11"]}, {"t": "p", "x": "A working test: a disagreement is safe when each person could state the other's position fairly enough that the other would accept the summary."}]}, {"q": "Psalm 46's city does not move because there is a river. Looking back over the eight sessions — what has to change in *this* group so that it becomes true of us too?", "note": [{"t": "p", "x": "Do not answer this one for them. It is the closing question and it belongs to the room."}, {"t": "p", "x": "But have a direction ready in case it stalls. The answer is almost never a programme. It is a practice — that we go to each other first, and that we say things out loud instead of storing them. Both are Session 6, and both are free."}, {"t": "p", "x": "**End with one specific commitment rather than a general one.** \"We will be more open with each other\" evaporates on the drive home. \"If I have something with you, I come to you within the week, and I will not be offended when you come to me\" is a sentence a group can be held to."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Agt weke gelede, wie se naam het in Sessie 1 by jou opgekom? Waar is dit nou?\"*"}], "en": [{"t": "p", "x": "*\"Eight weeks ago, whose name came to mind in Session 1? Where is that now?\"*"}]}, "title": "Leef vry  ·  Living free"}]};
const LS = {"af": {"kicker": "Leiersgids", "back": "← Alle sessies", "print": "Druk hierdie sessie", "before": "Voordat jy hierdie een lei", "quiet": "As die vertrek stil word", "noteHome": "Wat eerlike antwoorde gewoonlik is", "noteGroup": "Antwoord", "only": "Slegs vir die leier"}, "en": {"kicker": "Leader's guide", "back": "← All sessions", "print": "Print this session", "before": "Before you lead this one", "quiet": "If the room goes quiet", "noteHome": "What honest answers usually look like", "noteGroup": "Answer", "only": "Leader only"}};
const TT = {
 af:{lib:"Biblioteek",h1:"Leiersgids",sub:"Om Aanstoot te Neem — agt sessies. Hierdie bladsy is vir leiers. Stuur die sessie-skakel aan die persoon wat daardie week lei.",
     sess:"Sessie",open:"Maak oop",print:"Druk hierdie bladsy",foot:"Strome van Lewe Gemeente · Boshof"},
 en:{lib:"Library",h1:"Leader's guide",sub:"The Trap of Offence — eight sessions. This page is for leaders. Send the session link to whoever is leading that week.",
     sess:"Session",open:"Open",print:"Print this page",foot:"Strome van Lewe Gemeente · Boshof"}
};
let lang="af";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function md(x){return esc(x)
  .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>")
  .replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2">$1</a>');}
function gtable(rows){const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
  return "<table>"+body.map(r=>{const c=r.replace(/^\||\|$/g,"").split("|");
  return "<tr>"+c.map(x=>"<td>"+md(x.trim())+"</td>").join("")+"</tr>";}).join("")+"</table>";}
function gblocks(a){return (a||[]).map(b=>
  b.t==="box"?'<div class="lbox">'+b.x.map(p=>"<p>"+md(p)+"</p>").join("")+"</div>":
  b.t==="list"?"<ul>"+b.x.map(p=>"<li>"+md(p)+"</li>").join("")+"</ul>":
  b.t==="table"?gtable(b.x):"<p>"+md(b.x)+"</p>").join("");}
function render(){
  const t=TT[lang];
  document.documentElement.lang=lang;
  document.querySelector("[data-t='lib']").textContent=t.lib;
  document.getElementById("kick").textContent=LS[lang].kicker;
  document.getElementById("h1").textContent=t.h1;
  document.getElementById("sub").textContent=t.sub;
  document.getElementById("pb").textContent=t.print;
  document.getElementById("foot").textContent=t.foot;
  document.getElementById("grid").innerHTML='<div class="learn"><ol>'+
    GUIDE.sessions.map(s=>'<li><span><a href="s'+s.n+'/">'+esc(s.title? (s.title):"")+"</a></span></li>").join("")+"</ol></div>";
  document.getElementById("front").innerHTML =
    GUIDE.front[lang].map(sec=>(sec.title?'<h3 class="sec">'+esc(sec.title)+"</h3>":"")+
      '<div class="lblock">'+gblocks(sec.body)+"</div>").join("")+
    GUIDE.appendix[lang].map(a=>'<h3 class="sec">'+esc(a.title)+'</h3><div class="lblock">'+gblocks(a.body)+"</div>").join("");
  document.getElementById("btnAF").setAttribute("aria-pressed",lang==="af");
  document.getElementById("btnEN").setAttribute("aria-pressed",lang==="en");
}
document.getElementById("btnAF").onclick=()=>{lang="af";render()};
document.getElementById("btnEN").onclick=()=>{lang="en";render()};
try{ if((new URLSearchParams(location.search).get("lang")||"")==="en") lang="en"; }catch(e){}
render();
</script>
