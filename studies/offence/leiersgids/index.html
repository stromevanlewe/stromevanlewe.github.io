<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leiersgids — Om Aanstoot te Neem</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#fdf7ef; --ink:#2b2117; --ink-2:#5a4a38; --ink-3:#8a7760; --ink-4:#a89885;
  --line:#efe2c8; --card:#ffffff; --sand:#fbf2e3; --gold:#d9b88c; --gold-d:#b0895a;
  --warm:#fef1d6; --warm-line:#f0d9b0; --deep:#2b2117; --shadow:0 8px 30px rgba(43,33,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:500;color:var(--ink-3);min-width:0}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;padding:7px 11px;border-radius:999px;cursor:pointer}
.pillbox button:hover{color:var(--ink)}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}

/* hero */
.hero{padding-block:34px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:12px}
.eyebrow i{display:block;width:32px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.02}
.hero .sub{margin-top:10px;font-size:clamp(16px,2.4vw,19px);font-weight:500;color:var(--ink-2)}
.hero .opening{margin-top:16px;max-width:54ch;font-family:Fraunces,Georgia,serif;font-size:clamp(17px,2.4vw,19.5px);line-height:1.5;color:var(--ink)}
.hero .lede{margin-top:14px;max-width:56ch;font-size:15px;line-height:1.65;color:var(--ink-2)}

.fabline{margin:14px 0 0;max-width:60ch;font-size:14px;line-height:1.6;color:var(--ink-2)}
.fabline .link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--gold)}
.fabline .link:hover{border-bottom-color:var(--ink)}
.selfstrip{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sand);border:1px dashed var(--warm-line);border-radius:14px;padding:13px 16px}
.selfstrip span{font-size:14px;line-height:1.5;color:var(--ink-2)}
.selfstrip button{margin-left:auto;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:9px 15px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;white-space:nowrap}
.selfstrip button:hover{background:#000}
.note{margin:22px 0 4px;background:#fff;border:1px solid var(--warm-line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;box-shadow:var(--shadow)}
.note .ico{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:15px}
.note p{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note p:last-child{margin:0}
.note b{color:var(--ink)}

/* layout */
.cols{display:flex;gap:34px;padding-block:28px 110px;align-items:flex-start}
aside{display:none}
@media(min-width:900px){aside{display:block;flex:0 0 236px;position:sticky;top:74px}}
main{flex:1;min-width:0;max-width:660px}
.navlabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit;transition:.15s}
.navbtn:hover{background:#fff}
.navbtn[aria-current="true"]{background:#fff;border-color:var(--deep);box-shadow:var(--shadow)}
.navbtn .row{display:flex;align-items:center;gap:11px}
.navbtn .num{flex:0 0 auto;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font:700 12px/1 Inter,sans-serif;background:#fff;color:var(--ink-3);border:1px solid var(--line)}
.navbtn[aria-current="true"] .num{background:var(--deep);color:#fff;border-color:var(--deep)}
.navbtn .t{min-width:0}
.navbtn .t b{display:block;font:600 13px/1.25 Inter,sans-serif;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn[aria-current="true"] .t b{color:var(--ink)}
.navbtn .t span{display:block;font-size:11px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media(min-width:900px){.scroller{display:none}}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 13px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.chip[aria-current="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}

/* session */
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.skicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.shead h2{margin-top:5px;font-size:clamp(23px,4vw,31px);line-height:1.12}
.shead .theme{margin-top:6px;font-size:14px;color:var(--ink-3)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .inner{padding:18px 20px}
@media(min-width:768px){.card .inner{padding:22px 26px}}
.klabel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.klabel .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.klabel .r{font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2)}
blockquote.verse{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(18px,2.7vw,21px);line-height:1.45;font-weight:500}
.vbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink-3);border-radius:999px;padding:5px 10px;font:600 11px/1 Inter,sans-serif;cursor:pointer}
.vbar button[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.vbar a.open{margin-left:auto;font:600 11.5px/1 Inter,sans-serif;color:var(--ink-3);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--bg)}
.vbar a.open:hover{border-color:var(--deep);color:var(--ink)}

.simply{font-size:15.5px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.simply b{color:var(--ink)}
.simplynote{font-size:13.5px;line-height:1.6;color:var(--ink-3);font-style:italic;margin:8px 0 0}

h3.sec{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:26px 0 10px}
.prose p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:var(--ink-2)}
.lead-prose,.simply,.simplynote,h3.sec{padding-inline:6px}
@media(min-width:768px){.lead-prose,.simply,.simplynote,h3.sec{padding-inline:10px}}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.box{background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;margin:16px 0}
.box p{margin:0 0 9px;font-size:14.5px;line-height:1.68;color:var(--ink-2)}
.box p:last-child{margin:0}

.learn{background:var(--deep);color:#f5e9d6;border-radius:18px;padding:20px}
@media(min-width:768px){.learn{padding:24px 28px}}
.learn h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.learn ol{margin:0;padding:0;list-style:none;counter-reset:l}
.learn li{counter-increment:l;display:flex;gap:13px;margin-bottom:12px;font-size:15px;line-height:1.65}
.learn li:last-child{margin:0}
.learn li::before{content:counter(l);flex:0 0 auto;width:22px;height:22px;margin-top:2px;border-radius:999px;background:rgba(217,184,140,.18);color:var(--gold);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif}
.learn b{color:#fff}
.learn a{color:var(--gold)}
.learn .caveat{margin:14px 0 0;font-size:13.5px;line-height:1.6;color:#cbb99e;font-style:italic}

.story{background:#fff;border:1px solid var(--warm-line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
@media(min-width:768px){.story{padding:24px 28px}}
.story::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:999px;background:var(--warm);pointer-events:none}
.story>*{position:relative}
.story h3{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 12px}
.story h3 i{font-style:normal;width:26px;height:26px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:12px}
.story p{margin:0 0 12px;font-size:15px;line-height:1.78;color:#4a3c2b}
.story p:last-child{margin:0}
.story .lead{font-size:13.5px;color:var(--ink-3);font-style:italic}

.extras{background:var(--sand);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(min-width:768px){.extras{padding:22px 26px}}
.extras h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 14px}
.ex{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.ex:last-child{margin:0}
.ex .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.ex .top b{font:600 13.5px/1 Inter,sans-serif}
.ex .top a{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.03em;background:var(--deep);color:#fff;border-radius:999px;padding:5px 9px;text-decoration:none}
.ex p{margin:0;font-size:14px;line-height:1.62;color:var(--ink-2)}

.week{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
@media(min-width:768px){.week{padding:22px 26px}}
.week h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin:0 0 10px}

.qs{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
@media(min-width:768px){.qs{padding:22px 26px}}
.qs.group{background:var(--deep);border-color:var(--deep)}
.qs h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.qs.group h3{color:var(--gold)}
.qs .hint{font-size:12.5px;color:var(--ink-4);margin:0 0 14px}
.qs.group .hint{color:#b6a184}
.qs ol{margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:12px;margin-bottom:11px;font-size:15px;line-height:1.62;color:var(--ink-2)}
.qs li:last-child{margin:0}
.qs li::before{content:"Q" counter(q);flex:0 0 auto;font:700 11px/1.5 Inter,sans-serif;color:var(--ink-4)}
.qs.group li{color:#f0e4d1}
.qs.group li::before{color:var(--gold)}

.pray{border:1px dashed var(--warm-line);background:var(--warm);border-radius:18px;padding:18px 20px}
@media(min-width:768px){.pray{padding:20px 26px}}
.pray h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 8px}
.pray p{margin:0;font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.55;color:#4a3c2b}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;font:500 13.5px/1 Inter,sans-serif;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{background:var(--deep);color:#fff;border-color:var(--deep)}
.pager .count{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4)}

/* scripture refs */
a.ref{text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap;color:inherit}
a.ref:hover{border-bottom-color:var(--ink);background:rgba(217,184,140,.16)}
a.ref sup{font-size:9px;letter-spacing:.04em;color:var(--gold-d);margin-left:2px;vertical-align:super}
.learn a.ref{border-bottom-color:var(--gold)}
.learn a.ref sup{color:var(--gold)}

/* self-check */
.fab{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:11px 16px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(43,33,23,.28);max-width:calc(100% - 28px)}
@media(min-width:768px){.fab{right:20px;bottom:20px;padding:13px 19px;font-size:13.5px}}
dialog.sheet{border:0;padding:0;border-radius:20px;max-width:620px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(43,33,23,.3)}
dialog.sheet::backdrop{background:rgba(43,33,23,.45)}
.sheet .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 0}
.sheet h2{font-size:23px}
.sheet .close{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:32px;font-size:16px;line-height:1;cursor:pointer;color:var(--ink-3)}
.sheet .body{padding:14px 24px 24px}
.sheet .body p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.sheet ol.check{list-style:none;margin:14px 0;padding:0;counter-reset:c}
.sheet ol.check li{counter-increment:c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;font-size:14.5px;line-height:1.55}
.sheet ol.check li::before{content:counter(c);flex:0 0 auto;width:21px;height:21px;border-radius:999px;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif;color:var(--ink-3)}
.sheet .prog{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);opacity:.8;margin:0 0 10px}
.sheet .wq{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px;color:var(--ink)}
.sheet .opts{display:grid;gap:8px;margin:0 0 4px}
.sheet .opts button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:600 15px/1.3 Inter,sans-serif;color:var(--ink);cursor:pointer}
.sheet .opts button:hover{border-color:var(--gold);background:var(--sand)}
.sheet .mirror{display:grid;gap:10px;margin:14px 0}
@media(min-width:520px){.sheet .mirror{grid-template-columns:1fr 1fr}}
.sheet .mcol{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.sheet .mcol.spirit{background:var(--warm);border-color:var(--warm-line)}
.sheet .mcol h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.sheet .mcol ul{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.sheet .namein{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:500 16px/1.3 Inter,sans-serif;color:var(--ink);background:#fff;margin:4px 0 10px}
.sheet .namein:focus{outline:none;border-color:var(--gold)}
.sheet .privacy{font-size:13px;line-height:1.6;color:var(--ink-3);background:var(--sand);border-radius:12px;padding:11px 13px;margin:0 0 14px}
.sheet .go{background:var(--deep);color:#fff;border:1px solid var(--deep);border-radius:999px;padding:12px 20px;font:600 14.5px/1 Inter,sans-serif;cursor:pointer}
.sheet .ghost{background:none;border:0;padding:10px 2px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-3);cursor:pointer;text-decoration:underline}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.sheet .doors{list-style:none;margin:12px 0 0;padding:0}
.sheet .doors li{padding:4px 0 4px 15px;position:relative;font-size:14.5px;line-height:1.5}
.sheet .doors li:before{content:"\2192";position:absolute;left:0;opacity:.5}
.sheet .close-note{background:var(--warm);border:1px solid var(--warm-line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:#4a3c2b;margin-top:14px}

/* leader */
details.leader{margin-top:34px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
details.leader summary{cursor:pointer;padding:16px 20px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.leader summary::-webkit-details-marker{display:none}
details.leader summary::before{content:"›";display:inline-block;transition:.2s;font-size:19px;color:var(--ink-4)}
details.leader[open] summary::before{transform:rotate(90deg)}
details.leader .lbody{padding:0 20px 20px}
details.leader .lbody p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}

footer.foot{border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:22px 34px;font-size:12px;line-height:1.7;color:var(--ink-4)}
.footin p{margin:0 0 8px}
.footin a{color:var(--ink-3)}
.footin .rights{font-size:11px;line-height:1.6}

@media print{
  header.top,aside,.scroller,.pager,.fab,.crumbs,.ctrl{display:none!important}
  body{background:#fff}
  .card,.learn,.story,.extras,.week,.qs,.pray{box-shadow:none;break-inside:avoid}
  .learn,.qs.group{background:#fff!important;color:#000!important;border:1px solid #ccc!important}
  .learn li,.qs.group li{color:#000!important}
  .learn h3,.qs.group h3{color:#666!important}
}

/* ---- leiersgids ---- */
body{--gp:#2f5d50}
.lbadge{display:inline-flex;align-items:center;gap:7px;background:var(--gp);color:#fff;border-radius:999px;padding:6px 13px;font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.lblock{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 14px 14px 0;padding:15px 17px;margin:18px 0}
.lblock>h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gp);margin:0 0 9px}
.lblock p{font-size:14.7px;line-height:1.72;color:#22322c;margin:0 0 11px}
.lblock p:last-child{margin-bottom:0}
.lblock ul{margin:0 0 11px;padding-left:19px;font-size:14.7px;line-height:1.72;color:#22322c}
.lblock .lbox{background:#fff;border:1px solid #cfe0d9;border-radius:12px;padding:13px 15px;margin:12px 0}
.lblock table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.lblock td{border-bottom:1px solid #d8e6e0;padding:8px 9px;vertical-align:top;line-height:1.55}
.lnote{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0 4px}
.lnote p{font-size:14.4px;line-height:1.7;color:#22322c;margin:0 0 10px}
.lnote p:last-child{margin-bottom:0}
.lnote ul{margin:0 0 10px;padding-left:19px;font-size:14.4px;line-height:1.7;color:#22322c}
.lnote .lbox{background:#fff;border:1px solid #cfe0d9;border-radius:12px;padding:12px 14px;margin:10px 0}
.qs ol li{display:block}
.qs ol li>.lnote{margin-left:0}
.gextra{margin-top:12px}
.printbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:26px 0 0}

<script>
const GUIDE = {"front": {"af": [{"title": "", "body": [{"t": "p", "x": "**Hierdie gids is nie vanaf die studie geskakel nie.** Leiers kry die adres direk. Niks hier is geheim nie. Maar 'n lidmaat wat die antwoorde lees voordat hy sy eie vrae antwoord, kry minder uit die studie. Dít is die enigste rede waarom dit apart staan."}]}, {"title": "Hoe om dit te gebruik", "body": [{"t": "p", "x": "Elke sessie hier onder het vier dele."}, {"t": "list", "x": ["**Voordat jy hierdie een lei** — wat die sessie doen, en waar dit gewoonlik skeefloop", "**Die vrae vir by die huis** — hoe eerlike antwoorde gewoonlik lyk. Lidmate antwoord dit alleen en jy vra dit nooit in nie. Dit staan hier sodat jy weet wat mense saamdra wanneer hulle instap.", "**Die groepvrae** — werklike antwoorde, plus waarvoor om in die vertrek op te let", "**As die vertrek stil word** — een vraag om dit weer aan die gang te kry"]}, {"t": "p", "x": "Jy hoef nie by elke vraag uit te kom nie. 'n Groep wat een vraag behoorlik deurwerk, is verder as 'n groep wat deur ses jaag."}, {"t": "p", "x": "**Verse is gemerk.** Waar 'n vers reeds in die sessie staan, sien jy *(in die sessie)*. Waar dit net hier staan, sien jy *(net in hierdie gids)*. So weet jy wat op húlle skerms is en wat net op joune is."}]}, {"title": "'n Vorm vir die aand", "body": [{"t": "table", "x": ["| Tyd | Wat |", "|---|---|", "| **15 min** | Aankom, gaan sit, lees die hoofvers hardop in twee vertalings |", "| **10 min** | Die storie |", "| **45 min** | Twee of drie van die groepvrae |", "| **10 min** | Die praktiese stap vir die week |", "| **10 min** | Bid |", "| **90 min** | Altesaam |"]}, {"t": "p", "x": "Die versoeking is om te onderrig. Die meeste van wat jy sou onderrig, staan klaar op die bladsy en hulle het dit gelees. Jou werk is die middelste 45 minute."}]}, {"title": "Twee dinge om in week een te sê", "body": [{"t": "p", "x": "**Oor veiligheid.** As iemand iets deel wat met mishandeling, 'n bedreiging of 'n misdaad te doen het, gaan dit na 'n leier en na die owerhede. Sê dit aan die begin van die studie, nie wanneer dit gebeur nie. 'n Groep wat dit vooraf gehoor het, hanteer dit baie beter as 'n groep wat dit vir die eerste keer in die oomblik hoor."}, {"t": "p", "x": "**Oor tempo.** Sê hierdie twee sinne reguit:"}, {"t": "box", "x": ["Niemand hier kry 'n sperdatum om teen te vergewe nie.", "En om iemand te vergewe beteken nie dat jy teruggaan na hulle toe nie, of terug in 'n situasie wat jou seergemaak het nie. Dit is twee verskillende dinge, en ons hou hulle uitmekaar."]}, {"t": "p", "x": "Daardie tweede sin weeg meer as wat dit lyk. Party mense in die vertrek glo dat as hulle vergewe, hulle instem om aan te gaan soos vantevore. Daarom weier hulle om te vergewe, want om weg te bly is die enigste beskerming wat hulle het. Vat daardie vrees vroeg van die tafel af en jy verander wie bereid is om te praat."}]}, {"title": "Die drie grense (Sessie 7)", "body": [{"t": "p", "x": "Jy sien hierna verwys word voor Sessie 7. Hier is hulle, sodat die verwysing sin maak:"}, {"t": "list", "x": ["**Vergifnis is nie vertroue nie.** Vergifnis skrap 'n skuld. Vertroue is toegang, en toegang word oor tyd herbou.", "**Vergifnis is nie versoening nie.** Jy kan alleen vergewe. Jy kan nie alleen versoen nie — dit vat twee mense, en een van hulle moet berou hê.", "**Vergifnis beteken nooit om terug te gaan in skade in nie.** Waar iemand mishandel, bedreig of misbruik word, word daar op 'n veilige afstand vergewe. Dit vervang nooit om iemand te vertel, hulp te kry, of 'n misdaad aan te meld nie."]}, {"t": "p", "x": "Hulle word volledig in Sessie 7 verduidelik. Lees hulle daar hardop **voordat** die gesprek begin, nie agterna nie."}]}, {"title": "Sessies wat ekstra sorg verg", "body": [{"t": "p", "x": "**Sessie 4** is waar iemand dalk vir die eerste keer hardop sê dat hy kwaad is vir God. Moenie dit regmaak nie. Moenie God verdedig nie. Moenie vinnig na die volgende vraag beweeg nie. Jesus het Johannes nie berispe omdat hy gevra het nie. Die vertrek moet ook nie."}, {"t": "p", "x": "**Sessie 7** is waar 'n groep werklike skade kan doen sonder om dit te bedoel. Onderrig oor vergifnis land op mense wie se omstandighede jy nie ken nie."}]}, {"title": "Waar die materiaal vandaan kom", "body": [{"t": "p", "x": "Die strikprent, die spooknet, die bysteek en *\"die pyn volg die perspektief\"*, die sononder-reël, die Galasiërs 5-toets en Absalom kom almal uit Andrew Selley se tweede boodskap, *Hurt but Not Offended* (Four12-konferensie, Noord-Amerika, 2026)."}, {"t": "p", "x": "Die frase *\"'n onaanstootlike kerk\"* is ook syne. Dit is hoe hy die hele reeks raam. Sê dit iewers in die agt weke van voor af. Dit is die studie se eie beginsel op homself toegepas: **ons kan nie die aanstoot van die evangelie verwyder nie — maar ons moet nie roekeloos wees waar ons nie hoef te wees nie.**"}, {"t": "p", "x": "Drie dinge van hom is van die lidmaatbladsy af weggelaat. Die eerste is 'n eenvoudige oordeel oor 'n bladsy wat mense alleen lees. Die ander twee is lewende vrae, en 'n leier wat die oorspronklike boodskap gehoor het, gaan daaroor gevra word. Hulle staan hier onder sodat jy kan antwoord eerder as om die onderwerp te verander."}]}, {"title": "Nie op die lidmaatbladsy nie (1) — die verhaal van die aanranding", "body": [{"t": "p", "x": "Andrew vertel van 'n vrou wat deur verskeie mans aangerand is en hulle vergewe het terwyl dit gebeur. In 'n vertrek met 'n prediker teenwoordig, en 'n boodskap wat daarom gebou is, dra dit die punt kragtig."}, {"t": "p", "x": "Die studiebladsy word alleen gelees, op 'n foon, deur tieners sowel as volwassenes, met niemand daar nie. Die beginsel staan sonder dit. Dít is die hele rede, en dit is nie 'n meningsverskil met hom nie."}]}, {"title": "Nie op die lidmaatbladsy nie (2) — \"Trust isn't earned, it's given\"", "body": [{"t": "p", "x": "**Wat hy werklik sê** (27:25, terwyl hy 1 Korintiërs 13:7 hanteer):"}, {"t": "box", "x": ["\"It always protects. This is not self-protection. This is protection of the other. It always protects. It always trusts. I mean, that just blows my mind. We say, you know, I'll trust you again maybe in like 30 years once you've proved your trust to me. And the Bible says, well, that's not love. That's justice. Love trusts before it's earned. Trust isn't earned, it's given. And I want to be so in Christ that I give trust to those who don't deserve it. Because he gave trust to me when I did not deserve it.\""]}, {"t": "p", "x": "**Kyk waaroor hy besig is om te preek.** Hy werk deur 1 Korintiërs 13:7 *(net in hierdie gids)*:"}, {"t": "box", "x": ["*\"Dit bedek alles, glo alles, hoop alles, verdra alles.\"*"]}, {"t": "p", "x": "En hy doen dit binne-in 'n gedeelte oor **om aanstoot oor te sien**. Hy praat oor hóé ek die mens sien wat my seergemaak het — of ek hulle vriendelik lees of hulle afskryf. Hy praat nie oor wie die sleutels kry nie."}, {"t": "p", "x": "**Hy trek self ook die streep.** Later in dieselfde boodskap, in die 1 Petrus 2-gedeelte:"}, {"t": "box", "x": ["\"Now, church systems is another story. We're not going to look at that now. Leaders have to deal with matters sometimes within the community. But for me as an individual in the community, I am not governed...\""]}, {"t": "p", "x": "So hy skei die hart van die enkeling van die plig van die leier. Enigiemand wat die hele boodskap gehoor het, het albei helftes gehoor."}, {"t": "p", "x": "**Die probleem is die sin op sy eie.** *\"Trust isn't earned, it's given\"* is maklik om te onthou en maklik om oor te vertel. Oorvertel sonder die 1 Korintiërs 13-verband, en sonder die \"church systems is another story\"-sin, bereik dit die mens wat gedruk word om terug te gaan na iemand wat hom seergemaak het. Dít is die mens wat die minste daarteen kan stry."}, {"t": "p", "x": "**Hoe om dit te leer.** Die moeilikheid is dat die woord *vertroue* drie verskillende werke doen:"}, {"t": "table", "x": ["| | | |", "|---|---|---|", "| **Om die beste te dink** | om 'n goeie motief te veronderstel | **Gee dit vrylik, dadelik, altyd.** Dit is Andrew se punt, en hy is reg. |", "| **Om oop te wees** | bereid om te groet, in te sluit, te hoop | **Gee dit vrylik.** Christus het dit gedoen terwyl ons nog sy vyande was (Romeine 5:8, *net in hierdie gids*). |", "| **Toegang** | die sleutels, die geld, die kinders, die verhoog, die diep plekke van jou hart | **Word oor tyd herbou. Nooit oorhandig net omdat ons so gesê is nie.** |"]}, {"t": "p", "x": "Die vers wat dit uitmaak, staan reeds in Sessie 7 — **Johannes 2:23-25** *(Johannes 2:24 is in die sessie; die volle gedeelte staan hier)*:"}, {"t": "box", "x": ["*\"Terwyl Jesus vir die viering van die paasfees in Jerusalem was, het daar baie mense tot geloof in Hom gekom toe hulle die wondertekens sien wat Hy doen. Maar Hy het Hom nie op hulle verlaat nie, omdat Hy geweet het hoe hulle almal is. Hy het nie nodig gehad dat iemand Hom iets van 'n mens vertel nie, want Hy het self geweet hoe mense is.\"*"]}, {"t": "p", "x": "Johannes gebruik dieselfde woord albei kante toe, in twee verse. Hulle het Hóm *vertrou*. Hy het Homself nie aan hulle *toevertrou* nie. Dit is doelbewus. Die liefdevolste mens wat ooit geleef het, het hierdie derde soort vertroue teruggehou van mense wat werklik in Hom geglo het. So om toegang terug te hou kan nie op sigself 'n gebrek aan liefde wees nie."}, {"t": "p", "x": "**'n Nota oor die vertalings.** AFR83 het *\"Hy het Hom nie op hulle verlaat nie\"*. Dit dra die betekenis maar verloor die woordspel. AFR53 hou dit: *\"Hy het Hom aan hulle nie toevertrou nie.\"* Wys albei."}, {"t": "p", "x": "Die res van die Skrif werk dieselfde. **1 Timoteus 3:10** *(net in hierdie gids)*, oor diakens:"}, {"t": "box", "x": ["*\"Vooraf moet ondersoek ingestel word na hulle geskiktheid, en as niemand beswaar teen hulle inbring nie, kan hulle as diakens dien.\"*"]}, {"t": "p", "x": "**1 Timoteus 5:22** *(net in hierdie gids)*: *\"Moenie iemand oorhaastig die hande oplê nie.\"*"}, {"t": "p", "x": "En sit **Handelinge 15:37-38** langs **2 Timoteus 4:11** *(2 Timoteus 4:11 is in Sessie 8)*. Paulus het geweier om Markus saam te vat oor wat Markus vroeër gedoen het. Tien jaar later laat hy hom haal, want Markus het verander. Toegang is herbou deur veranderde gedrag — en die deur was nooit toe nie."}, {"t": "p", "x": "**Een sin om te preek:** *genade word gegee, goedgesindheid word gegee — toegang word herbou.*"}]}, {"title": "Nie op die lidmaatbladsy nie (3) — \"Jesus never had to forgive anybody\"", "body": [{"t": "p", "x": "**Wat hy werklik sê** (09:28):"}, {"t": "box", "x": ["\"If anyone felt rejection, it was Jesus. If anyone felt pain, it was Jesus. But he never got trapped. He never took offense. He never held onto it. ... I said Jesus never had to forgive anybody. And I knew immediately people going, but what about 'Father, forgive them for they don't know what they're doing', which is what he said on the cross. But I want you to note, he didn't say this, 'I forgive you guys because of what you've done.' He said, 'Father, forgive them. Don't bring them the justice that they deserve.' This wasn't offense and forgiveness. This was intercession for mercy. Jesus never got offended.\""]}, {"t": "p", "x": "**Die stelling is nouer as wat dit klink, en dit hou stand.** Hy sê nie dat Jesus nooit sondes vergewe nie. Hy sê Jesus het nooit 'n wrok hóéf te laat vaar nie, want Hy het nooit een opgetel nie. Die werk wat ons moet doen — om onsself uit verbittering uit te kry — het Hy nooit hoef te doen nie."}, {"t": "p", "x": "Dit skei twee dinge wat ons met een woord benoem. **Om 'n skuld teenoor God te skrap** is iets wat Jesus heeltyd doen, in sy eie naam. **Om 'n aanstoot los te laat wat ek persoonlik gevat het** is die ding wat Andrew sê Hy nooit nodig gehad het nie."}, {"t": "p", "x": "Dat Jesus in sy eie naam vergewe, is nie in twyfel nie. **Markus 2:5-7** *(net in hierdie gids)*:"}, {"t": "box", "x": ["*\"Toe Jesus hulle geloof sien, sê Hy vir die verlamde: 'Vriend, jou sondes word vergewe!' Maar sommige van die skrifgeleerdes het daar gesit en hulle afgevra: 'Waarom sê hy so? Hy praat mos godslasterlik! Wie kan sondes vergewe behalwe God alleen?'\"*"]}, {"t": "p", "x": "**Lukas 7:48** *(net in hierdie gids)*: *\"En Jesus sê vir haar: 'Jou sondes is vergewe.'\"*"}, {"t": "p", "x": "So die sin moet gelees word soos hy dit bedoel — Jesus het nooit **'n aanstoot teen Homself** hoef te vergewe nie — en nie plat nie."}, {"t": "p", "x": "**Drie eerlike probleme wat 'n leier moet ken.**"}, {"t": "p", "x": "**Die teks self.** Lukas 23:34a — *\"Vader, vergeef hulle, want hulle weet nie wat hulle doen nie\"* — ontbreek in verskeie van die oudste manuskripte, en die meeste studiebybels sit dit tussen hakies. Dit is dalk eg, en die argument val nie sonder dit inmekaar nie. Maar om 'n fyn onderskeid op die presiese woorde van 'n vers tussen hakies te bou, is om op sagte grond te staan — en iemand met 'n studiebybel gaan die hakies sien."}, {"t": "p", "x": "**Die voorbeeld-probleem, en dít is die werklike een.** Sessie 5 se hoofvers hou Jesus voor as 'n patroon. **1 Petrus 2:21-23** *(vers 23 is die hoofvers; 21-22 staan hier)*:"}, {"t": "box", "x": ["*\"Juis hiervoor is julle ook geroep, omdat Christus self vir julle gely en so vir julle 'n voorbeeld gestel het, sodat julle in sy voetspore kan volg. 'Hy het geen sonde gedoen nie en uit sy mond het daar nooit 'n leuen gekom nie.' Toe Hy beledig is, het Hy nie terug beledig nie, toe Hy gely het, het Hy nie gedreig nie, maar alles oorgelaat aan Hom wat regverdig oordeel.\"*"]}, {"t": "p", "x": "As Hy nooit die ding hoef te doen het wat ons moet doen nie, hoe is Hy dan ons voorbeeld?"}, {"t": "p", "x": "Daar is 'n goeie antwoord, en dit is die nuttigste ding in hierdie hele bespreking: **Hy is die voorbeeld van waarheen ons op pad is, nie van hoe ons daar kom nie.** Hy wys hoe 'n mens lyk wat die wrok nooit optel nie. Ons kom daar langs 'n pad wat Hy nie hoef te loop het nie. Dit is nie 'n swakheid in wat Andrew sê nie. Dit is juis wat dit die moeite werd maak om te preek."}, {"t": "p", "x": "**Die pastorale probleem.** Iemand hoor *\"Jesus never got offended\"* en besluit dat sy eie stryd bewys dat daar iets met hom verkeerd is. Of erger: dat vergifnis nie eintlik die punt is nie en hy moes bloot nie aanstoot geneem het nie — wat nuttelose raad is vir iemand wat nog bloei."}, {"t": "p", "x": "**Waarom dit van die lidmaatbladsy af weg is.** Nie omdat dit verkeerd is nie. Omdat dit vyf minute se versigtige raamwerk nodig het om veilig te land, en die studiebladsy het niemand in die vertrek om daardie vyf minute te gee nie. Sessie 5 rus eerder op 1 Petrus 2:23, waaroor niemand stry nie en wat dieselfde werk doen."}]}], "en": [{"title": "", "body": [{"t": "p", "x": "**Status:** English draft for review. Afrikaans comes last, once the wording is settled. The pages are built after that."}, {"t": "p", "x": "**This guide is not linked from the study.** Leaders get the address directly. Nothing here is secret. But a member who reads the answers before answering their own questions gets less out of the study. That is the only reason it sits apart."}]}, {"title": "How to use this", "body": [{"t": "p", "x": "Each session below has four parts."}, {"t": "list", "x": ["**Before you lead this one** — what the session is doing, and where it usually goes wrong", "**The questions at home** — what honest answers usually look like. Members answer these alone and you never collect them. This is here so you know what people are carrying when they walk in.", "**The group questions** — real answers, plus what to watch for in the room", "**If the room goes quiet** — one question to start it again"]}, {"t": "p", "x": "You do not have to reach every question. A group that works through one question properly is further along than a group that rushes six."}, {"t": "p", "x": "**Verses are marked.** Where a verse is already in the session, you will see *(in the session)*. Where it is only here, you will see *(only in this guide)*. That way you know what is on their screens and what is only on yours."}]}, {"title": "A shape for the evening", "body": [{"t": "table", "x": ["| Time | What |", "|---|---|", "| **15 min** | Arrive, settle, read the key verse out loud in two translations |", "| **10 min** | The story |", "| **45 min** | Two or three of the group questions |", "| **10 min** | The practical step for the week |", "| **10 min** | Pray |", "| **90 min** | Total |"]}, {"t": "p", "x": "The temptation is to teach. Most of what you would teach is already on the page and they have read it. Your work is the middle 45 minutes."}]}, {"title": "Two things to say in week one", "body": [{"t": "p", "x": "**On safety.** If someone shares something that involves abuse, a threat, or a crime, that goes to a leader and to the proper authorities. Say this at the start of the study, not when it happens. A group that has heard it in advance handles it far better than a group hearing it for the first time in the moment."}, {"t": "p", "x": "**On pace.** Say these two sentences plainly:"}, {"t": "box", "x": ["Nobody here will be given a deadline to forgive by.", "And forgiving someone does not mean going back to them, or back into a situation that hurt you. Those are two different things, and we will keep them separate."]}, {"t": "p", "x": "That second sentence matters more than it looks. Some people in the room believe that if they forgive, they are agreeing to carry on as before. So they refuse to forgive, because staying away is the only protection they have. Take that fear off the table early and you change who is willing to speak."}]}, {"title": "The three limits (Session 7)", "body": [{"t": "p", "x": "You will see these mentioned before Session 7. Here they are, so the reference makes sense:"}, {"t": "list", "x": ["**Forgiveness is not trust.** Forgiveness cancels a debt. Trust is access, and access is rebuilt over time.", "**Forgiveness is not reconciliation.** You can forgive on your own. You cannot reconcile on your own — that takes two people, and one of them repenting.", "**Forgiveness never means going back into harm.** Where someone is being abused, threatened or used, forgiveness is done from a safe distance. It never replaces telling someone, getting help, or reporting a crime."]}, {"t": "p", "x": "They are explained fully in Session 7. Read them out loud there **before** the discussion starts, not afterwards."}]}, {"title": "Sessions that need extra care", "body": [{"t": "p", "x": "**Session 4** is where someone may say out loud, for the first time, that they are angry with God. Do not fix it. Do not defend God. Do not move quickly to the next question. Jesus did not tell John off for asking. The room should not either."}, {"t": "p", "x": "**Session 7** is where a group can do real harm without meaning to. Teaching on forgiveness lands on people whose situations you do not know about."}]}, {"title": "Where the material comes from", "body": [{"t": "p", "x": "The trap picture, the ghost net, the bee sting and *\"the pain follows the perspective\"*, the sundown rule, the Galatians 5 test and Absalom all come from Andrew Selley's second message, *Hurt but Not Offended* (Four12 conference, North America, 2026)."}, {"t": "p", "x": "The phrase *\"an unoffendable church\"* is also his. It is how he frames the whole series. Say it from the front at some point in the eight weeks. It is the study's own principle turned back on itself: **we cannot remove the offence of the gospel — but we must not be careless with it where we do not have to be.**"}, {"t": "p", "x": "Three things of his were left off the member page. The first is a simple judgement about a page people read alone. The other two are live questions, and a leader who has heard the original message will be asked about them. They are set out below so you can answer rather than change the subject."}]}, {"title": "Not on the member page (1) — the account of the assault", "body": [{"t": "p", "x": "Andrew tells of a woman who was assaulted by several men and forgave them while it was happening. In a room with a preacher present, and a message built around it, it carries the point powerfully."}, {"t": "p", "x": "The study page is read alone, on a phone, by teenagers as well as adults, with nobody there. The principle stands without it. That is the whole reason, and it is not a disagreement with him."}]}, {"title": "Not on the member page (2) — \"Trust isn't earned, it's given\"", "body": [{"t": "p", "x": "**What he actually says** (27:25, teaching on 1 Corinthians 13:7):"}, {"t": "box", "x": ["\"It always protects. This is not self-protection. This is protection of the other. It always protects. It always trusts. I mean, that just blows my mind. We say, you know, I'll trust you again maybe in like 30 years once you've proved your trust to me. And the Bible says, well, that's not love. That's justice. Love trusts before it's earned. Trust isn't earned, it's given. And I want to be so in Christ that I give trust to those who don't deserve it. Because he gave trust to me when I did not deserve it.\""]}, {"t": "p", "x": "**Look at what he is teaching.** He is working through 1 Corinthians 13:7 *(only in this guide)*:"}, {"t": "box", "x": ["*\"Love bears all things, believes all things, hopes all things, endures all things.\"*"]}, {"t": "p", "x": "And he is doing it in the middle of a section on **overlooking an offence**. He is talking about how I see the person who hurt me — whether I read them kindly or write them off. He is not talking about who gets the keys."}, {"t": "p", "x": "**He also draws the line himself.** Later in the same message, in the 1 Peter 2 section:"}, {"t": "box", "x": ["\"Now, church systems is another story. We're not going to look at that now. Leaders have to deal with matters sometimes within the community. But for me as an individual in the community, I am not governed...\""]}, {"t": "p", "x": "So he separates the heart of the individual from the duty of the leader. Anyone who heard the whole message heard both halves."}, {"t": "p", "x": "**The problem is the sentence on its own.** *\"Trust isn't earned, it's given\"* is easy to remember and easy to repeat. Repeated without the 1 Corinthians 13 setting, and without the \"church systems is another story\" line, it reaches the person who is being pushed to go back to someone who hurt them. That is the person least able to argue with it."}, {"t": "p", "x": "**How to teach it.** The trouble is that the word *trust* is doing three different jobs:"}, {"t": "table", "x": ["| | | |", "|---|---|---|", "| **Thinking the best** | assuming a good motive | **Give it freely, straight away, always.** This is Andrew's point, and he is right. |", "| **Being open** | willing to greet, include, hope | **Give it freely.** Christ did this while we were still His enemies (Romans 5:8, *only in this guide*). |", "| **Access** | the keys, the money, the children, the platform, the deep places of your heart | **Rebuilt over time. Never handed over just because we were told to.** |"]}, {"t": "p", "x": "The verse that settles it is already in Session 7 — **John 2:23-25** *(John 2:24 is in the session; the full passage is here)*:"}, {"t": "box", "x": ["*\"Now when he was in Jerusalem at the Passover Feast, many believed in his name when they saw the signs that he was doing. But Jesus on his part did not entrust himself to them, because he knew all people and needed no one to bear witness about man, for he himself knew what was in man.\"*"]}, {"t": "p", "x": "John uses the same word both ways in two verses. They *trusted* Him. He did not *entrust* Himself to them. That is deliberate. The most loving person who has ever lived held back this third kind of trust from people who really did believe in Him. So holding back access cannot by itself be a failure of love."}, {"t": "p", "x": "**A note for the Afrikaans page.** AFR83 has *\"Hy het Hom nie op hulle verlaat nie\"* — He did not rely on them. That carries the sense but loses the word-play. AFR53 keeps it: *\"Hy het Hom aan hulle nie toevertrou nie.\"* Show both."}, {"t": "p", "x": "The rest of Scripture works the same way. **1 Timothy 3:10** *(only in this guide)*, on deacons:"}, {"t": "box", "x": ["*\"And let them also be tested first; then let them serve as deacons if they prove themselves blameless.\"*"]}, {"t": "p", "x": "**1 Timothy 5:22** *(only in this guide)*: *\"Do not be hasty in the laying on of hands.\"*"}, {"t": "p", "x": "And put **Acts 15:37-38** next to **2 Timothy 4:11** *(2 Timothy 4:11 is in Session 8)*. Paul refused to take Mark because of what Mark had done before. Ten years later he sent for him, because Mark had changed. Access was rebuilt by changed behaviour — and the door was never shut."}, {"t": "p", "x": "**One sentence to preach:** *grace is given, goodwill is given — access is rebuilt.*"}]}, {"title": "Not on the member page (3) — \"Jesus never had to forgive anybody\"", "body": [{"t": "p", "x": "**What he actually says** (09:28):"}, {"t": "box", "x": ["\"If anyone felt rejection, it was Jesus. If anyone felt pain, it was Jesus. But he never got trapped. He never took offense. He never held onto it. ... I said Jesus never had to forgive anybody. And I knew immediately people going, but what about 'Father, forgive them for they don't know what they're doing', which is what he said on the cross. But I want you to note, he didn't say this, 'I forgive you guys because of what you've done.' He said, 'Father, forgive them. Don't bring them the justice that they deserve.' This wasn't offense and forgiveness. This was intercession for mercy. Jesus never got offended.\""]}, {"t": "p", "x": "**The claim is narrower than it sounds, and it holds up.** He is not saying Jesus never forgives sins. He is saying Jesus never had to *let go of a grudge*, because He never picked one up. The work we have to do — getting ourselves out of resentment — He never had to do."}, {"t": "p", "x": "That separates two things we call by one word. **Cancelling a debt owed to God** is something Jesus does all the time, in His own name. **Letting go of an offence I took personally** is the thing Andrew says He never needed."}, {"t": "p", "x": "That Jesus forgives in His own name is not in question. **Mark 2:5-7** *(only in this guide)*:"}, {"t": "box", "x": ["*\"And when Jesus saw their faith, he said to the paralytic, 'Son, your sins are forgiven.' Now some of the scribes were sitting there, questioning in their hearts, 'Why does this man speak like that? He is blaspheming! Who can forgive sins but God alone?'\"*"]}, {"t": "p", "x": "**Luke 7:48** *(only in this guide)*: *\"And he said to her, 'Your sins are forgiven.'\"*"}, {"t": "p", "x": "So the sentence has to be read the way he means it — Jesus never had to forgive **an offence against Himself** — not flatly."}, {"t": "p", "x": "**Three honest problems a leader should know about.**"}, {"t": "p", "x": "**The text itself.** Luke 23:34a — *\"Father, forgive them, for they know not what they do\"* — is missing from several of the oldest manuscripts, and most study Bibles put it in brackets. It may well be genuine, and the argument does not fall apart without it. But building a fine distinction on the exact words of a bracketed verse is standing on soft ground, and someone with a study Bible will see the brackets."}, {"t": "p", "x": "**The example problem, which is the real one.** Session 5's key verse holds Jesus up as a pattern. **1 Peter 2:21-23** *(verse 23 is the key verse; 21-22 are here)*:"}, {"t": "box", "x": ["*\"For to this you have been called, because Christ also suffered for you, leaving you an example, so that you might follow in his steps. He committed no sin, neither was deceit found in his mouth. When he was reviled, he did not revile in return; when he suffered, he did not threaten, but continued entrusting himself to him who judges justly.\"*"]}, {"t": "p", "x": "If He never had to do the thing we have to do, how is He our example?"}, {"t": "p", "x": "There is a good answer, and it is the most useful thing in this whole discussion: **He is the example of where we are going, not of how we get there.** He shows what a person looks like who never picks the grudge up. We reach that by a road He did not have to walk. That is not a weakness in what Andrew says. It is what makes it worth preaching."}, {"t": "p", "x": "**The pastoral problem.** Someone hears *\"Jesus never got offended\"* and decides their own struggle proves something is wrong with them. Or worse, that forgiveness is beside the point and they should simply not have been offended — which is useless advice to somebody who is still bleeding."}, {"t": "p", "x": "**Why it is off the member page.** Not because it is wrong. Because it needs five minutes of careful framing to land safely, and the study page has nobody in the room to give those five minutes. Session 5 rests on 1 Peter 2:23 instead, which nobody argues about and which does the same work."}]}]}, "appendix": {"af": [{"title": "Bylae — \"Sit my voet in die strik?\"", "body": [{"t": "p", "x": "Die selftoets is vanaf elke sessie op die studiebladsy bereikbaar. Dit is doelbewus **nie** 'n groepoefening nie. Die vrae is te ontblotend om voor mense te antwoord, en 'n groep wat dit hardop antwoord, gee beleefde antwoorde."}, {"t": "p", "x": "**Wys lidmate daarheen, en laat hulle dan alleen daarmee.**"}, {"t": "p", "x": "## Hoe dit nou werk"}, {"t": "p", "x": "Dit loop as 'n stap-vir-stap toets eerder as 'n bladsy vol teks, en dit is doelbewus so. In die eerste weergawe was alles op een skerm, en mense het reguit verby die belangrikste deel geblaai om by die vrae te kom."}, {"t": "list", "x": ["**Die spieël kom eerste, op sy eie skerm.** Die twee lyste uit Galasiërs 5 — die vlees aan die een kant, die Gees aan die ander — met niks anders op die bladsy nie. Jy kan nie by die vrae kom sonder om daardeur te gaan nie.", "**'n Naam.** Hulle tik een in, of laat dit leeg en die toets sê \"iemand\" in plaas daarvan. Wat hulle tik, bly in die blaaier. Dit word nêrens gestuur nie en nêrens gestoor nie, ook nie op daardie foon nie. Die skerm sê so, want op 'n gedeelde gesinsfoon gaan mense wonder.", "**Ses vrae, een skerm op 'n slag**, met die naam in elke vraag ingeskryf. *\"Wanneer Anna se naam opkom, trek iets in jou bors saam?\"* Dit is 'n ander vraag as dieselfde woorde met 'n oop plek in.", "**'n Uitslag** — watter deur oopstaan, en by watter sessie om te begin."]}, {"t": "p", "x": "**Daar is doelbewus geen telling nie.** 'n Getal nooi twee slegte reaksies uit: *net twee uit ses, ek is reg*, of skaamte. Die uitslag benoem waarheen die antwoorde wys en stuur hulle na die een sessie wat hulle vermy het — gee die saak oor (5), gaan na die mens (6), of skrap die skuld (7)."}, {"t": "p", "x": "## Hoekom dit so gebou is"}, {"t": "p", "x": "Die moeilikste ding van aanstoot is dat die mens wat daarin is, laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Daarom kan die toets nie wees \"voel ek aanstoot?\" nie — niemand antwoord dít eerlik nie. Dit moet oor simptome gaan."}, {"t": "p", "x": "Paulus gee die toets in Galasiërs 5:19-23. Aan die een kant: vyandskap, twis, jaloesie, woede-uitbarstings, selfsug, tweedrag, verdeeldheid. Aan die ander kant: liefde, blydskap, vrede, geduld, vriendelikheid. Jy kan nie in albei tegelyk loop nie. As die eerste lys is wat opkom wanneer jy aan een bepaalde mens dink, sit jou voet in die strik — hoe goed jou saak ook al is."}, {"t": "p", "x": "As iemand ná die tyd na jou toe kom, is die nuttige ding om te sê die toets se eie sin: *jy is nie 'n slegte mens nie, en jy is waarskynlik nie verkeerd oor die feite nie.* Om reg te wees is wat die meeste mense daarin hou."}]}, {"title": "Bylae — As iemand jou iets ernstigs vertel", "body": [{"t": "p", "x": "Dit gebeur in studies soos hierdie, meestal in Sessies 4 en 7."}, {"t": "p", "x": "Sê die veiligheidsin in week een sodat die vertrek die reël klaar ken. Wanneer dit gebeur: laat hulle klaarmaak. Moenie ondersoekende vrae vra nie. Moenie belowe om dit tussen julle twee te hou nie. Moenie dit in die groep hanteer nie. Vat dit na 'n leier, en waar daar 'n misdaad of voortgaande skade is, na die owerhede."}, {"t": "p", "x": "Die een ding om nié te doen nie, is om na die sessiemateriaal te gryp. Iemand wat jou van mishandeling vertel, is nie meer in 'n Bybelstudie nie, en Kolossense 3:13 is nie die regte sin vir daardie oomblik nie."}]}], "en": [{"title": "Appendix — \"Is my foot in the trap?\"", "body": [{"t": "p", "x": "The self-check is reachable from every session on the study page. It is deliberately **not** a group exercise. The questions are too exposing to answer in front of people, and a group that answers them out loud will give polite answers."}, {"t": "p", "x": "**Point members to it, then leave them alone with it.**"}, {"t": "p", "x": "## How it works now"}, {"t": "p", "x": "It runs as a step-by-step check rather than a page of text, and that is deliberate. In the first version everything was on one screen, and people scrolled straight past the important part to get to the questions."}, {"t": "list", "x": ["**The mirror comes first, on its own screen.** The two lists from Galatians 5 — the flesh on one side, the Spirit on the other — with nothing else on the page. You cannot reach the questions without going through it.", "**A name.** They type one, or leave it blank and the check says \"someone\" instead. What they type stays in the browser. It is never sent anywhere and never saved, not even on that phone. The screen says so, because on a shared family phone people will wonder.", "**Six questions, one screen at a time**, with the name written into each one. *\"When Anna's name comes up, does something tighten in your chest?\"* That is a different question from the same words with a blank in them.", "**A result** — which door is standing open, and which session to start at."]}, {"t": "p", "x": "**There is no score, on purpose.** A number invites two bad reactions: *only two out of six, I am fine*, or shame. The result names what the answers point to and sends them to the one session they have been avoiding — hand the case over (5), go to the person (6), or cancel the debt (7)."}, {"t": "p", "x": "## Why it is built this way"}, {"t": "p", "x": "The hardest part of offence is that the person in it is the last to know. You do not feel offended. You feel **right**. So the test cannot be \"am I offended?\" — nobody answers that one honestly. It has to be about symptoms."}, {"t": "p", "x": "Paul gives the test in Galatians 5:19-23. On one side: enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions. On the other: love, joy, peace, patience, kindness. You cannot walk in both at once. If the first list is what comes up when you think of one particular person, your foot is in the trap — however good your case is."}, {"t": "p", "x": "If somebody comes to you after doing it, the useful thing to say is the check's own line: *you are not a bad person, and you are probably not wrong about the facts.* Being right is what keeps most people in the trap."}]}, {"title": "Appendix — If somebody tells you something serious", "body": [{"t": "p", "x": "It happens in studies like this one, most often in Sessions 4 and 7."}, {"t": "p", "x": "Say the safety sentence in week one so the room already knows the rule. When it happens: let them finish. Do not ask investigating questions. Do not promise to keep it between the two of you. Do not deal with it in the group. Take it to a leader, and where there is a crime or ongoing harm, to the proper authorities."}, {"t": "p", "x": "The one thing not to do is reach for the session material. Somebody telling you about abuse is not in a Bible study any more, and Colossians 3:13 is not the right sentence for that moment."}]}]}, "sessions": [{"n": 1, "lead": {"af": [{"t": "p", "x": "**Lukas 17:1** · *skandalon*, die stokkie in 'n strik waarop die aas sit"}], "en": [{"t": "p", "x": "**Luke 17:1** · *skandalon*, the small stick in a trap that holds the bait"}]}, "before": {"af": [{"t": "p", "x": "Hierdie sessie het een werk. Dit moet die groep skuif van *aanstoot is iets wat met my gebeur* na *aanstoot is iets wat ek doen*. Alles in die agt weke rus daarop. As die vertrek uitstap terwyl hulle aanstoot steeds in ander mense se gedrag plaas, het sessies 5, 6 en 7 niks om aan vas te haak nie."}, {"t": "p", "x": "Die *skandalon*-prentjie doen die werk, so gee dit tyd. Die dier word nie deur die strik gevang nie. Dit word deur die aas gevang. Die seer gebeur met jou. Die byt is joune."}, {"t": "p", "x": "**Die nuwe Kain-gedeelte doen dieselfde werk met God se eie stem**, en vir party mense is dit die makliker deur. Sien die groepantwoorde hier onder."}, {"t": "p", "x": "**Waar dit skeefloop:** die groep hoor blaam. *So dit is my skuld dat ek seergekry het?* Nee. Die verskil is tussen die wond en die muur. Riaan is werklik verontreg — die ouderlinge het regtig versuim om hom te bel. Die sessie stry nie oor die besering nie. Dit vra oor die drie maande."}, {"t": "p", "x": "Hou Riaan se storie vir laaste. Dit land harder nadat die strik benoem is."}], "en": [{"t": "p", "x": "This session has one job. It has to move the group from *offence is something that happens to me* to *offence is something I do*. Everything in the eight weeks rests on that. If the room leaves still putting offence in other people's behaviour, sessions 5, 6 and 7 will have nothing to hold on to."}, {"t": "p", "x": "The *skandalon* picture does the work, so give it time. The animal is not caught by the trap. It is caught by the bait. The hurt happens to you. The bite is yours."}, {"t": "p", "x": "**The new Cain passage does the same work with God's own voice**, and it may be the easier way in for some people. See the group answers below."}, {"t": "p", "x": "**Where it goes wrong:** the group hears blame. *So it is my fault that I am hurt?* No. The difference is between the wound and the wall. Riaan was genuinely wronged — the elders really did fail to phone him. The session is not arguing about the injury. It is asking about the three months."}, {"t": "p", "x": "Keep Riaan's story for the end. It lands harder once the trap has been named."}]}, "qhome": {"af": [{"q": "Wie se naam het by jou opgekom terwyl jy Riaan se storie gelees het?", "note": [{"t": "p", "x": "Byna almal het 'n naam. Dié wat sê \"niemand\" het gewoonlik iemand so lank gelede benoem dat die mens opgehou het om 'n mens te wees en 'n vasgestelde feit geword het. Moenie dit in die vertrek druk nie. Dit kom later vanself uit."}]}, {"q": "Wat vertel jy jouself van daardie mens — en weet jy regtig dat dit waar is?", "note": [{"t": "p", "x": "Die eerlike antwoord is gewoonlik 'n motief, nie 'n gebeurtenis nie. *Hy respekteer my nie. Sy was nog altyd so. Hulle het besluit ek maak nie saak nie.* 'n Gebeurtenis kan jy nagaan. 'n Motief byna nooit. Hierdie vraag doen die meeste werk van die hele week."}]}, {"q": "Wat sal dit jou kos om dit hierdie week te laat gaan?", "note": [{"t": "p", "x": "Regte antwoorde noem iets spesifieks wat hulle sal verloor: om reg te wees, 'n verskoning wat hulle geskuld word, die simpatie van mense wat die storie ken, die stand van die een wat verontreg is. 'n Vae antwoord soos \"net my trots\" beteken hulle het nog nie gekyk nie."}]}], "en": [{"q": "Whose name came to mind while you were reading Riaan's story?", "note": [{"t": "p", "x": "Almost everyone has a name. The ones who say \"nobody\" have usually named someone so long ago that the person has stopped being a person and become a settled fact. Do not push this in the room. It comes out later on its own."}]}, {"q": "What have you been telling yourself about that person — and do you actually know it is true?", "note": [{"t": "p", "x": "The honest answer is usually a motive, not an event. *He does not respect me. She has always been like this. They decided I do not matter.* You can check an event. You almost never can check a motive. This question does the most work all week."}]}, {"q": "What would it cost you to let it go this week?", "note": [{"t": "p", "x": "Real answers name something specific they would lose: being right, an apology they are owed, the sympathy of people who know the story, the standing of being the wronged one. A vague answer like \"just my pride\" means they have not looked yet."}]}]}, "qgroup": {"af": [{"q": "Jesus sê aanstoot kan nie vermy word nie. Hoekom is ons dan steeds geskok wanneer dit in die kerk gebeur?", "note": [{"t": "p", "x": "Omdat ons verwar wat die kerk geroep is om te wees met wat dit nou is. Ons verwag 'n klaar volk in plaas van 'n volk wat God nog besig is om klaar te maak."}, {"t": "p", "x": "Maar daar is 'n vriendeliker antwoord onder daardie een. **Die skok is bewys van liefde.** Spreuke 18:19 *(in die sessie)* sê 'n veronregte broer is ontoegankliker as 'n vestingstad. Hoe nader die band, hoe groter die val. 'n Vreemdeling kan jou nie werklik aanstoot gee nie. So die skok is nie 'n fout nie. Dit is wat dit kos om in mense belê te hê."}, {"t": "p", "x": "Die skade kom by die volgende stap, wanneer skok verander in *as dit hier gebeur, is dit nie eg nie*. Jesus het dit vooraf gekeer deur ons te waarsku. Hy het ons nie gewaarsku sodat ons minder van mekaar sou verwag nie. Hy het gewaarsku sodat dit, wanneer dit kom, nie ons geloof saam met dit sou vat nie."}, {"t": "p", "x": "*Let op:* iemand wat sê \"ek het beter van Christene verwag.\" Dit is eerlik en dit is waar. Die antwoord is nie om minder te verwag nie. Dit is om op te hou verras wees."}]}, {"q": "Is daar 'n verskil tussen seerkry en aanstoot neem? Waar lê die streep?", "note": [{"t": "p", "x": "Seerkry is wat met jou gebeur. Aanstoot is wat jy daarmee bou. Seerkry is 'n gebeurtenis. Aanstoot is 'n bouprojek."}, {"t": "p", "x": "Die groep gaan 'n skoon streep wil hê en daar is nie een nie. Daar is 'n rigting waarin jy beweeg. Maar daar is vier tekens dat jy dit oorgesteek het:"}, {"t": "list", "x": ["jy gaan dit weer deur wanneer niks nuuts gebeur het nie", "jy vertel dit aan iemand wat dit nie hoef te hoor nie", "jy begin alles wat hulle vroeër gedoen het in daardie lig lees", "jy begin doelbewus afstand hou"]}, {"t": "p", "x": "*Let op:* hierdie vraag kan die hele aand opvreet. Dit is werklik Sessie 5 se grond. Laat dit tien minute loop, sê dan so — \"ons kom oor vyf weke behoorlik hierby uit\" — in plaas daarvan om dit nou te probeer klaarmaak."}]}, {"q": "Riaan het niks gesê nie. Hoekom is stilte so dikwels ons eerste keuse — en wat kos dit?", "note": [{"t": "p", "x": "Stilte voel na die hoë pad. Dit lyk na geduld, na genade, na om nie 'n toneel te maak nie. Drie dinge is gewoonlik onder die oppervlak aan die gang."}, {"t": "p", "x": "Dit vermy die risiko van die gesprek. Dit hou jou in die reg — solank jy niks sê nie, is jy nog steeds die een wat verontreg is. En dit hou die storie joune, met geen feite wat mag inkom om dit te bederf nie."}, {"t": "p", "x": "Die koste is presies, en Riaan se storie wys dit. Stilte vat die enigste ding weg wat die storie kon regmaak. Hy het nooit van die oproep uitgevind nie, want om uit te vind sou beteken het om die gesprek te voer wat hy vermy. Drie maande se muur, gebou op 'n oproep wat niemand gemaak het nie."}, {"t": "p", "x": "*Let op:* die groep gaan die stilte goedkeur. Dit lees soos selfbeheersing. Druk een keer, saggies: *was dit genade, of was dit net goedkoper as die alternatief?*"}]}, {"q": "Ekstra: die vraag wat die Kain-gedeelte oopmaak — is dit sonde om aanstoot te neem?", "note": [{"t": "p", "x": "Iemand gaan dit in week een vra, en Genesis 4:6-7 antwoord dit beter as 'n definisie. God kom na Kain, wat 'n werklike griewe het, en Hy sê nie *jou kwaad wees is sonde* nie. Hy sê sonde hurk by die deur en Kain moet daaroor heers."}, {"t": "p", "x": "Dus: **die seerkry is nie die sonde nie. Die seerkry is die deur. Sonde is wat buite wag.**"}, {"t": "p", "x": "Twee dinge om vir die vertrek uit te wys. Eerstens praat God met die verontregte man **voordat** enigiets gebeur, en Hy doen dit vriendelik — met 'n vraag en 'n belofte, nie 'n bestrawwing nie. Dít is wat ons die groep vra om vir mekaar te doen. Tweedens sê God vir Kain dat hy dit *kan* oorheers. Die opdrag veronderstel dat dit moontlik is."}, {"t": "p", "x": "As iemand verder druk — *maar is dit dan nooit sonde nie?* — is die eerlike antwoord dat die Skrif dit ook nie neutraal laat nie. Hebreërs 12:15 noem wat daaruit groei 'n wortel van bitterheid wat baie besmet. Efesiërs 4:31 sê ons moet bitterheid, woede en kwaadwilligheid wegdoen. Galasiërs 5:20 lys *vyandskap, twis, jaloesie, woede, selfsug, tweedrag, verdeeldheid* onder die praktyke van die sondige natuur — dít is die aanstoot-familie, in dieselfde lys as afgodsdiens. En Matteus 6:15 is so skerp soos enigiets wat Jesus gesê het: as julle nie vergewe nie, sal julle Vader julle ook nie vergewe nie. *(Almal net in hierdie gids.)*"}, {"t": "p", "x": "Dus: die steek is nie sonde nie. Om te weier om daaroor te heers, is waar sonde inkom."}]}], "en": [{"q": "Jesus says offence cannot be avoided. So why are we still shocked when it happens in church?", "note": [{"t": "p", "x": "Because we mix up what the church is called to be with what it is right now. We expect a finished people instead of a people God is still finishing."}, {"t": "p", "x": "But there is a kinder answer underneath that one. **The shock is proof of love.** Proverbs 18:19 *(in the session)* says a brother offended is harder to win than a strong city. The closer the bond, the bigger the fall. A stranger cannot really offend you. So the shock is not a fault. It is what it costs to have invested in people."}, {"t": "p", "x": "The damage comes at the next step, when shock turns into *if it happens here, this is not real.* Jesus headed that off by telling us in advance. He did not warn us so that we would expect less of each other. He warned us so that when it came, it would not take our faith down with it."}, {"t": "p", "x": "*Watch for:* someone saying \"I expected better from Christians.\" That is honest and true. The answer is not to expect less. It is to stop being surprised."}]}, {"q": "Is there a difference between being hurt and taking offence? Where is the line?", "note": [{"t": "p", "x": "Hurt is what happens to you. Offence is what you build with it. Hurt is an event. Offence is a building project."}, {"t": "p", "x": "The group will want a clean line and there is not one. There is a direction of travel. But there are four signs that you have crossed it:"}, {"t": "list", "x": ["you go over it again when nothing new has happened", "you tell it to someone who does not need to hear it", "you start reading everything they did before in the light of it", "you begin keeping your distance on purpose"]}, {"t": "p", "x": "*Watch for:* this question can eat the whole evening. It really is Session 5's ground. Let it run ten minutes, then say so — \"we come back to this properly in five weeks\" — instead of trying to finish it now."}]}, {"q": "Riaan said nothing at all. Why is silence so often our first move — and what does it cost?", "note": [{"t": "p", "x": "Silence feels like the high road. It looks like patience, like grace, like not making a scene. Three things are usually going on underneath."}, {"t": "p", "x": "It avoids the risk of the conversation. It keeps you in the right — as long as you say nothing, you are still the one who was wronged. And it keeps the story yours, with no facts allowed in to spoil it."}, {"t": "p", "x": "The cost is exact, and Riaan's story shows it. Silence removes the only thing that could have corrected the story. He never found out about the phone call, because finding out would have meant having the conversation he was avoiding. Three months of wall, built on a phone call nobody made."}, {"t": "p", "x": "*Watch for:* the group will approve of the silence. It reads as self-control. Push once, gently: *was that grace, or was it just cheaper than the alternative?*"}]}, {"q": "Extra: the question the Cain passage raises — is being offended a sin?", "note": [{"t": "p", "x": "Somebody will ask this in week one, and Genesis 4:6-7 answers it better than a definition can. God comes to Cain, who has a real grievance, and He does not say *your anger is sin*. He says sin is crouching at the door and Cain must rule over it."}, {"t": "p", "x": "So: **the hurt is not the sin. The hurt is the door. Sin is what is waiting outside it.**"}, {"t": "p", "x": "Two things worth pointing out to the room. First, God speaks to the offended man **before** anything happens, and He does it kindly — with a question and a promise, not a telling-off. That is what we are asking the group to do for each other. Second, God tells Cain he *can* rule it. The command assumes it is possible."}, {"t": "p", "x": "If someone pushes further — *but is it never sin?* — the honest answer is that Scripture does not leave it neutral either. Hebrews 12:15 calls what grows from it a bitter root that spreads to many. Ephesians 4:31 tells us to put away bitterness, anger and malice. Galatians 5:20 lists *enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions* as works of the flesh — that is the offence family, in the same list as idolatry. And Matthew 6:15 is as sharp as anything Jesus said: if you do not forgive, your Father will not forgive you. *(All only in this guide.)*"}, {"t": "p", "x": "So: the sting is not sin. Refusing to rule it is where sin comes in."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Dink aan die laaste keer hierdie maand dat iemand 'n stokkie op jou pad gelos het. Nie 'n groot een nie. Wat het jy in die eerste tien sekondes gedoen?\"*"}], "en": [{"t": "p", "x": "*\"Think of the last time somebody put a stick in your path this month. Not a big one. What did you do in the first ten seconds?\"*"}]}, "title": "Die strik  ·  The trap"}, {"n": 2, "lead": {"af": [{"t": "p", "x": "**Hebreërs 12:15** · bitterheid groei in die gaping waar genade moes gewees het"}], "en": [{"t": "p", "x": "**Hebrews 12:15** · bitterness grows in the gap where grace should have been"}]}, "before": {"af": [{"t": "p", "x": "Sessie 1 het gesê die byt is joune. Sessie 2 vra hoekom jy gebyt het. Die antwoord is dat die sneller nie die oorsaak was nie."}, {"t": "p", "x": "Twee prente dra die sessie en hulle doen verskillende werk. Die **wortel** verduidelik hoekom dieselfde woorde op verskillende dae verskillend land. Die **bysteek** verduidelik hoekom dit oor 'n week erger word terwyl niks nuuts gebeur het nie. Druk die gifsakkie en jy stoot meer in as wat die by reggekry het. Elke keer wat jy dit weer deurgaan, druk jy."}, {"t": "p", "x": "Absalom is die swaar een. Lees 2 Samuel 13:22 hardop *(in die sessie)*: hy het nie 'n enkele woord met Amnon gepraat nie, twee jaar lank. Toe die moord. Toe die koninkryk wat skeur. Niks het in daardie twee jaar aan die buitekant verander nie. Alles het onder verander."}, {"t": "p", "x": "**Waar dit skeefloop:** die groep gebruik die wortel om werklike onreg weg te wuif — *jy was net moeg.* Sê duidelik dat die wortel verduidelik hoe sterk jy gereageer het, nie of die onreg werklik was nie. Marlene se leier het regtig niks gedoen nie. Hennie in Sessie 6 is regtig verkul. Die studie het albei nodig."}], "en": [{"t": "p", "x": "Session 1 said the bite is yours. Session 2 asks why you bit. The answer is that the trigger was not the cause."}, {"t": "p", "x": "Two pictures carry the session and they do different jobs. The **root** explains why the same words land differently on different days. The **bee sting** explains why it gets worse over a week when nothing new has happened. Squeeze the venom sac and you push in more than the bee managed. Every time you go over it, you squeeze."}, {"t": "p", "x": "Absalom is the heavy one. Read 2 Samuel 13:22 out loud *(in the session)*: he said nothing to Amnon, good or bad, for two years. Then the killing. Then the kingdom split. Nothing changed on the outside in those two years. Everything changed underneath."}, {"t": "p", "x": "**Where it goes wrong:** the group uses the root to wave away real wrongs — *you were just tired.* Say clearly that the root explains how strongly you reacted, not whether the wrong was real. Marlene's leader really had done nothing. Hennie in Session 6 really was cheated. The study needs both."}]}, "qhome": {"af": [{"q": "Watter woord, toon of soort mens kry 'n groter reaksie uit jou as wat dit behoort te kry?", "note": [{"t": "p", "x": "Mense vind hierdie een makliker as wat jy sou dink. Die teken is dat die reaksie buite verhouding is — groter as wat hulle self sou verdedig as hulle dit op video gesien het."}]}, {"q": "Waar kom dit vandaan? Wie het dit eerste gesê?", "note": [{"t": "p", "x": "Dit is die werklike vraag van die week, en dit is dikwels die eerste keer dat iemand dit vra. Verwag 'n ouer, 'n onderwyser, 'n eerste werkgewer, of 'n seisoen eerder as een mens."}]}, {"q": "Watter genade het jy self nodig gehad wat jy moeilik vir iemand anders gee?", "note": [{"t": "p", "x": "Die antwoorde is gewoonlik stil en spesifiek. Dit is die vers wat 'n spieël word."}]}], "en": [{"q": "What word, tone or kind of person gets a bigger reaction out of you than it should?", "note": [{"t": "p", "x": "People find this one easier than you would expect. The sign is that the reaction is out of proportion — bigger than they would defend if they saw it on video."}]}, {"q": "Where did that come from? Who said it first?", "note": [{"t": "p", "x": "This is the real question of the week, and it is often the first time anyone has asked them. Expect a parent, a teacher, a first boss, or a season rather than one person."}]}, {"q": "What grace have you needed yourself that you find hard to give someone else?", "note": [{"t": "p", "x": "The answers are usually quiet and specific. This is the verse turned into a mirror."}]}]}, "qgroup": {"af": [{"q": "Hebreërs sê bitterheid \"besmet baie\". Hoe verander een mens met aanstoot 'n hele groep?", "note": [{"t": "p", "x": "Byna nooit deur teen iemand te praat nie. Gewoonlik deur terug te trek."}, {"t": "p", "x": "Die groep verander vorm om die gaping sonder om te besluit. Grappies word versigtig. Gebed word vlakker. Mense hou op spontaan wees omdat hulle stilweg iemand se stemming bestuur. Niemand kan sê wat verander het nie, en dít is die punt. Hebreërs gebruik 'n bevlek-woord, nie 'n slaan-woord nie. Bitterheid val nie 'n groep aan nie. Dit kleur dit."}, {"t": "p", "x": "Die tweede manier is **werwing**. Aanstoot soek instemming, so dit vertel die storie aan mense wat dit nie hoef te gehoor het nie. Elke keer wat jy dit vertel, teken jy iemand aan."}, {"t": "box", "x": ["**'n Nota uit ons eie leierskap.**", "Om jou man of vrou van 'n griewe met 'n ander leier te vertel, voel heeltemal veilig. Dit is jou huwelik. Julle vertel mekaar alles.", "Maar dink aan wat jy nou net gedoen het. Jou maat dra nou 'n prentjie van daardie mens wat hulle nie self gebou het nie en nie kan afbreek nie. Jy maak dit dalk volgende week reg. Hulle is dalk 'n jaar later nog koel teenoor daardie mens. Hulle het nooit aanstoot geneem nie — hulle is gewerf.", "Daarom een praktyk wat oorweging werd is: **moenie met jou maat oor 'n ander leier praat voordat jy dit in jou eie hart uitgemaak het, of dit met die mens self uitgemaak het nie.** Vertel hulle dan die hele storie, insluitend hoe dit geëindig het.", "Twee grense daarop, en hulle maak saak. Dit is 'n reël oor griewe, nie oor jou huwelik nie — niemand vra jou om jou lewe weg te steek van die mens met wie jy saamleef nie. En as jy skade ly, of iets is werklik verkeerd en jy het hulp nodig, vertel iemand. Hierdie reël bestaan om te keer dat mense gewerf word. Dit is nie 'n rede om iets alleen te dra nie.", "Sleg hanteer, is dít presies hoe ons vestingstede teen mekaar bou — die sterk stad van Spreuke 18:19, net dat dit nou ons huwelike is wat die poorte toehou."]}, {"t": "p", "x": "*Let op:* as die groep eerlik is, gaan iemand besef dat hulle hierdie groep beskryf. Laat dit sit. Moenie dit red nie."}]}, {"q": "Hoekom maak dieselfde opmerking op een dag seer en op 'n ander dag nie?", "note": [{"t": "p", "x": "Omdat die opmerking die sneller is, nie die oorsaak nie. Wat verander, is die drie dinge wat die sessie noem — slaap, kos, tyd met God — plus geskiedenis, en dít is Marlene."}, {"t": "p", "x": "Daar is 'n ongemaklike punt hier, en dit is die moeite werd om te sê. As my reaksie verander terwyl die woorde dieselfde bly, dan gaan die meeste van die reaksie oor my. Dit is nie iets om oor skaam te wees nie. Dit is die diagnose wat verandering moontlik maak, want ek kan nie hulle woorde beheer nie en ek kan wél iets aan die wortel doen."}]}, {"q": "Hebreërs sê nie \"probeer harder\" nie — dit sê moenie by die genade verbyval nie. Hoe lyk dit op 'n Woensdag?", "note": [{"t": "p", "x": "Kyk na die werkwoord: *afvallig word*, verbyval. Dit is 'n versuim om te gaan haal, nie 'n versuim om te probeer nie. Genade is 'n voorraad, nie 'n stemming nie."}, {"t": "p", "x": "Die praktiese vraag is dus: wat is my werklike manier om genade in die middel van die week te kry? As die enigste antwoord Sondag is, het die wortel ses dae vir homself."}, {"t": "p", "x": "Die sessie gee drie vrae om as hek te gebruik voor enige besluit wat jy neem terwyl jy leeg loop:"}, {"t": "box", "x": ["**Het ek geslaap? Het ek geëet? Was ek by God?**", "As twee van die drie nee is, moenie vandag besluit nie. Kry eers genade, besluit dan."]}, {"t": "p", "x": "Twee ander antwoorde kom gewoonlik in die vertrek op, en albei is goed. Vat genade in voordat jy dit nodig het, eerder as net in 'n krisis. En hê iewers om dinge neer te sit — 'n mens vir wie jy dit hardop kan sê voordat dit hard word."}]}], "en": [{"q": "Hebrews says bitterness \"defiles many\". How does one offended person change a whole group?", "note": [{"t": "p", "x": "Almost never by speaking against anybody. Usually by pulling back."}, {"t": "p", "x": "The group changes shape around the gap without deciding to. Jokes get careful. Prayer gets shallower. People stop being spontaneous because they are quietly managing somebody's mood. Nobody can say what changed, and that is the point. Hebrews uses a staining word, not a striking word. Bitterness does not attack a group. It colours it."}, {"t": "p", "x": "The second way is **recruitment**. Offence wants agreement, so it tells the story to people who did not need to hear it. Every time you tell it, you sign somebody up."}, {"t": "box", "x": ["**A note from our own leadership.**", "Telling your husband or wife about a grievance with another leader feels completely safe. It is your marriage. You tell each other everything.", "But think about what you have just done. Your spouse now carries a picture of that person which they did not build and cannot take down. You may settle the matter next week. They may still be cool towards that person a year later. They were never offended — they were recruited.", "So one practice worth considering: **do not talk to your spouse about another leader until you have settled it in your own heart, or settled it with the person.** Then tell them the whole story, including how it ended.", "Two limits on that, and they matter. It is a rule about grievances, not about your marriage — nobody is asking you to hide your life from the person you live with. And if you are being harmed, or something is genuinely wrong and you need help, tell someone. This rule exists to stop people being recruited. It is not a reason to carry something alone.", "Handled badly, this is exactly how we build fortified cities against each other — the strong city of Proverbs 18:19, only now it is our marriages holding the gates shut."]}, {"t": "p", "x": "
