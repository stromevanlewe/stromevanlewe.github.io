<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leiersgids · Sessie 1 — Om Aanstoot te Neem</title>
<meta name="description" content="'n Tweetalige studie van agt sessies oor aanstoot — vir persoonlike voorbereiding en kleingroepbespreking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf7ef; --ink:#2b2117; --ink-2:#5a4a38; --ink-3:#8a7760; --ink-4:#a89885;
  --line:#efe2c8; --card:#ffffff; --sand:#fbf2e3; --gold:#d9b88c; --gold-d:#b0895a;
  --warm:#fef1d6; --warm-line:#f0d9b0; --deep:#2b2117; --shadow:0 8px 30px rgba(43,33,23,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
@media(min-width:768px){.wrap{padding:0 32px}}

/* header */
header.top{position:sticky;top:0;z-index:40;background:rgba(253,247,239,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:500;color:var(--ink-3);min-width:0}
.crumbs a{text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pillbox{display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.pillbox button{border:0;background:transparent;color:var(--ink-3);font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;padding:7px 11px;border-radius:999px;cursor:pointer}
.pillbox button:hover{color:var(--ink)}
.pillbox button[aria-pressed="true"]{background:var(--deep);color:#fff}

/* hero */
.hero{padding-block:34px 8px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d);margin-bottom:12px}
.eyebrow i{display:block;width:32px;height:1px;background:var(--gold);font-style:normal}
.hero h1{font-size:clamp(30px,6vw,50px);line-height:1.02}
.hero .sub{margin-top:10px;font-size:clamp(16px,2.4vw,19px);font-weight:500;color:var(--ink-2)}
.hero .opening{margin-top:16px;max-width:54ch;font-family:Fraunces,Georgia,serif;font-size:clamp(17px,2.4vw,19.5px);line-height:1.5;color:var(--ink)}
.hero .lede{margin-top:14px;max-width:56ch;font-size:15px;line-height:1.65;color:var(--ink-2)}

.fabline{margin:14px 0 0;max-width:60ch;font-size:14px;line-height:1.6;color:var(--ink-2)}
.fabline .link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--gold)}
.fabline .link:hover{border-bottom-color:var(--ink)}
.selfstrip{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sand);border:1px dashed var(--warm-line);border-radius:14px;padding:13px 16px}
.selfstrip span{font-size:14px;line-height:1.5;color:var(--ink-2)}
.selfstrip button{margin-left:auto;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:9px 15px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;white-space:nowrap}
.selfstrip button:hover{background:#000}
.note{margin:22px 0 4px;background:#fff;border:1px solid var(--warm-line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;box-shadow:var(--shadow)}
.note .ico{flex:0 0 auto;width:34px;height:34px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:15px}
.note p{margin:0 0 6px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note p:last-child{margin:0}
.note b{color:var(--ink)}

/* layout */
.cols{display:flex;gap:34px;padding-block:28px 110px;align-items:flex-start}
aside{display:none}
@media(min-width:900px){aside{display:block;flex:0 0 236px;position:sticky;top:74px}}
main{flex:1;min-width:0;max-width:660px}
.navlabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4);margin-bottom:10px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit;transition:.15s}
.navbtn:hover{background:#fff}
.navbtn[aria-current="true"]{background:#fff;border-color:var(--deep);box-shadow:var(--shadow)}
.navbtn .row{display:flex;align-items:center;gap:11px}
.navbtn .num{flex:0 0 auto;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font:700 12px/1 Inter,sans-serif;background:#fff;color:var(--ink-3);border:1px solid var(--line)}
.navbtn[aria-current="true"] .num{background:var(--deep);color:#fff;border-color:var(--deep)}
.navbtn .t{min-width:0}
.navbtn .t b{display:block;font:600 13px/1.25 Inter,sans-serif;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbtn[aria-current="true"] .t b{color:var(--ink)}
.navbtn .t span{display:block;font-size:11px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
@media(min-width:900px){.scroller{display:none}}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font:500 13px/1 Inter,sans-serif;color:var(--ink-2);cursor:pointer}
.chip[aria-current="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}

/* session */
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.skicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.shead h2{margin-top:5px;font-size:clamp(23px,4vw,31px);line-height:1.12}
.shead .theme{margin-top:6px;font-size:14px;color:var(--ink-3)}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .inner{padding:18px 20px}
@media(min-width:768px){.card .inner{padding:22px 26px}}
.klabel{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.klabel .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--gold-d)}
.klabel .r{font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2)}
blockquote.verse{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(18px,2.7vw,21px);line-height:1.45;font-weight:500}
.vbar{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vbar button{border:1px solid var(--line);background:var(--bg);color:var(--ink-3);border-radius:999px;padding:5px 10px;font:600 11px/1 Inter,sans-serif;cursor:pointer}
.vbar button[aria-pressed="true"]{background:var(--deep);color:#fff;border-color:var(--deep)}
.vbar a.open{margin-left:auto;font:600 11.5px/1 Inter,sans-serif;color:var(--ink-3);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px;background:var(--bg)}
.vbar a.open:hover{border-color:var(--deep);color:var(--ink)}

.simply{font-size:15.5px;line-height:1.65;color:var(--ink-2);margin:0 0 6px}
.simply b{color:var(--ink)}
.simplynote{font-size:13.5px;line-height:1.6;color:var(--ink-3);font-style:italic;margin:8px 0 0}

h3.sec{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:26px 0 10px}
.prose p{margin:0 0 13px;font-size:15.5px;line-height:1.72;color:var(--ink-2)}
.lead-prose,.simply,.simplynote,h3.sec{padding-inline:6px}
@media(min-width:768px){.lead-prose,.simply,.simplynote,h3.sec{padding-inline:10px}}
.prose p:last-child{margin-bottom:0}
.prose b{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.box{background:var(--sand);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:0 14px 14px 0;padding:14px 18px;margin:16px 0}
.box p{margin:0 0 9px;font-size:14.5px;line-height:1.68;color:var(--ink-2)}
.box p:last-child{margin:0}

.learn{background:var(--deep);color:#f5e9d6;border-radius:18px;padding:20px}
@media(min-width:768px){.learn{padding:24px 28px}}
.learn h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold);margin:0 0 14px}
.learn ol{margin:0;padding:0;list-style:none;counter-reset:l}
.learn li{counter-increment:l;display:flex;gap:13px;margin-bottom:12px;font-size:15px;line-height:1.65}
.learn li:last-child{margin:0}
.learn li::before{content:counter(l);flex:0 0 auto;width:22px;height:22px;margin-top:2px;border-radius:999px;background:rgba(217,184,140,.18);color:var(--gold);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif}
.learn b{color:#fff}
.learn a{color:var(--gold)}
.learn .caveat{margin:14px 0 0;font-size:13.5px;line-height:1.6;color:#cbb99e;font-style:italic}

.story{background:#fff;border:1px solid var(--warm-line);border-radius:18px;padding:20px;position:relative;overflow:hidden}
@media(min-width:768px){.story{padding:24px 28px}}
.story::after{content:"";position:absolute;right:-42px;top:-42px;width:130px;height:130px;border-radius:999px;background:var(--warm);pointer-events:none}
.story>*{position:relative}
.story h3{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 12px}
.story h3 i{font-style:normal;width:26px;height:26px;border-radius:999px;background:var(--warm);border:1px solid var(--warm-line);display:grid;place-items:center;font-size:12px}
.story p{margin:0 0 12px;font-size:15px;line-height:1.78;color:#4a3c2b}
.story p:last-child{margin:0}
.story .lead{font-size:13.5px;color:var(--ink-3);font-style:italic}

.extras{background:var(--sand);border:1px solid var(--line);border-radius:18px;padding:18px}
@media(min-width:768px){.extras{padding:22px 26px}}
.extras h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 14px}
.ex{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:10px}
.ex:last-child{margin:0}
.ex .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.ex .top b{font:600 13.5px/1 Inter,sans-serif}
.ex .top a{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.03em;background:var(--deep);color:#fff;border-radius:999px;padding:5px 9px;text-decoration:none}
.ex p{margin:0;font-size:14px;line-height:1.62;color:var(--ink-2)}

.week{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
@media(min-width:768px){.week{padding:22px 26px}}
.week h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--gold-d);margin:0 0 10px}

.qs{border:1px solid var(--line);border-radius:18px;padding:18px 20px;background:#fff}
@media(min-width:768px){.qs{padding:22px 26px}}
.qs.group{background:var(--deep);border-color:var(--deep)}
.qs h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.qs.group h3{color:var(--gold)}
.qs .hint{font-size:12.5px;color:var(--ink-4);margin:0 0 14px}
.qs.group .hint{color:#b6a184}
.qs ol{margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{counter-increment:q;display:flex;gap:12px;margin-bottom:11px;font-size:15px;line-height:1.62;color:var(--ink-2)}
.qs li:last-child{margin:0}
.qs li::before{content:"Q" counter(q);flex:0 0 auto;font:700 11px/1.5 Inter,sans-serif;color:var(--ink-4)}
.qs.group li{color:#f0e4d1}
.qs.group li::before{color:var(--gold)}

.pray{border:1px dashed var(--warm-line);background:var(--warm);border-radius:18px;padding:18px 20px}
@media(min-width:768px){.pray{padding:20px 26px}}
.pray h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:#8a5a2a;margin:0 0 8px}
.pray p{margin:0;font-family:Fraunces,Georgia,serif;font-size:17px;line-height:1.55;color:#4a3c2b}

.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 17px;font:500 13.5px/1 Inter,sans-serif;cursor:pointer;color:var(--ink)}
.pager button:disabled{opacity:.35;cursor:default}
.pager button.next{background:var(--deep);color:#fff;border-color:var(--deep)}
.pager .count{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-4)}

/* scripture refs */
a.ref{text-decoration:none;border-bottom:1px solid var(--gold);white-space:nowrap;color:inherit}
a.ref:hover{border-bottom-color:var(--ink);background:rgba(217,184,140,.16)}
a.ref sup{font-size:9px;letter-spacing:.04em;color:var(--gold-d);margin-left:2px;vertical-align:super}
.learn a.ref{border-bottom-color:var(--gold)}
.learn a.ref sup{color:var(--gold)}

/* self-check */
.fab{position:fixed;right:14px;bottom:14px;z-index:50;border:1px solid var(--deep);background:var(--deep);color:#fff;border-radius:999px;padding:11px 16px;font:600 12.5px/1 Inter,sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(43,33,23,.28);max-width:calc(100% - 28px)}
@media(min-width:768px){.fab{right:20px;bottom:20px;padding:13px 19px;font-size:13.5px}}
dialog.sheet{border:0;padding:0;border-radius:20px;max-width:620px;width:calc(100% - 28px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(43,33,23,.3)}
dialog.sheet::backdrop{background:rgba(43,33,23,.45)}
.sheet .head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:22px 24px 0}
.sheet h2{font-size:23px}
.sheet .close{border:1px solid var(--line);background:#fff;border-radius:999px;width:32px;height:32px;font-size:16px;line-height:1;cursor:pointer;color:var(--ink-3)}
.sheet .body{padding:14px 24px 24px}
.sheet .body p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}
.sheet ol.check{list-style:none;margin:14px 0;padding:0;counter-reset:c}
.sheet ol.check li{counter-increment:c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;font-size:14.5px;line-height:1.55}
.sheet ol.check li::before{content:counter(c);flex:0 0 auto;width:21px;height:21px;border-radius:999px;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font:700 11px/1 Inter,sans-serif;color:var(--ink-3)}
.sheet .prog{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);opacity:.8;margin:0 0 10px}
.sheet .wq{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;margin:0 0 18px;color:var(--ink)}
.sheet .opts{display:grid;gap:8px;margin:0 0 4px}
.sheet .opts button{width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:600 15px/1.3 Inter,sans-serif;color:var(--ink);cursor:pointer}
.sheet .opts button:hover{border-color:var(--gold);background:var(--sand)}
.sheet .mirror{display:grid;gap:10px;margin:14px 0}
@media(min-width:520px){.sheet .mirror{grid-template-columns:1fr 1fr}}
.sheet .mcol{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:#fff}
.sheet .mcol.spirit{background:var(--warm);border-color:var(--warm-line)}
.sheet .mcol h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.sheet .mcol ul{list-style:none;margin:0;padding:0;font-size:14.5px;line-height:1.85;color:var(--ink-2)}
.sheet .namein{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:13px 15px;font:500 16px/1.3 Inter,sans-serif;color:var(--ink);background:#fff;margin:4px 0 10px}
.sheet .namein:focus{outline:none;border-color:var(--gold)}
.sheet .privacy{font-size:13px;line-height:1.6;color:var(--ink-3);background:var(--sand);border-radius:12px;padding:11px 13px;margin:0 0 14px}
.sheet .go{background:var(--deep);color:#fff;border:1px solid var(--deep);border-radius:999px;padding:12px 20px;font:600 14.5px/1 Inter,sans-serif;cursor:pointer}
.sheet .ghost{background:none;border:0;padding:10px 2px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-3);cursor:pointer;text-decoration:underline}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.sheet .doors{list-style:none;margin:12px 0 0;padding:0}
.sheet .doors li{padding:4px 0 4px 15px;position:relative;font-size:14.5px;line-height:1.5}
.sheet .doors li:before{content:"\2192";position:absolute;left:0;opacity:.5}
.sheet .close-note{background:var(--warm);border:1px solid var(--warm-line);border-radius:14px;padding:14px 16px;font-size:14.5px;line-height:1.65;color:#4a3c2b;margin-top:14px}

/* leader */
details.leader{margin-top:34px;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
details.leader summary{cursor:pointer;padding:16px 20px;font:600 13.5px/1 Inter,sans-serif;color:var(--ink-2);list-style:none;display:flex;align-items:center;gap:10px}
details.leader summary::-webkit-details-marker{display:none}
details.leader summary::before{content:"›";display:inline-block;transition:.2s;font-size:19px;color:var(--ink-4)}
details.leader[open] summary::before{transform:rotate(90deg)}
details.leader .lbody{padding:0 20px 20px}
details.leader .lbody p{font-size:14.5px;line-height:1.7;color:var(--ink-2);margin:0 0 12px}

footer.foot{border-top:1px solid var(--line);background:rgba(255,255,255,.6)}
.footin{padding-block:22px 34px;font-size:12px;line-height:1.7;color:var(--ink-4)}
.footin p{margin:0 0 8px}
.footin a{color:var(--ink-3)}
.footin .rights{font-size:11px;line-height:1.6}

@media print{
  header.top,aside,.scroller,.pager,.fab,.crumbs,.ctrl{display:none!important}
  body{background:#fff}
  .card,.learn,.story,.extras,.week,.qs,.pray{box-shadow:none;break-inside:avoid}
  .learn,.qs.group{background:#fff!important;color:#000!important;border:1px solid #ccc!important}
  .learn li,.qs.group li{color:#000!important}
  .learn h3,.qs.group h3{color:#666!important}
}

/* ---- leiersgids ---- */
body{--gp:#2f5d50}
.lbadge{display:inline-flex;align-items:center;gap:7px;background:var(--gp);color:#fff;border-radius:999px;padding:6px 13px;font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase}
.lblock{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 14px 14px 0;padding:15px 17px;margin:18px 0}
.lblock>h4{font:700 11px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gp);margin:0 0 9px}
.lblock p{font-size:14.7px;line-height:1.72;color:#22322c;margin:0 0 11px}
.lblock p:last-child{margin-bottom:0}
.lblock ul{margin:0 0 11px;padding-left:19px;font-size:14.7px;line-height:1.72;color:#22322c}
.lblock .lbox{background:#fff;border:1px solid #cfe0d9;border-radius:12px;padding:13px 15px;margin:12px 0}
.lblock table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.lblock td{border-bottom:1px solid #d8e6e0;padding:8px 9px;vertical-align:top;line-height:1.55}
.lnote{border-left:3px solid var(--gp);background:#f2f7f5;border-radius:0 12px 12px 0;padding:12px 15px;margin:10px 0 4px}
.lnote p{font-size:14.4px;line-height:1.7;color:#22322c;margin:0 0 10px}
.lnote p:last-child{margin-bottom:0}
.lnote ul{margin:0 0 10px;padding-left:19px;font-size:14.4px;line-height:1.7;color:#22322c}

<script>
const DATA = {"versions": {"AFR83": {"id": 6, "lang": "af", "name": "Afrikaans 1983"}, "AFR53": {"id": 5, "lang": "af", "name": "Afrikaans 1933/1953"}, "NLV": {"id": 117, "lang": "af", "name": "Nuwe Lewende Vertaling"}, "ESV": {"id": 59, "lang": "en", "name": "English Standard Version"}, "NIV": {"id": 111, "lang": "en", "name": "New International Version"}}, "books": {"af": {"Genesis": "GEN", "Eksodus": "EXO", "Levitikus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Konings": "1KI", "2 Konings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Spreuke": "PRO", "Prediker": "ECC", "Jesaja": "ISA", "Jeremia": "JER", "Matteus": "MAT", "Matthéüs": "MAT", "Markus": "MRK", "Lukas": "LUK", "Johannes": "JHN", "Handelinge": "ACT", "Romeine": "ROM", "1 Korintiërs": "1CO", "2 Korintiërs": "2CO", "Galasiërs": "GAL", "Efesiërs": "EPH", "Filippense": "PHP", "Kolossense": "COL", "1 Timoteus": "1TI", "2 Timoteus": "2TI", "Hebreërs": "HEB", "Jakobus": "JAS", "1 Petrus": "1PE", "2 Petrus": "2PE", "Judas": "JUD", "Openbaring": "REV"}, "en": {"Genesis": "GEN", "Exodus": "EXO", "Leviticus": "LEV", "1 Samuel": "1SA", "2 Samuel": "2SA", "1 Kings": "1KI", "2 Kings": "2KI", "Psalm": "PSA", "Psalms": "PSA", "Proverbs": "PRO", "Ecclesiastes": "ECC", "Isaiah": "ISA", "Jeremiah": "JER", "Matthew": "MAT", "Mark": "MRK", "Luke": "LUK", "John": "JHN", "Acts": "ACT", "Romans": "ROM", "1 Corinthians": "1CO", "2 Corinthians": "2CO", "Galatians": "GAL", "Ephesians": "EPH", "Philippians": "PHP", "Colossians": "COL", "1 Timothy": "1TI", "2 Timothy": "2TI", "Hebrews": "HEB", "James": "JAS", "1 Peter": "1PE", "2 Peter": "2PE", "Jude": "JUD", "Revelation": "REV"}}, "sessions": [{"n": 1, "id": "s1", "title": {"af": "Die strik", "en": "The trap"}, "theme": {"af": "Noem die ding op sy naam", "en": "Naming the thing"}, "keyRef": {"af": "Lukas 17:1", "en": "Luke 17:1"}, "osis": "LUK.17.1", "texts": {"AFR83": "Jesus het vir sy dissipels gesê: “Dit is onvermydelik dat daar dinge kom wat mense laat struikel. Maar ellende wag vir die mens wat die oorsaak daarvan is.”", "AFR53": "En Hy het vir sy dissipels gesê: Dit is onvermydelik dat die struikelblokke kom, maar wee hom deur wie hulle kom.", "NLV": "Jesus het aan sy dissipels gesê: “Dit is onmoontlik dat dinge wat mense laat struikel, nie oor julle pad kom nie. Groot ellende wag egter op hulle deur wie dit veroorsaak word.”", "ESV": "And he said to his disciples, “Temptations to sin are sure to come, but woe to the one through whom they come!”", "NIV": "Jesus said to his disciples: “Things that cause people to stumble are bound to come, but woe to anyone through whom they come.”"}, "simply": {"af": "Aanstoot gaan kom. Jesus sê dit reguit. Die vraag is nooit of jy seer gaan kry nie — dit is wat jy daarna doen.", "en": "Offence is going to come. Jesus says so plainly. The question is never whether you will be hurt — it is what you do next."}, "simplyNote": {"af": "", "en": ""}, "meaning": {"af": [{"t": "p", "x": "Die Griekse woord agter \"aanstoot\" is *skandalon*. Dit was nie 'n kerkwoord nie. Dit was die naam van die stokkie in 'n wildstrik — die plaatjie waarop die aas sit. Die dier word nie deur die strik gevang nie. Dit word deur die aas gevang."}, {"t": "p", "x": "Dit is die prentjie. Niemand dwing jou in aanstoot in nie. Iemand los 'n klein stokkie op jou pad — 'n woord, 'n stilte, 'n besluit waarvan niemand jou vertel het nie — en jý besluit of jy byt. Die seer gebeur met jou. Die byt is joune."}, {"t": "box", "x": ["**Hou hierdie beeld.** In Augustus 2018 het duikers by Oaxaca in Meksiko 'n weggegooide visnet gekry — 'n sogenaamde spooknet — met omtrent 300 bedreigde seeskilpaaie dood daarin. Party van hulle het minder as 'n voet onder die wateroppervlak verdrink. Die net het hulle nie doodgemaak nie. Om nie uit te kón kom nie, het."]}, {"t": "box", "x": ["**Sonde hurk by die deur** — Genesis 4:6-7", "Kain het 'n werklike griewe gehad. Sy offer is nie aanvaar nie en sy broer s'n wel. God maak nie of dit nie so is nie. Hy kom praat met Kain daaroor.", "Kyk mooi na wat God **nie** sê nie. Hy sê nie *jou kwaad wees is sonde* nie. Hy sê: *\"Waarom is jy kwaad? Waarom is jy bedruk? Wag daar nie vir jou blydskap as jy goed doen nie? As jy nie goed doen nie — die sonde wag jou in daarbuite en hy wil jou in sy mag kry. Maar jy moet oor hom heers.\"* (AFR83) Die NLV hou die beeld van die deur: *\"Sonde hurk by die deur om jou te oorweldig, maar jy moet dit oorwin.\"*", "Die seerkry is nie die sonde nie. Die seerkry is die **deur**. Sonde is die ding wat buite wag. En God sê vir Kain, reguit, dat hy daaroor kan heers.", "Kain het nie. Twee verse later lê daar 'n lyk in 'n land.", "Dit is die hele studie in een prentjie. Iets word aan jou gedoen — soms iets wat werklik onregverdig is. Dít is die deur wat oopgaan. Wat jy in die volgende tien sekondes doen, bepaal wat daardeur kom."]}], "en": [{"t": "p", "x": "The Greek word behind \"offence\" is *skandalon*. It was not a religious word. It was the name of the small stick in an animal trap — the piece that holds the bait. The animal is not caught by the trap. It is caught by the bait."}, {"t": "p", "x": "That is the picture. Nobody forces you into offence. Someone leaves a small stick in your path — a word, a silence, a decision you were not told about — and you decide whether to bite. The hurt happens to you. The bite is yours."}, {"t": "box", "x": ["**Worth keeping in your head.** In August 2018 divers off Oaxaca, Mexico, found an abandoned fishing net — a \"ghost net\" — with about 300 endangered sea turtles dead inside it. Some had drowned less than a foot below the surface. The net did not kill them. Not getting out of it did."]}, {"t": "box", "x": ["**Sin is crouching at the door** — Genesis 4:6-7", "Cain had a real grievance. His offering was refused and his brother's was accepted. God does not pretend otherwise. He comes and speaks to Cain about it.", "Look carefully at what God does **not** say. He does not say *your anger is sin*. He says: *\"Why are you angry, and why has your face fallen? If you do well, will you not be accepted? And if you do not do well, sin is crouching at the door. Its desire is for you, and you must rule over it.\"*", "The hurt is not the sin. The hurt is the **door**. Sin is the thing waiting outside it. And God tells Cain plainly that he can rule over it.", "Cain did not. Two verses later there is a body in a field.", "That is the whole study in one picture. Something is done to you — sometimes something genuinely unfair. That is the door opening. What you do in the next ten seconds decides what comes through it."]}]}, "points": {"af": [{"t": "list", "x": ["Jesus belowe nie 'n kerk waar niks seermaak nie. Hy belowe dat dit **wel** gaan seermaak, en Hy waarsku die een wat dit veroorsaak.", "Aanstoot begin gewoonlik by 'n verwagting, nie by 'n aanval nie: *\"Hulle moes tog...\"*", "Die strik voel na beskerming. Afstand voel veilig. Dit is juis hoekom die strik werk. Jy kan nie keer dat strikke gestel word nie. Jy kan weier om in die tande gevang te word."]}], "en": [{"t": "list", "x": ["Jesus does not promise a church where nothing hurts. He promises that it *will* hurt, and warns the one who causes it.", "Offence usually starts with an expectation, not an attack: *\"They should have...\"*", "The trap feels like protection. Distance feels safe. That is why it works. You cannot stop traps being set. You can refuse to stay in the teeth."]}]}, "story": {"af": [{"t": "p", "x": "Riaan was elf jaar in die gemeente. Hy het die klankspan begin toe dit een luidspreker en 'n geleende menger was. Hy het elke mens op daardie diens-rooster self opgelei. In Maart vra die ouderlinge iemand anders om dit te lei — iemand wat twee jaar daar is. Niemand het Riaan gebel nie. Hy het dit in die span se WhatsApp-groep gelees, op 'n Dinsdagaand, in 'n boodskap wat begin het met \"Welkom aan Christo as ons nuwe...\""}, {"t": "p", "x": "Hy het 'n antwoord getik. Uitgevee. Nog een getik. Uitgevee. Toe draai hy die foon om op die tafel en sê niks."}, {"t": "p", "x": "Dít was die lokval (die aas). Nie sý besluit nie — die stilte. Die volgende drie maande het Riaan laat gekom en vroeg gery. Hy het opgehou antwoord in die groep. Hy het die saak so in detail in sy kop gebou dat hy dit teen Junie kon opsê. *\"Elf jaar.\"* *\"Niemand laat my weet nie.\"* *\"Dit is nie eers met my bespreek nie.\"*"}, {"t": "p", "x": "Dit is wat hy nooit uitgevind het nie: die ouderlinge hét vir Christo gevra om hom te bel. Christo, wat senuweeagtig en nuut was, het dit aanhou uitstel."}, {"t": "p", "x": "Drie maande se muur, gebou op 'n oproep wat nooit gemaak is nie."}], "en": [{"t": "p", "x": "Riaan had been at the church eleven years. He started the sound team when it was one speaker and a borrowed mixer. He trained every person on that roster. In March the elders asked someone else to lead it — someone who had been there two years. Nobody phoned Riaan. He found out in the team WhatsApp group, on a Tuesday night, in a message that started \"Welcome to Christo as our new...\""}, {"t": "p", "x": "He typed a reply. Deleted it. Typed another. Deleted it. Then he put the phone face down and said nothing at all."}, {"t": "p", "x": "That was the bite. Not the decision — the silence. For the next three months Riaan came late and left early. He stopped answering the group. He built the case in his head so carefully that by June he could recite it. Eleven years. Not one phone call."}, {"t": "p", "x": "Here is what he never found out: the elders had asked Christo to phone him. Christo, who was nervous and new, kept putting it off."}, {"t": "p", "x": "Three months of wall, built on a phone call that never got made."}]}, "extras": {"af": [{"ref": "Spreuke 18:19", "osis": "PRO.18.19", "note": "Hoe nader die verhouding, hoe dikker die mure. 'n Vreemdeling kan jou nie regtig aanstoot gee nie."}, {"ref": "Matteus 24:10", "osis": "MAT.24.10", "note": "Jesus trek die lyn: eers aanstoot, dan verraad, dan haat. Dit bly nooit waar dit begin het nie."}, {"ref": "Prediker 7:21-22", "osis": "ECC.7.21", "note": "Jy was ook al iemand se stokkie (strik)."}], "en": [{"ref": "Proverbs 18:19", "osis": "PRO.18.19", "note": "The closer the relationship, the thicker the walls. A stranger cannot really offend you."}, {"ref": "Matthew 24:10", "osis": "MAT.24.10", "note": "Jesus traces the line: offence first, then betrayal, then hate. It never stays where it started."}, {"ref": "Ecclesiastes 7:21-22", "osis": "ECC.7.21", "note": "You have also been someone's small stick."}]}, "week": {"af": [{"t": "p", "x": "Wanneer jy dit voel opkom — daardie warmte in die bors — sê dit hardop voordat jy antwoord: *\"Dis 'n stokkie (strik). Ek byt nie.\"* En vra dan die eerlike vraag voordat jy die saak begin bou: **weet ek werklik hoekom hulle dit gedoen het?**"}], "en": [{"t": "p", "x": "When you feel it rise — that heat in the chest — name it out loud before you respond: *\"That's a stick. I'm not biting.\"* Then ask the honest question before you build the case: **do I actually know why they did that?**"}]}, "qhome": {"af": ["Wie se naam het by jou opgekom terwyl jy Riaan se storie gelees het?", "Wat vertel jy jouself al 'n ruk lank van daardie persoon — en weet jy regtig dat dit waar is?", "Wat sal dit jou kos om dit hierdie week te laat gaan? Wees spesifiek."], "en": ["Whose name came to mind while you were reading Riaan's story?", "What have you been telling yourself about that person — and do you actually know it is true?", "What would it cost you to let it go this week? Be specific."]}, "qgroup": {"af": ["Jesus sê aanstoot is onvermydelik. Hoekom is ons dan steeds geskok wanneer dit in die kerk gebeur?", "Is daar 'n verskil tussen seerkry en aanstoot neem? Waar presies lê die lyn?", "Riaan het niks gesê nie. Hoekom is stilte so dikwels ons eerste keuse — en wat kos dit ons?"], "en": ["Jesus says offence is unavoidable. So why are we still shocked when it happens in church?", "Is there a difference between being hurt and taking offence? Where exactly is the line?", "Riaan said nothing at all. Why is silence so often our first move — and what does it cost us?"]}, "prayer": {"af": "*Here, U het gesê dit sal kom. Help my om die stokkie (strik) te sien voordat ek byt. Waar ek al 'n muur gebou het, wys my die eerste baksteen — en gee my die moed om dit af te breek.*", "en": "*Lord, You said it would come. Help me see the stick before I bite. Where I have already built a wall, show me the first brick — and give me the courage to take it down.*"}}], "selfcheck": {"af": {"intro": ["Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Die toets kan dus nie wees \"voel ek aanstoot?\" nie — niemand antwoord dít eerlik nie. Die toets moet oor simptome gaan.", "Paulus lys hulle in Galasiërs 5:19-21, en langs verse 22-23 gelees werk dit soos 'n diagnose. Aan die een kant: vyandskap, twis, jaloesie, woede-uitbarstings, selfsug, tweedrag, verdeeldheid. Aan die ander kant: liefde, blydskap, vrede, geduld, vriendelikheid. Jy kan nie in albei tegelyk wandel nie. As die eerste lys is wat opkom wanneer jy aan 'n bepaalde mens dink, sit jou voet in die strik — hoe goed jou saak ook al is.", "**Ses eerlike vrae. Kies een mens en antwoord vir hulle.**"], "questions": ["Wanneer hulle naam opkom, wat gebeur in jou bors?", "As jy hulle in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie vertel aan iemand wat dit nie hoef te gehoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir hulle?", "Kan jy God hardop, by die naam, vir hulle dank en dit bedoel?", "Kan jy in 'n vertrek sit en hoor hoe hulle geprys word sonder om 'n \"maar\" by te sit?"], "close": "**As verskeie van dié raak vat:** jy is nie 'n slegte mens nie en jy is waarskynlik nie verkeerd oor die feite nie. Jy is in 'n strik. Om reg te wees is wat die meeste mense daarin hou. Gaan terug na sessie 5 (gee die saak oor), sessie 6 (gaan na hulle), of sessie 7 (skrap die skuld) — watter een jy ook al vermy het."}, "en": {"intro": ["The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel *right*. So the test cannot be \"am I offended?\" — nobody answers that honestly. The test has to be about symptoms.", "Paul lists them in Galatians 5:19-21, and read side by side with verses 22-23 they work as a diagnostic. On the one side: enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions. On the other: love, joy, peace, patience, kindness. You cannot walk in both at once. If the first list is what comes up when you think of a particular person, your foot is in the trap, however good your case is.", "**Six honest questions. Pick one person and answer for them.**"], "questions": ["When their name comes up, what happens in your chest?", "If you saw them in the shop, would you turn down a different aisle?", "Have you told the story to someone who did not need to hear it?", "Do you find yourself hoping something goes slightly wrong for them?", "Can you thank God for them out loud, by name, and mean it?", "Could you sit in a room and hear them praised without adding a \"but\"?"], "close": "**If several of those land:** you are not a bad person and you are probably not wrong about the facts. You are in a trap. Being right is what keeps most people in it. Go back to Session 5 (hand the case over), Session 6 (go to them), or Session 7 (cancel the debt) — whichever one you have been avoiding."}}, "check": {"af": {"step": "Stap", "of": "van", "mirrorTitle": "Eers die spieël", "mirrorLead": "Die moeilikste ding van aanstoot is dat die mens wat daarin is, gewoonlik laaste weet. Jy voel nie aanstoot nie. Jy voel **reg**. Daarom kan die toets nie wees \"voel ek aanstoot?\" nie. Niemand antwoord dít eerlik nie.", "mirrorLead2": "Paulus gee vir ons 'n ander soort toets. Hy sit twee lyste langs mekaar in Galasiërs 5:19-23. Jy kan nie in albei tegelyk loop nie. Kyk watter lys opkom wanneer jy aan een bepaalde mens dink.", "fleshTitle": "Die vlees", "flesh": ["vyandskap", "twis", "jaloesie", "woede-uitbarstings", "selfsug", "tweedrag", "verdeeldheid"], "spiritTitle": "Die Gees", "spirit": ["liefde", "blydskap", "vrede", "geduld", "vriendelikheid", "goedhartigheid", "getrouheid"], "mirrorClose": "Hierdie toets vra nie of jou saak goed is nie. Dit vra net wat in jou gebeur.", "go": "Ek is gereed", "nameTitle": "Wie is die mens?", "nameLead": "Dink aan een mens. Tik hulle naam, of laat dit leeg as jy liewer nie wil nie.", "namePlaceholder": "Naam", "namePrivacy": "Wat jy hier tik bly op jou foon. Dit word nêrens gestoor of gestuur nie, ook nie op hierdie toestel nie. Maak die blad toe en dit is weg.", "nameSkip": "iemand", "start": "Begin", "yes": "Ja", "unsure": "Nie seker", "no": "Nee", "back": "Terug", "q": ["Wanneer {n} se naam opkom, trek iets in jou bors saam?", "As jy {n} in die winkel sien, sal jy in 'n ander gang afdraai?", "Het jy die storie oor {n} vertel aan iemand wat dit nie hoef te hoor het nie?", "Hoop jy soms dat iets effens verkeerd loop vir {n}?", "Sukkel jy om God hardop vir {n} te dank, by die naam, en dit te bedoel?", "Sukkel jy om te hoor hoe {n} geprys word sonder om 'n \"maar\" by te sit?"], "resultTitle": "Wat dit aandui", "r0": "Niks hier dui daarop dat jy met {n} vasgevang is nie. Dit is goeie nuus, en dit is die moeite werd om dit so te hou.\n\nAs 'n ander naam by jou opgekom het terwyl jy die vrae gelees het, doen die toets weer vir daardie mens. Dít is gewoonlik die een.", "r1": "Daar is iets hier, maar dit is nog vroeg. Op hierdie stadium is dit klein genoeg om te hanteer sonder dat iemand anders eers hoef te weet.\n\nDit is presies die oomblik waar 'n mens dit gewoonlik laat lê, en dit is presies hoekom dit later 'n muur word.", "r2": "Jou voet is in die strik.\n\nJy is nie 'n slegte mens nie, en jy is waarskynlik nie verkeerd oor die feite nie. Om reg te wees is juis wat die meeste mense daarin hou.", "door6": "Jy praat **oor** {n} eerder as **met** {n}. Begin by sessie 6.", "door7": "Jy hou 'n rekening oop wat jy kan skrap. Begin by sessie 7.", "door5": "Jy dra 'n saak wat jy kan oorgee. Begin by sessie 5.", "alsoTitle": "Die drie deure", "also": ["Sessie 5 — gee die saak oor", "Sessie 6 — gaan na hulle toe", "Sessie 7 — skrap die skuld"], "again": "Doen dit weer", "close": "Maak toe"}, "en": {"step": "Step", "of": "of", "mirrorTitle": "The mirror first", "mirrorLead": "The hardest part of offence is that the person in it is usually the last to know. You do not feel offended. You feel **right**. So the test cannot be \"am I offended?\" Nobody answers that one honestly.", "mirrorLead2": "Paul gives us a different kind of test. He puts two lists side by side in Galatians 5:19-23. You cannot walk in both at once. Watch which list comes up when you think of one particular person.", "fleshTitle": "The flesh", "flesh": ["enmity", "strife", "jealousy", "fits of anger", "rivalries", "dissensions", "divisions"], "spiritTitle": "The Spirit", "spirit": ["love", "joy", "peace", "patience", "kindness", "goodness", "faithfulness"], "mirrorClose": "This test does not ask whether your case is good. It only asks what is happening in you.", "go": "I am ready", "nameTitle": "Who is the person?", "nameLead": "Think of one person. Type their name, or leave it blank if you would rather not.", "namePlaceholder": "Name", "namePrivacy": "What you type stays on your phone. It is not stored or sent anywhere, not even on this device. Close the page and it is gone.", "nameSkip": "someone", "start": "Start", "yes": "Yes", "unsure": "Not sure", "no": "No", "back": "Back", "q": ["When {n}'s name comes up, does something tighten in your chest?", "If you saw {n} in the shop, would you turn down a different aisle?", "Have you told the story about {n} to someone who did not need to hear it?", "Do you ever hope something goes slightly wrong for {n}?", "Do you struggle to thank God out loud for {n}, by name, and mean it?", "Do you struggle to hear {n} praised without adding a \"but\"?"], "resultTitle": "What this points to", "r0": "Nothing here suggests you are caught with {n}. That is good news, and it is worth keeping that way.\n\nIf another name came to mind while you were reading the questions, run it again for that person. That is usually the one.", "r1": "There is something here, but it is early. At this stage it is small enough to deal with before anyone else needs to know about it.\n\nThis is exactly the point where people leave it, and exactly why it becomes a wall later.", "r2": "Your foot is in the trap.\n\nYou are not a bad person, and you are probably not wrong about the facts. Being right is what keeps most people in it.", "door6": "You are talking **about** {n} rather than **to** {n}. Start at session 6.", "door7": "You are holding an account open that you could cancel. Start at session 7.", "door5": "You are carrying a case you could hand over. Start at session 5.", "alsoTitle": "The three doors", "also": ["Session 5 — hand the case over", "Session 6 — go to them", "Session 7 — cancel the debt"], "again": "Run it again", "close": "Close"}}, "leader": {"af": ["**Oor sessie 4.** Dit is die sessie waar iemand dalk vir die eerste keer hardop sê dat hulle kwaad is vir God. Moenie dit regmaak nie, moenie God verdedig nie, en moenie vinnig na die volgende vraag beweeg nie. Jesus het Johannes nie berispe omdat hy gevra het nie. Die vertrek moet ook nie.", "**Oor sessie 7.** Onderrig oor vergifnis is waar 'n groep werklike skade kan doen sonder om dit te bedoel. Twee reëls: niemand word ooit gesê om volgens 'n tydtafel te vergewe nie, en niemand word ooit gesê dat vergewe beteken jy gaan terug nie. As iemand in die groep mishandeling of 'n misdaad openbaar, gaan dit na 'n leier en na die owerhede. Sê dit van voor af, eerder as om dit in 'n voetnoot te laat.", "**Oor Andrew Selley se twee boodskappe.** Die strikbeeld, die spooknet, die bysteek en \"die pyn volg die perspektief\", die sononder-reël, die Galasiërs 5-diagnose en Absalom kom uit sy tweede boodskap, *Hurt but Not Offended*. Drie dinge is doelbewus van die studieblad af weggelaat:", "- **Sy vertelling van 'n vrou wat deur verskeie mans aangerand is en hulle een vir een vergewe het terwyl dit gebeur.** Dit dra die punt, maar die blad word alleen gelees, op 'n foon, deur tieners sowel as volwassenes, met geen leier in die vertrek nie. Die beginsel staan sonder dit.\n- **\"Trust isn't earned, it's given.\"** Net so gelaat, plaas dit mense terug binne bereik van dié wat hulle skade aangedoen het. Sessie 7 behou die liefde en voeg Johannes 2:24 by.\n- **\"Jesus never had to forgive anybody\"** — die argument dat \"Vader, vergeef hulle\" voorbidding was eerder as vergifnis. Verdedigbaar, maar dit is 'n fyn onderskeid wat meer in verwarring gaan kos as wat dit in presiesheid wen. Sessie 5 rus op 1 Petrus 2:23, wat niemand betwis nie.", "Die frase \"'n onaanstootlike kerk\" in sessie 8 is ook syne — dit is hoe hy die hele reeks raam. Iewers in die agt weke werd om van voor af te sê, want dit is die studie se eie beginsel op homself toegepas: *ons kan nie die aanstoot van die evangelie verwyder nie — maar ons wil dit in liefde en versigtigheid oorbring.*"], "en": ["**On Session 4.** This is the session where someone may say out loud, for the first time, that they are angry with God. Do not fix it, do not defend God, and do not move quickly to the next question. Jesus did not rebuke John for asking. The room should not either.", "**On Session 7.** Forgiveness teaching is where a group can do real damage without meaning to. Two rules to hold: nobody is ever told to forgive on a timetable, and nobody is ever told that forgiving means going back. If someone discloses abuse or a crime in the group, that goes to a leader and to the proper authorities. Say that from the front rather than leaving it in a footnote.", "**On Andrew Selley's two messages.** The trap image, the ghost net, the bee sting and \"the pain follows the perspective\", the sundown rule, the Galatians 5 diagnostic and Absalom all come from his part-two message, *Hurt but Not Offended*. Three things were deliberately left out of the study page:", "- **His account of a woman assaulted by several men, forgiving them as it happened.** It carries the point, but the study page is read alone, on a phone, by teenagers as well as adults, with no leader in the room. The principle stands without it.\n- **\"Trust isn't earned, it's given.\"** Held as-is, it puts people back within reach of those who harmed them. Session 7 keeps the love and adds John 2:24.\n- **\"Jesus never had to forgive anybody\"** — the argument that \"Father, forgive them\" was intercession rather than forgiveness. It is a defensible reading, but it is a fine distinction that will cost more in confusion than it gains in precision. Session 5 rests on 1 Peter 2:23, which nobody disputes.", "The phrase \"an unoffendable church\" in Session 8 is also his — it is how he frames the whole series. Worth saying from the front at some point in the eight weeks, because it is the study's own principle turned on itself: *we cannot remove the offence of the gospel — but we must not be recklessly careless where it is not necessary.*"]}};
const GUIDE = {"sessions": [{"n": 1, "lead": {"af": [{"t": "p", "x": "**Lukas 17:1** · *skandalon*, die stokkie in 'n strik waarop die aas sit"}], "en": [{"t": "p", "x": "**Luke 17:1** · *skandalon*, the small stick in a trap that holds the bait"}]}, "before": {"af": [{"t": "p", "x": "Hierdie sessie het een werk. Dit moet die groep skuif van *aanstoot is iets wat met my gebeur* na *aanstoot is iets wat ek doen*. Alles in die agt weke rus daarop. As die vertrek uitstap terwyl hulle aanstoot steeds in ander mense se gedrag plaas, het sessies 5, 6 en 7 niks om aan vas te haak nie."}, {"t": "p", "x": "Die *skandalon*-prentjie doen die werk, so gee dit tyd. Die dier word nie deur die strik gevang nie. Dit word deur die aas gevang. Die seer gebeur met jou. Die byt is joune."}, {"t": "p", "x": "**Die nuwe Kain-gedeelte doen dieselfde werk met God se eie stem**, en vir party mense is dit die makliker deur. Sien die groepantwoorde hier onder."}, {"t": "p", "x": "**Waar dit skeefloop:** die groep hoor blaam. *So dit is my skuld dat ek seergekry het?* Nee. Die verskil is tussen die wond en die muur. Riaan is werklik verontreg — die ouderlinge het regtig versuim om hom te bel. Die sessie stry nie oor die besering nie. Dit vra oor die drie maande."}, {"t": "box", "x": ["**Die twee prente sê nie dieselfde ding nie, en dit maak saak.**", "Die strik gaan oor **hóé jy inkom**: iets met aas is op jou pad gesit en jy het gebyt. Die byt is joune. Die net gaan oor **hoe lank jy bly**. Niemand kies 'n net nie. Die skilpaaie het net geswem.", "Sê dit hardop — dit beskerm die sessie. *Niemand kies die net nie, en ons gaan nie maak of dit jou skuld is nie.* Riaan het nie gekies om oorgeslaan te word nie, of om dit in 'n WhatsApp-groep uit te vind nie. Wat syne was, was die drie maande.", "**Die reël wat dit dra: party van hulle het minder as 'n voet van lug af verdrink.** Dit is nie blaam nie, dit is hartseer. Hulp was so naby. Die nuttige vraag is dus nie *hoe het jy ingekom* nie, maar *wie is al drie jaar lank 'n voet van lug af?*", "**Noem die grens van die beeld voordat iemand dit voel.** 'n Skilpad in 'n net kan werklik nie uitkom nie. Dit is nie swak wil nie, dit is verstrengeling. Sê dus reguit: ons is nie skilpaaie nie. 'n Skilpad kan nie benoem wat hom vashou nie, kan na niemand toe gaan nie, kan dit nie oorgee nie. Ons kan al drie — en dít is sessies 5, 6 en 7. Die net wys die gevaar. Dit was nooit bedoel om die uitweg te wys nie.", "As iemand sê *\"maar die skilpad kon dit nie help nie\"*, stem saam. Dit is die beste ding wat enigiemand die aand gaan sê, en dit is juis hoekom daar nog sewe sessies is.", "**Nog een laag.** Dit was 'n *weggegooide* net. Iemand het dit gestel en huis toe gegaan. Hy het nooit van daardie drie honderd skilpaaie geweet nie. Dít is aanstoot in 'n kerk: die mens wat jou seergemaak het, is dalk lankal weg, onthou dit dalk nie, sou dalk verstom wees as jy hom vertel. Die net gee nie om nie. Dit lê nog in die water en dit vang nog steeds. Presies Lukas 17:1 — die wee val op die een *deur wie* die aanstoot kom, en teen die tyd dat die skade gedoen is, is hy gewoonlik nêrens naby nie."]}, {"t": "p", "x": "Hou Riaan se storie vir laaste. Dit land harder nadat die strik benoem is."}], "en": [{"t": "p", "x": "This session has one job. It has to move the group from *offence is something that happens to me* to *offence is something I do*. Everything in the eight weeks rests on that. If the room leaves still putting offence in other people's behaviour, sessions 5, 6 and 7 will have nothing to hold on to."}, {"t": "p", "x": "The *skandalon* picture does the work, so give it time. The animal is not caught by the trap. It is caught by the bait. The hurt happens to you. The bite is yours."}, {"t": "p", "x": "**The new Cain passage does the same work with God's own voice**, and it may be the easier way in for some people. See the group answers below."}, {"t": "p", "x": "**Where it goes wrong:** the group hears blame. *So it is my fault that I am hurt?* No. The difference is between the wound and the wall. Riaan was genuinely wronged — the elders really did fail to phone him. The session is not arguing about the injury. It is asking about the three months."}, {"t": "box", "x": ["**The two pictures are not saying the same thing, and it matters.**", "The trap is about **how you get in**: something baited was put in your path and you took it. The bite is yours. The net is about **how long you stay**. Nobody chooses a net. The turtles were only swimming.", "Say that out loud — it protects the session. *Nobody chooses the net, and we are not going to pretend it is your fault.* Riaan did not choose to be passed over, or to find out in a WhatsApp group. What was his was the three months.", "**The line that carries it: some of them drowned less than a foot from air.** That is not blame, it is grief. Help was that close. So the useful question is not *how did you get in* but *who has been a foot from air for three years?*", "**Name the limit of the picture before somebody feels it.** A turtle in a net truly cannot get out. That is not weak will, it is entanglement. So say plainly: we are not turtles. A turtle cannot name what holds it, cannot go to anyone, cannot hand it over. We can do all three — and that is sessions 5, 6 and 7. The net shows the danger. It was never meant to show the way out.", "If somebody says *\"but the turtle could not help it\"*, agree with them. That is the best thing anyone will say all evening, and it is exactly why there are seven more sessions.", "**One more layer.** It was an *abandoned* net. Somebody set it and went home. He never knew about those three hundred turtles. That is offence in a church: the person who hurt you may be long gone, may not remember it, may be astonished if you told them. The net does not care. It is still in the water and it is still catching things. Which is Luke 17:1 exactly — the woe falls on the one *through whom* offence comes, and by the time the damage is done he is usually nowhere near it."]}, {"t": "p", "x": "Keep Riaan's story for the end. It lands harder once the trap has been named."}]}, "qhome": {"af": [{"q": "Wie se naam het by jou opgekom terwyl jy Riaan se storie gelees het?", "note": [{"t": "p", "x": "Byna almal het 'n naam. Dié wat sê \"niemand\" het gewoonlik iemand so lank gelede benoem dat die mens opgehou het om 'n mens te wees en 'n vasgestelde feit geword het. Moenie dit in die vertrek druk nie. Dit kom later vanself uit."}]}, {"q": "Wat vertel jy jouself van daardie mens — en weet jy regtig dat dit waar is?", "note": [{"t": "p", "x": "Die eerlike antwoord is gewoonlik 'n motief, nie 'n gebeurtenis nie. *Hy respekteer my nie. Sy was nog altyd so. Hulle het besluit ek maak nie saak nie.* 'n Gebeurtenis kan jy nagaan. 'n Motief byna nooit. Hierdie vraag doen die meeste werk van die hele week."}]}, {"q": "Wat sal dit jou kos om dit hierdie week te laat gaan?", "note": [{"t": "p", "x": "Regte antwoorde noem iets spesifieks wat hulle sal verloor: om reg te wees, 'n verskoning wat hulle geskuld word, die simpatie van mense wat die storie ken, die stand van die een wat verontreg is. 'n Vae antwoord soos \"net my trots\" beteken hulle het nog nie gekyk nie."}]}], "en": [{"q": "Whose name came to mind while you were reading Riaan's story?", "note": [{"t": "p", "x": "Almost everyone has a name. The ones who say \"nobody\" have usually named someone so long ago that the person has stopped being a person and become a settled fact. Do not push this in the room. It comes out later on its own."}]}, {"q": "What have you been telling yourself about that person — and do you actually know it is true?", "note": [{"t": "p", "x": "The honest answer is usually a motive, not an event. *He does not respect me. She has always been like this. They decided I do not matter.* You can check an event. You almost never can check a motive. This question does the most work all week."}]}, {"q": "What would it cost you to let it go this week?", "note": [{"t": "p", "x": "Real answers name something specific they would lose: being right, an apology they are owed, the sympathy of people who know the story, the standing of being the wronged one. A vague answer like \"just my pride\" means they have not looked yet."}]}]}, "qgroup": {"af": [{"q": "Jesus sê aanstoot kan nie vermy word nie. Hoekom is ons dan steeds geskok wanneer dit in die kerk gebeur?", "note": [{"t": "p", "x": "Omdat ons verwar wat die kerk geroep is om te wees met wat dit nou is. Ons verwag 'n klaar volk in plaas van 'n volk wat God nog besig is om klaar te maak."}, {"t": "p", "x": "Maar daar is 'n vriendeliker antwoord onder daardie een. **Die skok is bewys van liefde.** Spreuke 18:19 *(in die sessie)* sê 'n veronregte broer is ontoegankliker as 'n vestingstad. Hoe nader die band, hoe groter die val. 'n Vreemdeling kan jou nie werklik aanstoot gee nie. So die skok is nie 'n fout nie. Dit is wat dit kos om in mense belê te hê."}, {"t": "p", "x": "Die skade kom by die volgende stap, wanneer skok verander in *as dit hier gebeur, is dit nie eg nie*. Jesus het dit vooraf gekeer deur ons te waarsku. Hy het ons nie gewaarsku sodat ons minder van mekaar sou verwag nie. Hy het gewaarsku sodat dit, wanneer dit kom, nie ons geloof saam met dit sou vat nie."}, {"t": "p", "x": "*Let op:* iemand wat sê \"ek het beter van Christene verwag.\" Dit is eerlik en dit is waar. Die antwoord is nie om minder te verwag nie. Dit is om op te hou verras wees."}]}, {"q": "Is daar 'n verskil tussen seerkry en aanstoot neem? Waar lê die streep?", "note": [{"t": "p", "x": "Seerkry is wat met jou gebeur. Aanstoot is wat jy daarmee bou. Seerkry is 'n gebeurtenis. Aanstoot is 'n bouprojek."}, {"t": "p", "x": "Die groep gaan 'n skoon streep wil hê en daar is nie een nie. Daar is 'n rigting waarin jy beweeg. Maar daar is vier tekens dat jy dit oorgesteek het:"}, {"t": "list", "x": ["jy gaan dit weer deur wanneer niks nuuts gebeur het nie", "jy vertel dit aan iemand wat dit nie hoef te hoor nie", "jy begin alles wat hulle vroeër gedoen het in daardie lig lees", "jy begin doelbewus afstand hou"]}, {"t": "p", "x": "*Let op:* hierdie vraag kan die hele aand opvreet. Dit is werklik Sessie 5 se grond. Laat dit tien minute loop, sê dan so — \"ons kom oor vyf weke behoorlik hierby uit\" — in plaas daarvan om dit nou te probeer klaarmaak."}]}, {"q": "Riaan het niks gesê nie. Hoekom is stilte so dikwels ons eerste keuse — en wat kos dit?", "note": [{"t": "p", "x": "Stilte voel na die hoë pad. Dit lyk na geduld, na genade, na om nie 'n toneel te maak nie. Drie dinge is gewoonlik onder die oppervlak aan die gang."}, {"t": "p", "x": "Dit vermy die risiko van die gesprek. Dit hou jou in die reg — solank jy niks sê nie, is jy nog steeds die een wat verontreg is. En dit hou die storie joune, met geen feite wat mag inkom om dit te bederf nie."}, {"t": "p", "x": "Die koste is presies, en Riaan se storie wys dit. Stilte vat die enigste ding weg wat die storie kon regmaak. Hy het nooit van die oproep uitgevind nie, want om uit te vind sou beteken het om die gesprek te voer wat hy vermy. Drie maande se muur, gebou op 'n oproep wat niemand gemaak het nie."}, {"t": "p", "x": "*Let op:* die groep gaan die stilte goedkeur. Dit lees soos selfbeheersing. Druk een keer, saggies: *was dit genade, of was dit net goedkoper as die alternatief?*"}]}, {"q": "Ekstra: die vraag wat die Kain-gedeelte oopmaak — is dit sonde om aanstoot te neem?", "note": [{"t": "p", "x": "Iemand gaan dit in week een vra, en Genesis 4:6-7 antwoord dit beter as 'n definisie. God kom na Kain, wat 'n werklike griewe het, en Hy sê nie *jou kwaad wees is sonde* nie. Hy sê sonde hurk by die deur en Kain moet daaroor heers."}, {"t": "p", "x": "Dus: **die seerkry is nie die sonde nie. Die seerkry is die deur. Sonde is wat buite wag.**"}, {"t": "p", "x": "Twee dinge om vir die vertrek uit te wys. Eerstens praat God met die verontregte man **voordat** enigiets gebeur, en Hy doen dit vriendelik — met 'n vraag en 'n belofte, nie 'n bestrawwing nie. Dít is wat ons die groep vra om vir mekaar te doen. Tweedens sê God vir Kain dat hy dit *kan* oorheers. Die opdrag veronderstel dat dit moontlik is."}, {"t": "p", "x": "As iemand verder druk — *maar is dit dan nooit sonde nie?* — is die eerlike antwoord dat die Skrif dit ook nie neutraal laat nie. Hebreërs 12:15 noem wat daaruit groei 'n wortel van bitterheid wat baie besmet. Efesiërs 4:31 sê ons moet bitterheid, woede en kwaadwilligheid wegdoen. Galasiërs 5:20 lys *vyandskap, twis, jaloesie, woede, selfsug, tweedrag, verdeeldheid* onder die praktyke van die sondige natuur — dít is die aanstoot-familie, in dieselfde lys as afgodsdiens. En Matteus 6:15 is so skerp soos enigiets wat Jesus gesê het: as julle nie vergewe nie, sal julle Vader julle ook nie vergewe nie. *(Almal net in hierdie gids.)*"}, {"t": "p", "x": "Dus: die steek is nie sonde nie. Om te weier om daaroor te heers, is waar sonde inkom."}]}], "en": [{"q": "Jesus says offence cannot be avoided. So why are we still shocked when it happens in church?", "note": [{"t": "p", "x": "Because we mix up what the church is called to be with what it is right now. We expect a finished people instead of a people God is still finishing."}, {"t": "p", "x": "But there is a kinder answer underneath that one. **The shock is proof of love.** Proverbs 18:19 *(in the session)* says a brother offended is harder to win than a strong city. The closer the bond, the bigger the fall. A stranger cannot really offend you. So the shock is not a fault. It is what it costs to have invested in people."}, {"t": "p", "x": "The damage comes at the next step, when shock turns into *if it happens here, this is not real.* Jesus headed that off by telling us in advance. He did not warn us so that we would expect less of each other. He warned us so that when it came, it would not take our faith down with it."}, {"t": "p", "x": "*Watch for:* someone saying \"I expected better from Christians.\" That is honest and true. The answer is not to expect less. It is to stop being surprised."}]}, {"q": "Is there a difference between being hurt and taking offence? Where is the line?", "note": [{"t": "p", "x": "Hurt is what happens to you. Offence is what you build with it. Hurt is an event. Offence is a building project."}, {"t": "p", "x": "The group will want a clean line and there is not one. There is a direction of travel. But there are four signs that you have crossed it:"}, {"t": "list", "x": ["you go over it again when nothing new has happened", "you tell it to someone who does not need to hear it", "you start reading everything they did before in the light of it", "you begin keeping your distance on purpose"]}, {"t": "p", "x": "*Watch for:* this question can eat the whole evening. It really is Session 5's ground. Let it run ten minutes, then say so — \"we come back to this properly in five weeks\" — instead of trying to finish it now."}]}, {"q": "Riaan said nothing at all. Why is silence so often our first move — and what does it cost?", "note": [{"t": "p", "x": "Silence feels like the high road. It looks like patience, like grace, like not making a scene. Three things are usually going on underneath."}, {"t": "p", "x": "It avoids the risk of the conversation. It keeps you in the right — as long as you say nothing, you are still the one who was wronged. And it keeps the story yours, with no facts allowed in to spoil it."}, {"t": "p", "x": "The cost is exact, and Riaan's story shows it. Silence removes the only thing that could have corrected the story. He never found out about the phone call, because finding out would have meant having the conversation he was avoiding. Three months of wall, built on a phone call nobody made."}, {"t": "p", "x": "*Watch for:* the group will approve of the silence. It reads as self-control. Push once, gently: *was that grace, or was it just cheaper than the alternative?*"}]}, {"q": "Extra: the question the Cain passage raises — is being offended a sin?", "note": [{"t": "p", "x": "Somebody will ask this in week one, and Genesis 4:6-7 answers it better than a definition can. God comes to Cain, who has a real grievance, and He does not say *your anger is sin*. He says sin is crouching at the door and Cain must rule over it."}, {"t": "p", "x": "So: **the hurt is not the sin. The hurt is the door. Sin is what is waiting outside it.**"}, {"t": "p", "x": "Two things worth pointing out to the room. First, God speaks to the offended man **before** anything happens, and He does it kindly — with a question and a promise, not a telling-off. That is what we are asking the group to do for each other. Second, God tells Cain he *can* rule it. The command assumes it is possible."}, {"t": "p", "x": "If someone pushes further — *but is it never sin?* — the honest answer is that Scripture does not leave it neutral either. Hebrews 12:15 calls what grows from it a bitter root that spreads to many. Ephesians 4:31 tells us to put away bitterness, anger and malice. Galatians 5:20 lists *enmity, strife, jealousy, fits of anger, rivalries, dissensions, divisions* as works of the flesh — that is the offence family, in the same list as idolatry. And Matthew 6:15 is as sharp as anything Jesus said: if you do not forgive, your Father will not forgive you. *(All only in this guide.)*"}, {"t": "p", "x": "So: the sting is not sin. Refusing to rule it is where sin comes in."}]}]}, "quiet": {"af": [{"t": "p", "x": "*\"Dink aan die laaste keer hierdie maand dat iemand 'n stokkie op jou pad gelos het. Nie 'n groot een nie. Wat het jy in die eerste tien sekondes gedoen?\"*"}], "en": [{"t": "p", "x": "*\"Think of the last time somebody put a stick in your path this month. Not a big one. What did you do in the first ten seconds?\"*"}]}, "title": "Die strik  ·  The trap"}]};

let lang = "af", ver = "AFR83", cur = 1;

/* ---------- scripture reference linking ---------- */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const bookRe = {};
for (const L of ["af","en"]) {
  const names = Object.keys(DATA.books[L]).sort((a,b)=>b.length-a.length)
    .map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  bookRe[L] = new RegExp("(?:\\b)("+names.join("|")+")\\s+(\\d+)(?::(\\d+(?:[–-]\\d+)?))?(?!\\d)","g");
}
const verseIndex = {};
DATA.sessions.forEach(s=>{
  const add=(o,n)=>{ if(o && !(o in verseIndex)) verseIndex[o]=n; };
  add(s.osis, s.n);
  ["af","en"].forEach(L=>s.extras[L].forEach(x=>add(x.osis, s.n)));
});
const bibleUrl = osis => "https://www.bible.com/bible/"+DATA.versions[ver].id+"/"+osis;

function linkRefs(html, sessionN){
  const parts = html.split(/(<a\b[^>]*>[\s\S]*?<\/a>|<[^>]+>)/g);
  return parts.map(seg=>{
    if (!seg || seg[0]==="<") return seg;
    return seg.replace(bookRe[lang], (m, book, ch, v) => {
      const code = DATA.books[lang][book];
      if (!code) return m;
      const osis = code+"."+ch+(v?"."+v:"");
      const key  = code+"."+ch+(v?"."+v.split(/[–-]/)[0]:"");
      const tgt  = verseIndex[key];
      if (tgt && tgt !== sessionN)
        return '<a class="ref" href="#s'+tgt+'" title="'+T[lang].seeS+' '+tgt+'">'+m+'<sup>S'+tgt+'</sup></a>';
      return '<a class="ref" href="'+bibleUrl(osis)+'" target="_blank" rel="noopener" title="'+DATA.versions[ver].name+'">'+m+'<sup>↗</sup></a>';
    });
  }).join("");
}

/* ---------- inline markdown ---------- */
function md(s, sessionN){
  let h = esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/\[(.+?)\]\((#?[^)\s]+)\)/g,'<a href="$2">$1</a>');
  return linkRefs(h, sessionN);
}
const blocks = (arr, n) => arr.map(b=>{
  if (b.t==="box")  return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  if (b.t==="list") return '<div class="box">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>";
  return "<p>"+md(b.x,n)+"</p>";
}).join("");

function gtable(rows,n){
  const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
  return "<table>"+body.map(r=>{
    const cells=r.replace(/^\||\|$/g,"").split("|");
    return "<tr>"+cells.map(c=>"<td>"+md(c.trim(),n)+"</td>").join("")+"</tr>";
  }).join("")+"</table>";
}
function gblocks(arr,n){
  return (arr||[]).map(b=>
    b.t==="box"   ? '<div class="lbox">'+b.x.map(p=>"<p>"+md(p,n)+"</p>").join("")+"</div>" :
    b.t==="list"  ? "<ul>"+b.x.map(p=>"<li>"+md(p,n)+"</li>").join("")+"</ul>" :
    b.t==="table" ? gtable(b.x,n) :
                    "<p>"+md(b.x,n)+"</p>").join("");
}
function gnote(key,i){
  const arr=(G[key]&&G[key][lang])||[]; const it=arr[i];
  if(!it) return "";
  return '<div class="lnote">'+gblocks(it.note,SESSION)+"</div>";
}
function gextras(key,from){
  const arr=(G[key]&&G[key][lang])||[];
  if(arr.length<=from) return "";
  return arr.slice(from).map(it=>'<div class="lnote gextra"><p><b>'+esc(it.q)+"</b></p>"+gblocks(it.note,SESSION)+"</div>").join("");
}

function go(n, push=true){
  if(n<1||n>8) return;
  cur=n;
  if(push){ try{ if(location.hash!=="#s"+n) history.replaceState(null,"","#s"+n); }catch(e){} }
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("btnAF").onclick=()=>{ lang="af"; if(DATA.versions[ver].lang!=="af") ver="AFR83"; render(); };
document.getElementById("btnEN").onclick=()=>{ lang="en"; if(DATA.versions[ver].lang!=="en") ver="ESV";   render(); };

const sheet=document.getElementById("sheet");
document.addEventListener("click",e=>{ if(e.target.closest("[data-check]")) openCheck(); });
document.getElementById("fab").onclick=openCheck;
document.getElementById("sheetClose").onclick=()=>sheet.close();
sheet.addEventListener("click",function(e){
  const st=e.target.closest("[data-cstep]");
  if(st){ chk.step=+st.dataset.cstep; if(chk.step<2) chk.ans=[]; renderSheet(); return; }
  if(e.target.closest("[data-cstart]")){ chk.step=2; chk.ans=[]; renderSheet(); return; }
  const an=e.target.closest("[data-cans]");
  if(an){ chk.ans[chk.step-2]=parseFloat(an.dataset.cans); chk.step++; renderSheet(); return; }
  if(e.target.closest("[data-cclose]")) sheet.close();
});
sheet.addEventListener("click",e=>{ if(e.target===sheet) sheet.close(); });

document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#s"]');
  if(a){ const n=+a.getAttribute("href").slice(2); if(n>=1&&n<=8){ e.preventDefault(); if(sheet.open) sheet.close(); go(n); } }
});
window.addEventListener("hashchange",()=>{ try{ const m=location.hash.match(/^#s([1-8])$/); if(m) go(+m[1],false); }catch(e){} });

(function init(){
  try{
    const m=location.hash.match(/^#s([1-8])$/); if(m) cur=+m[1];
    const q=new URLSearchParams(location.search);
    if((q.get("lang")||"").toLowerCase()==="en"){ lang="en"; ver="ESV"; }
  }catch(e){}
  render();
})();
</script>
</body>
</html>
