          --plum:#6b3f5e;
          --rule:#b9c2c8;

          --background:#fdf7ef;
          --border:#e8ddd0;
        }
        *{box-sizing:border-box}
        .card{border:1px dashed var(--rule); background:var(--paper); padding:5mm 7mm; display:flex; flex-direction:column; position:relative; border-radius:2px}

        .action{font-size:20px; line-height:1.35; font-weight:400; margin:0}

        .sheet{width:100%; max-width:190mm; margin:0 auto; background:var(--paper); padding:8mm 3mm; box-shadow:0 2px 18px rgba(34,48,60,.12); display:grid; grid-template-columns:repeat(2, 1fr); gap:4mm; justify-content:center}
        @media (max-width:700px){ .sheet{grid-template-columns:1fr} }
